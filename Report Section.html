<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profit & Loss | Smart COA Reporting</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand: #4f46e5;
      --brand-light: #eef2ff;
      --brand-dark: #3730a3;
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; }

    /* ── Header ── */
    header {
      background: var(--card);
      border-radius: 20px;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .logo-text h1 { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
    .logo-text p { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.08em; }
    .user-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-badge {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg);
      padding: 5px 14px 5px 5px;
      border-radius: 40px;
      border: 1px solid var(--border);
    }
    #userInitials {
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: white; border-radius: 50%;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
    }
    #username { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .btn-nav {
      padding: 8px 18px; border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text); font-weight: 600; font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-nav:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
    .btn-nav.danger:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }

    /* ── Filter Panel ── */
    .filter-panel {
      background: var(--card);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      align-items: end;
    }
    .filter-item label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .filter-item select,
    .filter-item input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .filter-item select:focus,
    .filter-item input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
    .date-pair { display: flex; gap: 6px; }
    .btn-generate {
      padding: 11px 24px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: white; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      white-space: nowrap;
    }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); }

    /* ── Period Display ── */
    .period-display {
      background: linear-gradient(135deg, var(--brand-light), #f5f3ff);
      border: 1px solid #c7d2fe;
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    }
    .period-tag {
      display: flex; align-items: center; gap: 8px;
      background: white;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.78rem;
      border: 1px solid #c7d2fe;
    }
    .period-tag i { color: var(--brand); font-size: 0.75rem; }
    .period-tag .tag-label { color: var(--text-muted); font-weight: 600; }
    .period-tag .tag-value { color: var(--text); font-weight: 700; }

    /* ── KPI Cards ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card);
      border-radius: 18px;
      padding: 22px 24px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: all 0.25s;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.2); border-color: #c7d2fe; }
    .kpi-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    }
    .kpi-card.income::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .kpi-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .kpi-card.profit::before { background: linear-gradient(90deg, var(--brand), #7c3aed); }
    .kpi-card.opening::before { background: linear-gradient(90deg, #0891b2, #06b6d4); }
    .kpi-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .kpi-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .kpi-card.income .kpi-icon { background: var(--success-light); color: var(--success); }
    .kpi-card.expense .kpi-icon { background: var(--danger-light); color: var(--danger); }
    .kpi-card.profit .kpi-icon { background: var(--brand-light); color: var(--brand); }
    .kpi-card.opening .kpi-icon { background: #ecfeff; color: #0891b2; }
    .kpi-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-value { font-size: 1.75rem; font-weight: 800; color: var(--text); letter-spacing: -0.03em; line-height: 1.2; }
    .kpi-trend { font-size: 0.7rem; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .trend-up { color: var(--success); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; background: var(--success-light); padding: 2px 8px; border-radius: 20px; }
    .trend-down { color: var(--danger); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; background: var(--danger-light); padding: 2px 8px; border-radius: 20px; }

    /* ── Card Panels ── */
    .card {
      background: var(--card);
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .card-header h3 { font-size: 0.95rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .card-header h3 i { color: var(--brand); }
    .coa-badge {
      font-size: 0.65rem; font-weight: 700; padding: 4px 10px;
      background: var(--brand-light); color: var(--brand);
      border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .table-wrap { overflow-x: auto; }
    .pl-table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .pl-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .pl-table thead th.right { text-align: right; }
    .pl-table tbody td {
      padding: 11px 16px;
      font-size: 0.82rem;
      border-bottom: 1px solid #f1f5f9;
      color: var(--text);
    }
    .pl-table tbody tr:hover { background: #fafbff; }
    .pl-table .amount { font-weight: 600; font-family: 'SF Mono', 'Fira Code', monospace; text-align: right; font-size: 0.8rem; }
    .income-amount { color: var(--success); }
    .expense-amount { color: var(--danger); }
    .opening-amount { color: #0891b2; }
    .type-badge {
      display: inline-block;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-right: 6px;
    }
    .type-income { background: var(--success-light); color: var(--success); }
    .type-expense { background: var(--danger-light); color: var(--danger); }
    .type-opening { background: #ecfeff; color: #0891b2; }
    .type-equity { background: #f3e8ff; color: #9333ea; }
    .type-other { background: #f1f5f9; color: #475569; }
    .total-row td { background: var(--brand-light); font-weight: 800; color: var(--text); border-top: 2px solid var(--brand); padding: 14px 16px; font-size: 0.85rem; }
    .subtotal-row td { background: #f0fdf4; font-weight: 700; color: var(--text); border-top: 1px solid #86efac; padding: 12px 16px; font-size: 0.82rem; }
    .subtotal-row.expense-sub td { background: #fff1f2; border-top: 1px solid #fecaca; }
    .variance-positive { color: var(--success); font-weight: 700; }
    .variance-negative { color: var(--danger); font-weight: 700; }

    /* ── Grid Layouts ── */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) { .split-grid { grid-template-columns: 1fr; } }
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.82rem;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .name { color: var(--text); font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .list-item .val { font-weight: 700; font-family: monospace; font-size: 0.8rem; }

    /* ── Chart ── */
    .chart-panel {
      background: var(--card);
      border-radius: 18px;
      padding: 20px 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .chart-panel canvas { max-height: 340px; }

    /* ── Insights ── */
    .insights-panel {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      border: 1px solid #fde68a;
      border-radius: 18px;
      padding: 22px 24px;
      margin-bottom: 20px;
    }
    .insights-panel h3 { font-size: 0.95rem; font-weight: 700; color: #92400e; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .insight-item {
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #78350f;
      border-left: 3px solid var(--warning);
      font-weight: 500;
    }

    /* ── Export ── */
    .export-bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
    .btn-export {
      padding: 10px 22px; border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text); font-weight: 600; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-export:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }

    /* ── Loading ── */
    .loading-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center; align-items: center;
    }
    .loading-content { background: white; padding: 36px 48px; border-radius: 24px; text-align: center; }
    .loading-content p { color: var(--text-muted); font-size: 0.85rem; margin-top: 16px; font-weight: 600; }
    .spinner { color: var(--brand); font-size: 2.5rem; }

    /* ── Empty State ── */
    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    .empty-state i { font-size: 2.5rem; color: #cbd5e1; margin-bottom: 12px; display: block; }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .kpi-value { font-size: 1.4rem; }
      .filter-row { grid-template-columns: 1fr; }
      .pl-table thead th, .pl-table tbody td { padding: 8px 10px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-chart-column"></i></div>
      <div class="logo-text">
        <h1>FinLedger Pro</h1>
        <p>COA-BASED P&L</p>
      </div>
    </div>
    <div class="user-area">
      <div class="user-badge">
        <div id="userInitials">U</div>
        <span id="username">User</span>
      </div>
      <button id="homeBtn" class="btn-nav"><i class="fas fa-home"></i> Home</button>
      <button id="logoutBtn" class="btn-nav danger"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </header>

  <!-- Filter Panel -->
  <div class="filter-panel">
    <div class="filter-row">
      <div class="filter-item">
        <label><i class="fas fa-calendar-alt"></i> Reporting Period</label>
        <select id="reportPeriod">
          <option value="month" selected>This Month</option>
          <option value="lastMonth">Last Month</option>
          <option value="quarter">This Quarter</option>
          <option value="year">This Year</option>
          <option value="lastYear">Last Year</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div class="filter-item" id="customDateRange" style="display: none;">
        <label>Custom Range</label>
        <div class="date-pair">
          <input type="date" id="startDate">
          <input type="date" id="endDate">
        </div>
      </div>
      <div class="filter-item">
        <label><i class="fas fa-chart-bar"></i> Chart Type</label>
        <select id="chartType">
          <option value="bar">Bar Chart</option>
          <option value="line">Line Chart</option>
          <option value="pie">Pie Chart</option>
          <option value="doughnut">Doughnut Chart</option>
        </select>
      </div>
      <div class="filter-item">
        <label><i class="fas fa-balance-scale"></i> Compare With</label>
        <select id="comparisonType">
          <option value="none">No Comparison</option>
          <option value="previousPeriod" selected>Previous Period</option>
          <option value="previousMonth">Previous Month</option>
          <option value="previousQuarter">Previous Quarter</option>
          <option value="previousYear">Previous Year</option>
          <option value="samePeriodLastYear">Same Period Last Year</option>
          <option value="twoQuartersBack">Two Quarters Back</option>
          <option value="twoYearsBack">Two Years Back</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div class="filter-item" id="customComparisonRange" style="display: none;">
        <label>Custom Compare</label>
        <div class="date-pair">
          <input type="date" id="compareStartDate">
          <input type="date" id="compareEndDate">
        </div>
      </div>
      <div class="filter-item">
        <button id="generateReportBtn" class="btn-generate"><i class="fas fa-sync-alt"></i> Generate</button>
      </div>
    </div>
  </div>

  <!-- Period Display -->
  <div class="period-display">
    <div class="period-tag"><i class="fas fa-calendar-check"></i><span class="tag-label">Current:</span><span class="tag-value" id="currentPeriodLabel">—</span></div>
    <div class="period-tag" id="prev1Wrapper" style="display:none;"><i class="fas fa-calendar-week"></i><span class="tag-label">Previous:</span><span class="tag-value" id="prev1PeriodLabel">—</span></div>
    <div class="period-tag" id="prev2Wrapper" style="display:none;"><i class="fas fa-calendar-minus"></i><span class="tag-label">Prior‑Previous:</span><span class="tag-value" id="prev2PeriodLabel">—</span></div>
  </div>

  <!-- Export Bar -->
  <div class="export-bar">
    <button id="exportExcel" class="btn-export"><i class="fas fa-file-excel"></i> Excel</button>
    <button id="exportPDF" class="btn-export"><i class="fas fa-file-pdf"></i> Export PDF (A4)</button>
  </div>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="kpi-card opening">
      <div class="kpi-head">
        <div class="kpi-icon"><i class="fas fa-door-open"></i></div>
      </div>
      <div class="kpi-label">Opening Balance</div>
      <div class="kpi-value" id="totalOpening">₹0</div>
      <div class="kpi-trend" id="openingTrend"></div>
    </div>
    <div class="kpi-card income">
      <div class="kpi-head">
        <div class="kpi-icon"><i class="fas fa-arrow-trend-up"></i></div>
      </div>
      <div class="kpi-label">Total Income</div>
      <div class="kpi-value" id="totalIncome">₹0</div>
      <div class="kpi-trend" id="incomeTrend"></div>
    </div>
    <div class="kpi-card expense">
      <div class="kpi-head">
        <div class="kpi-icon"><i class="fas fa-arrow-trend-down"></i></div>
      </div>
      <div class="kpi-label">Total Expenses</div>
      <div class="kpi-value" id="totalExpenses">₹0</div>
      <div class="kpi-trend" id="expenseTrend"></div>
    </div>
    <div class="kpi-card profit">
      <div class="kpi-head">
        <div class="kpi-icon"><i class="fas fa-scale-balanced"></i></div>
      </div>
      <div class="kpi-label">Net Profit / (Loss)</div>
      <div class="kpi-value" id="netProfit">₹0</div>
      <div class="kpi-trend" id="profitTrend"></div>
    </div>
  </div>

  <!-- P&L Table -->
  <div class="card">
    <div class="card-header">
      <h3><i class="fas fa-file-invoice-dollar"></i> Profit & Loss Statement</h3>
      <span class="coa-badge" id="coaBadge">COA Loading…</span>
    </div>
    <div class="table-wrap">
      <table class="pl-table" id="pnlTable">
        <thead id="pnlTableHead"></thead>
        <tbody id="pnlTableBody"><tr><td colspan="6" class="empty-state"><i class="fas fa-spinner fa-spin"></i>Loading data…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Top Lists -->
  <div class="split-grid">
    <div class="card">
      <div class="card-header"><h3><i class="fas fa-arrow-up-right-dots"></i> Top Income Accounts</h3></div>
      <div id="topIncomeList"></div>
    </div>
    <div class="card">
      <div class="card-header"><h3><i class="fas fa-arrow-down-right-dots"></i> Top Expense Accounts</h3></div>
      <div id="topExpenseList"></div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-panel">
    <canvas id="pnlChart"></canvas>
  </div>

  <!-- Insights -->
  <div class="insights-panel">
    <h3><i class="fas fa-lightbulb"></i> Financial Insights</h3>
    <div id="insightsContent"></div>
  </div>
</div>

<div id="loadingModal" class="loading-modal">
  <div class="loading-content">
    <i class="fas fa-spinner fa-spin spinner"></i>
    <p>Generating COA Report…</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ── Formatting ── */
function formatINR(amt) {
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatINRShort(amt) {
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatNumberForPDF(amt) {
  return amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDateShort(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatPeriod(start, end) { return `${start.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} – ${end.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`; }

/* ── Date Ranges ── */
function getDateRange(periodType, customStart=null, customEnd=null) {
  const today = new Date();
  let start, end;
  if (periodType === 'month') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = new Date(today.getFullYear(), today.getMonth()+1, 0); }
  else if (periodType === 'lastMonth') { start = new Date(today.getFullYear(), today.getMonth()-1, 1); end = new Date(today.getFullYear(), today.getMonth(), 0); }
  else if (periodType === 'quarter') { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = new Date(today.getFullYear(), (q+1)*3, 0); }
  else if (periodType === 'year') { start = new Date(today.getFullYear(), 0, 1); end = new Date(today.getFullYear(), 11, 31); }
  else if (periodType === 'lastYear') { start = new Date(today.getFullYear()-1, 0, 1); end = new Date(today.getFullYear()-1, 11, 31); }
  else { start = new Date(customStart); end = new Date(customEnd); }
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return { start, end };
}

function getComparisonRange(mainStart, mainEnd, compType, customStart=null, customEnd=null) {
  if (compType === 'none') return null;
  if (compType === 'previousPeriod') {
    const duration = mainEnd - mainStart;
    const prevEnd = new Date(mainStart.getTime() - 1);
    const prevStart = new Date(prevEnd.getTime() - duration);
    return { start: prevStart, end: prevEnd };
  }
  if (compType === 'previousMonth') {
    let start = new Date(mainStart); start.setDate(1); start.setMonth(start.getMonth()-1);
    let end = new Date(start.getFullYear(), start.getMonth()+1, 0);
    return { start, end };
  }
  if (compType === 'previousQuarter') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-3, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'previousYear' || compType === 'samePeriodLastYear') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-1);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-1);
    return { start, end };
  }
  if (compType === 'twoQuartersBack') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-6, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'twoYearsBack') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-2);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-2);
    return { start, end };
  }
  if (compType === 'custom' && customStart && customEnd) {
    return { start: new Date(customStart), end: new Date(customEnd) };
  }
  return null;
}

function getSecondComparisonRange(mainStart, mainEnd, compType) {
  if (compType === 'twoQuartersBack') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-9, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'twoYearsBack') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-3);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-3);
    return { start, end };
  }
  return null;
}

/* ── Fetch COA from Firestore ── */
async function fetchCOA() {
  if (!currentUser) return;
  coaMap.clear();
  openingBalanceMap.clear();
  try {
    const snapshot = await getDocs(
      query(
        collection(db, "users", currentUser.uid, "chartOfAccounts"),
        where("userId", "==", currentUser.uid)
      )
    );
    snapshot.forEach(d => {
      const data = d.data();
      const name = data.name || d.id;
      const type = (data.type || "").trim();
      const category = data.category || "";
      const openingBalance = parseFloat(data.openingBalance) || parseFloat(data.opening_balance) || parseFloat(data.balance) || 0;
      
      coaMap.set(name, { type, category, id: d.id });
      if (openingBalance > 0) {
        openingBalanceMap.set(name, openingBalance);
      }
    });
    console.log(`Loaded ${coaMap.size} COA accounts. ${openingBalanceMap.size} have opening balances.`);
  } catch(e) {
    console.error("COA fetch error:", e);
  }
}

/* ── Detect if account is Opening Balance / Capital type ── */
function isOpeningBalanceAccount(accountName, type, category) {
  const nameLower = (accountName || "").toLowerCase();
  const typeLower = (type || "").toLowerCase();
  const catLower = (category || "").toLowerCase();
  
  // Check by name patterns
  if (nameLower.includes("opening") || nameLower.includes("opening balance") || nameLower.includes("opening bal")) return true;
  if (nameLower.includes("capital") && !nameLower.includes("working capital")) return true;
  if (nameLower.includes("owner's contribution") || nameLower.includes("owners contribution")) return true;
  if (nameLower.includes("owner contribution") || nameLower.includes("owner's equity")) return true;
  if (nameLower.includes("retained earnings")) return true;
  if (nameLower.includes("share capital") || nameLower.includes("initial investment")) return true;
  if (nameLower.includes("startup capital") || nameLower.includes("starting capital")) return true;
  
  // Check by category
  if (catLower.includes("opening") || catLower.includes("capital")) return true;
  
  // Check by type
  if (typeLower === "equity") return true;
  
  return false;
}

/* ── Determine account type with COA priority ── */
function getAccountType(accountName, incomeAmt, expenseAmt) {
  // Priority 1: Opening Balance detection (from COA)
  if (coaMap.has(accountName)) {
    const coaEntry = coaMap.get(accountName);
    const t = coaEntry.type.toLowerCase();
    const cat = (coaEntry.category || "").toLowerCase();
    
    // Check if this is an opening balance account
    if (isOpeningBalanceAccount(accountName, coaEntry.type, coaEntry.category)) {
      return 'Opening';
    }
    
    if (t.includes('income') || t.includes('revenue') || t.includes('sales')) return 'Income';
    if (t.includes('expense') || t.includes('cost') || t.includes('cogs')) return 'Expense';
    if (t.includes('asset')) return 'Asset';
    if (t.includes('liability')) return 'Liability';
    if (t.includes('equity')) return 'Equity';
    return coaEntry.type;
  }
  
  // Priority 2: Fallback by name patterns
  if (isOpeningBalanceAccount(accountName, "", "")) return 'Opening';
  
  // Priority 3: Fallback by transaction amounts
  if (incomeAmt > 0 && expenseAmt === 0) return 'Income';
  if (expenseAmt > 0 && incomeAmt === 0) return 'Expense';
  if (incomeAmt > 0 && expenseAmt > 0) {
    return incomeAmt >= expenseAmt ? 'Income' : 'Expense';
  }
  return 'Unknown';
}

/* ── Check if account should appear in P&L ── */
function isPLAccount(type) {
  if (!type) return true;
  const t = type.toLowerCase();
  // Exclude pure balance sheet accounts (but keep Opening as it shows in P&L as capital contribution)
  if (t === 'opening') return true;
  if (t.includes('asset') || t.includes('liability') || t.includes('equity') || t.includes('capital')) {
    // But allow Equity accounts that look like Opening/Capital
    return false;
  }
  return true;
}

/* ── Fetch Transactions ── */
async function fetchTransactions(start, end) {
  if (!currentUser) return [];
  try {
    const snap = await getDocs(collection(db, "users", currentUser.uid, "transactions"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(tx => {
      if (!tx.DATE) return false;
      let d = tx.DATE.toDate ? tx.DATE.toDate() : new Date(tx.DATE);
      return d >= start && d <= end;
    });
  } catch(e) { console.error(e); return []; }
}

/* ── Process Transactions with COA + Opening Balance logic ── */
function processTransactions(transactions) {
  const accountMap = new Map(); // account -> { income, expense, openingBalance }
  let totalIncome = 0, totalExpense = 0, totalOpening = 0;
  const openingCategories = [];

  // First pass: aggregate by account
  transactions.forEach(tx => {
    const inc = parseFloat(tx.INCOME) || 0;
    const exp = parseFloat(tx.EXPENSE) || 0;
    const account = tx.ACCOUNT_HEADER || tx.ACCOUNT_NAME || tx.account || "Uncategorized";

    if (!accountMap.has(account)) {
      accountMap.set(account, { income: 0, expense: 0 });
    }
    const entry = accountMap.get(account);
    entry.income += inc;
    entry.expense += exp;
  });

  // Second pass: classify each account
  const incomeCategories = [];
  const expenseCategories = [];

  accountMap.forEach((vals, account) => {
    const type = getAccountType(account, vals.income, vals.expense);

    // Opening Balance accounts
    if (type === 'Opening') {
      // Opening balance: use income side as capital contribution
      const openingAmt = vals.income > 0 ? vals.income : (vals.expense > 0 ? vals.expense : 0);
      // Also check COA openingBalance field
      const coaOpening = openingBalanceMap.get(account) || 0;
      const finalOpening = openingAmt > 0 ? openingAmt : coaOpening;
      
      if (finalOpening > 0) {
        openingCategories.push([account, finalOpening]);
        totalOpening += finalOpening;
      }
      return;
    }

    // Skip non-P&L accounts (Assets, Liabilities)
    if (!isPLAccount(type)) return;

    if (type === 'Income') {
      const incomeValue = vals.income > 0 ? vals.income : 0;
      if (incomeValue > 0) {
        incomeCategories.push([account, incomeValue]);
        totalIncome += incomeValue;
      }
      if (vals.expense > 0) {
        const netIncome = vals.income - vals.expense;
        const idx = incomeCategories.findIndex(x => x[0] === account);
        if (idx >= 0) {
          totalIncome -= incomeCategories[idx][1];
          incomeCategories[idx][1] = netIncome;
          totalIncome += netIncome;
        }
      }
    } else if (type === 'Expense') {
      const expenseValue = vals.expense > 0 ? vals.expense : 0;
      if (expenseValue > 0) {
        expenseCategories.push([account, expenseValue]);
        totalExpense += expenseValue;
      }
      if (vals.income > 0) {
        const netExpense = vals.expense - vals.income;
        const idx = expenseCategories.findIndex(x => x[0] === account);
        if (idx >= 0) {
          totalExpense -= expenseCategories[idx][1];
          expenseCategories[idx][1] = netExpense;
          totalExpense += netExpense;
        }
      }
    } else {
      // Unknown — use amount logic
      if (vals.income > 0 && vals.expense === 0) {
        incomeCategories.push([account, vals.income]);
        totalIncome += vals.income;
      } else if (vals.expense > 0 && vals.income === 0) {
        expenseCategories.push([account, vals.expense]);
        totalExpense += vals.expense;
      } else if (vals.income > 0 && vals.expense > 0) {
        if (vals.income >= vals.expense) {
          incomeCategories.push([account, vals.income - vals.expense]);
          totalIncome += (vals.income - vals.expense);
        } else {
          expenseCategories.push([account, vals.expense - vals.income]);
          totalExpense += (vals.expense - vals.income);
        }
      }
    }
  });

  incomeCategories.sort((a,b) => b[1] - a[1]);
  expenseCategories.sort((a,b) => b[1] - a[1]);
  openingCategories.sort((a,b) => b[1] - a[1]);

  // Net profit = (Opening Balance + Income) - Expenses
  const totalRevenue = totalOpening + totalIncome;
  const netProfit = totalRevenue - totalExpense;

  return {
    totalIncome, totalExpense, totalOpening, totalRevenue, netProfit,
    incomeCategories, expenseCategories, openingCategories,
    allAccounts: Array.from(accountMap.entries()).map(([name, v]) => ({
      name,
      type: getAccountType(name, v.income, v.expense),
      net: v.income - v.expense
    }))
  };
}

/* ── Load Report ── */
async function loadReport() {
  const loading = document.getElementById("loadingModal");
  loading.style.display = "flex";
  try {
    await fetchCOA();

    const period = document.getElementById("reportPeriod").value;
    const customStart = document.getElementById("startDate").value, customEnd = document.getElementById("endDate").value;
    const { start, end } = getDateRange(period, customStart, customEnd);
    currentPeriod.start = start; currentPeriod.end = end;
    currentPeriod.periodText = formatPeriod(start, end);

    const currTransactions = await fetchTransactions(start, end);
    currentPeriod.summary = processTransactions(currTransactions);

    const compType = document.getElementById("comparisonType").value;
    const compStart = document.getElementById("compareStartDate").value, compEnd = document.getElementById("compareEndDate").value;
    const compRange = getComparisonRange(start, end, compType, compStart, compEnd);
    showThreePeriods = (compType === 'twoQuartersBack' || compType === 'twoYearsBack');

    if (compRange) {
      const trans1 = await fetchTransactions(compRange.start, compRange.end);
      prev1Summary = processTransactions(trans1);
      const prevPeriodText = formatPeriod(compRange.start, compRange.end);

      if (showThreePeriods) {
        const compRange2 = getSecondComparisonRange(start, end, compType);
        if (compRange2) {
          const trans2 = await fetchTransactions(compRange2.start, compRange2.end);
          prev2Summary = processTransactions(trans2);
          document.getElementById("prev2PeriodLabel").innerHTML = formatPeriod(compRange2.start, compRange2.end);
          document.getElementById("prev2Wrapper").style.display = "flex";
        } else { prev2Summary = null; document.getElementById("prev2Wrapper").style.display = "none"; }
        document.getElementById("prev1PeriodLabel").innerHTML = prevPeriodText;
        document.getElementById("prev1Wrapper").style.display = "flex";
      } else {
        prev2Summary = null;
        document.getElementById("prev1PeriodLabel").innerHTML = prevPeriodText;
        document.getElementById("prev1Wrapper").style.display = "flex";
        document.getElementById("prev2Wrapper").style.display = "none";
      }
    } else {
      prev1Summary = null; prev2Summary = null;
      document.getElementById("prev1Wrapper").style.display = "none";
      document.getElementById("prev2Wrapper").style.display = "none";
    }

    document.getElementById("currentPeriodLabel").innerHTML = currentPeriod.periodText;
    document.getElementById("coaBadge").innerText = coaMap.size > 0 ? `COA: ${coaMap.size} Accounts` : 'COA: Auto-detect';
    renderDashboard();
  } finally { loading.style.display = "none"; }
}

function renderPNLTable(curr, p1, p2) {

  if (p2) headerHtml += `<th class="right">Δ vs Prior‑Prev</th>`;
  headerHtml += `</tr>`;
  thead.innerHTML = headerHtml;

  const allAccountNames = new Set();
  curr.allAccounts.forEach(a => allAccountNames.add(a.name));
  if (p1) p1.allAccounts.forEach(a => allAccountNames.add(a.name));
  if (p2) p2.allAccounts.forEach(a => allAccountNames.add(a.name));

  const p2Map = p2 ? new Map(p2.allAccounts.map(a => [a.name, a])) : new Map();

    const aType = currMap.get(a)?.type || p1Map.get(a)?.type || p2Map.get(a)?.type || 'Unknown';
    const bType = currMap.get(b)?.type || p1Map.get(b)?.type || p2Map.get(b)?.type || 'Unknown';
    if ((typeOrder[aType]??4) !== (typeOrder[bType]??4)) return (typeOrder[aType]??4) - (typeOrder[bType]??4);
    return Math.abs(currMap.get(b)?.net || 0) - Math.abs(currMap.get(a)?.net || 0);
  });

  let tbody = '';
  let openingSubtotalCurr = 0, openingSubtotalP1 = 0, openingSubtotalP2 = 0;
  let incomeSubtotalCurr = 0, incomeSubtotalP1 = 0, incomeSubtotalP2 = 0;
  let expenseSubtotalCurr = 0, expenseSubtotalP1 = 0, expenseSubtotalP2 = 0;

    else if (type === 'Income') { typeLabel = 'INCOME'; typeClass = 'type-income'; }
    else if (type === 'Expense') { typeLabel = 'EXPENSE'; typeClass = 'type-expense'; }
    else if (type === 'Equity') { typeLabel = 'EQUITY'; typeClass = 'type-equity'; }

    if (type === 'Opening') amtClass = 'opening-amount';

    tbody += `<tr>
      <td><span class="type-badge ${typeClass}">${typeLabel}</span>${name}</td>
      <td class="amount ${amtClass}">${formatINR(netCurr)}</td>`;

    if (p1) {
      const p1Row = p1Map.get(name) || { net: 0, type: 'Unknown' };
      let p1AmtClass = p1Row.net >= 0 ? 'income-amount' : 'expense-amount';
      if (p1Row.type === 'Opening') p1AmtClass = 'opening-amount';
      tbody += `<td class="amount ${p1AmtClass}">${formatINR(p1Row.net)}</td>`;
    }
    if (p2) {
      const p2Row = p2Map.get(name) || { net: 0, type: 'Unknown' };
      let p2AmtClass = p2Row.net >= 0 ? 'income-amount' : 'expense-amount';
      if (p2Row.type === 'Opening') p2AmtClass = 'opening-amount';
      tbody += `<td class="amount ${p2AmtClass}">${formatINR(p2Row.net)}</td>`;
    }
    if (p1) {
      const p1Net = (p1Map.get(name) || {net:0}).net;
      const change1 = p1Net === 0 ? (netCurr===0?0:100) : ((netCurr - p1Net)/Math.abs(p1Net)*100);
      tbody += `<td class="amount ${change1>=0?'variance-positive':'variance-negative'}">${change1.toFixed(1)}%</td>`;
    }
    if (p2) {
      const p2Net = (p2Map.get(name) || {net:0}).net;
      const change2 = p2Net === 0 ? (netCurr===0?0:100) : ((netCurr - p2Net)/Math.abs(p2Net)*100);
      tbody += `<td class="amount ${change2>=0?'variance-positive':'variance-negative'}">${change2.toFixed(1)}%</td>`;
    }
    tbody += `</tr>`;

    // Accumulate subtotals
    if (type === 'Opening') {
      openingSubtotalCurr += netCurr;
      if (p1) openingSubtotalP1 += (p1Map.get(name)||{net:0}).net;
      if (p2) openingSubtotalP2 += (p2Map.get(name)||{net:0}).net;
    } else if (type === 'Income') {
      incomeSubtotalCurr += netCurr;
      if (p1) incomeSubtotalP1 += (p1Map.get(name)||{net:0}).net;
      if (p2) incomeSubtotalP2 += (p2Map.get(name)||{net:0}).net;
    } else if (type === 'Expense') {
      expenseSubtotalCurr += netCurr;
      if (p1) expenseSubtotalP1 += (p1Map.get(name)||{net:0}).net;
      if (p2) expenseSubtotalP2 += (p2Map.get(name)||{net:0}).net;
    }
  }

  // Add subtotals for Opening
  if (openingSubtotalCurr !== 0 || openingSubtotalP1 !== 0 || openingSubtotalP2 !== 0) {
    tbody += `<tr class="subtotal-row"><td><strong>Opening Balance Subtotal</strong></td><td class="amount opening-amount"><strong>${formatINR(openingSubtotalCurr)}</strong></td>`;
    if (p1) tbody += `<td class="amount opening-amount"><strong>${formatINR(openingSubtotalP1)}</strong></td>`;
    if (p2) tbody += `<td class="amount opening-amount"><strong>${formatINR(openingSubtotalP2)}</strong></td>`;
    if (p1) { const ch = openingSubtotalP1===0?0:((openingSubtotalCurr-openingSubtotalP1)/Math.abs(openingSubtotalP1)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    if (p2) { const ch = openingSubtotalP2===0?0:((openingSubtotalCurr-openingSubtotalP2)/Math.abs(openingSubtotalP2)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    tbody += `</tr>`;
  }

  // Add subtotals for Income
  if (incomeSubtotalCurr !== 0 || incomeSubtotalP1 !== 0 || incomeSubtotalP2 !== 0) {
    tbody += `<tr class="subtotal-row"><td><strong>Income Subtotal</strong></td><td class="amount income-amount"><strong>${formatINR(incomeSubtotalCurr)}</strong></td>`;
    if (p1) tbody += `<td class="amount income-amount"><strong>${formatINR(incomeSubtotalP1)}</strong></td>`;
    if (p2) tbody += `<td class="amount income-amount"><strong>${formatINR(incomeSubtotalP2)}</strong></td>`;
    if (p1) { const ch = incomeSubtotalP1===0?0:((incomeSubtotalCurr-incomeSubtotalP1)/Math.abs(incomeSubtotalP1)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    if (p2) { const ch = incomeSubtotalP2===0?0:((incomeSubtotalCurr-incomeSubtotalP2)/Math.abs(incomeSubtotalP2)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    tbody += `</tr>`;
  }

  // Add subtotals for Expense
  if (expenseSubtotalCurr !== 0 || expenseSubtotalP1 !== 0 || expenseSubtotalP2 !== 0) {
    tbody += `<tr class="subtotal-row expense-sub"><td><strong>Expense Subtotal</strong></td><td class="amount expense-amount"><strong>${formatINR(expenseSubtotalCurr)}</strong></td>`;
    if (p1) tbody += `<td class="amount expense-amount"><strong>${formatINR(expenseSubtotalP1)}</strong></td>`;
    if (p2) tbody += `<td class="amount expense-amount"><strong>${formatINR(expenseSubtotalP2)}</strong></td>`;
    if (p1) { const ch = expenseSubtotalP1===0?0:((expenseSubtotalCurr-expenseSubtotalP1)/Math.abs(expenseSubtotalP1)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    if (p2) { const ch = expenseSubtotalP2===0?0:((expenseSubtotalCurr-expenseSubtotalP2)/Math.abs(expenseSubtotalP2)*100); tbody += `<td class="amount">${ch.toFixed(1)}%</td>`; }
    tbody += `</tr>`;
  }

  if (sortedNames.length === 0) {
    tbody = `<tr><td colspan="6" class="empty-state"><i class="fas fa-inbox"></i>No transactions found for this period</td></tr>`;
  }

  // Grand total: (Opening + Income) - Expenses
  const grandTotalCurr = curr.netProfit;
  tbody += `<tr class="total-row"><td><strong>TOTAL NET (Opening + Income − Expenses)</strong></td><td class="amount"><strong>${formatINR(grandTotalCurr)}</strong></td>`;
  if (p1) tbody += `<td class="amount"><strong>${formatINR(p1.netProfit)}</strong></td>`;
  if (p2) tbody += `<td class="amount"><strong>${formatINR(p2.netProfit)}</strong></td>`;
  if (p1) { const change = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); tbody += `<td class="amount">${change.toFixed(1)}%</td>`; }
  if (p2) { const change = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); tbody += `<td class="amount">${change.toFixed(1)}%</td>`; }
  tbody += `</tr>`;

  document.getElementById("pnlTableBody").innerHTML = tbody;
}

function renderTopLists(curr) {
  document.getElementById("topIncomeList").innerHTML = curr.incomeCategories.slice(0,5).map(([c,a])=>`<div class="list-item"><span class="name"><i class="fas fa-circle" style="color:var(--success);font-size:6px;"></i>${c}</span><span class="val income-amount">${formatINR(a)}</span></div>`).join('') || '<div class="empty-state"><i class="fas fa-inbox"></i>No income accounts</div>';
  document.getElementById("topExpenseList").innerHTML = curr.expenseCategories.slice(0,5).map(([c,a])=>`<div class="list-item"><span class="name"><i class="fas fa-circle" style="color:var(--danger);font-size:6px;"></i>${c}</span><span class="val expense-amount">${formatINR(a)}</span></div>`).join('') || '<div class="empty-state"><i class="fas fa-inbox"></i>No expense accounts</div>';
}

function renderInsights(curr, p1, p2) {
  let html = '';
  if (curr.totalOpening > 0) {
    html += `<div class="insight-item">🚪 <strong>Opening Balance:</strong> ${formatINR(curr.totalOpening)} from ${curr.openingCategories.length} account(s) — treated as capital contribution</div>`;
  }
  if (curr.netProfit > 0 && curr.totalRevenue > 0) {
    const margin = ((curr.netProfit/curr.totalRevenue)*100).toFixed(1);
    html += `<div class="insight-item">✅ <strong>Profit Margin:</strong> ${margin}% — Net profit of ${formatINR(curr.netProfit)} on total revenue of ${formatINR(curr.totalRevenue)}</div>`;
  } else if (curr.netProfit < 0) {
    html += `<div class="insight-item">⚠️ <strong>Loss Alert:</strong> Expenses exceed total revenue (Opening + Income) by ${formatINR(Math.abs(curr.netProfit))}</div>`;
  }
  if (p1) { const growth = ((curr.totalRevenue-p1.totalRevenue)/Math.abs(p1.totalRevenue||1)*100).toFixed(1); html += `<div class="insight-item">📈 <strong>Total Revenue vs Previous:</strong> ${growth>=0?'+':''}${growth}%</div>`; }
  if (p2) { const growth2 = ((curr.totalRevenue-p2.totalRevenue)/Math.abs(p2.totalRevenue||1)*100).toFixed(1); html += `<div class="insight-item">📊 <strong>Total Revenue vs Prior‑Previous:</strong> ${growth2>=0?'+':''}${growth2}%</div>`; }
  if (curr.incomeCategories.length > 0) html += `<div class="insight-item">🏆 <strong>Top Income:</strong> ${curr.incomeCategories[0][0]} (${formatINR(curr.incomeCategories[0][1])})</div>`;
  if (curr.expenseCategories.length > 0) html += `<div class="insight-item">🔻 <strong>Top Expense:</strong> ${curr.expenseCategories[0][0]} (${formatINR(curr.expenseCategories[0][1])})</div>`;
  if (coaMap.size > 0) html += `<div class="insight-item">📋 <strong>COA Active:</strong> ${coaMap.size} accounts mapped — Opening balances and Equity treated as capital</div>`;
  document.getElementById("insightsContent").innerHTML = html || '<div class="insight-item">No insights available</div>';
}

function updateChart(curr) {
  const ctx = document.getElementById("pnlChart").getContext("2d");
  if (currentChart) currentChart.destroy();
  const chartType = document.getElementById("chartType").value;

  // Include Opening + Income as "Revenue" side, Expenses as "Cost" side
  const openingLabels = curr.openingCategories.slice(0,3).map(o=>'🚪 '+o[0]);
  const openingData = curr.openingCategories.slice(0,3).map(o=>o[1]);
  const incomeLabels = curr.incomeCategories.slice(0,5).map(i=>i[0]);
  const incomeData = curr.incomeCategories.slice(0,5).map(i=>i[1]);
  const expenseLabels = curr.expenseCategories.slice(0,5).map(e=>e[0]);
  const expenseData = curr.expenseCategories.slice(0,5).map(e=>e[1]);

  const brandColors = ['#4f46e5','#7c3aed','#a78bfa','#c4b5fd','#818cf8'];
  const dangerColors = ['#dc2626','#ef4444','#f87171','#fca5a5','#fecaca'];
  const openingColors = ['#0891b2','#06b6d4','#22d3ee','#67e8f9'];

  if (chartType === 'pie' || chartType === 'doughnut') {
    const allLabels = [...openingLabels, ...incomeLabels.map(l=>'↑ '+l), ...expenseLabels.map(l=>'↓ '+l)];
    const allData = [...openingData, ...incomeData, ...expenseData];
    const allColors = [...openingColors.slice(0, openingData.length), ...brandColors.slice(0, incomeData.length), ...dangerColors.slice(0, expenseData.length)];
    currentChart = new Chart(ctx, {
      type: chartType,
      data: { labels: allLabels, datasets: [{ data: allData, backgroundColor: allColors, borderColor: '#fff', borderWidth: 2 }] },
      options: { responsive: true, plugins: { legend: { position: 'right', labels: { font: { size: 11 }, padding: 12 } },
        tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatINR(ctx.raw)}` } } } }
    });
    return;
  }

  // Bar / Line: show Opening, Income, Expense side by side
  const allLabels = [...openingLabels, ...incomeLabels, ...expenseLabels];
  const openingSeries = [...openingData, ...new Array(incomeLabels.length + expenseLabels.length).fill(0)];
  const incomeSeries = [...new Array(openingLabels.length).fill(0), ...incomeData, ...new Array(expenseLabels.length).fill(0)];
  const expenseSeries = [...new Array(openingLabels.length + incomeLabels.length).fill(0), ...expenseData];

  currentChart = new Chart(ctx, {
    type: chartType,
    data: {
      labels: allLabels,
      datasets: [
        { label: "Opening Balance", data: openingSeries, backgroundColor: chartType==='line'?'rgba(8,145,178,0.1)':'#0891b2', borderColor: '#0891b2', borderWidth: 2, tension: 0.4, fill: chartType==='line', borderRadius: 6 },
        { label: "Income", data: incomeSeries, backgroundColor: chartType==='line'?'rgba(79,70,229,0.1)':'#4f46e5', borderColor: '#4f46e5', borderWidth: 2, tension: 0.4, fill: chartType==='line', borderRadius: 6 },
        { label: "Expenses", data: expenseSeries, backgroundColor: chartType==='line'?'rgba(220,38,38,0.1)':'#dc2626', borderColor: '#dc2626', borderWidth: 2, tension: 0.4, fill: chartType==='line', borderRadius: 6 }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#64748b', font: { family: 'Inter', size: 11, weight: '600' }, padding: 16 } },
        tooltip: { backgroundColor: '#0f172a', padding: 10, callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatINR(ctx.raw)}` } }
      },
      scales: {
        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#f1f5f9' } },
        y: { ticks: { color: '#64748b', font: { size: 10 }, callback: v => '₹'+v.toLocaleString('en-IN') }, grid: { color: '#f1f5f9' } }
      }
    }
  });
}

async function exportToPDF() {
  if (!currentPeriod.summary) { Swal.fire("No Data", "Generate report first", "warning"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

  const curr = currentPeriod.summary;
  const p1 = prev1Summary;
  const p2 = showThreePeriods ? prev2Summary : null;
  const userName = document.getElementById("username").innerText || "User";

  /* ========== PAGE 1 — Cover & Summary ========== */
  doc.setFillColor(79, 70, 229); doc.rect(0, 0, pageW, 55, 'F');
  doc.setFillColor(124, 58, 237); doc.rect(0, 50, pageW, 5, 'F');

  doc.setTextColor(255,255,255);
  doc.setFontSize(22); doc.setFont('helvetica','bold');
  doc.text("PROFIT & LOSS", pageW/2, 25, { align: 'center' });

  doc.setTextColor(100,116,139); doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text(`Prepared for: ${userName}`, 15, 68);
  doc.text(`Generated: ${new Date().toLocaleString('en-IN')}`, pageW - 15, 68, { align: 'right' });

  // KPI boxes (4 columns now)

  const boxStartX = (pageW - (boxW*4 + gap*3)) / 2;

  // Opening box
  doc.setFillColor(236, 254, 255); doc.roundedRect(boxStartX, boxY, boxW, boxH, 3, 3, 'F');
  doc.setDrawColor(8, 145, 178); doc.setLineWidth(0.5); doc.roundedRect(boxStartX, boxY, boxW, boxH, 3, 3, 'S');

  doc.text("OPENING", boxStartX + boxW/2, boxY + 12, { align: 'center' });
  doc.setFontSize(11); doc.setTextColor(15,23,42);
  doc.text(formatINRShort(curr.totalOpening), boxStartX + boxW/2, boxY + 26, { align: 'center' });

  // Income box
  doc.setFillColor(236, 253, 245); doc.roundedRect(boxStartX + boxW + gap, boxY, boxW, boxH, 3, 3, 'F');
  doc.setDrawColor(5, 150, 105); doc.roundedRect(boxStartX + boxW + gap, boxY, boxW, boxH, 3, 3, 'S');
  doc.setTextColor(5,150,105); doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.text("INCOME", boxStartX + boxW + gap + boxW/2, boxY + 12, { align: 'center' });
  doc.setFontSize(11); doc.setTextColor(15,23,42);
  doc.text(formatINRShort(curr.totalIncome), boxStartX + boxW + gap + boxW/2, boxY + 26, { align: 'center' });

  // Expense box
  doc.setFillColor(254, 242, 242); doc.roundedRect(boxStartX + (boxW+gap)*2, boxY, boxW, boxH, 3, 3, 'F');
  doc.setDrawColor(220, 38, 38); doc.roundedRect(boxStartX + (boxW+gap)*2, boxY, boxW, boxH, 3, 3, 'S');
  doc.setTextColor(220,38,38); doc.setFontSize(7); doc.setFont('helvetica','bold');
  doc.text("EXPENSES", boxStartX + (boxW+gap)*2 + boxW/2, boxY + 12, { align: 'center' });
  doc.setFontSize(11); doc.setTextColor(15,23,42);
  doc.text(formatINRShort(curr.totalExpense), boxStartX + (boxW+gap)*2 + boxW/2, boxY + 26, { align: 'center' });

  // Net box
  const netIsProfit = curr.netProfit >= 0;
  const netBg = netIsProfit ? [238, 242, 255] : [254, 242, 242];
  const netBorder = netIsProfit ? [79, 70, 229] : [220, 38, 38];
  doc.setFillColor(...netBg); doc.roundedRect(boxStartX + (boxW+gap)*3, boxY, boxW, boxH, 3, 3, 'F');
  doc.setDrawColor(...netBorder); doc.roundedRect(boxStartX + (boxW+gap)*3, boxY, boxW, boxH, 3, 3, 'S');
  doc.setTextColor(...netBorder); doc.setFontSize(7); doc.setFont('helvetica','bold');

  doc.setFontSize(11); doc.setTextColor(15,23,42);
  const netText = netIsProfit ? formatINRShort(curr.netProfit) : `-${formatINRShort(Math.abs(curr.netProfit))}`;
  doc.text(netText, boxStartX + (boxW+gap)*3 + boxW/2, boxY + 26, { align: 'center' });

  // Formula note
  doc.setFontSize(7); doc.setTextColor(100,116,139); doc.setFont('helvetica','italic');
  doc.text("Net = (Opening Balance + Income) − Expenses", pageW/2, boxY + boxH + 6, { align: 'center' });

  // Comparison table
  const compY = boxY + boxH + 15;
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text("PERIOD COMPARISON", pageW/2, compY, { align: 'center' });

  const compHeaders = ["Metric", "Current"];
  if (p1) compHeaders.push("Previous");
  if (p2) compHeaders.push("Prior-Prev");
  const compData = [compHeaders];
  compData.push(["Opening Balance", formatINRShort(curr.totalOpening), p1?formatINRShort(p1.totalOpening):null, p2?formatINRShort(p2.totalOpening):null].filter(v=>v!==null));
  compData.push(["Income", formatINRShort(curr.totalIncome), p1?formatINRShort(p1.totalIncome):null, p2?formatINRShort(p2.totalIncome):null].filter(v=>v!==null));
  compData.push(["Expenses", formatINRShort(curr.totalExpense), p1?formatINRShort(p1.totalExpense):null, p2?formatINRShort(p2.totalExpense):null].filter(v=>v!==null));
  compData.push(["Net P/L", formatINRShort(curr.netProfit), p1?formatINRShort(p1.netProfit):null, p2?formatINRShort(p2.netProfit):null].filter(v=>v!==null));

  doc.autoTable({

    alternateRowStyles: { fillColor: [248,250,252] }
  });

  let noteY = doc.lastAutoTable.finalY + 12;

  doc.setFontSize(8); doc.setTextColor(148,163,184);
  doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 1 of 3", pageW - 15, pageH - 10, { align: 'right' });

  /* ========== PAGE 2 — Charts & Analysis ========== */
  doc.addPage('a4', 'portrait');
  doc.setFillColor(79, 70, 229); doc.rect(0, 0, pageW, 22, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text("CHARTS & ANALYSIS", pageW/2, 14, { align: 'center' });

  doc.setTextColor(15,23,42); doc.setFontSize(11); doc.setFont('helvetica','bold');
  doc.text("Opening Balance, Income & Expenses", 15, 35);

  const chartY = 42, chartH = 55, chartW = 180;
  const maxVal = Math.max(
    ...curr.incomeCategories.slice(0,4).map(i=>i[1]),
    ...curr.expenseCategories.slice(0,4).map(e=>e[1]),
    ...curr.openingCategories.slice(0,2).map(o=>o[1]),
    1
  );

  const incItems = curr.incomeCategories.slice(0,4);
  const expItems = curr.expenseCategories.slice(0,4);
  const openItems = curr.openingCategories.slice(0,2);

  doc.setDrawColor(226,232,240); doc.setLineWidth(0.2);
  for (let i = 0; i <= 4; i++) {
    const y = chartY + chartH - (i/4)*chartH;
    doc.line(15, y, 15 + chartW, y);
  }

  const barW = 8;
  // Opening bars
  openItems.forEach((item, i) => {
    const h = (item[1] / maxVal) * chartH;
    doc.setFillColor(8, 145, 178);

    doc.text(item[0].substring(0,6), 20 + i * (barW + 3) + barW/2, chartY + chartH + 4, { align: 'center', maxWidth: 12 });
  });

  // Income bars
  const incStartX = 20 + openItems.length * (barW + 3) + 8;
  incItems.forEach((item, i) => {
    const h = (item[1] / maxVal) * chartH;
    doc.setFillColor(79, 70, 229);
    doc.rect(incStartX + i * (barW + 3), chartY + chartH - h, barW, h, 'F');
    doc.setFontSize(6); doc.setTextColor(100,116,139);
    doc.text(item[0].substring(0,6), incStartX + i * (barW + 3) + barW/2, chartY + chartH + 4, { align: 'center', maxWidth: 12 });
  });

  // Expense bars
  const expStartX = incStartX + incItems.length * (barW + 3) + 8;
  expItems.forEach((item, i) => {
    const h = (item[1] / maxVal) * chartH;
    doc.setFillColor(220, 38, 38);
    doc.rect(expStartX + i * (barW + 3), chartY + chartH - h, barW, h, 'F');
    doc.setFontSize(6); doc.setTextColor(100,116,139);
    doc.text(item[0].substring(0,6), expStartX + i * (barW + 3) + barW/2, chartY + chartH + 4, { align: 'center', maxWidth: 12 });
  });

  // Legend
  doc.setFillColor(8,145,178); doc.rect(15, chartY + chartH + 10, 5, 5, 'F');
  doc.setFontSize(8); doc.setTextColor(15,23,42); doc.setFont('helvetica','normal');
  doc.text("Opening", 23, chartY + chartH + 14);
  doc.setFillColor(79,70,229); doc.rect(60, chartY + chartH + 10, 5, 5, 'F');
  doc.text("Income", 68, chartY + chartH + 14);
  doc.setFillColor(220,38,38); doc.rect(105, chartY + chartH + 10, 5, 5, 'F');
  doc.text("Expenses", 113, chartY + chartH + 14);

  // Net Profit Trend
  if (p1) {
    const trendY = 120, trendH = 50, trendW = 170;
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
    doc.text("Net Profit Trend", 15, trendY);

    const periods = p2 ? ['Prior-Prev', 'Previous', 'Current'] : ['Previous', 'Current'];
    const values = p2 ? [p2.netProfit, p1.netProfit, curr.netProfit] : [p1.netProfit, curr.netProfit];
    const maxNet = Math.max(...values.map(Math.abs), 1);

    doc.setDrawColor(203,213,225); doc.setLineWidth(0.3);
    const zeroY = trendY + 8 + trendH / 2;
    doc.line(15, zeroY, 15 + trendW, zeroY);
    doc.setFontSize(6); doc.setTextColor(148,163,184);
    doc.text("₹0", 12, zeroY + 1, { align: 'right' });

    const points = values.map((v, i) => ({
      x: 20 + (i / (values.length - 1 || 1)) * (trendW - 10),
      y: zeroY - (v / maxNet) * (trendH / 2)
    }));

    doc.setDrawColor(79,70,229); doc.setLineWidth(1);
    for (let i = 0; i < points.length - 1; i++) {
      doc.line(points[i].x, points[i].y, points[i+1].x, points[i+1].y);
    }

    points.forEach((p, i) => {
      doc.setFillColor(79,70,229);
      doc.circle(p.x, p.y, 1.5, 'F');
      doc.setFontSize(7); doc.setTextColor(100,116,139);
      doc.text(periods[i], p.x, zeroY + 8, { align: 'center' });
      doc.setTextColor(15,23,42); doc.setFont('helvetica','bold');
      doc.text(formatINRShort(values[i]), p.x, p.y - 4, { align: 'center' });
      doc.setFont('helvetica','normal');
    });
  }

  // Insights
  const insightY = 190;
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(15,23,42);
  doc.text("Key Insights", 15, insightY);

  const insights = [];
  if (curr.totalOpening > 0) insights.push(`Opening Balance: ${formatINRShort(curr.totalOpening)} (capital contribution)`);
  if (curr.netProfit > 0 && curr.totalRevenue > 0) insights.push(`Profit margin: ${((curr.netProfit/curr.totalRevenue)*100).toFixed(1)}% on ${formatINRShort(curr.totalRevenue)} revenue`);
  else if (curr.netProfit < 0) insights.push(`Net loss: ${formatINRShort(Math.abs(curr.netProfit))}`);
  if (p1) insights.push(`Total revenue vs Previous: ${((curr.totalRevenue-p1.totalRevenue)/Math.abs(p1.totalRevenue||1)*100).toFixed(1)}%`);
  if (curr.incomeCategories.length > 0) insights.push(`Top income: ${curr.incomeCategories[0][0]} (${formatINRShort(curr.incomeCategories[0][1])})`);
  if (curr.expenseCategories.length > 0) insights.push(`Top expense: ${curr.expenseCategories[0][0]} (${formatINRShort(curr.expenseCategories[0][1])})`);

  insights.forEach((text, i) => {
    doc.setFillColor(248,250,252); doc.roundedRect(15, insightY + 5 + i * 10, pageW - 30, 8, 2, 2, 'F');
    doc.setFontSize(8); doc.setTextColor(51,65,85); doc.setFont('helvetica','normal');
    doc.text(`•  ${text}`, 20, insightY + 5 + i * 10 + 5.5);
  });

  doc.setFontSize(8); doc.setTextColor(148,163,184);
  doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 2 of 3", pageW - 15, pageH - 10, { align: 'right' });

  /* ========== PAGE 3+ — Detailed P&L Table ========== */
  doc.addPage('a4', 'portrait');
  doc.setFillColor(79, 70, 229); doc.rect(0, 0, pageW, 22, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text("DETAILED P&L STATEMENT", pageW/2, 14, { align: 'center' });
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(currentPeriod.periodText, pageW/2, 19, { align: 'center' });

  const allAccountNames = new Set();
  curr.allAccounts.forEach(a => allAccountNames.add(a.name));
  if (p1) p1.allAccounts.forEach(a => allAccountNames.add(a.name));
  if (p2) p2.allAccounts.forEach(a => allAccountNames.add(a.name));

  const currMap = new Map(curr.allAccounts.map(a => [a.name, a]));
  const p1Map = p1 ? new Map(p1.allAccounts.map(a => [a.name, a])) : new Map();
  const p2Map = p2 ? new Map(p2.allAccounts.map(a => [a.name, a])) : new Map();

  const typeOrder = { 'Opening': 0, 'Income': 1, 'Expense': 2, 'Unknown': 3 };
  const sortedNames = Array.from(allAccountNames).sort((a, b) => {
    const aType = currMap.get(a)?.type || 'Unknown';
    const bType = currMap.get(b)?.type || 'Unknown';
    if ((typeOrder[aType]??4) !== (typeOrder[bType]??4)) return (typeOrder[aType]??4) - (typeOrder[bType]??4);
    return Math.abs(currMap.get(b)?.net||0) - Math.abs(currMap.get(a)?.net||0);
  });

  const tableBody = [];
  sortedNames.forEach(name => {
    const c = currMap.get(name) || { net: 0, type: 'Unknown' };
    const typeLabel = c.type === 'Opening' ? 'OPEN' : (c.type === 'Income' ? 'INC' : (c.type === 'Expense' ? 'EXP' : ''));
    const row = [`${typeLabel ? '['+typeLabel+'] ' : ''}${name}`, formatNumberForPDF(c.net)];
    if (p1) row.push(formatNumberForPDF((p1Map.get(name)||{net:0}).net));
    if (p2) row.push(formatNumberForPDF((p2Map.get(name)||{net:0}).net));
    if (p1) {
      const p1Net = (p1Map.get(name)||{net:0}).net;
      const ch = p1Net === 0 ? (c.net===0?0:100) : ((c.net - p1Net)/Math.abs(p1Net)*100);
      row.push(ch.toFixed(1) + '%');
    }
    if (p2) {
      const p2Net = (p2Map.get(name)||{net:0}).net;
      const ch = p2Net === 0 ? (c.net===0?0:100) : ((c.net - p2Net)/Math.abs(p2Net)*100);
      row.push(ch.toFixed(1) + '%');
    }
    tableBody.push(row);
  });

  // Subtotal + total rows
  if (curr.totalOpening > 0) {
    const r = ["Opening Balance Subtotal", formatNumberForPDF(curr.totalOpening)];
    if (p1) r.push(formatNumberForPDF(p1.totalOpening));
    if (p2) r.push(formatNumberForPDF(p2.totalOpening));
    if (p1) r.push("—"); if (p2) r.push("—");
    tableBody.push(r);
  }
  if (curr.totalIncome > 0) {
    const r = ["Income Subtotal", formatNumberForPDF(curr.totalIncome)];
    if (p1) r.push(formatNumberForPDF(p1.totalIncome));
    if (p2) r.push(formatNumberForPDF(p2.totalIncome));
    if (p1) r.push("—"); if (p2) r.push("—");
    tableBody.push(r);
  }
  if (curr.totalExpense > 0) {
    const r = ["Expense Subtotal", formatNumberForPDF(curr.totalExpense)];
    if (p1) r.push(formatNumberForPDF(p1.totalExpense));
    if (p2) r.push(formatNumberForPDF(p2.totalExpense));
    if (p1) r.push("—"); if (p2) r.push("—");
    tableBody.push(r);
  }

  const totalRow = ["NET PROFIT (Opening + Income − Expenses)", formatNumberForPDF(curr.netProfit)];
  if (p1) totalRow.push(formatNumberForPDF(p1.netProfit));
  if (p2) totalRow.push(formatNumberForPDF(p2.netProfit));
  if (p1) { const ch = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); totalRow.push(ch.toFixed(1)+'%'); }
  if (p2) { const ch = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); totalRow.push(ch.toFixed(1)+'%'); }
  tableBody.push(totalRow);

  const headers = ["Account", "Current (₹)"];
  if (p1) headers.push("Previous (₹)");
  if (p2) headers.push("Prior-Prev (₹)");
  if (p1) headers.push("Δ Prev");
  if (p2) headers.push("Δ Prior-Prev");

  doc.autoTable({
    startY: 28,
    head: [headers],
    body: tableBody,
    theme: 'grid',
    headStyles: { fillColor: [79,70,229], textColor: [255,255,255], fontSize: 8, halign: 'center', fontStyle: 'bold' },
    bodyStyles: { fontSize: 7.5, textColor: [51,65,85] },
    alternateRowStyles: { fillColor: [248,250,252] },
    columnStyles: {
      0: { cellWidth: 65, halign: 'left' },
      1: { cellWidth: 28, halign: 'right' },
      2: { cellWidth: 28, halign: 'right' },
      3: { cellWidth: 28, halign: 'right' },
      4: { cellWidth: 22, halign: 'right' },
      5: { cellWidth: 22, halign: 'right' }
    },
    didParseCell: function(data) {
      if (data.section === 'body') {
        const lastIdx = tableBody.length - 1;
        if (data.row.index === lastIdx) {
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [238,242,255];
          data.cell.styles.textColor = [15,23,42];
        } else if (data.cell.raw && typeof data.cell.raw === 'string' && data.cell.raw.includes('Subtotal')) {
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [241,245,249];
        }
        if (data.column.index >= 4 && typeof data.cell.raw === 'string' && data.cell.raw.includes('%')) {
          const num = parseFloat(data.cell.raw);
          if (num >= 0) data.cell.styles.textColor = [5,150,105];
          else data.cell.styles.textColor = [220,38,38];
          data.cell.styles.fontStyle = 'bold';
        }
      }
    },
    didDrawPage: function() {
      doc.setFontSize(8); doc.setTextColor(148,163,184);
      doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
      doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageW - 15, pageH - 10, { align: 'right' });
    }
  });

  const fileName = `PnL_COA_Report_${new Date().toISOString().slice(0,10)}.pdf`;
  doc.save(fileName);
  Swal.fire({ icon: 'success', title: 'PDF Exported', text: 'A4 report generated successfully', timer: 2000, showConfirmButton: false });
}

/* ── Export Excel ── */
function exportToExcel() {
  if (!currentPeriod.summary) { Swal.fire("No Data", "Generate report first", "warning"); return; }
  const curr = currentPeriod.summary, p1 = prev1Summary, p2 = showThreePeriods ? prev2Summary : null;

  const allNames = new Set();
  curr.allAccounts.forEach(a => allNames.add(a.name));
  if (p1) p1.allAccounts.forEach(a => allNames.add(a.name));
  if (p2) p2.allAccounts.forEach(a => allNames.add(a.name));

  const currMap = new Map(curr.allAccounts.map(a => [a.name, a]));
  const p1Map = p1 ? new Map(p1.allAccounts.map(a => [a.name, a])) : new Map();
  const p2Map = p2 ? new Map(p2.allAccounts.map(a => [a.name, a])) : new Map();

  const data = [["Account", "Type", "Current Net (₹)"]];
  if (p1) data[0].push("Previous (₹)");
  if (p2) data[0].push("Prior-Prev (₹)");
  if (p1) data[0].push("Δ vs Prev");
  if (p2) data[0].push("Δ vs Prior-Prev");

  Array.from(allNames).forEach(name => {
    const c = currMap.get(name) || { net: 0, type: 'Unknown' };
    const row = [name, c.type, c.net];
    if (p1) row.push((p1Map.get(name)||{net:0}).net);
    if (p2) row.push((p2Map.get(name)||{net:0}).net);
    if (p1) {
      const p1Net = (p1Map.get(name)||{net:0}).net;
      const ch = p1Net === 0 ? (c.net===0?0:100) : ((c.net - p1Net)/Math.abs(p1Net)*100);
      row.push(ch.toFixed(1) + '%');
    }
    if (p2) {
      const p2Net = (p2Map.get(name)||{net:0}).net;
      const ch = p2Net === 0 ? (c.net===0?0:100) : ((c.net - p2Net)/Math.abs(p2Net)*100);
      row.push(ch.toFixed(1) + '%');
    }
    data.push(row);
  });

  // Subtotals
  data.push(["Opening Balance Subtotal", "Opening", curr.totalOpening]);
  if (p1) data[data.length-1].push(p1.totalOpening);
  if (p2) data[data.length-1].push(p2.totalOpening);
  if (p1) data[data.length-1].push("—");
  if (p2) data[data.length-1].push("—");

  data.push(["Income Subtotal", "Income", curr.totalIncome]);
  if (p1) data[data.length-1].push(p1.totalIncome);
  if (p2) data[data.length-1].push(p2.totalIncome);
  if (p1) data[data.length-1].push("—");
  if (p2) data[data.length-1].push("—");

  data.push(["Expense Subtotal", "Expense", curr.totalExpense]);
  if (p1) data[data.length-1].push(p1.totalExpense);
  if (p2) data[data.length-1].push(p2.totalExpense);
  if (p1) data[data.length-1].push("—");
  if (p2) data[data.length-1].push("—");

  data.push(["NET PROFIT", "", curr.netProfit]);
  if (p1) data[data.length-1].push(p1.netProfit);
  if (p2) data[data.length-1].push(p2.netProfit);
  if (p1) { const ch = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); data[data.length-1].push(ch.toFixed(1)+'%'); }
  if (p2) { const ch = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); data[data.length-1].push(ch.toFixed(1)+'%'); }

  const ws = XLSX.utils.aoa_to_sheet(data);
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
  for (let r = range.s.r + 1; r <= range.e.r; r++) {
    for (let col = 2; col <= (p1 ? (p2 ? 4 : 2) : 2); col++) {
      const addr = XLSX.utils.encode_cell({ r, c: col });
      if (ws[addr] && typeof ws[addr].v === 'number') ws[addr].z = '#,##0.00';
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "P&L Statement");
  XLSX.writeFile(wb, `PnL_COA_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
  Swal.fire({ icon: 'success', title: 'Excel Exported', timer: 1500, showConfirmButton: false });
}

/* ── Defaults & Events ── */
function setDefaultDates() {
  const today = new Date();
  document.getElementById("startDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 1));
  document.getElementById("endDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()+1, 0));
  document.getElementById("compareStartDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()-1, 1));
  document.getElementById("compareEndDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 0));
}

document.getElementById("reportPeriod").addEventListener("change", () => {
  document.getElementById("customDateRange").style.display = document.getElementById("reportPeriod").value === "custom" ? "block" : "none";
});
document.getElementById("comparisonType").addEventListener("change", () => {
  document.getElementById("customComparisonRange").style.display = document.getElementById("comparisonType").value === "custom" ? "block" : "none";
});
document.getElementById("generateReportBtn").addEventListener("click", loadReport);
document.getElementById("exportExcel").addEventListener("click", exportToExcel);
document.getElementById("exportPDF").addEventListener("click", exportToPDF);
document.getElementById("chartType").addEventListener("change", () => { if (currentPeriod.summary) updateChart(currentPeriod.summary); });
document.getElementById("homeBtn").addEventListener("click", () => { window.location.href = "home.html"; });

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const name = user.displayName || user.email?.split('@')[0] || "User";
    document.getElementById("username").innerHTML = name;
    document.getElementById("userInitials").innerHTML = name.charAt(0).toUpperCase();
    setDefaultDates();
    await loadReport();
  } else {
    window.location.href = "index.html";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
