<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Profit & Loss | Executive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0f1c;
      color: #e2e8f0;
      line-height: 1.6;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1500px; margin: 0 auto; }

    /* ── Glassmorphism Header ── */
    header {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 24px;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    .logo span { font-weight: 700; font-size: 1.15rem; color: #f1f5f9; letter-spacing: -0.02em; }
    .logo small { display: block; font-size: 0.65rem; color: #64748b; font-weight: 500; letter-spacing: 0.05em; }
    .user-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-badge {
      display: flex; align-items: center; gap: 10px;
      background: rgba(51, 65, 85, 0.5);
      padding: 6px 16px 6px 6px;
      border-radius: 40px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }
    #userInitials {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-radius: 50%;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
    }
    #username { font-size: 0.85rem; font-weight: 600; color: #cbd5e1; }
    .btn-nav {
      padding: 8px 18px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(51, 65, 85, 0.4);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-nav:hover { background: rgba(99, 102, 241, 0.2); border-color: #6366f1; color: #a5b4fc; }
    .btn-danger { color: #fca5a5; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.15); border-color: #ef4444; }

    /* ── Control Panels ── */
    .control-bar {
      display: flex; flex-wrap: wrap; gap: 14px;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    .control-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 18px;
      padding: 14px 20px;
      flex: 1;
      min-width: 200px;
    }
    .control-card label {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 8px;
    }
    .control-card select,
    .control-card input {
      width: 100%;
      padding: 9px 14px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(15, 23, 42, 0.6);
      color: #e2e8f0;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }
    .control-card select:focus,
    .control-card input:focus { border-color: #6366f1; }
    .control-card select option { background: #1e293b; }
    .btn-primary {
      padding: 10px 28px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      display: flex; align-items: center; gap: 8px;
      white-space: nowrap;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4); }

    /* ── Period Header ── */
    .period-bar {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.1));
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 18px;
      padding: 14px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .period-chip {
      display: flex; align-items: center; gap: 8px;
      background: rgba(15, 23, 42, 0.5);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }
    .period-chip i { color: #818cf8; font-size: 0.75rem; }
    .period-chip .label { color: #64748b; font-weight: 600; }
    .period-chip .value { color: #f1f5f9; font-weight: 700; }

    /* ── KPI Cards ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 22px;
      padding: 22px 24px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: 22px 22px 0 0;
    }
    .kpi-card.income::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .kpi-card.expense::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .kpi-card.profit::before { background: linear-gradient(90deg, #6366f1, #a78bfa); }
    .kpi-card:hover { transform: translateY(-3px); border-color: rgba(99, 102, 241, 0.3); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    .kpi-icon {
      width: 44px; height: 44px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      margin-bottom: 14px;
    }
    .kpi-card.income .kpi-icon { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .kpi-card.expense .kpi-icon { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .kpi-card.profit .kpi-icon { background: rgba(99, 102, 241, 0.15); color: #a78bfa; }
    .kpi-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; margin-bottom: 6px; }
    .kpi-value { font-size: 1.9rem; font-weight: 800; color: #f8fafc; letter-spacing: -0.03em; }
    .kpi-trend { font-size: 0.72rem; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px; }
    .trend-up { color: #34d399; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .trend-down { color: #f87171; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .trend-neutral { color: #94a3b8; font-weight: 600; }

    /* ── Table ── */
    .card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 22px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .card-header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      display: flex; align-items: center; gap: 10px;
    }
    .card-header i { color: #818cf8; font-size: 1rem; }
    .card-header h3 { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; letter-spacing: -0.01em; }
    .table-wrap { overflow-x: auto; }
    .pl-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .pl-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      background: rgba(15, 23, 42, 0.5);
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      white-space: nowrap;
    }
    .pl-table thead th.right { text-align: right; }
    .pl-table tbody td {
      padding: 11px 16px;
      font-size: 0.82rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.05);
      color: #cbd5e1;
    }
    .pl-table tbody tr:hover { background: rgba(99, 102, 241, 0.06); }
    .pl-table .amount { font-weight: 600; font-family: 'SF Mono', 'Fira Code', monospace; text-align: right; font-size: 0.8rem; }
    .income-amount { color: #34d399; }
    .expense-amount { color: #f87171; }
    .total-row td { background: rgba(99, 102, 241, 0.1); font-weight: 800; color: #f1f5f9; border-top: 1px solid rgba(99, 102, 241, 0.3); padding: 14px 16px; }
    .variance-positive { color: #34d399; font-weight: 700; }
    .variance-negative { color: #f87171; font-weight: 700; }

    /* ── Chart & Lists ── */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 28px;
    }
    @media (max-width: 900px) { .split-grid { grid-template-columns: 1fr; } }
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.05);
      font-size: 0.82rem;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .name { color: #94a3b8; font-weight: 500; }
    .list-item .val { font-weight: 700; font-family: monospace; font-size: 0.8rem; }
    .chart-box {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 28px;
    }
    .chart-box canvas { max-height: 320px; }

    /* ── Insights ── */
    .insights-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 20px;
    }
    .insights-box h3 { font-size: 0.95rem; font-weight: 700; color: #a5b4fc; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .insight-item {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 8px;
      font-size: 0.82rem;
      color: #cbd5e1;
      border-left: 3px solid #6366f1;
    }

    /* ── Export Bar ── */
    .export-bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 24px; flex-wrap: wrap; }
    .btn-export {
      padding: 10px 22px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(30, 41, 59, 0.5);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-export:hover { background: rgba(99, 102, 241, 0.15); border-color: #6366f1; color: #a5b4fc; transform: translateY(-1px); }

    /* ── Loading ── */
    .loading-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(10, 15, 28, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      justify-content: center; align-items: center;
    }
    .loading-content { background: #1e293b; padding: 36px 44px; border-radius: 24px; text-align: center; border: 1px solid rgba(148, 163, 184, 0.1); }
    .loading-content p { color: #94a3b8; font-size: 0.85rem; margin-top: 16px; font-weight: 500; }
    .spinner { color: #6366f1; font-size: 2.5rem; }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .kpi-value { font-size: 1.5rem; }
      .control-card { min-width: 100%; }
      .period-chip { font-size: 0.7rem; padding: 4px 12px; }
      .pl-table thead th, .pl-table tbody td { padding: 8px 10px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
      <div>
        <span>FinLedger</span>
        <small>EXECUTIVE P&L</small>
      </div>
    </div>
    <div class="user-area">
      <div class="user-badge">
        <div id="userInitials">U</div>
        <span id="username">User</span>
      </div>
      <button id="homeBtn" class="btn-nav"><i class="fas fa-home"></i> Home</button>
      <button id="logoutBtn" class="btn-nav btn-danger"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
    </div>
  </header>

  <!-- Controls -->
  <div class="control-bar">
    <div class="control-card">
      <label><i class="fas fa-calendar-alt"></i> Reporting Period</label>
      <select id="reportPeriod">
        <option value="month" selected>This Month</option>
        <option value="lastMonth">Last Month</option>
        <option value="quarter">This Quarter</option>
        <option value="year">This Year</option>
        <option value="lastYear">Last Year</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    <div class="control-card" id="customDateRange" style="display: none;">
      <label>Custom Range</label>
      <div style="display: flex; gap: 8px;">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
      </div>
    </div>
    <div class="control-card">
      <label><i class="fas fa-chart-bar"></i> Chart Type</label>
      <select id="chartType">
        <option value="bar">Bar Chart</option>
        <option value="line">Line Chart</option>
        <option value="pie">Pie Chart</option>
        <option value="doughnut">Doughnut Chart</option>
        <option value="radar">Radar Chart</option>
      </select>
    </div>
    <div class="control-card">
      <label><i class="fas fa-balance-scale"></i> Compare With</label>
      <select id="comparisonType">
        <option value="none">No Comparison</option>
        <option value="previousPeriod" selected>Previous Period</option>
        <option value="previousMonth">Previous Month</option>
        <option value="previousQuarter">Previous Quarter</option>
        <option value="previousYear">Previous Year</option>
        <option value="samePeriodLastYear">Same Period Last Year</option>
        <option value="twoQuartersBack">Two Quarters Back</option>
        <option value="twoYearsBack">Two Years Back</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    <div class="control-card" id="customComparisonRange" style="display: none;">
      <label>Custom Compare</label>
      <div style="display: flex; gap: 8px;">
        <input type="date" id="compareStartDate">
        <input type="date" id="compareEndDate">
      </div>
    </div>
    <button id="generateReportBtn" class="btn-primary"><i class="fas fa-sync-alt"></i> Update Report</button>
  </div>

  <!-- Period Bar -->
  <div class="period-bar">
    <div class="period-chip"><i class="fas fa-calendar-check"></i><span class="label">Current:</span><span class="value" id="currentPeriodLabel">—</span></div>
    <div class="period-chip" id="prev1Wrapper" style="display:none;"><i class="fas fa-calendar-week"></i><span class="label">Previous:</span><span class="value" id="prev1PeriodLabel">—</span></div>
    <div class="period-chip" id="prev2Wrapper" style="display:none;"><i class="fas fa-calendar-minus"></i><span class="label">Prior‑Previous:</span><span class="value" id="prev2PeriodLabel">—</span></div>
  </div>

  <!-- Export Bar -->
  <div class="export-bar">
    <button id="exportExcel" class="btn-export"><i class="fas fa-file-excel"></i> Export Excel</button>
    <button id="exportPDF" class="btn-export"><i class="fas fa-file-pdf"></i> Export PDF</button>
  </div>

  <!-- KPI Grid -->
  <div class="kpi-grid">
    <div class="kpi-card income">
      <div class="kpi-icon"><i class="fas fa-arrow-trend-up"></i></div>
      <div class="kpi-label">Total Income</div>
      <div class="kpi-value" id="totalIncome">₹0</div>
      <div class="kpi-trend" id="incomeTrend"></div>
    </div>
    <div class="kpi-card expense">
      <div class="kpi-icon"><i class="fas fa-arrow-trend-down"></i></div>
      <div class="kpi-label">Total Expenses</div>
      <div class="kpi-value" id="totalExpenses">₹0</div>
      <div class="kpi-trend" id="expenseTrend"></div>
    </div>
    <div class="kpi-card profit">
      <div class="kpi-icon"><i class="fas fa-scale-balanced"></i></div>
      <div class="kpi-label">Net Profit / (Loss)</div>
      <div class="kpi-value" id="netProfit">₹0</div>
      <div class="kpi-trend" id="profitTrend"></div>
    </div>
  </div>

  <!-- P&L Table -->
  <div class="card">
    <div class="card-header"><i class="fas fa-file-invoice-dollar"></i><h3>Profit & Loss Statement</h3></div>
    <div class="table-wrap">
      <table class="pl-table" id="pnlTable">
        <thead id="pnlTableHead"></thead>
        <tbody id="pnlTableBody"><tr><td colspan="6" style="text-align:center;padding:30px;color:#64748b;">Loading data…</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- Top Lists -->
  <div class="split-grid">
    <div class="card">
      <div class="card-header"><i class="fas fa-arrow-up-right-dots"></i><h3>Top Income Sources</h3></div>
      <div id="topIncomeList"></div>
    </div>
    <div class="card">
      <div class="card-header"><i class="fas fa-arrow-down-right-dots"></i><h3>Top Expense Categories</h3></div>
      <div id="topExpenseList"></div>
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-box">
    <canvas id="pnlChart"></canvas>
  </div>

  <!-- Insights -->
  <div class="insights-box">
    <h3><i class="fas fa-lightbulb"></i> Financial Insights</h3>
    <div id="insightsContent"></div>
  </div>
</div>

<div id="loadingModal" class="loading-modal">
  <div class="loading-content">
    <i class="fas fa-spinner fa-spin spinner"></i>
    <p>Generating Report…</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app = initializeApp({ apiKey: "AIzaSyBhjgu6vpBRhMVjMs5RgSL4aViJq6GYy1A", authDomain: "budget-app-1365f.firebaseapp.com", projectId: "budget-app-1365f", storageBucket: "budget-app-1365f.appspot.com", messagingSenderId: "1036194450411", appId: "1:1036194450411:web:78ca39a5a82ab9db6c67ae" });
const db = getFirestore(app);
const auth = getAuth(app);
let currentUser = null, currentChart = null;
let currentPeriod = { summary: null, periodText: "", start: null, end: null };
let prev1Summary = null;
let prev2Summary = null;
let showThreePeriods = false;

/* ── Helpers ── */
function formatINR(amt) {
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatINRShort(amt) {
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatNumberForPDF(amt) {
  return amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatDateShort(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function formatPeriod(start, end) { return `${start.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} – ${end.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`; }
function formatPeriodShort(start, end) { return `${start.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})} – ${end.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})}`; }

/* ── Date Range Logic ── */
function getDateRange(periodType, customStart=null, customEnd=null) {
  const today = new Date();
  let start, end;
  if (periodType === 'month') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = new Date(today.getFullYear(), today.getMonth()+1, 0); }
  else if (periodType === 'lastMonth') { start = new Date(today.getFullYear(), today.getMonth()-1, 1); end = new Date(today.getFullYear(), today.getMonth(), 0); }
  else if (periodType === 'quarter') { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = new Date(today.getFullYear(), (q+1)*3, 0); }
  else if (periodType === 'year') { start = new Date(today.getFullYear(), 0, 1); end = new Date(today.getFullYear(), 11, 31); }
  else if (periodType === 'lastYear') { start = new Date(today.getFullYear()-1, 0, 1); end = new Date(today.getFullYear()-1, 11, 31); }
  else { start = new Date(customStart); end = new Date(customEnd); }
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return { start, end };
}

function getComparisonRange(mainStart, mainEnd, compType, customStart=null, customEnd=null) {
  if (compType === 'none') return null;
  if (compType === 'previousPeriod') {
    const duration = mainEnd - mainStart;
    const prevEnd = new Date(mainStart.getTime() - 1);
    const prevStart = new Date(prevEnd.getTime() - duration);
    return { start: prevStart, end: prevEnd };
  }
  if (compType === 'previousMonth') {
    let start = new Date(mainStart); start.setDate(1); start.setMonth(start.getMonth()-1);
    let end = new Date(start.getFullYear(), start.getMonth()+1, 0);
    return { start, end };
  }
  if (compType === 'previousQuarter') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-3, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'previousYear') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-1);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-1);
    return { start, end };
  }
  if (compType === 'samePeriodLastYear') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-1);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-1);
    return { start, end };
  }
  if (compType === 'twoQuartersBack') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-6, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'twoYearsBack') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-2);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-2);
    return { start, end };
  }
  if (compType === 'custom' && customStart && customEnd) {
    return { start: new Date(customStart), end: new Date(customEnd) };
  }
  return null;
}

function getSecondComparisonRange(mainStart, mainEnd, compType) {
  if (compType === 'twoQuartersBack') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-9, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'twoYearsBack') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-3);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-3);
    return { start, end };
  }
  return null;
}

async function fetchTransactions(start, end) {
  if (!currentUser) return [];
  try {
    const snap = await getDocs(collection(db, "users", currentUser.uid, "transactions"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(tx => {
      if (!tx.DATE) return false;
      let d = tx.DATE.toDate ? tx.DATE.toDate() : new Date(tx.DATE);
      return d >= start && d <= end;
    });
  } catch(e) { console.error(e); return []; }
}

function processTransactions(transactions) {
  const incMap = new Map(), expMap = new Map();
  let totalIncome = 0, totalExpense = 0;
  transactions.forEach(tx => {
    const inc = parseFloat(tx.INCOME) || 0;
    const exp = parseFloat(tx.EXPENSE) || 0;
    const cat = tx.ACCOUNT_HEADER || (inc > 0 ? "Other Income" : "Other Expenses");
    if (inc > 0) { totalIncome += inc; incMap.set(cat, (incMap.get(cat)||0)+inc); }
    if (exp > 0) { totalExpense += exp; expMap.set(cat, (expMap.get(cat)||0)+exp); }
  });
  return {
    totalIncome, totalExpense, netProfit: totalIncome - totalExpense,
    incomeCategories: Array.from(incMap.entries()).sort((a,b)=>b[1]-a[1]),
    expenseCategories: Array.from(expMap.entries()).sort((a,b)=>b[1]-a[1])
  };
}

/* ── Load Report ── */
async function loadReport() {
  const loading = document.getElementById("loadingModal");
  loading.style.display = "flex";
  try {
    const period = document.getElementById("reportPeriod").value;
    const customStart = document.getElementById("startDate").value, customEnd = document.getElementById("endDate").value;
    const { start, end } = getDateRange(period, customStart, customEnd);
    currentPeriod.start = start; currentPeriod.end = end;
    currentPeriod.periodText = formatPeriod(start, end);
    const currTransactions = await fetchTransactions(start, end);
    currentPeriod.summary = processTransactions(currTransactions);

    const compType = document.getElementById("comparisonType").value;
    const compStart = document.getElementById("compareStartDate").value, compEnd = document.getElementById("compareEndDate").value;
    const compRange = getComparisonRange(start, end, compType, compStart, compEnd);

    showThreePeriods = (compType === 'twoQuartersBack' || compType === 'twoYearsBack');

    if (compRange) {
      const trans1 = await fetchTransactions(compRange.start, compRange.end);
      prev1Summary = processTransactions(trans1);
      const prevPeriodText = formatPeriod(compRange.start, compRange.end);

      if (showThreePeriods) {
        const compRange2 = getSecondComparisonRange(start, end, compType);
        if (compRange2) {
          const trans2 = await fetchTransactions(compRange2.start, compRange2.end);
          prev2Summary = processTransactions(trans2);
          document.getElementById("prev2PeriodLabel").innerHTML = formatPeriod(compRange2.start, compRange2.end);
          document.getElementById("prev2Wrapper").style.display = "flex";
        } else {
          prev2Summary = null;
          document.getElementById("prev2Wrapper").style.display = "none";
        }
        document.getElementById("prev1PeriodLabel").innerHTML = prevPeriodText;
        document.getElementById("prev1Wrapper").style.display = "flex";
      } else {
        prev2Summary = null;
        document.getElementById("prev1PeriodLabel").innerHTML = prevPeriodText;
        document.getElementById("prev1Wrapper").style.display = "flex";
        document.getElementById("prev2Wrapper").style.display = "none";
      }
    } else {
      prev1Summary = null;
      prev2Summary = null;
      document.getElementById("prev1Wrapper").style.display = "none";
      document.getElementById("prev2Wrapper").style.display = "none";
    }

    document.getElementById("currentPeriodLabel").innerHTML = currentPeriod.periodText;
    renderDashboard();
  } finally { loading.style.display = "none"; }
}

/* ── Render Dashboard ── */
function renderDashboard() {
  const curr = currentPeriod.summary;
  const p1 = prev1Summary;
  const p2 = showThreePeriods ? prev2Summary : null;

  document.getElementById("totalIncome").innerHTML = formatINR(curr.totalIncome);
  document.getElementById("totalExpenses").innerHTML = formatINR(curr.totalExpense);
  const netElem = document.getElementById("netProfit");
  netElem.innerHTML = curr.netProfit >= 0 ? formatINR(curr.netProfit) : `-${formatINR(Math.abs(curr.netProfit))}`;
  netElem.style.color = curr.netProfit >= 0 ? "#34d399" : "#f87171";

  const incomeTrendDiv = document.getElementById("incomeTrend");
  const expenseTrendDiv = document.getElementById("expenseTrend");
  const profitTrendDiv = document.getElementById("profitTrend");
  incomeTrendDiv.innerHTML = ""; expenseTrendDiv.innerHTML = ""; profitTrendDiv.innerHTML = "";

  if (p1) {
    const incChange = ((curr.totalIncome - p1.totalIncome)/Math.abs(p1.totalIncome||1)*100).toFixed(1);
    const expChange = ((curr.totalExpense - p1.totalExpense)/Math.abs(p1.totalExpense||1)*100).toFixed(1);
    const netChange = ((curr.netProfit - p1.netProfit)/Math.abs(p1.netProfit||1)*100).toFixed(1);
    incomeTrendDiv.innerHTML += `<span class="${incChange>=0?'trend-up':'trend-down'}"><i class="fas ${incChange>=0?'fa-arrow-up':'fa-arrow-down'}"></i> ${Math.abs(incChange)}% vs prev</span>`;
    expenseTrendDiv.innerHTML += `<span class="${expChange<=0?'trend-up':'trend-down'}"><i class="fas ${expChange<=0?'fa-arrow-down':'fa-arrow-up'}"></i> ${Math.abs(expChange)}% vs prev</span>`;
    profitTrendDiv.innerHTML += `<span class="${netChange>=0?'trend-up':'trend-down'}"><i class="fas ${netChange>=0?'fa-arrow-up':'fa-arrow-down'}"></i> ${Math.abs(netChange)}% vs prev</span>`;
  }
  if (p2) {
    const incChange2 = ((curr.totalIncome - p2.totalIncome)/Math.abs(p2.totalIncome||1)*100).toFixed(1);
    const expChange2 = ((curr.totalExpense - p2.totalExpense)/Math.abs(p2.totalExpense||1)*100).toFixed(1);
    const netChange2 = ((curr.netProfit - p2.netProfit)/Math.abs(p2.netProfit||1)*100).toFixed(1);
    incomeTrendDiv.innerHTML += `<span class="${incChange2>=0?'trend-up':'trend-down'}"><i class="fas ${incChange2>=0?'fa-arrow-up':'fa-arrow-down'}"></i> ${Math.abs(incChange2)}% vs prior-prev</span>`;
    expenseTrendDiv.innerHTML += `<span class="${expChange2<=0?'trend-up':'trend-down'}"><i class="fas ${expChange2<=0?'fa-arrow-down':'fa-arrow-up'}"></i> ${Math.abs(expChange2)}% vs prior-prev</span>`;
    profitTrendDiv.innerHTML += `<span class="${netChange2>=0?'trend-up':'trend-down'}"><i class="fas ${netChange2>=0?'fa-arrow-up':'fa-arrow-down'}"></i> ${Math.abs(netChange2)}% vs prior-prev</span>`;
  }

  renderPNLTable(curr, p1, p2);
  renderTopLists(curr);
  renderInsights(curr, p1, p2);
  updateChart(curr);
}

function renderPNLTable(curr, p1, p2) {
  const thead = document.getElementById("pnlTableHead");
  let headerHtml = `<tr><th>Account</th><th class="right">Net (₹)</th>`;
  if (p1) headerHtml += `<th class="right">Previous (₹)</th>`;
  if (p2) headerHtml += `<th class="right">Prior‑Prev (₹)</th>`;
  if (p1) headerHtml += `<th class="right">Δ vs Prev</th>`;
  if (p2) headerHtml += `<th class="right">Δ vs Prior‑Prev</th>`;
  headerHtml += `</tr>`;
  thead.innerHTML = headerHtml;

  const allCats = [...new Set([...curr.incomeCategories.map(i=>i[0]), ...curr.expenseCategories.map(e=>e[0])])];
  const currIncMap = new Map(curr.incomeCategories), currExpMap = new Map(curr.expenseCategories);
  let p1IncMap = new Map(), p1ExpMap = new Map(), p2IncMap = new Map(), p2ExpMap = new Map();
  if (p1) { p1IncMap = new Map(p1.incomeCategories); p1ExpMap = new Map(p1.expenseCategories); }
  if (p2) { p2IncMap = new Map(p2.incomeCategories); p2ExpMap = new Map(p2.expenseCategories); }
  let tbody = '';
  for (let cat of allCats.slice(0, 35)) {
    const incCurr = currIncMap.get(cat)||0, expCurr = currExpMap.get(cat)||0, netCurr = incCurr - expCurr;
    tbody += `<tr><td>${cat}</td><td class="amount ${netCurr>=0?'income-amount':'expense-amount'}">${formatINR(netCurr)}</td>`;
    if (p1) {
      const incP1 = p1IncMap.get(cat)||0, expP1 = p1ExpMap.get(cat)||0, netP1 = incP1 - expP1;
      tbody += `<td class="amount ${netP1>=0?'income-amount':'expense-amount'}">${formatINR(netP1)}</td>`;
    }
    if (p2) {
      const incP2 = p2IncMap.get(cat)||0, expP2 = p2ExpMap.get(cat)||0, netP2 = incP2 - expP2;
      tbody += `<td class="amount ${netP2>=0?'income-amount':'expense-amount'}">${formatINR(netP2)}</td>`;
    }
    if (p1) {
      const netP1 = (p1IncMap.get(cat)||0) - (p1ExpMap.get(cat)||0);
      const change1 = netP1 === 0 ? (netCurr===0?0:100) : ((netCurr - netP1)/Math.abs(netP1)*100);
      tbody += `<td class="amount ${change1>=0?'variance-positive':'variance-negative'}">${change1.toFixed(1)}%</td>`;
    }
    if (p2) {
      const netP2 = (p2IncMap.get(cat)||0) - (p2ExpMap.get(cat)||0);
      const change2 = netP2 === 0 ? (netCurr===0?0:100) : ((netCurr - netP2)/Math.abs(netP2)*100);
      tbody += `<td class="amount ${change2>=0?'variance-positive':'variance-negative'}">${change2.toFixed(1)}%</td>`;
    }
    tbody += `</tr>`;
  }
  tbody += `<tr class="total-row"><td><strong>TOTAL NET</strong></td><td class="amount"><strong>${formatINR(curr.netProfit)}</strong></td>`;
  if (p1) tbody += `<td class="amount"><strong>${formatINR(p1.netProfit)}</strong></td>`;
  if (p2) tbody += `<td class="amount"><strong>${formatINR(p2.netProfit)}</strong></td>`;
  if (p1) { const change = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); tbody += `<td class="amount">${change.toFixed(1)}%</td>`; }
  if (p2) { const change = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); tbody += `<td class="amount">${change.toFixed(1)}%</td>`; }
  tbody += `</tr>`;
  document.getElementById("pnlTableBody").innerHTML = tbody;
}

function renderTopLists(curr) {
  document.getElementById("topIncomeList").innerHTML = curr.incomeCategories.slice(0,5).map(([c,a])=>`<div class="list-item"><span class="name">${c}</span><span class="val income-amount">${formatINR(a)}</span></div>`).join('') || '<div class="list-item"><span class="name">No income data</span></div>';
  document.getElementById("topExpenseList").innerHTML = curr.expenseCategories.slice(0,5).map(([c,a])=>`<div class="list-item"><span class="name">${c}</span><span class="val expense-amount">${formatINR(a)}</span></div>`).join('') || '<div class="list-item"><span class="name">No expense data</span></div>';
}

function renderInsights(curr, p1, p2) {
  let html = '';
  if (curr.netProfit > 0) html += `<div class="insight-item">✅ <strong>Profit Margin:</strong> ${((curr.netProfit/curr.totalIncome)*100).toFixed(1)}% — Net profit of ${formatINR(curr.netProfit)}</div>`;
  else if (curr.netProfit < 0) html += `<div class="insight-item">⚠️ <strong>Loss Alert:</strong> Expenses exceed income by ${formatINR(Math.abs(curr.netProfit))}</div>`;
  if (p1) { const growth = ((curr.totalIncome-p1.totalIncome)/Math.abs(p1.totalIncome||1)*100).toFixed(1); html += `<div class="insight-item">📈 <strong>Revenue vs Previous:</strong> ${growth>=0?'+':''}${growth}%</div>`; }
  if (p2) { const growth2 = ((curr.totalIncome-p2.totalIncome)/Math.abs(p2.totalIncome||1)*100).toFixed(1); html += `<div class="insight-item">📊 <strong>Revenue vs Prior‑Previous:</strong> ${growth2>=0?'+':''}${growth2}%</div>`; }
  if (curr.incomeCategories.length > 0) html += `<div class="insight-item">🏆 <strong>Top Income:</strong> ${curr.incomeCategories[0][0]} (${formatINR(curr.incomeCategories[0][1])})</div>`;
  if (curr.expenseCategories.length > 0) html += `<div class="insight-item">🔻 <strong>Top Expense:</strong> ${curr.expenseCategories[0][0]} (${formatINR(curr.expenseCategories[0][1])})</div>`;
  document.getElementById("insightsContent").innerHTML = html || '<div class="insight-item">No insights available</div>';
}

function updateChart(curr) {
  const ctx = document.getElementById("pnlChart").getContext("2d");
  if (currentChart) currentChart.destroy();
  const labels = curr.incomeCategories.slice(0,6).map(i=>i[0]);
  const incomeData = curr.incomeCategories.slice(0,6).map(i=>i[1]);
  const expenseData = curr.expenseCategories.slice(0,6).map(e=>e[1]);
  const chartType = document.getElementById("chartType").value;

  const colors = ['#6366f1','#8b5cf6','#a78bfa','#c4b5fd','#818cf8','#4f46e5'];
  const expColors = ['#ef4444','#f87171','#fca5a5','#fecaca','#dc2626','#b91c1c'];

  let datasets = [];
  if (chartType === 'pie' || chartType === 'doughnut') {
    datasets = [{ label: "Income", data: incomeData, backgroundColor: colors, borderColor: 'rgba(15,23,42,0.8)', borderWidth: 2 }];
  } else {
    datasets = [
      { label: "Income", data: incomeData, backgroundColor: chartType==='line'?'rgba(99,102,241,0.2)':'#6366f1', borderColor: '#818cf8', borderWidth: 2, tension: 0.4, fill: chartType==='line' },
      { label: "Expenses", data: expenseData, backgroundColor: chartType==='line'?'rgba(239,68,68,0.2)':'#ef4444', borderColor: '#f87171', borderWidth: 2, tension: 0.4, fill: chartType==='line' }
    ];
  }

  currentChart = new Chart(ctx, {
    type: chartType,
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { labels: { color: '#94a3b8', font: { family: 'Inter', size: 11, weight: '600' }, padding: 16 } },
        tooltip: {
          backgroundColor: '#1e293b',
          titleColor: '#f1f5f9',
          bodyColor: '#cbd5e1',
          borderColor: 'rgba(148,163,184,0.2)',
          borderWidth: 1,
          callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${formatINR(ctx.raw)}` }
        }
      },
      scales: (chartType === 'pie' || chartType === 'doughnut') ? {} : {
        x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: 'rgba(148,163,184,0.05)' } },
        y: { ticks: { color: '#64748b', font: { size: 10 }, callback: v => '₹'+v.toLocaleString('en-IN') }, grid: { color: 'rgba(148,163,184,0.05)' } }
      }
    }
  });
}

    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontSize: 10, halign: 'center', fontStyle: 'bold' },
    bodyStyles: { fontSize: 9, halign: 'center', textColor: [51, 65, 85] },
    alternateRowStyles: { fillColor: [248, 250, 252] }
  });

  // Footer
  doc.setFontSize(8); doc.setTextColor(148, 163, 184);
  doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 1 of 3 — Summary", pageW - 20, pageH - 10, { align: 'right' });

  /* ============================================================
     PAGE 2 — Charts & Visual Analysis
     ============================================================ */
  doc.addPage('a4', 'landscape');

  // Header
  doc.setFillColor(15, 23, 42); doc.rect(0, 0, pageW, 30, 'F');
  doc.setFillColor(99, 102, 241); doc.rect(0, 28, pageW, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text("CHARTS & VISUAL ANALYSIS", pageW/2, 18, { align: 'center' });
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.setTextColor(148,163,184);
  doc.text(currentPeriod.periodText, pageW/2, 25, { align: 'center' });

  // Chart 1: Income vs Expenses comparison (current period)
  const chart1Y = 40;
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
  doc.text("Top Income vs Top Expenses", 20, chart1Y);

  // Draw a simple bar chart manually
  const barChartX = 20, barChartY = chart1Y + 8, barChartW = 120, barChartH = 60;
  const maxVal = Math.max(...curr.incomeCategories.slice(0,5).map(i=>i[1]), ...curr.expenseCategories.slice(0,5).map(e=>e[1]), 1);

  // Draw bars for income
  const incBars = curr.incomeCategories.slice(0,5);
  const expBars = curr.expenseCategories.slice(0,5);
  const barW = 10, barGap = 4;
  const totalBars = incBars.length + expBars.length;
  const startX = barChartX + (barChartW - totalBars * (barW + barGap)) / 2;

  doc.setFillColor(99,102,241);
  incBars.forEach((item, i) => {
    const h = (item[1] / maxVal) * barChartH;
    doc.rect(startX + i * (barW + barGap), barChartY + barChartH - h, barW, h, 'F');
    doc.setFontSize(6); doc.setTextColor(100,116,139);
    doc.text(item[0].substring(0,8), startX + i * (barW + barGap) + barW/2, barChartY + barChartH + 4, { align: 'center' });
  });

  const expStartX = startX + incBars.length * (barW + barGap) + 10;
  doc.setFillColor(239,68,68);
  expBars.forEach((item, i) => {
    const h = (item[1] / maxVal) * barChartH;
    doc.rect(expStartX + i * (barW + barGap), barChartY + barChartH - h, barW, h, 'F');
    doc.setFontSize(6); doc.setTextColor(100,116,139);
    doc.text(item[0].substring(0,8), expStartX + i * (barW + barGap) + barW/2, barChartY + barChartH + 4, { align: 'center' });
  });

  // Legend
  doc.setFillColor(99,102,241); doc.rect(20, barChartY + barChartH + 10, 6, 6, 'F');
  doc.setFontSize(8); doc.setTextColor(30,41,59); doc.text("Income", 30, barChartY + barChartH + 15);
  doc.setFillColor(239,68,68); doc.rect(70, barChartY + barChartH + 10, 6, 6, 'F');
  doc.text("Expenses", 80, barChartY + barChartH + 15);

  // Chart 2: Profit trend (if comparison available)
  if (p1) {
    const chart2Y = chart1Y;
    doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
    doc.text("Net Profit Trend", 170, chart2Y);

    const trendY = chart2Y + 8, trendH = 60, trendW = 100;
    const periods = p2 ? ['Prior‑Prev', 'Previous', 'Current'] : ['Previous', 'Current'];
    const values = p2 ? [p2.netProfit, p1.netProfit, curr.netProfit] : [p1.netProfit, curr.netProfit];
    const maxNet = Math.max(...values.map(Math.abs), 1);

    // Draw line chart
    doc.setDrawColor(99,102,241); doc.setLineWidth(1.5);
    const points = values.map((v, i) => ({
      x: 170 + (i / (values.length - 1 || 1)) * trendW,
      y: trendY + trendH - ((v + maxNet) / (2 * maxNet)) * trendH
    }));

    // Draw axes
    doc.setDrawColor(200,200,200); doc.setLineWidth(0.3);
    doc.line(170, trendY + trendH, 170 + trendW, trendY + trendH);

    // Draw line
    doc.setDrawColor(99,102,241); doc.setLineWidth(1.5);
    for (let i = 0; i < points.length - 1; i++) {
      doc.line(points[i].x, points[i].y, points[i+1].x, points[i+1].y);
    }

    // Draw dots
    doc.setFillColor(99,102,241);
    points.forEach((p, i) => {
      doc.circle(p.x, p.y, 1.5, 'F');
      doc.setFontSize(7); doc.setTextColor(100,116,139);
      doc.text(periods[i], p.x, trendY + trendH + 5, { align: 'center' });
      doc.setFontSize(7); doc.setTextColor(30,41,59);
      doc.text(formatINRShort(values[i]), p.x, p.y - 4, { align: 'center' });
    });
  }

  // Bottom summary cards
  const bottomY = 130;
  doc.setFontSize(11); doc.setFont('helvetica','bold'); doc.setTextColor(30,41,59);
  doc.text("Quick Insights", 20, bottomY);

  const insightsY = bottomY + 8;
  const insights = [];
  if (curr.netProfit > 0) insights.push(`Profit margin: ${((curr.netProfit/curr.totalIncome)*100).toFixed(1)}%`);
  else insights.push(`Loss: ${formatINRShort(Math.abs(curr.netProfit))}`);
  if (p1) insights.push(`Revenue vs prev: ${((curr.totalIncome-p1.totalIncome)/Math.abs(p1.totalIncome||1)*100).toFixed(1)}%`);
  if (curr.incomeCategories.length > 0) insights.push(`Top income: ${curr.incomeCategories[0][0]} (${formatINRShort(curr.incomeCategories[0][1])})`);
  if (curr.expenseCategories.length > 0) insights.push(`Top expense: ${curr.expenseCategories[0][0]} (${formatINRShort(curr.expenseCategories[0][1])})`);

  insights.forEach((text, i) => {
    doc.setFillColor(248,250,252); doc.roundedRect(20, insightsY + i * 10, 260, 8, 2, 2, 'F');
    doc.setFontSize(8); doc.setTextColor(51,65,85);
    doc.text(`• ${text}`, 24, insightsY + i * 10 + 6);
  });

  // Footer
  doc.setFontSize(8); doc.setTextColor(148, 163, 184);
  doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 2 of 3 — Charts", pageW - 20, pageH - 10, { align: 'right' });

  /* ============================================================
     PAGE 3+ — Detailed P&L Data Table
     ============================================================ */
  doc.addPage('a4', 'landscape');

  // Header
  doc.setFillColor(15, 23, 42); doc.rect(0, 0, pageW, 30, 'F');
  doc.setFillColor(99, 102, 241); doc.rect(0, 28, pageW, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text("DETAILED PROFIT & LOSS STATEMENT", pageW/2, 18, { align: 'center' });
  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.setTextColor(148,163,184);
  doc.text(currentPeriod.periodText + (p1 ? `  |  Compared to: ${document.getElementById("prev1PeriodLabel").innerText}` : ''), pageW/2, 25, { align: 'center' });

  const allCats = [...new Set([...curr.incomeCategories.map(i=>i[0]), ...curr.expenseCategories.map(e=>e[0])])];
  const tableData = [];

  for (let cat of allCats.slice(0, 50)) {
    const currNet = (curr.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (curr.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
    let row = [cat, formatNumberForPDF(currNet)];

    if (p1) {
      const p1Net = (p1.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p1.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      row.push(formatNumberForPDF(p1Net));
    }
    if (p2) {
      const p2Net = (p2.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p2.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      row.push(formatNumberForPDF(p2Net));
    }
    if (p1) {
      const p1Net = (p1.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p1.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      const change1 = p1Net === 0 ? (currNet===0?0:100) : ((currNet - p1Net)/Math.abs(p1Net)*100);
      row.push(change1.toFixed(1) + '%');
    }
    if (p2) {
      const p2Net = (p2.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p2.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      const change2 = p2Net === 0 ? (currNet===0?0:100) : ((currNet - p2Net)/Math.abs(p2Net)*100);
      row.push(change2.toFixed(1) + '%');
    }
    tableData.push(row);
  }

  // Total row
  let totalRow = ["TOTAL NET", formatNumberForPDF(curr.netProfit)];
  if (p1) totalRow.push(formatNumberForPDF(p1.netProfit));
  if (p2) totalRow.push(formatNumberForPDF(p2.netProfit));
  if (p1) { const change = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); totalRow.push(change.toFixed(1)+'%'); }
  if (p2) { const change = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); totalRow.push(change.toFixed(1)+'%'); }
  tableData.push(totalRow);

  // Headers
  let headers = ["Account", "Current Net (₹)"];
  if (p1) headers.push("Previous Net (₹)");
  if (p2) headers.push("Prior‑Prev Net (₹)");
  if (p1) headers.push("Δ vs Prev");
  if (p2) headers.push("Δ vs Prior‑Prev");

  const colWidths = [80, 45, 45, 45, 35, 35];
  const columnStyles = {};
  headers.forEach((_, i) => {
    columnStyles[i] = { cellWidth: colWidths[i] || 40, halign: i === 0 ? 'left' : 'right' };
  });

  doc.autoTable({
    startY: 38,
    head: [headers],
    body: tableData,
    theme: 'grid',
    headStyles: { fillColor: [30, 41, 59], textColor: [255, 255, 255], fontSize: 8, halign: 'center', fontStyle: 'bold' },
    bodyStyles: { fontSize: 7.5, textColor: [51, 65, 85] },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    columnStyles,
    didParseCell: function(data) {
      if (data.section === 'body' && data.column.index > 0) {
        const val = data.cell.raw.toString();
        if (val.includes('%')) {
          const num = parseFloat(val);
          if (num >= 0) data.cell.styles.textColor = [16, 185, 129];
          else data.cell.styles.textColor = [239, 68, 68];
          data.cell.styles.fontStyle = 'bold';
        }
        if (data.row.index === tableData.length - 1) {
          data.cell.styles.fontStyle = 'bold';
          data.cell.styles.fillColor = [238, 242, 255];
        }
      }
    },
    didDrawPage: function(data) {
      // Footer on each page
      doc.setFontSize(8); doc.setTextColor(148, 163, 184);
      doc.text("FinLedger Pro — Executive P&L Report", pageW/2, pageH - 10, { align: 'center' });
      doc.text(`Page ${doc.internal.getNumberOfPages()}`, pageW - 20, pageH - 10, { align: 'right' });
    }
  });

  // Save
  const fileName = `PnL_Report_${new Date().toISOString().slice(0, 10)}.pdf`;
  doc.save(fileName);
  Swal.fire({ icon: 'success', title: 'PDF Exported', text: '3-page report generated successfully', timer: 2000, showConfirmButton: false });
}

/* ── Export Excel ── */
function exportToExcel() {
  if (!currentPeriod.summary) { Swal.fire("No Data", "Generate report first", "warning"); return; }
  const curr = currentPeriod.summary, p1 = prev1Summary, p2 = showThreePeriods ? prev2Summary : null;
  let data = [["Account", "Current Net (₹)"]];
  if (p1) data[0].push("Previous Net (₹)");
  if (p2) data[0].push("Prior-Previous Net (₹)");
  if (p1) data[0].push("Δ vs Prev");
  if (p2) data[0].push("Δ vs Prior-Prev");

  const allCats = [...new Set([...curr.incomeCategories.map(i=>i[0]), ...curr.expenseCategories.map(e=>e[0])])];
  for (let cat of allCats) {
    const currNet = (curr.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (curr.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
    let row = [cat, currNet];
    if (p1) {
      const p1Net = (p1.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p1.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      row.push(p1Net);
    }
    if (p2) {
      const p2Net = (p2.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p2.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      row.push(p2Net);
    }
    if (p1) {
      const p1Net = (p1.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p1.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      const change1 = p1Net === 0 ? (currNet===0?0:100) : ((currNet - p1Net)/Math.abs(p1Net)*100);
      row.push(change1.toFixed(1) + '%');
    }
    if (p2) {
      const p2Net = (p2.incomeCategories.find(i=>i[0]===cat)?.[1]||0) - (p2.expenseCategories.find(e=>e[0]===cat)?.[1]||0);
      const change2 = p2Net === 0 ? (currNet===0?0:100) : ((currNet - p2Net)/Math.abs(p2Net)*100);
      row.push(change2.toFixed(1) + '%');
    }
    data.push(row);
  }

  data.push(["TOTAL NET", curr.netProfit]);
  if (p1) data[data.length-1].push(p1.netProfit);
  if (p2) data[data.length-1].push(p2.netProfit);
  if (p1) { const change = p1.netProfit===0?0:((curr.netProfit-p1.netProfit)/Math.abs(p1.netProfit)*100); data[data.length-1].push(change.toFixed(1)+'%'); }
  if (p2) { const change = p2.netProfit===0?0:((curr.netProfit-p2.netProfit)/Math.abs(p2.netProfit)*100); data[data.length-1].push(change.toFixed(1)+'%'); }

  const ws = XLSX.utils.aoa_to_sheet(data);
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
  for (let row = range.s.r + 1; row <= range.e.r; row++) {
    for (let col = 1; col <= (p1 ? (p2 ? 4 : 2) : 1); col++) {
      const cellAddress = XLSX.utils.encode_cell({ r: row, c: col });
      if (ws[cellAddress] && typeof ws[cellAddress].v === 'number') {
        ws[cellAddress].z = '#,##0.00';
      }
    }
  }

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "P&L Statement");
  XLSX.writeFile(wb, `PnL_Report_${new Date().toISOString().slice(0, 10)}.xlsx`);
  Swal.fire({ icon: 'success', title: 'Excel Exported', timer: 1500, showConfirmButton: false });
}

/* ── Defaults & Events ── */
function setDefaultDates() {
  const today = new Date();
  document.getElementById("startDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 1));
  document.getElementById("endDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()+1, 0));
  document.getElementById("compareStartDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()-1, 1));
  document.getElementById("compareEndDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 0));
}

document.getElementById("reportPeriod").addEventListener("change", () => {
  document.getElementById("customDateRange").style.display = document.getElementById("reportPeriod").value === "custom" ? "block" : "none";
});
document.getElementById("comparisonType").addEventListener("change", () => {
  document.getElementById("customComparisonRange").style.display = document.getElementById("comparisonType").value === "custom" ? "block" : "none";
});
document.getElementById("generateReportBtn").addEventListener("click", loadReport);
document.getElementById("exportExcel").addEventListener("click", exportToExcel);
document.getElementById("exportPDF").addEventListener("click", exportToPDF);
document.getElementById("chartType").addEventListener("change", () => { if (currentPeriod.summary) updateChart(currentPeriod.summary); });
document.getElementById("homeBtn").addEventListener("click", () => { window.location.href = "home.html"; });

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const name = user.displayName || user.email?.split('@')[0] || "User";
    document.getElementById("username").innerHTML = name;
    document.getElementById("userInitials").innerHTML = name.charAt(0).toUpperCase();
    setDefaultDates();
    await loadReport();
  } else {
    window.location.href = "index.html";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
</script>
