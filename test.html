<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FinLedger Pro | Balance Sheet & Cash Flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --brand: #4f46e5;
      --brand-light: #eef2ff;
      --brand-dark: #3730a3;
      --success: #059669;
      --success-light: #ecfdf5;
      --danger: #dc2626;
      --danger-light: #fef2f2;
      --warning: #d97706;
      --warning-light: #fffbeb;
      --info: #0891b2;
      --info-light: #ecfeff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 1500px; margin: 0 auto; }

    /* ── Header ── */
    header {
      background: var(--card);
      border-radius: 20px;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 20px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }
    .logo-text h1 { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
    .logo-text p { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.08em; }
    .user-area { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .user-badge {
      display: flex; align-items: center; gap: 10px;
      background: var(--bg);
      padding: 5px 14px 5px 5px;
      border-radius: 40px;
      border: 1px solid var(--border);
    }
    #userInitials {
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: white; border-radius: 50%;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem;
    }
    #username { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .btn-nav {
      padding: 8px 18px; border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text); font-weight: 600; font-size: 0.8rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-nav:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); }
    .btn-nav.danger:hover { background: var(--danger-light); border-color: var(--danger); color: var(--danger); }

    /* ── Bank Balance Card ── */
    .bank-balance-card {
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      border-radius: 20px;
      padding: 24px 28px;
      margin-bottom: 20px;
      color: white;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px -8px rgba(79, 70, 229, 0.4);
    }
    .bank-balance-card::before {
      content: ''; position: absolute; top: -50%; right: -10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 70%);
      border-radius: 50%;
    }
    .bank-balance-header {
      display: flex; align-items: center; gap: 12px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; opacity: 0.9; margin-bottom: 8px;
    }
    .bank-balance-value {
      font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1;
    }
    .bank-detail-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px; margin-top: 20px;
    }
    .bank-account-item {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .bank-account-name {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;
      opacity: 0.85; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .bank-account-balance { font-size: 1.3rem; font-weight: 700; }
    .update-section { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .update-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 8px 18px; border-radius: 10px;
      font-weight: 600; font-size: 0.8rem; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 6px;
    }
    .update-btn:hover { background: rgba(255,255,255,0.3); }

    /* ── Filter Panel ── */
    .filter-panel {
      background: var(--card); border-radius: 20px;
      padding: 20px 24px; margin-bottom: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .filter-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; align-items: end;
    }
    .filter-item label {
      display: block; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .filter-item select,
    .filter-item input {
      width: 100%; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 0.85rem; font-weight: 500;
      font-family: inherit; outline: none; transition: all 0.2s;
    }
    .filter-item select:focus,
    .filter-item input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-light); }
    .date-pair { display: flex; gap: 6px; }
    .btn-generate {
      padding: 11px 24px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      color: white; font-weight: 700; font-size: 0.85rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
      white-space: nowrap;
    }
    .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35); }

    /* ── Period Display ── */
    .period-display {
      background: linear-gradient(135deg, var(--brand-light), #f5f3ff);
      border: 1px solid #c7d2fe;
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    }
    .period-tag {
      display: flex; align-items: center; gap: 8px;
      background: white; padding: 6px 16px;
      border-radius: 40px; font-size: 0.78rem;
      border: 1px solid #c7d2fe;
    }
    .period-tag i { color: var(--brand); font-size: 0.75rem; }
    .period-tag .tag-label { color: var(--text-muted); font-weight: 600; }
    .period-tag .tag-value { color: var(--text); font-weight: 700; }

    /* ── Tabs ── */
    .tabs {
      display: flex; gap: 4px; margin-bottom: 24px;
      background: var(--card); padding: 6px;
      border-radius: 14px; border: 1px solid var(--border);
      width: fit-content;
    }
    .tab-btn {
      background: none; border: none; padding: 10px 22px;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      color: var(--text-muted); transition: all 0.2s;
      border-radius: 10px; font-family: inherit;
      display: flex; align-items: center; gap: 8px;
    }
    .tab-btn i { font-size: 0.9rem; }
    .tab-btn:hover { color: var(--text); background: var(--bg); }
    .tab-btn.active {
      color: white;
      background: linear-gradient(135deg, var(--brand), #7c3aed);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── KPI Cards ── */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px; margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--card); border-radius: 18px;
      padding: 22px 24px; border: 1px solid var(--border);
      position: relative; overflow: hidden; transition: all 0.25s;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(79, 70, 229, 0.2); border-color: #c7d2fe; }
    .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
    .kpi-card.assets::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    .kpi-card.liabilities::before { background: linear-gradient(90deg, #ef4444, #f87171); }
    .kpi-card.equity::before { background: linear-gradient(90deg, #10b981, #34d399); }
    .kpi-card.opening::before { background: linear-gradient(90deg, var(--info), #22d3ee); }
    .kpi-card.cash::before { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
    .kpi-card.operating::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .kpi-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .kpi-icon {
      width: 42px; height: 42px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1rem;
    }
    .kpi-card.assets .kpi-icon { background: #dbeafe; color: #2563eb; }
    .kpi-card.liabilities .kpi-icon { background: var(--danger-light); color: var(--danger); }
    .kpi-card.equity .kpi-icon { background: var(--success-light); color: var(--success); }
    .kpi-card.opening .kpi-icon { background: var(--info-light); color: var(--info); }
    .kpi-card.cash .kpi-icon { background: #f3e8ff; color: #9333ea; }
    .kpi-card.operating .kpi-icon { background: var(--warning-light); color: var(--warning); }
    .kpi-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 4px; }
    .kpi-value { font-size: 1.7rem; font-weight: 800; color: var(--text); letter-spacing: -0.03em; line-height: 1.2; }
    .kpi-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; font-weight: 500; }

    /* ── Balance Validation ── */
    .balance-validation {
      padding: 16px 20px; border-radius: 16px; text-align: center;
      font-weight: 700; margin-bottom: 24px; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .balance-valid { background: var(--success-light); color: #065f46; border: 1px solid #a7f3d0; }
    .balance-invalid { background: var(--danger-light); color: #991b1b; border: 1px solid #fecaca; }

    /* ── Section Cards ── */
    .section-card {
      background: var(--card); border-radius: 18px;
      margin-bottom: 24px; border: 1px solid var(--border);
      overflow: hidden; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .section-header {
      padding: 16px 24px; font-weight: 700; font-size: 0.95rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: #f8fafc;
    }
    .section-header i { color: var(--brand); margin-right: 10px; }
    .section-body { padding: 0; overflow-x: auto; }

    .statement-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .statement-table th {
      text-align: right; padding: 12px 20px; font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
      background: #f8fafc; border-bottom: 1px solid var(--border);
    }
    .statement-table th:first-child { text-align: left; }
    .statement-table td {
      padding: 12px 20px; border-bottom: 1px solid #f1f5f9;
      font-size: 0.82rem; color: var(--text);
    }
    .statement-table td:first-child { text-align: left; font-weight: 500; }
    .statement-table td:not(:first-child) {
      text-align: right;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-weight: 600; font-size: 0.8rem;
    }
    .statement-table .indent { padding-left: 44px !important; }
    .statement-table .total-row {
      background: var(--brand-light); border-top: 2px solid var(--brand);
    }
    .statement-table .total-row td { font-weight: 800; padding: 14px 20px; font-size: 0.85rem; }
    .statement-table .section-divider td {
      background: #f1f5f9; padding: 8px 20px; font-weight: 700;
      font-size: 0.7rem; text-transform: uppercase; color: #475569;
      letter-spacing: 0.06em;
    }
    .amount-positive { color: var(--success); }
    .amount-negative { color: var(--danger); }
    .amount-info { color: var(--info); }

    /* ── Export Bar ── */
    .export-bar { display: flex; gap: 12px; justify-content: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
    .btn-export {
      padding: 10px 22px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-weight: 600; font-size: 0.82rem;
      cursor: pointer; transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-export:hover { background: var(--brand-light); border-color: var(--brand); color: var(--brand); transform: translateY(-1px); }

    /* ── Chart ── */
    .chart-panel {
      background: var(--card); border-radius: 18px;
      padding: 20px 24px; margin-bottom: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    .chart-panel canvas { max-height: 340px; }

    /* ── Loading ── */
    .loading-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);
      z-index: 1000; justify-content: center; align-items: center;
    }
    .loading-content {
      background: white; padding: 36px 48px; border-radius: 24px; text-align: center;
    }
    .loading-content p { color: var(--text-muted); font-size: 0.85rem; margin-top: 16px; font-weight: 600; }
    .spinner { color: var(--brand); font-size: 2.5rem; }

    .no-data-message { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem; font-style: italic; }
    .reconciled-badge {
      background: var(--success-light); color: var(--success);
      font-size: 0.6rem; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; margin-left: 8px; text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .type-badge {
      display: inline-block; font-size: 0.6rem; font-weight: 700;
      padding: 2px 8px; border-radius: 10px; text-transform: uppercase;
      letter-spacing: 0.04em; margin-right: 6px;
    }
    .type-asset { background: #dbeafe; color: #2563eb; }
    .type-liability { background: var(--danger-light); color: var(--danger); }
    .type-equity { background: #f3e8ff; color: #9333ea; }
    .type-opening { background: var(--info-light); color: var(--info); }

    @media (max-width: 900px) {
      .statement-table { font-size: 0.75rem; }
      .statement-table th, .statement-table td { padding: 10px 12px; }
      .kpi-value { font-size: 1.4rem; }
      .bank-balance-value { font-size: 1.8rem; }
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      .filter-row { grid-template-columns: 1fr; }
      .period-display { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-cubes"></i></div>
      <div class="logo-text">
        <h1>FinLedger Pro</h1>
        <p>BALANCE SHEET & CASH FLOW</p>
      </div>
    </div>
    <div class="user-area">
      <div class="user-badge">
        <div id="userInitials">U</div>
        <span id="username">User</span>
      </div>
      <button id="homeBtn" class="btn-nav"><i class="fas fa-home"></i> Dashboard</button>
      <button id="logoutBtn" class="btn-nav danger"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </header>

  <!-- Bank Balance Overview -->
  <div class="bank-balance-card">
    <div class="bank-balance-header">
      <i class="fas fa-university"></i>
      <span>Bank Account Balances</span>
    </div>
    <div class="bank-balance-value" id="totalBankBalance">₹0.00</div>
    <div class="bank-detail-grid" id="bankDetailGrid"></div>
    <div class="update-section">
      <button class="update-btn" id="refreshBankBalance"><i class="fas fa-sync-alt"></i> Refresh</button>
      <button class="update-btn" id="debugBtn"><i class="fas fa-bug"></i> Debug Info</button>
    </div>
  </div>

  <!-- Filter Panel -->
  <div class="filter-panel">
    <div class="filter-row">
      <div class="filter-item">
        <label><i class="fas fa-calendar-alt"></i> Reporting Period</label>
        <select id="reportPeriod">
          <option value="month" selected>Current Month</option>
          <option value="lastMonth">Previous Month</option>
          <option value="quarter">Current Quarter</option>
          <option value="year">Current Year (YTD)</option>
          <option value="lastYear">Previous Year</option>
          <option value="all">All Time</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div class="filter-item" id="customDateRange" style="display:none;">
        <label>Custom Range</label>
        <div class="date-pair">
          <input type="date" id="startDate">
          <input type="date" id="endDate">
        </div>
      </div>
      <div class="filter-item">
        <label><i class="fas fa-chart-bar"></i> Chart Type</label>
        <select id="chartType">
          <option value="bar">Bar Chart</option>
          <option value="line">Line Chart</option>
          <option value="pie">Pie Chart</option>
          <option value="doughnut">Doughnut Chart</option>
        </select>
      </div>
      <div class="filter-item">
        <label><i class="fas fa-balance-scale"></i> Compare With</label>
        <select id="comparisonType">
          <option value="none">No Comparison</option>
          <option value="previousPeriod" selected>Previous Period</option>
          <option value="previousMonth">Previous Month</option>
          <option value="previousQuarter">Previous Quarter</option>
          <option value="previousYear">Previous Year</option>
          <option value="samePeriodLastYear">Same Period Last Year</option>
          <option value="twoQuartersBack">Two Quarters Back</option>
          <option value="twoYearsBack">Two Years Back</option>
          <option value="custom">Custom Range</option>
        </select>
      </div>
      <div class="filter-item" id="customComparisonRange" style="display:none;">
        <label>Custom Compare</label>
        <div class="date-pair">
          <input type="date" id="compareStartDate">
          <input type="date" id="compareEndDate">
        </div>
      </div>
      <div class="filter-item">
        <button id="generateBtn" class="btn-generate"><i class="fas fa-sync-alt"></i> Generate</button>
      </div>
    </div>
  </div>

  <!-- Period Display -->
  <div class="period-display" id="periodHeader"></div>

  <!-- Export Bar -->
  <div class="export-bar">
    <button id="exportExcel" class="btn-export"><i class="fas fa-file-excel"></i> Excel</button>
    <button id="exportPDF" class="btn-export"><i class="fas fa-file-pdf"></i> Export PDF (A4)</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="balance"><i class="fas fa-file-invoice"></i> Balance Sheet</button>
    <button class="tab-btn" data-tab="cashflow"><i class="fas fa-money-bill-wave"></i> Cash Flow</button>
  </div>

  <!-- Balance Sheet Tab -->
  <div id="balanceSheetTab" class="tab-content active">
    <div class="kpi-grid" id="bsKpiGrid"></div>
    <div id="bsValidation" class="balance-validation"></div>
    <div class="chart-panel"><canvas id="bsChart"></canvas></div>
    <div class="section-card">
      <div class="section-header"><span><i class="fas fa-building"></i> Assets</span></div>
      <div class="section-body"><table class="statement-table" id="assetsTable"></table></div>
    </div>
    <div class="section-card">
      <div class="section-header"><span><i class="fas fa-credit-card"></i> Liabilities</span></div>
      <div class="section-body"><table class="statement-table" id="liabilitiesTable"></table></div>
    </div>
    <div class="section-card">
      <div class="section-header"><span><i class="fas fa-chart-pie"></i> Equity</span></div>
      <div class="section-body"><table class="statement-table" id="equityTable"></table></div>
    </div>
  </div>

  <!-- Cash Flow Tab -->
  <div id="cashflowTab" class="tab-content">
    <div class="kpi-grid" id="cfKpiGrid"></div>
    <div class="chart-panel"><canvas id="cfChart"></canvas></div>
    <div class="section-card">
      <div class="section-header"><span><i class="fas fa-chart-line"></i> Cash Flow Statement</span></div>

/* ── Helpers ── */
function formatINR(amt) {
  if (amt === null || amt === undefined || isNaN(amt)) return '₹0.00';
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatINRShort(amt) {
  if (amt === null || amt === undefined || isNaN(amt)) return '₹0.00';
  return `₹${amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function formatNumberForPDF(amt) {
  if (amt === null || amt === undefined || isNaN(amt)) return '0.00';
  return amt.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatPeriod(start, end) {
  if (!start || !end) return '-';
  return `${start.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} – ${end.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`;
}
function formatDateShort(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ── Date Ranges ── */
function getDateRange(periodType, customStart=null, customEnd=null) {
  const today = new Date();
  let start, end;
  if (periodType === 'month') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = new Date(today.getFullYear(), today.getMonth()+1, 0); }
  else if (periodType === 'lastMonth') { start = new Date(today.getFullYear(), today.getMonth()-1, 1); end = new Date(today.getFullYear(), today.getMonth(), 0); }
  else if (periodType === 'quarter') { const q = Math.floor(today.getMonth()/3); start = new Date(today.getFullYear(), q*3, 1); end = new Date(today.getFullYear(), (q+1)*3, 0); }
  else if (periodType === 'year') { start = new Date(today.getFullYear(), 0, 1); end = new Date(today.getFullYear(), 11, 31); }
  else if (periodType === 'lastYear') { start = new Date(today.getFullYear()-1, 0, 1); end = new Date(today.getFullYear()-1, 11, 31); }
  else if (periodType === 'all') { start = new Date(2000, 0, 1); end = new Date(2099, 11, 31); }
  else { start = new Date(customStart); end = new Date(customEnd); }
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return { start, end };
}

function getComparisonRange(mainStart, mainEnd, compType, customStart=null, customEnd=null) {
  if (compType === 'none') return null;
  if (compType === 'previousPeriod') {
    const duration = mainEnd - mainStart;
    const prevEnd = new Date(mainStart.getTime() - 1);
    const prevStart = new Date(prevEnd.getTime() - duration);
    return { start: prevStart, end: prevEnd };
  }
  if (compType === 'previousMonth') {
    let start = new Date(mainStart); start.setDate(1); start.setMonth(start.getMonth()-1);
    let end = new Date(start.getFullYear(), start.getMonth()+1, 0);
    return { start, end };
  }
  if (compType === 'previousQuarter') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-3, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'previousYear' || compType === 'samePeriodLastYear') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-1);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-1);
    return { start, end };
  }
  if (compType === 'twoQuartersBack') {
    let start = new Date(mainStart);
    let quarterStartMonth = Math.floor(start.getMonth()/3)*3;
    start = new Date(start.getFullYear(), quarterStartMonth-6, 1);
    let end = new Date(start.getFullYear(), start.getMonth()+3, 0);
    return { start, end };
  }
  if (compType === 'twoYearsBack') {
    let start = new Date(mainStart); start.setFullYear(start.getFullYear()-2);
    let end = new Date(mainEnd); end.setFullYear(end.getFullYear()-2);
    return { start, end };
  }
  if (compType === 'custom' && customStart && customEnd) {
    return { start: new Date(customStart), end: new Date(customEnd) };
  }
  return null;
}

/* ── Fetch ── */
async function fetchAllTransactions() {
  if (!currentUser) return [];
  try {
    const snap = await getDocs(collection(db, "users", currentUser.uid, "transactions"));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(e) { console.error(e); return []; }
}

async function fetchAllTransactionsUpTo(endDate) {
  const all = await fetchAllTransactions();
  return all.filter(tx => {
    if (!tx.DATE) return false;
    let d = typeof tx.DATE === 'string' ? new Date(tx.DATE) : (tx.DATE.toDate ? tx.DATE.toDate() : new Date(tx.DATE));
    return d <= endDate;
  });
}

async function fetchTransactionsInPeriod(start, end) {
  const all = await fetchAllTransactions();
  return all.filter(tx => {
    if (!tx.DATE) return false;
    let d = typeof tx.DATE === 'string' ? new Date(tx.DATE) : (tx.DATE.toDate ? tx.DATE.toDate() : new Date(tx.DATE));
    return d >= start && d <= end;
  });
}

/* ── Load COA (matches coa.html structure) ── */
async function loadCOA() {
  if (!currentUser) return { map: {}, banks: [] };
  try {
    const snap = await getDocs(
      query(
        collection(db, "users", currentUser.uid, "chartOfAccounts"),
        where("userId", "==", currentUser.uid)
      )
    );
    const map = {};
    const banks = [];
    
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const name = (d.name || '').trim();
      if (!name) return;
      const lowerName = name.toLowerCase();
      const type = d.type || '';
      const category = d.category || '';
      const openingBalance = parseFloat(d.openingBalance) || parseFloat(d.opening_balance) || parseFloat(d.balance) || 0;
      
      // Detect opening balance accounts
      const isOpening = detectOpeningBalance(name, type, category);
      
      const entry = { type, category, openingBalance, isOpening, originalName: name };
      map[name] = entry;
      map[lowerName] = entry;
      
      // Detect bank accounts (Asset type with Bank category OR name patterns)
      if (type === 'Asset' && (category === 'Bank' || category === 'Cash' || category === 'Current Assets')) {
        if (!banks.includes(name)) banks.push(name);
      }
      const bankPatterns = ['bank', 'cash', 'hdfc', 'sbi', 'icici', 'axis', 'bom', 'current account', 'savings account'];
      for (const pattern of bankPatterns) {
        if (lowerName.includes(pattern) && !banks.includes(name)) {
          banks.push(name);
          break;
        }
      }
    });
    
    if (banks.length === 0) banks.push('AXIS', 'BOM', 'SBI', 'HDFC', 'Cash');
    
    console.log(`COA loaded: ${Object.keys(map).length} entries, ${banks.length} banks`);
    return { map, banks };
  } catch(e) {
    console.error("COA fetch error:", e);
    return { map: {}, banks: ['AXIS', 'BOM', 'SBI', 'HDFC', 'Cash'] };
  }
}

/* ── Detect Opening Balance account ── */
function detectOpeningBalance(name, type, category) {
  const n = (name || '').toLowerCase();
  const c = (category || '').toLowerCase();
  const t = (type || '').toLowerCase();
  
  if (n.includes('opening') || n.includes('opening balance') || n.includes('opening bal')) return true;
  if (n.includes('capital') && !n.includes('working capital')) return true;
  if (n.includes("owner's contribution") || n.includes('owners contribution')) return true;
  if (n.includes('owner contribution') || n.includes("owner's equity")) return true;
  if (n.includes('retained earnings')) return true;
  if (n.includes('share capital') || n.includes('initial investment')) return true;
  if (n.includes('startup capital') || n.includes('starting capital')) return true;
  if (c.includes('opening') || c.includes('capital')) return true;
  if (t === 'equity') return true;
  return false;
}

/* ── Account type resolver (COA-aware) ── */
function getAccountType(accountName, coaMap) {
  if (!accountName) return 'Expense';
  const lowerName = accountName.toLowerCase().trim();
  
  // COA first
  if (coaMap[accountName]) {
    const entry = coaMap[accountName];
    if (entry.isOpening) return 'Opening';
    return normalizeAccountType(entry.type);
  }
  if (coaMap[lowerName]) {
    const entry = coaMap[lowerName];
    if (entry.isOpening) return 'Opening';
    return normalizeAccountType(entry.type);
  }
  
  // Name-based fallback
  if (detectOpeningBalance(accountName, '', '')) return 'Opening';
  if (lowerName.includes('bank') || lowerName.includes('cash')) return 'Asset';
  if (lowerName.includes('loan') || lowerName.includes('payable')) return 'Liability';
  if (lowerName.includes('equity') || lowerName.includes('capital')) return 'Equity';
  if (lowerName.includes('sale') || lowerName.includes('revenue') || lowerName.includes('income') || lowerName.includes('salary')) return 'Income';
  return 'Expense';
}

function normalizeAccountType(type) {
  if (!type) return 'Expense';
  const t = type.toLowerCase();
  if (t === 'asset' || t === 'bank') return 'Asset';
  if (t === 'liability' || t === 'accounts payable' || t === 'loans payable') return 'Liability';
  if (t === 'equity' || t === 'investment' || t === 'balance') return 'Equity';
  if (t === 'income' || t === 'revenue') return 'Income';
  if (t === 'expense' || t === 'otherexpense' || t === 'other expense') return 'Expense';
  if (t === 'cogs' || t === 'cost of goods sold') return 'Expense';
  if (t === 'otherincome' || t === 'other income') return 'Income';
  return type;
}

/* ── Is Bank Account? ── */
function isBankAccount(accountName, coaBanksList) {
  if (!accountName) return false;
  const lowerName = accountName.toLowerCase().trim();
  for (const bank of coaBanksList) {
    if (bank.toLowerCase() === lowerName) return true;
  }
  for (const bank of coaBanksList) {
    if (lowerName.includes(bank.toLowerCase()) || bank.toLowerCase().includes(lowerName)) return true;
  }
  const bankPatterns = ['bank', 'cash', 'hdfc', 'sbi', 'icici', 'axis', 'bom', 'current account', 'savings account'];
  for (const pattern of bankPatterns) {
    if (lowerName.includes(pattern)) return true;
  }
  return false;
}

/* ── Compute Balance Sheet (COA-aware, with Opening Balance) ── */
function computeBalanceSheet(transactions, coaMap, coaBanksList) {
  const banks = {}, otherAssets = {}, liabilities = {}, equityAccounts = {};
  let totalIncome = 0, totalExpense = 0;
  let openingBalanceFromCOA = 0;
  const openingAccounts = {};
  
  // Step 1: Add Opening Balances from COA directly
  Object.entries(coaMap).forEach(([name, entry]) => {
    if (entry && entry.isOpening && entry.openingBalance > 0) {
      const canonical = entry.originalName || name;
      if (!openingAccounts[canonical]) {
        openingAccounts[canonical] = entry.openingBalance;
        openingBalanceFromCOA += entry.openingBalance;
      }
    }
  });
  
  // Step 2: Process transactions
  transactions.forEach(tx => {
    const accHeader = tx.ACCOUNT_HEADER || "Uncategorized";
    const bankName = tx.BANK_NAME || tx.MODE || "";
    const type = tx.TYPE || "";
    const income = parseFloat(tx.INCOME) || 0;
    const expense = parseFloat(tx.EXPENSE) || 0;
    
    if (type === 'Income') totalIncome += income;
    else if (type === 'Expense') totalExpense += expense;
    
    // Bank account tracking
    if (bankName && isBankAccount(bankName, coaBanksList)) {
      if (type === 'Income') banks[bankName] = (banks[bankName] || 0) + income;
      else if (type === 'Expense') banks[bankName] = (banks[bankName] || 0) - expense;
      else if (type === 'Transfer') banks[bankName] = (banks[bankName] || 0) + (income - expense);
    }
    
    // Account header tracking (skip if same as bank)
    if (accHeader !== bankName) {
      const accType = getAccountType(accHeader, coaMap);
      const isBank = isBankAccount(accHeader, coaBanksList);
      const net = income - expense;
      
      // Skip Opening accounts in transaction processing (they're handled from COA)
      if (accType === 'Opening') {
        // Only add if not already tracked from COA
        const canonical = coaMap[accHeader]?.originalName || accHeader;
        if (!openingAccounts[canonical] && net > 0) {
          openingAccounts[canonical] = net;
          openingBalanceFromCOA += net;
        }
        return;
      }
      
      if (isBank) {
        if (type === 'Income') banks[accHeader] = (banks[accHeader] || 0) + income;
        else if (type === 'Expense') banks[accHeader] = (banks[accHeader] || 0) - expense;
        else if (type === 'Transfer') banks[accHeader] = (banks[accHeader] || 0) + (income - expense);
      } else if (accType === 'Asset') {
        otherAssets[accHeader] = (otherAssets[accHeader] || 0) + net;
      } else if (accType === 'Liability') {
        liabilities[accHeader] = (liabilities[accHeader] || 0) + net;
      } else if (accType === 'Equity') {
        equityAccounts[accHeader] = (equityAccounts[accHeader] || 0) + net;
      }
    }
  });
  
  // Step 3: Add Opening Balances to equity
  Object.entries(openingAccounts).forEach(([name, amt]) => {
    equityAccounts[name] = (equityAccounts[name] || 0) + amt;
  });
  
  // Step 4: Net profit → Retained Earnings
  const netProfit = totalIncome - totalExpense;
  if (Math.abs(netProfit) > 0.01) {
    equityAccounts["Retained Earnings"] = (equityAccounts["Retained Earnings"] || 0) + netProfit;
  }
  
  return { banks, otherAssets, liabilities, equityAccounts, openingAccounts, openingBalanceFromCOA, netProfit, totalIncome, totalExpense };
}

/* ── Compute Cash Flow ── */
function computeCashFlow(transactions, coaMap, coaBanksList) {
  let operating = 0, investing = 0, financing = 0;
  
  transactions.forEach(tx => {
    const type = tx.TYPE || "";
    const income = parseFloat(tx.INCOME) || 0;
    const expense = parseFloat(tx.EXPENSE) || 0;
    const net = income - expense;
    const accHeader = tx.ACCOUNT_HEADER || "";
    const accType = getAccountType(accHeader, coaMap);
    
    if (type === 'Income' || type === 'Expense') {
      if (accType === 'Income' || accType === 'Expense' || accType === 'Unknown') {
        operating += (type === 'Income' ? income : -expense);
      }
    } else if (type === 'Transfer') {
      const lower = accHeader.toLowerCase();
      if (lower.includes('invest') || lower.includes('asset') || lower.includes('equipment')) {
        investing += net;
      } else if (lower.includes('loan') || lower.includes('capital') || lower.includes('equity')) {
        financing += net;
      } else {
        operating += net;
      }
    }
  });
  
  return { operating, investing, financing, netCash: operating + investing + financing };
}

/* ── Update Bank Balance Display ── */
function updateBankBalanceDisplay() {

}

/* ── Load All Periods ── */
async function loadAllPeriods() {
  const periodType = document.getElementById("reportPeriod").value;
  const customStart = document.getElementById("startDate").value;
  const customEnd = document.getElementById("endDate").value;
  
  const { start, end } = getDateRange(periodType, customStart, customEnd);
  periods.current = { start, end, text: formatPeriod(start, end) };
  
  const compType = document.getElementById("comparisonType").value;
  showThree = (compType === 'twoQuartersBack' || compType === 'twoYearsBack');
  
  const compRange = getComparisonRange(start, end, compType,
    document.getElementById("compareStartDate").value,
    document.getElementById("compareEndDate").value);
  
  const coaData = await loadCOA();
  coaMap = coaData.map;
  coaBanks = coaData.banks;
  
  // Current period
  const allCurrent = await fetchAllTransactionsUpTo(end);
  const periodCurrent = await fetchTransactionsInPeriod(start, end);
  data.current.bs = computeBalanceSheet(allCurrent, coaMap, coaBanks);
  data.current.cf = computeCashFlow(periodCurrent, coaMap, coaBanks);
  
  // Prev1
  if (compRange) {
    const allPrev1 = await fetchAllTransactionsUpTo(compRange.end);
    const periodPrev1 = await fetchTransactionsInPeriod(compRange.start, compRange.end);
    periods.prev1 = { start: compRange.start, end: compRange.end, text: formatPeriod(compRange.start, compRange.end) };
    data.prev1.bs = computeBalanceSheet(allPrev1, coaMap, coaBanks);
    data.prev1.cf = computeCashFlow(periodPrev1, coaMap, coaBanks);
    
    if (showThree) {
      let compRange2;
      if (compType === 'twoYearsBack') {
        compRange2 = { start: new Date(start.getFullYear()-2, start.getMonth(), start.getDate()), end: new Date(end.getFullYear()-2, end.getMonth(), end.getDate()) };
      } else if (compType === 'twoQuartersBack') {
        const qsm = Math.floor(start.getMonth()/3)*3;
        compRange2 = { start: new Date(start.getFullYear(), qsm-6, 1), end: new Date(start.getFullYear(), qsm-3, 0) };
      }
      if (compRange2) {
        const allPrev2 = await fetchAllTransactionsUpTo(compRange2.end);
        const periodPrev2 = await fetchTransactionsInPeriod(compRange2.start, compRange2.end);
        periods.prev2 = { start: compRange2.start, end: compRange2.end, text: formatPeriod(compRange2.start, compRange2.end) };
        data.prev2.bs = computeBalanceSheet(allPrev2, coaMap, coaBanks);
        data.prev2.cf = computeCashFlow(periodPrev2, coaMap, coaBanks);
      } else {
        periods.prev2 = null; data.prev2 = { bs: null, cf: null };
      }
    } else {
      periods.prev2 = null; data.prev2 = { bs: null, cf: null };
    }
  } else {
    periods.prev1 = null; periods.prev2 = null;
    data.prev1 = { bs: null, cf: null }; data.prev2 = { bs: null, cf: null };
  }
  
  renderPeriodHeader();
  renderBalanceSheet();
  renderCashFlow();
  renderCharts();
  updateBankBalanceDisplay();
}

function renderPeriodHeader() {
  const header = document.getElementById('periodHeader');
  let html = `<div class="period-tag"><i class="fas fa-calendar-check"></i><span class="tag-label">Current:</span><span class="tag-value">${periods.current.text}</span></div>`;
  if (periods.prev1) html += `<div class="period-tag"><i class="fas fa-calendar-week"></i><span class="tag-label">Previous:</span><span class="tag-value">${periods.prev1.text}</span></div>`;
  if (periods.prev2 && showThree) html += `<div class="period-tag"><i class="fas fa-calendar-minus"></i><span class="tag-label">Prior‑Previous:</span><span class="tag-value">${periods.prev2.text}</span></div>`;
  header.innerHTML = html;
}

function getTableHeaders() {
  let headers = ['<th>Account</th>', '<th>Current</th>'];
  if (periods.prev1) headers.push('<th>Previous</th>');
  if (periods.prev2 && showThree) headers.push('<th>Prior</th>');
  return `<tr>${headers.join('')}</tr>`;
}

function formatCell(value, cls = '') {
  if (value === null || value === undefined) return '₹0.00';
  const c = cls || (value >= 0 ? 'amount-positive' : 'amount-negative');
  return `<span class="${c}">${formatINR(value)}</span>`;
}

function renderTableRow(label, currentVal, prev1Val, prev2Val, options = {}) {
  const { isTotal = false, indent = false, isSection = false, badge = null, cls = '' } = options;
  const rowClass = isTotal ? 'total-row' : (isSection ? 'section-divider' : '');
  const indentCls = indent ? 'indent' : '';
  
  let html = `<tr class="${rowClass}"><td class="${indentCls}">${indent ? '↳ ' : ''}${label}${badge ? ` <span class="reconciled-badge">${badge}</span>` : ''}</td>`;
  html += `<td>${isSection ? '' : formatCell(currentVal, cls)}</td>`;
  if (periods.prev1) html += `<td>${isSection ? '' : formatCell(prev1Val, cls)}</td>`;
  if (periods.prev2 && showThree) html += `<td>${isSection ? '' : formatCell(prev2Val, cls)}</td>`;
  html += `</tr>`;
  return html;
}

/* ── Render Balance Sheet ── */
function renderBalanceSheet() {
  if (!data.current.bs) return;
  const curr = data.current.bs, prev1 = data.prev1.bs, prev2 = data.prev2.bs;
  
  const totalBanks = Object.values(curr.banks).reduce((a,b)=>a+b,0);
  const totalOther = Object.values(curr.otherAssets).reduce((a,b)=>a+b,0);
  const totalAssets = totalBanks + totalOther;
  const totalLiab = Object.values(curr.liabilities).reduce((a,b)=>a+b,0);
  const totalEq = Object.values(curr.equityAccounts).reduce((a,b)=>a+b,0);
  
  document.getElementById('bsKpiGrid').innerHTML = `
    <div class="kpi-card assets">
      <div class="kpi-head"><div class="kpi-icon"><i class="fas fa-building"></i></div></div>
      <div class="kpi-label">Total Assets</div>
      <div class="kpi-value">${formatINR(totalAssets)}</div>
      <div class="kpi-sub">Bank: ${formatINR(totalBanks)} | Other: ${formatINR(totalOther)}</div>
    </div>
    <div class="kpi-card liabilities">
      <div class="kpi-head"><div class="kpi-icon"><i class="fas fa-credit-card"></i></div></div>
      <div class="kpi-label">Total Liabilities</div>
      <div class="kpi-value">${formatINR(totalLiab)}</div>
      <div class="kpi-sub">${Object.keys(curr.liabilities).length} accounts</div>
    </div>
    <div class="kpi-card equity">
      <div class="kpi-head"><div class="kpi-icon"><i class="fas fa-chart-pie"></i></div></div>
      <div class="kpi-label">Total Equity</div>
      <div class="kpi-value">${formatINR(totalEq)}</div>
      <div class="kpi-sub">Incl. Opening: ${formatINR(curr.openingBalanceFromCOA)}</div>
    </div>
    <div class="kpi-card opening">
      <div class="kpi-head"><div class="kpi-icon"><i class="fas fa-door-open"></i></div></div>
      <div class="kpi-label">Opening Balance</div>
      <div class="kpi-value">${formatINR(curr.openingBalanceFromCOA)}</div>
      <div class="kpi-sub">From COA (capital)</div>
    </div>`;
  
  const balanced = Math.abs(totalAssets - (totalLiab + totalEq)) < 0.01;
  const vd = document.getElementById("bsValidation");
  vd.innerHTML = balanced
    ? '<i class="fas fa-check-circle"></i> Balance Sheet is balanced (Assets = Liabilities + Equity)'
    : `<i class="fas fa-exclamation-triangle"></i> Out of balance by ${formatINR(Math.abs(totalAssets - (totalLiab + totalEq)))}`;
  vd.className = `balance-validation ${balanced ? 'balance-valid' : 'balance-invalid'}`;
  
  /* ── Assets Table ── */
  let assetsHtml = getTableHeaders();
  const sortedBanks = Object.entries(curr.banks).sort((a,b) => a[0].localeCompare(b[0]));
  if (sortedBanks.length > 0) {
    const p1TB = prev1 ? Object.values(prev1.banks).reduce((a,b)=>a+b,0) : null;
    const p2TB = prev2 ? Object.values(prev2.banks).reduce((a,b)=>a+b,0) : null;
    assetsHtml += renderTableRow('BANK & CASH ACCOUNTS', totalBanks, p1TB, p2TB, { isSection: true });
    for (let [name, val] of sortedBanks) {
      assetsHtml += renderTableRow(name, val, prev1?.banks?.[name] || 0, prev2?.banks?.[name] || 0, { indent: true });
    }
  }
  const sortedOther = Object.entries(curr.otherAssets).sort((a,b) => a[0].localeCompare(b[0]));
  if (sortedOther.length > 0) {
    const p1TO = prev1 ? Object.values(prev1.otherAssets).reduce((a,b)=>a+b,0) : null;
    const p2TO = prev2 ? Object.values(prev2.otherAssets).reduce((a,b)=>a+b,0) : null;
    assetsHtml += renderTableRow('OTHER ASSETS', totalOther, p1TO, p2TO, { isSection: true });
    for (let [name, val] of sortedOther) {
      assetsHtml += renderTableRow(name, val, prev1?.otherAssets?.[name] || 0, prev2?.otherAssets?.[name] || 0, { indent: true });
    }
  }
  if (sortedBanks.length === 0 && sortedOther.length === 0) {
    assetsHtml += `<tr><td colspan="4" class="no-data-message">No assets recorded.</td></tr>`;
  }
  const p1TA = prev1 ? Object.values(prev1.banks).reduce((a,b)=>a+b,0)+Object.values(prev1.otherAssets).reduce((a,b)=>a+b,0) : null;
  const p2TA = prev2 ? Object.values(prev2.banks).reduce((a,b)=>a+b,0)+Object.values(prev2.otherAssets).reduce((a,b)=>a+b,0) : null;
  assetsHtml += renderTableRow('TOTAL ASSETS', totalAssets, p1TA, p2TA, { isTotal: true });
  document.getElementById('assetsTable').innerHTML = assetsHtml;
  
  /* ── Liabilities Table ── */
  let liabHtml = getTableHeaders();
  const sortedLiab = Object.entries(curr.liabilities).sort((a,b)=>a[0].localeCompare(b[0]));
  if (sortedLiab.length > 0) {
    for (let [n,v] of sortedLiab) {
      liabHtml += renderTableRow(n, v, prev1?.liabilities?.[n]||0, prev2?.liabilities?.[n]||0);
    }
  } else {
    liabHtml += `<tr><td colspan="4" class="no-data-message">No liabilities recorded.</td></tr>`;
  }
  const p1TL = prev1 ? Object.values(prev1.liabilities).reduce((a,b)=>a+b,0) : null;
  const p2TL = prev2 ? Object.values(prev2.liabilities).reduce((a,b)=>a+b,0) : null;
  liabHtml += renderTableRow('TOTAL LIABILITIES', totalLiab, p1TL, p2TL, { isTotal: true });
  document.getElementById('liabilitiesTable').innerHTML = liabHtml;
  
  /* ── Equity Table ── */
  let eqHtml = getTableHeaders();
  const sortedEq = Object.entries(curr.equityAccounts).sort((a,b)=>a[0].localeCompare(b[0]));
  // Separate opening accounts
  const openingNames = Object.keys(curr.openingAccounts || {});
  const retainedNames = sortedEq.filter(([n]) => n === 'Retained Earnings');
  const otherEq = sortedEq.filter(([n]) => n !== 'Retained Earnings' && !openingNames.includes(n));
  
  if (openingNames.length > 0) {
    eqHtml += renderTableRow('OPENING BALANCE / CAPITAL', curr.openingBalanceFromCOA, prev1?.openingBalanceFromCOA, prev2?.openingBalanceFromCOA, { isSection: true });
    for (let name of openingNames) {
      eqHtml += renderTableRow(name, curr.equityAccounts[name] || 0, prev1?.equityAccounts?.[name] || 0, prev2?.equityAccounts?.[name] || 0, { indent: true, badge: 'COA' });
    }
  }
  if (otherEq.length > 0) {
    eqHtml += renderTableRow('OTHER EQUITY', otherEq.reduce((s,[_,v])=>s+v,0), null, null, { isSection: true });
    for (let [name, val] of otherEq) {
      eqHtml += renderTableRow(name, val, prev1?.equityAccounts?.[name] || 0, prev2?.equityAccounts?.[name] || 0, { indent: true });
    }
  }
  if (retainedNames.length > 0) {
    eqHtml += renderTableRow('RETAINED EARNINGS (NET PROFIT)', curr.netProfit, prev1?.netProfit, prev2?.netProfit, { isSection: true });
    for (let [name, val] of retainedNames) {
      eqHtml += renderTableRow(name, val, prev1?.equityAccounts?.[name] || 0, prev2?.equityAccounts?.[name] || 0, { indent: true });
    }
  }
  if (sortedEq.length === 0) {
    eqHtml += `<tr><td colspan="4" class="no-data-message">No equity recorded.</td></tr>`;
  }
  const p1TE = prev1 ? Object.values(prev1.equityAccounts).reduce((a,b)=>a+b,0) : null;
  const p2TE = prev2 ? Object.values(prev2.equityAccounts).reduce((a,b)=>a+b,0) : null;
  eqHtml += renderTableRow('TOTAL EQUITY', totalEq, p1TE, p2TE, { isTotal: true });
  document.getElementById('equityTable').innerHTML = eqHtml;
}

/* ── Charts ── */
function renderCharts() {
  if (!data.current.bs || !data.current.cf) return;
  const chartType = document.getElementById("chartType").value;
  
  const ctx1 = document.getElementById("bsChart").getContext("2d");
  if (bsChart) bsChart.destroy();
  const curr = data.current.bs;
  const ta = Object.values(curr.banks).reduce((a,b)=>a+b,0) + Object.values(curr.otherAssets).reduce((a,b)=>a+b,0);
  const tl = Object.values(curr.liabilities).reduce((a,b)=>a+b,0);
  const te = Object.values(curr.equityAccounts).reduce((a,b)=>a+b,0);
  
  bsChart = new Chart(ctx1, {
    type: chartType === 'pie' || chartType === 'doughnut' ? chartType : chartType,
    data: {
      labels: ["Assets", "Liabilities", "Equity"],
      datasets: [{
        label: 'Current',
        data: [ta, tl, te],
        backgroundColor: ["#3b82f6", "#ef4444", "#10b981"],
        borderColor: '#fff',
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { font: { size: 11, weight: '600' }, padding: 16 } },
        tooltip: { callbacks: { label: (ctx) => ` ${ctx.label}: ${formatINR(ctx.raw)}` } }
      },
      scales: chartType === 'pie' || chartType === 'doughnut' ? {} : {
        y: { beginAtZero: true, ticks: { callback: v => '₹'+v.toLocaleString('en-IN') } }
      }
    }
  });
  
  const ctx2 = document.getElementById("cfChart").getContext("2d");
  if (cfChart) cfChart.destroy();
  cfChart = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: ["Operating", "Investing", "Financing"],
      datasets: [{
        label: 'Current',
        data: [data.current.cf.operating, data.current.cf.investing, data.current.cf.financing],
        backgroundColor: ["#10b981", "#f59e0b", "#3b82f6"],
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => ` ${formatINR(ctx.raw)}` } }
      },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '₹'+v.toLocaleString('en-IN') } }
      }
    }
  });
}

/* ── Export Excel ── */
async function exportToExcel() {
  try {
    const wb = XLSX.utils.book_new();
    
    // Sheet 1: Bank Balance
    const bankData = [['Bank Account','Balance']];
    Object.entries(data.current.bs?.banks||{}).forEach(([n,b])=>bankData.push([n,b]));
    bankData.push(['TOTAL', Object.values(data.current.bs?.banks||{}).reduce((a,b)=>a+b,0)]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bankData), 'Bank Balance');
    
    // Sheet 2: Balance Sheet
    const bsData = [['Section','Account','Current','Previous']];
    const currBS = data.current.bs;
    Object.entries(currBS.banks).forEach(([n,v]) => bsData.push(['Bank', n, v, data.prev1.bs?.banks?.[n]||0]));
    Object.entries(currBS.otherAssets).forEach(([n,v]) => bsData.push(['Other Asset', n, v, data.prev1.bs?.otherAssets?.[n]||0]));
    Object.entries(currBS.liabilities).forEach(([n,v]) => bsData.push(['Liability', n, v, data.prev1.bs?.liabilities?.[n]||0]));
    Object.entries(currBS.equityAccounts).forEach(([n,v]) => bsData.push(['Equity', n, v, data.prev1.bs?.equityAccounts?.[n]||0]));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bsData), 'Balance Sheet');
    
    // Sheet 3: Cash Flow
    const cfData = [['Category','Current','Previous']];
    cfData.push(['Operating', data.current.cf.operating, data.prev1.cf?.operating||0]);
    cfData.push(['Investing', data.current.cf.investing, data.prev1.cf?.investing||0]);
    cfData.push(['Financing', data.current.cf.financing, data.prev1.cf?.financing||0]);
    cfData.push(['Net Cash', data.current.cf.netCash, data.prev1.cf?.netCash||0]);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(cfData), 'Cash Flow');
    
    XLSX.writeFile(wb, `FinLedger_BS_${formatDateShort(new Date())}.xlsx`);
    Swal.fire({ icon: 'success', title: 'Excel Exported', timer: 1500, showConfirmButton: false });
  } catch(e) { Swal.fire("Error", e.message, "error"); }
}

  if (Object.keys(curr.liabilities).length === 0) bsBody.push([{ content: 'No liabilities', colSpan: 2, styles: { halign: 'center', fontStyle: 'italic', textColor: [148,163,184] } }]);
  bsBody.push([{ content: 'TOTAL LIABILITIES', styles: { fontStyle: 'bold', fillColor: [238,242,255] } }, { content: formatNumberForPDF(totalLiab), styles: { fontStyle: 'bold', fillColor: [238,242,255], halign: 'right' } }]);
  
  bsBody.push([{ content: 'EQUITY', colSpan: 2, styles: { fillColor: [236,253,245], fontStyle: 'bold', halign: 'left' } }]);
  Object.entries(curr.equityAccounts).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([n,v]) => {
    bsBody.push([n, formatNumberForPDF(v)]);
  });
  bsBody.push([{ content: 'TOTAL EQUITY', styles: { fontStyle: 'bold', fillColor: [238,242,255] } }, { content: formatNumberForPDF(totalEq), styles: { fontStyle: 'bold', fillColor: [238,242,255], halign: 'right' } }]);
  
  bsBody.push([{ content: 'TOTAL LIABILITIES + EQUITY', styles: { fontStyle: 'bold', fillColor: [238,242,255], textColor: [79,70,229] } }, { content: formatNumberForPDF(totalLiab + totalEq), styles: { fontStyle: 'bold', fillColor: [238,242,255], halign: 'right', textColor: [79,70,229] } }]);
  
  doc.autoTable({
    startY: 28,
    head: [["Account", "Amount (₹)"]],
    body: bsBody,
    theme: 'grid',
    headStyles: { fillColor: [79,70,229], textColor: [255,255,255], fontSize: 9, halign: 'center', fontStyle: 'bold' },
    bodyStyles: { fontSize: 8, textColor: [51,65,85] },
    columnStyles: { 0: { halign: 'left' }, 1: { halign: 'right' } }
  });
  
  doc.setFontSize(8); doc.setTextColor(148,163,184);
  doc.text("FinLedger Pro — Balance Sheet Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 2 of 3", pageW - 15, pageH - 10, { align: 'right' });
  
  /* ===== PAGE 3: Cash Flow ===== */
  doc.addPage('a4', 'portrait');
  doc.setFillColor(79, 70, 229); doc.rect(0, 0, pageW, 22, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(14); doc.setFont('helvetica','bold');
  doc.text("CASH FLOW STATEMENT", pageW/2, 14, { align: 'center' });
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text(periods.current.text, pageW/2, 19, { align: 'center' });
  
  const cf = data.current.cf;
  const cfBody = [
    ["Operating Activities", formatNumberForPDF(cf.operating)],
    ["Investing Activities", formatNumberForPDF(cf.investing)],
    ["Financing Activities", formatNumberForPDF(cf.financing)],
    [{ content: 'NET CASH FLOW', styles: { fontStyle: 'bold', fillColor: [238,242,255] } }, { content: formatNumberForPDF(cf.netCash), styles: { fontStyle: 'bold', fillColor: [238,242,255], halign: 'right' } }]
  ];
  
  doc.autoTable({
    startY: 30,
    head: [["Category", "Amount (₹)"]],
    body: cfBody,
    theme: 'grid',
    tableWidth: 160,
    margin: { left: (pageW - 160) / 2 },
    headStyles: { fillColor: [79,70,229], textColor: [255,255,255], fontSize: 9, halign: 'center', fontStyle: 'bold' },
    bodyStyles: { fontSize: 9, textColor: [51,65,85] },
    columnStyles: { 1: { halign: 'right' } }
  });
  
  // COA note
  const noteY = doc.lastAutoTable.finalY + 12;
  doc.setFillColor(238, 242, 255); doc.roundedRect(15, noteY, pageW - 30, 22, 3, 3, 'F');
  doc.setTextColor(79,70,229); doc.setFontSize(8); doc.setFont('helvetica','bold');
  doc.text("Chart of Accounts (COA) Status", 20, noteY + 7);
  doc.setFont('helvetica','normal'); doc.setTextColor(51,65,85); doc.setFontSize(7.5);
  doc.text(`COA Entries: ${Object.keys(coaMap).length} | Bank Accounts: ${coaBanks.length}`, 20, noteY + 13);
  doc.text("Opening Balance/Equity accounts are treated as capital contributions.", 20, noteY + 18);
  
  doc.setFontSize(8); doc.setTextColor(148,163,184);
  doc.text("FinLedger Pro — Balance Sheet Report", pageW/2, pageH - 10, { align: 'center' });
  doc.text("Page 3 of 3", pageW - 15, pageH - 10, { align: 'right' });
  
  doc.save(`FinLedger_BS_${formatDateShort(new Date())}.pdf`);
  Swal.fire({ icon: 'success', title: 'PDF Exported', text: 'A4 report generated', timer: 2000, showConfirmButton: false });
}

/* ── Default Dates ── */
function setDefaultDates() {
  const today = new Date();
  document.getElementById("startDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 1));
  document.getElementById("endDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()+1, 0));
  document.getElementById("compareStartDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth()-1, 1));
  document.getElementById("compareEndDate").value = formatDateShort(new Date(today.getFullYear(), today.getMonth(), 0));
}

/* ── Event Listeners ── */
document.getElementById("reportPeriod").addEventListener("change", (e) => {
  document.getElementById("customDateRange").style.display = e.target.value === "custom" ? "block" : "none";
});
document.getElementById("comparisonType").addEventListener("change", (e) => {
  document.getElementById("customComparisonRange").style.display = e.target.value === "custom" ? "block" : "none";
});
document.getElementById("generateBtn").addEventListener("click", async () => {
  const loading = document.getElementById("loadingModal");
  loading.style.display = "flex";
  await loadAllPeriods();
  loading.style.display = "none";
});
document.getElementById("exportExcel").addEventListener("click", exportToExcel);
document.getElementById("exportPDF").addEventListener("click", exportToPDF);
document.getElementById("chartType").addEventListener("change", renderCharts);
document.getElementById("refreshBankBalance").addEventListener("click", async () => {
  const loading = document.getElementById("loadingModal");
  loading.style.display = "flex";
  await loadAllPeriods();
  loading.style.display = "none";
  Swal.fire({ icon: 'success', title: 'Refreshed', timer: 1500, showConfirmButton: false });
});
document.getElementById("debugBtn").addEventListener("click", showDebugInfo);
document.getElementById("homeBtn").addEventListener("click", () => { window.location.href = "home.html"; });

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab + "Tab").classList.add("active");
    setTimeout(renderCharts, 100);
  });
});

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const name = user.displayName || user.email?.split('@')[0] || "User";
    document.getElementById("username").innerHTML = name;
    document.getElementById("userInitials").innerHTML = name.charAt(0).toUpperCase();
    setDefaultDates();
    const loading = document.getElementById("loadingModal");
    loading.style.display = "flex";
    await loadAllPeriods();
    loading.style.display = "none";
  } else {
    window.location.href = "index.html";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.href = "index.html";
});
</script>
</body>
</html>
