<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow | Inventory Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF export libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ==================== DESIGN SYSTEM ==================== */
    :root {
      --primary: #4e54c8;
      --primary-light: #8f94fb;
      --primary-dark: #3f45a8;
      --success: #00b09b;
      --success-light: #96c93d;
      --warning: #f46b45;
      --warning-light: #eea849;
      --danger: #ff416c;
      --danger-light: #ff4b2b;
      --info: #3498db;
      --purple: #8b5cf6;
      --dark: #0f172a;
      --light: #f8fafc;
      --gray-50: #f9fafb;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-success: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      --gradient-warning: linear-gradient(135deg, #f46b45 0%, #eea849 100%);
      --gradient-danger: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --gradient-info: linear-gradient(135deg, #3498db 0%, #6dd5ed 100%);
      --gradient-purple: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      --gradient-sidebar: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      --sidebar-width: 270px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--gray-100); min-height: 100vh; color: var(--gray-800); overflow-x: hidden; }

    /* ==================== LAYOUT ==================== */
    .app-container { display: flex; min-height: 100vh; position: relative; }

    /* ==================== SIDEBAR ==================== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--gradient-sidebar);
      color: white;
      position: fixed;
      height: 100vh;
      left: 0; top: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
    }
    .sidebar-brand { padding: 1.6rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .sidebar-brand h2 {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; display: flex; align-items: center; gap: 8px;
    }
    .company-info {
      margin-top: 12px; padding: 10px 12px;
      background: rgba(255,255,255,0.08); border-radius: var(--radius-md);
      font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      cursor: pointer; transition: var(--transition);
    }
    .company-info:hover { background: rgba(255,255,255,0.15); }
    .company-info span:first-of-type {
      font-weight: 600; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 120px;
    }
    .industry-badge {
      background: rgba(96,165,250,0.25); padding: 3px 10px; border-radius: 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3px;
      text-transform: uppercase; margin-left: auto; white-space: nowrap; color: #bfdbfe;
    }
    .sidebar-nav {
      flex: 1; overflow-y: auto; padding: 1rem 0.8rem;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .sidebar-nav::-webkit-scrollbar { width: 6px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .nav-section { margin-bottom: 1.4rem; }
    .nav-section-title {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--gray-500); padding: 0.4rem 0.8rem; font-weight: 700;
    }
    .nav-link {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-md);
      color: var(--gray-300); text-decoration: none;
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
      transition: var(--transition); margin: 2px 0;
      position: relative; overflow: hidden;
    }
    .nav-link::before {
      content: ''; position: absolute; left: 0; top: 0;
      height: 100%; width: 3px; background: var(--primary-light);
      transform: scaleY(0); transition: transform 0.25s ease;
      border-radius: 0 3px 3px 0;
    }
    .nav-link:hover { background: rgba(255,255,255,0.08); color: white; transform: translateX(2px); }
    .nav-link.active { background: rgba(96,165,250,0.18); color: white; font-weight: 600; }
    .nav-link.active::before { transform: scaleY(1); }
    .nav-link i { width: 20px; text-align: center; font-size: 1rem; flex-shrink: 0; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }

    /* ==================== MAIN ==================== */
    .main-content {
      flex: 1; margin-left: var(--sidebar-width);
      padding: 1.5rem; min-height: 100vh;
      transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      width: calc(100% - var(--sidebar-width));
    }
    .top-header {
      background: white; padding: 1.1rem 1.5rem;
      border-radius: var(--radius-lg);
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
      flex-wrap: wrap; gap: 1rem; position: sticky; top: 1.5rem;
      z-index: 100; border: 1px solid var(--gray-200);
    }
    .header-left h1 {
      font-size: 1.5rem; color: var(--gray-900); font-weight: 800;
      letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
    }
    .header-left p { font-size: 0.8rem; color: var(--gray-500); margin-top: 3px; font-weight: 500; }
    .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ==================== BUTTONS ==================== */
    .btn {
      padding: 9px 18px; border-radius: var(--radius-md); border: none;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      transition: var(--transition); display: inline-flex;
      align-items: center; justify-content: center; gap: 7px;
      white-space: nowrap; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 6px 18px rgba(78,84,200,0.35); transform: translateY(-2px); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #009a88; box-shadow: 0 6px 18px rgba(0,176,155,0.35); transform: translateY(-2px); }
    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #d95a38; box-shadow: 0 6px 18px rgba(244,107,69,0.35); transform: translateY(-2px); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #e03458; box-shadow: 0 6px 18px rgba(255,65,108,0.35); transform: translateY(-2px); }
    .btn-info { background: var(--info); color: white; }
    .btn-info:hover { background: #2980b9; box-shadow: 0 6px 18px rgba(52,152,219,0.35); transform: translateY(-2px); }
    .btn-purple { background: var(--purple); color: white; }
    .btn-purple:hover { background: #7c3aed; box-shadow: 0 6px 18px rgba(139,92,246,0.35); transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: rgba(78,84,200,0.05); }
    .btn-ghost { background: transparent; border: none; color: var(--gray-600); }
    .btn-ghost:hover { background: var(--gray-100); }
    .btn-sm { padding: 5px 11px; font-size: 0.75rem; border-radius: var(--radius-sm); }
    .btn-lg { padding: 13px 26px; font-size: 0.95rem; border-radius: var(--radius-lg); }
    .btn-block { width: 100%; }
    .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: var(--radius-md); }

    /* ==================== CARDS ==================== */
    .card {
      background: white; border-radius: var(--radius-xl); padding: 1.5rem;
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      transition: var(--transition);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 12px;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 8px; }
    .card-subtitle { font-size: 0.8rem; color: var(--gray-500); margin-top: 4px; font-weight: 500; }

    /* ==================== STATS ==================== */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.2rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white; padding: 1.4rem; border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      transition: var(--transition); cursor: pointer;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 4px; height: 100%; background: var(--primary);
      border-radius: 0 4px 4px 0;
    }
    .stat-card:nth-child(2)::before { background: var(--success); }
    .stat-card:nth-child(3)::before { background: var(--warning); }
    .stat-card:nth-child(4)::before { background: var(--purple); }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .stat-icon {
      font-size: 1.8rem; margin-bottom: 0.6rem;
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: var(--radius-md);
      background: rgba(78,84,200,0.1); color: var(--primary);
    }
    .stat-card:nth-child(2) .stat-icon { background: rgba(0,176,155,0.1); color: var(--success); }
    .stat-card:nth-child(3) .stat-icon { background: rgba(244,107,69,0.1); color: var(--warning); }
    .stat-card:nth-child(4) .stat-icon { background: rgba(139,92,246,0.1); color: var(--purple); }
    .stat-value { font-size: 1.9rem; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px; line-height: 1.1; }
    .stat-label { color: var(--gray-500); font-size: 0.82rem; font-weight: 600; margin-top: 4px; }
    .stat-change { font-size: 0.72rem; margin-top: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--danger); }
    .stat-change.warning { color: var(--warning); }

    /* ==================== QUICK ACTIONS (#2) ==================== */
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .qa-card {
      background: white;
      border-radius: var(--radius-xl);
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      border: 1px solid var(--gray-200);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .qa-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary);
    }
    .qa-icon {
      width: 52px; height: 52px;
      border-radius: var(--radius-lg);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      color: white;
    }
    .qa-icon.primary { background: var(--gradient-primary); }
    .qa-icon.success { background: var(--gradient-success); }
    .qa-icon.warning { background: var(--gradient-warning); }
    .qa-icon.danger { background: var(--gradient-danger); }
    .qa-icon.info { background: var(--gradient-info); }
    .qa-icon.purple { background: var(--gradient-purple); }
    .qa-label { font-size: 0.85rem; font-weight: 700; color: var(--gray-800); }
    .qa-sub { font-size: 0.7rem; color: var(--gray-500); font-weight: 500; }

    /* ==================== GRIDS ==================== */
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem; margin-bottom: 1.5rem;
    }

    /* ==================== TABLES ==================== */
    .table-wrapper { overflow-x: auto; border-radius: var(--radius-md); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    thead th {
      background: var(--gray-50); padding: 12px 14px; text-align: left;
      font-weight: 700; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--gray-500);
      border-bottom: 2px solid var(--gray-200); white-space: nowrap;
    }
    tbody td {
      padding: 13px 14px; border-bottom: 1px solid var(--gray-100);
      font-size: 0.875rem; color: var(--gray-700); vertical-align: middle;
    }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--gray-50); }
    tbody tr:last-child td { border-bottom: none; }

    /* ==================== BADGES ==================== */
    .badge {
      padding: 4px 11px; border-radius: 20px; font-size: 0.68rem;
      font-weight: 700; display: inline-flex; align-items: center;
      gap: 4px; letter-spacing: 0.2px; white-space: nowrap;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }
    .badge-gray { background: var(--gray-200); color: var(--gray-600); }

    /* ==================== PROGRESS ==================== */
    .progress-bar { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; width: 100%; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .progress-fill.success { background: var(--gradient-success); }
    .progress-fill.warning { background: var(--gradient-warning); }
    .progress-fill.danger { background: var(--gradient-danger); }
    .progress-fill.info { background: var(--gradient-info); }

    /* ==================== AVATAR ==================== */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 0.85rem;
      flex-shrink: 0; background: var(--gradient-primary);
    }
    .avatar-sm { width: 32px; height: 32px; font-size: 0.7rem; }
    .avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }
    .user-cell { display: flex; align-items: center; gap: 12px; }
    .user-cell-info strong { display: block; font-size: 0.875rem; color: var(--gray-900); font-weight: 600; }
    .user-cell-info small { font-size: 0.72rem; color: var(--gray-500); }

    /* ==================== ACTIVITY ==================== */
    .activity-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--gray-100); }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 42px; height: 42px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .activity-icon.green { background: #d1fae5; color: #065f46; }
    .activity-icon.blue { background: #dbeafe; color: #1e40af; }
    .activity-icon.yellow { background: #fef3c7; color: #92400e; }
    .activity-icon.red { background: #fee2e2; color: #991b1b; }
    .activity-icon.purple { background: #ede9fe; color: #5b21b6; }
    .activity-content { flex: 1; min-width: 0; }
    .activity-content strong { display: block; font-size: 0.85rem; color: var(--gray-900); font-weight: 600; }
    .activity-content small { font-size: 0.75rem; color: var(--gray-500); }
    .activity-time { font-size: 0.7rem; color: var(--gray-400); white-space: nowrap; }

    /* ==================== EMPTY STATE ==================== */
    .empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--gray-400); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; display: block; }
    .empty-state p { font-size: 0.9rem; font-weight: 500; color: var(--gray-500); }
    .empty-state h4 { font-size: 1.05rem; color: var(--gray-700); margin-bottom: 6px; font-weight: 700; }

    /* ==================== MODAL ==================== */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.65);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      justify-content: center; align-items: center;
      z-index: 2000; padding: 20px;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .modal.active { display: flex; opacity: 1; }
    .modal-content {
      background: white; border-radius: var(--radius-2xl);
      padding: 0; max-width: 560px; width: 100%;
      max-height: 88vh; overflow-y: auto;
      animation: modalSlideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xl); scrollbar-width: thin;
    }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 1.4rem 1.6rem; background: var(--gradient-primary);
      color: white; display: flex; justify-content: space-between;
      align-items: center; border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      position: sticky; top: 0; z-index: 10;
    }
    .modal-header h3 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .modal-close {
      background: rgba(255,255,255,0.2); border: none; color: white;
      width: 34px; height: 34px; border-radius: 50%;
      font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); line-height: 1;
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); transform: rotate(90deg); }
    .modal-body { padding: 1.6rem; }

    /* ==================== LOADING MODAL (#7) ==================== */
    .loading-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.7);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      justify-content: center; align-items: center;
      z-index: 10000;
    }
    .loading-modal.active { display: flex; }
    .loading-modal-content {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2.5rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-xl);
      animation: modalSlideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 260px;
      max-width: 90vw;
    }
    .loading-spinner-xl {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(78,84,200,0.15);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loading-modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-900);
      text-align: center;
    }
    .loading-modal-sub {
      font-size: 0.8rem;
      color: var(--gray-500);
      text-align: center;
      margin-top: -10px;
    }

    /* ==================== FORMS ==================== */
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.82rem; color: var(--gray-700); }
    .form-group label .required { color: var(--danger); margin-left: 2px; }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-md);
      font-size: 0.9rem; transition: var(--transition);
      background: white; font-family: inherit; color: var(--gray-800);
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(78,84,200,0.1); }
    .form-control::placeholder { color: var(--gray-400); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-actions {
      display: flex; gap: 12px; margin-top: 1.4rem;
      padding-top: 1.2rem; border-top: 1px solid var(--gray-200);
    }
    .form-actions .btn { flex: 1; }
    .form-hint { font-size: 0.72rem; color: var(--gray-500); margin-top: 4px; }

    /* ==================== PAYMENT MODE PICKER (#6) ==================== */
    .payment-mode-grid {
      display: grid;

<script>
(function () {
  'use strict';

  // ---------- Error display ----------
  window.addEventListener('error', function (e) {
    console.error('[Global error]', e.error || e.message);
    showErrorOverlay(e.error ? (e.error.stack || e.error.message) : e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    console.error('[Unhandled promise]', e.reason);
    showErrorOverlay(e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
  });

  function showErrorOverlay(message) {
    const overlay = document.getElementById('errorOverlay');
    const details = document.getElementById('errorDetails');
    if (!overlay || !details) return;
    const pre = document.createElement('pre');
    pre.textContent = message || 'Unknown error';
    details.innerHTML = '';
    details.appendChild(pre);
    overlay.classList.add('active');
  }

  // ---------- Firebase config ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBhjgu6vpBRhMVjMs5RgSL4aViJq6GYy1A",
    authDomain: "budget-app-1365f.firebaseapp.com",
    databaseURL: "https://budget-app-1365f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "budget-app-1365f",
    storageBucket: "budget-app-1365f.firebasestorage.app",
    messagingSenderId: "1036194450411",
    appId: "1:1036194450411:web:78ca39a5a82ab9db6c67ae",
    measurementId: "G-YFFJL2H54X"
  };

  let db, auth;
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    db.enablePersistence({ synchronizeTabs: true }).catch(function (err) {
      if (err.code === 'failed-precondition') console.warn('Persistence failed: multiple tabs open');
      else if (err.code === 'unimplemented') console.warn('Persistence not supported');
    });
  } catch (err) {
    console.error('Firebase init failed:', err);
    showErrorOverlay('Firebase init failed: ' + (err.message || err));
  }

  // ---------- Page titles ----------
  const PAGE_TITLES = {
    dashboard: '📈 Dashboard Overview',
    inventory: '📦 Inventory Management',
    sales: '💰 Sales Orders',
    purchases: '🚚 Purchase Orders',
    employees: '👥 Employee Management',
    customers: '🤝 Customer Relations',
    suppliers: '🏭 Supplier Management',
    projects: '📋 Project Management',
    accounts: '💵 Financial Accounts',
    expenses: '🧾 Expense Tracking',
    reports: '📊 Analytics & Reports',
    gstreports: '🧾 GST Reconciliation',
    calendar: '📅 Calendar',
    documents: '📄 Document Repository',
    settings: '⚙️ Settings'
  };

  // ---------- State ----------
  const state = {
    company: null,
    companyDetails: null, // Extra company info from Firestore (phone, address, GST, etc.)
    user: null,
    currentPage: 'dashboard',
    cache: {
      inventory: [], sales: [], purchases: [], employees: [],
      customers: [], suppliers: [], projects: [],
      transactions: [], expenses: [], documents: [], walkin: []
    },
    pagination: {
      inventory: { page: 1, perPage: 10 },
      sales: { page: 1, perPage: 10 },
      purchases: { page: 1, perPage: 10 },
      employees: { page: 1, perPage: 10 },
      customers: { page: 1, perPage: 10 },
      suppliers: { page: 1, perPage: 10 },
      transactions: { page: 1, perPage: 10 },
      expenses: { page: 1, perPage: 10 },
      documents: { page: 1, perPage: 10 },
      walkin: { page: 1, perPage: 10 }
    },
    deleteTarget: null
  };

  // ---------- Renderer registry ----------
  const pageRenderers = {};
  function registerPageRenderer(name, fn) {
    pageRenderers[name] = fn;
    console.log('[Router] Registered renderer:', name);
  }

  // ---------- Navigate ----------
  function navigateTo(page) {
    state.currentPage = page;
    const titleEl = document.getElementById('pageTitle');
    if (titleEl) titleEl.textContent = PAGE_TITLES[page] || page;

    // Auto-close sidebar on mobile (#1)
    const sb = document.getElementById('sidebar');
    const ov = document.getElementById('sidebarOverlay');
    if (sb) sb.classList.remove('open');
    if (ov) ov.classList.remove('active');

    const container = document.getElementById('dynamicContent');
    container.innerHTML =
      '<div class="loading-block">' +
        '<div class="loading-spinner lg"></div>' +
        '<span>Loading ' + escapeHtml(PAGE_TITLES[page] || page) + '…</span>' +
      '</div>';

    const renderer = pageRenderers[page];
    if (typeof renderer === 'function') {
      try {
        renderer(container);
      } catch (err) {
        console.error('Renderer for "' + page + '" threw:', err);
        container.innerHTML =
          '<div class="card"><div class="empty-state">' +
            '<i class="fas fa-exclamation-triangle"></i>' +
            '<h4>Module error</h4>' +
            '<p>' + escapeHtml(err.message || 'Unknown') + '</p>' +
          '</div></div>';
        showErrorOverlay((err.stack || err.message || String(err)));
      }
    } else {
      container.innerHTML =
        '<div class="card"><div class="empty-state">' +
          '<i class="fas fa-tools"></i>' +
          '<h4>' + escapeHtml(PAGE_TITLES[page] || page) + '</h4>' +
          '<p>This module is not installed yet.</p>' +
        '</div></div>';
    }
  }

  // ---------- Utilities ----------
  function escapeHtml(text) {
    if (text == null) return '';
    return String(text).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function formatCurrency(amount) {
    const n = Number(amount) || 0;
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function formatDate(v) {
    if (!v) return 'N/A';
    let d;
    if (typeof v.toDate === 'function') d = v.toDate();
    else d = new Date(v);
    if (isNaN(d.getTime())) return 'N/A';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function getInitials(name) {
    if (!name) return '?';
    return String(name).trim().split(/\s+/).map(function (n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
  }

  // ---------- Toast ----------
  function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
    const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML =
      '<i class="fas ' + (icons[type] || icons.info) + ' toast-icon"></i>' +
      '<div class="toast-content"><div class="toast-title">' + (titles[type] || 'Info') + '</div>' +
      '<div class="toast-message">' + escapeHtml(message) + '</div></div>' +
      '<button class="toast-close" aria-label="Close">&times;</button>';
    toast.querySelector('.toast-close').addEventListener('click', function () { removeToast(toast); });
    container.appendChild(toast);
    setTimeout(function () { removeToast(toast); }, 4500);
  }

  function removeToast(toast) {
    if (!toast || !toast.parentElement) return;
    toast.classList.add('removing');
    setTimeout(function () {
      if (toast.parentElement) toast.parentElement.removeChild(toast);
    }, 300);
  }

  // ---------- Loading modal (#7) ----------
  function showLoading(title, subtitle) {
    const modal = document.getElementById('loadingModal');
    const titleEl = document.getElementById('loadingModalTitle');
    const subEl = document.getElementById('loadingModalSub');
    if (titleEl) titleEl.textContent = title || 'Loading…';
    if (subEl) subEl.textContent = subtitle || 'Please wait';
    if (modal) modal.classList.add('active');
  }

  function selectPaymentMode(modeId) {
    if (!window._paymentContext) return;
    window._paymentContext.mode = modeId;
    window._paymentContext.isSplit = false;

    // Highlight selected
    document.querySelectorAll('.payment-mode-option').forEach(function (el) {
      el.classList.toggle('selected', el.dataset.mode === modeId);
    });

    // Show split section if "split" chosen (special mode)
    const splitSection = document.getElementById('paymentSplitSection');
    if (modeId === 'split') {
      if (splitSection) splitSection.style.display = 'block';
      window._paymentContext.isSplit = true;
      if (window._paymentContext.splits.length === 0) {
        window._paymentContext.splits = [
          { mode: 'cash', amount: 0 },
          { mode: 'upi', amount: 0 }
        ];
      }
      renderSplitRows();
    } else {
      if (splitSection) splitSection.style.display = 'none';
    }
  }

  function addSplitRow() {
    if (!window._paymentContext) return;
    window._paymentContext.splits.push({ mode: 'cash', amount: 0 });
    renderSplitRows();
  }

  function removeSplitRow(idx) {
    if (!window._paymentContext) return;
    window._paymentContext.splits.splice(idx, 1);
    renderSplitRows();
  }

  function updateSplitValue(idx, field, value) {
    if (!window._paymentContext) return;
    if (!window._paymentContext.splits[idx]) return;
    if (field === 'mode') {
      window._paymentContext.splits[idx].mode = value;
    } else if (field === 'amount') {
      window._paymentContext.splits[idx].amount = Math.max(0, Number(value) || 0);
    }
    recalcSplitTotal();
  }

  function renderSplitRows() {
    const container = document.getElementById('paymentSplitRows');
    if (!container || !window._paymentContext) return;

    const splits = window._paymentContext.splits;
    const modeOpts = PAYMENT_MODES.map(function (m) {
      return '<option value="' + m.id + '">' + m.label + '</option>';
    }).join('');

    container.innerHTML = splits.map(function (s, idx) {
      const selectedOpts = PAYMENT_MODES.map(function (m) {
        return '<option value="' + m.id + '" ' + (s.mode === m.id ? 'selected' : '') + '>' + m.label + '</option>';
      }).join('');
      return '<div class="payment-split-row">' +
        '<select class="form-control" onchange="App.updateSplitValue(' + idx + ', \'mode\', this.value)">' + selectedOpts + '</select>' +
        '<input type="number" class="form-control" placeholder="Amount" value="' + (s.amount || 0) + '" min="0" step="0.01" oninput="App.updateSplitValue(' + idx + ', \'amount\', this.value)">' +
        '<button type="button" class="btn btn-sm btn-danger btn-icon" onclick="App.removeSplitRow(' + idx + ')" title="Remove"><i class="fas fa-times"></i></button>' +
      '</div>';
    }).join('');

    // Add "Split" mode option to the grid if not present
    const grid = document.getElementById('paymentModeGrid');
    if (grid && !grid.querySelector('[data-mode="split"]')) {
      const splitBtn = document.createElement('div');
      splitBtn.className = 'payment-mode-option';
      splitBtn.dataset.mode = 'split';
      splitBtn.onclick = function () { selectPaymentMode('split'); };
      splitBtn.innerHTML = '<i class="fas fa-divide"></i><span>Split</span>';
      grid.appendChild(splitBtn);
    }

    recalcSplitTotal();
  }

  function recalcSplitTotal() {
    if (!window._paymentContext) return;
    const total = window._paymentContext.splits.reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
    const target = window._paymentContext.total;
    const remaining = Math.max(0, target - total);

    const totalEl = document.getElementById('paymentSplitTotal');
    const remEl = document.getElementById('paymentSplitRemaining');
    if (totalEl) totalEl.textContent = formatCurrency(total);
    if (remEl) {
      remEl.textContent = formatCurrency(remaining);
      remEl.style.color = remaining > 0 ? 'var(--danger)' : 'var(--success)';
    }
  }

  function confirmPaymentMode() {
    if (!window._paymentContext) return;
    const ctx = window._paymentContext;

    if (!ctx.isSplit && !ctx.mode) {
      showToast('Select a payment mode', 'error');
      return;
    }

    const notesEl = document.getElementById('payment_notes');
    const notes = notesEl ? notesEl.value.trim() : '';

    let paymentData;
    if (ctx.isSplit) {
      const splitsTotal = ctx.splits.reduce(function (s, x) { return s + (Number(x.amount) || 0); }, 0);
      if (Math.abs(splitsTotal - ctx.total) > 0.01) {
        showToast('Split amounts must equal ' + formatCurrency(ctx.total) + ' (currently ' + formatCurrency(splitsTotal) + ')', 'error');
        return;
      }
      paymentData = {
        mode: 'split',
        splits: ctx.splits.map(function (s) { return { mode: s.mode, amount: Number(s.amount) || 0 }; }),
        total: ctx.total,
        notes: notes
      };
    } else {
      paymentData = {
        mode: ctx.mode,
        splits: [{ mode: ctx.mode, amount: ctx.total }],
        total: ctx.total,
        notes: notes
      };
    }

    // Add split option to picker if needed and save
    paymentData.modeLabel = PAYMENT_MODES.find(function (m) { return m.id === paymentData.mode; })?.label || paymentData.mode;

    if (typeof ctx.onConfirm === 'function') {
      ctx.onConfirm(paymentData);
    }

    window._paymentContext = null;
    closeGlobalModal();
    showToast('Payment recorded: ' + paymentData.modeLabel, 'success');
  }

  // ---------- PDF export (#6) ----------
  async function exportToPDF(elementId, filename, options) {
    options = options || {};
    const element = typeof elementId === 'string' ? document.getElementById(elementId) : elementId;
    if (!element) { showToast('Nothing to export', 'error'); return; }

    try {
      showLoading('Generating PDF…', 'This may take a few seconds');

      const canvas = await html2canvas(element, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false
      });

      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: options.orientation || 'portrait',
        unit: 'mm',
        format: options.format || 'a4'
      });

      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgWidth = pageWidth - 20;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 10;

      pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - 20);

      while (heightLeft >= 0) {
        position = heightLeft - imgHeight + 10;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
        heightLeft -= (pageHeight - 20);
      }

      pdf.save(filename || 'export.pdf');
      hideLoading();
      showToast('PDF downloaded', 'success');
    } catch (err) {
      console.error('[PDF] export error:', err);
      hideLoading();
      showToast('PDF export failed: ' + (err.message || 'Unknown'), 'error');
    }
  }

  // ---------- GST report builder (#5) ----------
  async function buildGSTReport(dateFrom, dateTo) {
    // Collect sales and purchases within date range
    const [salesSnap, purchSnap] = await Promise.all([
      companyCollection('sales').get(),
      companyCollection('purchases').get()
    ]);

    const sales = salesSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
    const purchases = purchSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

    function inRange(dateVal) {
      if (!dateFrom && !dateTo) return true;
      let d;
      if (typeof dateVal === 'object' && dateVal && typeof dateVal.toDate === 'function') d = dateVal.toDate();
      else d = new Date(dateVal);
      if (isNaN(d.getTime())) return false;
      if (dateFrom && d < new Date(dateFrom)) return false;
      if (dateTo && d > new Date(new Date(dateTo).getTime() + 86400000)) return false;
      return true;
    }

    const salesInRange = sales.filter(function (s) {
      return inRange(s.createdAt) && (s.status || '').toLowerCase() !== 'cancelled';
    });
    const purchasesInRange = purchases.filter(function (p) {
      return inRange(p.createdAt) && (p.status || '').toLowerCase() !== 'cancelled';
    });

    // Compute GST (assuming 18% default; each line may override)
    function computeLineGST(amount, rate) {
      rate = Number(rate) || 18;
      const base = Number(amount) || 0;
      return {
        base: base,
        rate: rate,
        cgst: base * (rate / 200),
        sgst: base * (rate / 200),
        total: base * (1 + rate / 100)
      };
    }

    const outputGST = salesInRange.reduce(function (sum, s) {
      const lines = Array.isArray(s.items) ? s.items : [];
      lines.forEach(function (it) {
        const lineTotal = Number(it.lineTotal) || (Number(it.qty) || 0) * (Number(it.price) || 0);
        const g = computeLineGST(lineTotal, it.gstRate);
        sum.base += g.base;
        sum.cgst += g.cgst;
        sum.sgst += g.sgst;
        sum.total += g.total;
      });
      return sum;
    }, { base: 0, cgst: 0, sgst: 0, total: 0 });

    const inputGST = purchasesInRange.reduce(function (sum, p) {
      const lines = Array.isArray(p.items) ? p.items : [];
      lines.forEach(function (it) {
        const lineTotal = Number(it.lineTotal) || (Number(it.qty) || 0) * (Number(it.price) || 0);
        const g = computeLineGST(lineTotal, it.gstRate);
        sum.base += g.base;
        sum.cgst += g.cgst;
        sum.sgst += g.sgst;
        sum.total += g.total;
      });
      return sum;
    }, { base: 0, cgst: 0, sgst: 0, total: 0 });

    const netGST = {
      cgst: outputGST.cgst - inputGST.cgst,
      sgst: outputGST.sgst - inputGST.sgst,
      total: outputGST.total - inputGST.total,
      cgstPayable: Math.max(0, outputGST.cgst - inputGST.cgst),
      sgstPayable: Math.max(0, outputGST.sgst - inputGST.sgst)
    };

    return {
      dateFrom: dateFrom || null,
      dateTo: dateTo || null,
      salesCount: salesInRange.length,
      purchasesCount: purchasesInRange.length,

  // ---------- Firestore helpers ----------
  function companyCollection(name) {
    if (!state.company) throw new Error('No company in state');
    return db.collection(name).where('companyId', '==', state.company.id);
  }

  function downloadCSV(rows, filename) {
    const csv = rows.map(function (r) {
      return r.map(function (cell) {
        const s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderPagination(containerId, pg, totalPages, goToFnName) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<button class="page-btn" ' + (pg.page === 1 ? 'disabled' : '') + ' onclick="App.' + goToFnName + '(' + (pg.page - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
        if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
        continue;
      }
      html += '<button class="page-btn ' + (i === pg.page ? 'active' : '') + '" onclick="App.' + goToFnName + '(' + i + ')">' + i + '</button>';
    }
    html += '<button class="page-btn" ' + (pg.page === totalPages ? 'disabled' : '') + ' onclick="App.' + goToFnName + '(' + (pg.page + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
    el.innerHTML = html;
  }

  function openDeleteConfirm() {
    const t = state.deleteTarget;
    if (!t) return;
    const html =
      '<div class="modal-header" style="background: var(--gradient-danger);">' +
        '<h3><i class="fas fa-trash-alt"></i> Confirm Delete</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal(); App.state.deleteTarget=null;">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<p style="margin-bottom: 1.4rem; font-size: 0.95rem; color: var(--gray-700);">' +
          'Are you sure you want to delete <strong>' + escapeHtml(t.label) + '</strong>? This action cannot be undone.' +
        '</p>' +
        '<div class="form-actions">' +
          '<button class="btn btn-outline" onclick="App.closeGlobalModal(); App.state.deleteTarget=null;">Cancel</button>' +
          '<button class="btn btn-danger" onclick="App.confirmDelete()"><i class="fas fa-trash"></i> Delete Permanently</button>' +
        '</div>' +
      '</div>';
    openGlobalModal(html);
  }

  async function confirmDelete() {
    const t = state.deleteTarget;
    if (!t) return;
    try {
      showLoading('Deleting…');
      await db.collection(t.collection).doc(t.id).delete();
      hideLoading();
      showToast('Deleted successfully', 'success');
      closeGlobalModal();
      state.deleteTarget = null;
      navigateTo(state.currentPage);
    } catch (err) {
      hideLoading();
      console.error('Delete error:', err);
      showToast('Failed to delete: ' + (err.message || 'Unknown'), 'error');
    }
  }

  // ---------- Session bootstrap ----------
  function bootstrap() {
    let companySession = null;
    try { companySession = JSON.parse(sessionStorage.getItem('activeCompany')); } catch (e) {}

        companySession.id = 'demo-company-' + localStorage.getItem('demoCompanyId');
      } else {
        companySession.id = 'demo-company-' + localStorage.getItem('demoCompanyId');
      }
      sessionStorage.setItem('activeCompany', JSON.stringify(companySession));
      sessionStorage.setItem('companyAuth', 'true');
      console.warn('[Bootstrap] No activeCompany — using demo workspace:', companySession.id);
      showToast('No company session found — using demo workspace', 'warning');
    }

    state.company = companySession;

    const sc = document.getElementById('sidebarCompany');
    const si = document.getElementById('sidebarIndustry');
    if (sc) sc.textContent = companySession.name || 'Company';
    if (si) si.textContent = companySession.type || 'Type';

    // Load company details from Firestore (async, non-blocking)
    loadCompanyDetails();

    let authHandled = false;
    function proceed(user) {
      if (authHandled) return;
      authHandled = true;
      state.user = user || { email: 'demo@budgetflow.app', uid: 'demo-user' };
      const ue = document.getElementById('userEmail');

    }

    if (auth) {

        console.warn('[Bootstrap] Auth timeout — proceeding without user');
        proceed(null);

      auth.onAuthStateChanged(function (user) {
        clearTimeout(fallback);
        proceed(user);
      }, function (err) {
        console.warn('[Bootstrap] Auth error:', err);
        clearTimeout(fallback);
        proceed(null);
      });
    } else {

  }

})();

  async function loadDashboardData() {
    try {
      App.showLoading('Loading dashboard…', 'Fetching your business data');

      const [invSnap, salesSnap, custSnap, expSnap, txSnap] = await Promise.all([
        App.companyCollection('inventory').get(),
        App.companyCollection('sales').get(),
        App.companyCollection('customers').get(),
        App.companyCollection('expenses').get(),
        App.companyCollection('transactions').get()
      ]);

      const inventory = invSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const sales = salesSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const expenses = expSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const transactions = txSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

      state.cache.inventory = inventory;
      state.cache.sales = sales;

      // Revenue
      const totalSales = sales
        .filter(function (s) { return (s.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (s, x) { return s + (Number(x.total) || 0); }, 0);

      // Other income (transactions type=income)
      const otherIncome = transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'income'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);

      // Expenses (expenses approved/paid + transactions type=expense)
      const expenseTotal = expenses
        .filter(function (e) { return ['approved', 'paid'].indexOf((e.status || '').toLowerCase()) !== -1; })
        .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0)
        + transactions
          .filter(function (t) { return (t.type || '').toLowerCase() === 'expense'; })
          .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);

      // Pending
      const pendingSales = sales.filter(function (s) { return (s.status || '').toLowerCase() === 'pending'; });

      // Sort recent sales
      sales.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      setText('statProducts', inventory.length);
      setText('statSales', formatCurrency(totalSales));
      setText('statIncome', formatCurrency(otherIncome));
      setText('statExpenses', formatCurrency(expenseTotal));
      setText('statCustomers', custSnap.size);
      setText('statPending', pendingSales.length);

                             : status === 'cancelled' ? 'badge-danger'
                             : 'badge-info';
            return '<tr>' +
              '<td><strong>#' + escapeHtml(sale.invoiceNo || sale.id.slice(-6).toUpperCase()) + '</strong></td>' +
              '<td>' + escapeHtml(sale.customerName || 'Walk-in') + '</td>' +
              '<td><strong>' + formatCurrency(sale.total) + '</strong></td>' +
              '<td><span class="badge ' + badgeClass + '">' + escapeHtml(sale.status || 'pending') + '</span></td>' +
              '</tr>';
          }).join('');
        }
      }

      // Low stock
      const lowBody = document.getElementById('lowStockBody');
      if (lowBody) {
        const lowStock = inventory
          .filter(function (p) { return (Number(p.stock) || 0) < 10; })
          .sort(function (a, b) { return (Number(a.stock) || 0) - (Number(b.stock) || 0); })
          .slice(0, 6);

        if (lowStock.length === 0) {
          lowBody.innerHTML = '<tr><td colspan="3"><div class="empty-state"><i class="fas fa-check-circle"></i><p>All items well stocked</p></div></td></tr>';
        } else {
          lowBody.innerHTML = lowStock.map(function (p) {
            const stock = Number(p.stock) || 0;
            const badgeClass = stock === 0 ? 'badge-danger' : 'badge-warning';
            const label = stock === 0 ? 'Out' : 'Low';
            return '<tr>' +
              '<td><strong>' + escapeHtml(p.name || 'Unnamed') + '</strong></td>' +
              '<td>' + stock + '</td>' +
              '<td><span class="badge ' + badgeClass + '">' + label + '</span></td>' +
              '</tr>';
          }).join('');
        }
      }

      // Activity feed
      renderActivityFeed(sales, inventory);
      App.hideLoading();
    } catch (err) {
      App.hideLoading();

  function timeAgo(dateVal) {
    if (!dateVal) return 'now';
    let d;
    if (typeof dateVal.toDate === 'function') d = dateVal.toDate();
    else d = new Date(dateVal);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  }
