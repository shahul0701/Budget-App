<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow | Inventory Pro Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ==================== DESIGN SYSTEM ==================== */
    :root {
      --primary: #4e54c8;
      --primary-light: #8f94fb;
      --success: #00b09b;
      --success-light: #96c93d;
      --warning: #f46b45;
      --warning-light: #eea849;
      --danger: #ff416c;
      --danger-light: #ff4b2b;
      --info: #3498db;
      --purple: #8b5cf6;
      --dark: #0f172a;
      --darker: #0b1220;
      --light: #f8fafc;
      --gray-50: #f9fafb;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;

      --gradient-warning: linear-gradient(135deg, #f46b45 0%, #eea849 100%);
      --gradient-danger: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --gradient-info: linear-gradient(135deg, #3498db 0%, #6dd5ed 100%);

      --header-height: 80px;

      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);

      --shadow-xl: 0 20px 50px rgba(0,0,0,0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    html { scroll-behavior: smooth; }

    .app-container { display: flex; min-height: 100vh; position: relative; }
    .sidebar { width: var(--sidebar-width); background: var(--gradient-sidebar); color: white; position: fixed; height: 100vh; left: 0; top: 0; z-index: 1000; display: flex; flex-direction: column; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 24px rgba(0,0,0,0.15); }
    .sidebar-brand { padding: 1.6rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .sidebar-brand h2 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; display: flex; align-items: center; gap: 8px; }
    .company-info { margin-top: 12px; padding: 10px 12px; background: rgba(255,255,255,0.08); border-radius: var(--radius-md); font-size: 0.8rem; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.06); }
    .company-info span:first-of-type { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
    .industry-badge { background: rgba(96,165,250,0.25); padding: 3px 10px; border-radius: 12px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; margin-left: auto; white-space: nowrap; color: #bfdbfe; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 1rem 0.8rem; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }
    .sidebar-nav::-webkit-scrollbar { width: 6px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .nav-section { margin-bottom: 1.4rem; }

    .nav-link::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--primary-light); transform: scaleY(0); transition: transform 0.25s ease; border-radius: 0 3px 3px 0; }

    .nav-link.active { background: rgba(96,165,250,0.18); color: white; font-weight: 600; }

    .nav-link .nav-badge { margin-left: auto; background: var(--danger); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; min-width: 20px; text-align: center; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .main-content { flex: 1; margin-left: var(--sidebar-width); padding: 1.5rem; min-height: 100vh; transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1); width: calc(100% - var(--sidebar-width)); }
    .top-header { background: white; padding: 1.1rem 1.5rem; border-radius: var(--radius-lg); display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); flex-wrap: wrap; gap: 1rem; position: sticky; top: 1.5rem; z-index: 100; border: 1px solid var(--gray-200); }

    .btn-success { background: var(--success); color: white; }

    .btn-danger { background: var(--danger); color: white; }

    .btn-purple { background: var(--purple); color: white; }

    .btn-lg { padding: 13px 26px; font-size: 0.95rem; border-radius: var(--radius-lg); }
    .btn-block { width: 100%; }
    .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: var(--radius-md); }
    .card { background: white; border-radius: var(--radius-xl); padding: 1.5rem; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); transition: var(--transition); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 12px; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 8px; }

    .stat-card { background: white; padding: 1.4rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); transition: var(--transition); cursor: pointer; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--primary); border-radius: 0 4px 4px 0; }

    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .stat-icon { font-size: 1.8rem; margin-bottom: 0.6rem; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: var(--radius-md); background: rgba(78,84,200,0.1); color: var(--primary); }
    .stat-card:nth-child(2) .stat-icon { background: rgba(0,176,155,0.1); color: var(--success); }
    .stat-card:nth-child(3) .stat-icon { background: rgba(244,107,69,0.1); color: var(--warning); }
    .stat-card:nth-child(4) .stat-icon { background: rgba(139,92,246,0.1); color: var(--purple); }

    .stat-label { color: var(--gray-500); font-size: 0.82rem; font-weight: 600; margin-top: 4px; }

    .stat-change.negative { color: var(--danger); }
    .stat-change.warning { color: var(--warning); }

    tbody td { padding: 13px 14px; border-bottom: 1px solid var(--gray-100); font-size: 0.875rem; color: var(--gray-700); vertical-align: middle; }

    .badge { padding: 4px 11px; border-radius: 20px; font-size: 0.68rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.2px; white-space: nowrap; }

    .avatar-sm { width: 32px; height: 32px; font-size: 0.7rem; }

    .user-cell-info small { font-size: 0.72rem; color: var(--gray-500); }

    .activity-icon.blue { background: #dbeafe; color: #1e40af; }
    .activity-icon.yellow { background: #fef3c7; color: #92400e; }
    .activity-icon.red { background: #fee2e2; color: #991b1b; }
    .activity-icon.purple { background: #ede9fe; color: #5b21b6; }

    .empty-state p { font-size: 0.9rem; font-weight: 500; color: var(--gray-500); }
    .empty-state h4 { font-size: 1.05rem; color: var(--gray-700); margin-bottom: 6px; font-weight: 700; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 2000; padding: 20px; opacity: 0; transition: opacity 0.25s ease; }
    .modal.active { display: flex; opacity: 1; }

    .modal-header h3 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }

<!-- ============================================================
     PART 1 — APPLICATION SHELL & INITIALIZATION
     ============================================================ -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBhjgu6vpBRhMVjMs5RgSL4aViJq6GYy1A",
    authDomain: "budget-app-1365f.firebaseapp.com",
    databaseURL: "https://budget-app-1365f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "budget-app-1365f",
    storageBucket: "budget-app-1365f.firebasestorage.app",
    messagingSenderId: "1036194450411",
    appId: "1:1036194450411:web:78ca39a5a82ab9db6c67ae",
    measurementId: "G-YFFJL2H54X"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  const state = {
    company: null, user: null, currentPage: 'dashboard',
    cache: { inventory: [], sales: [], purchases: [], employees: [], customers: [], suppliers: [], projects: [], transactions: [], expenses: [], documents: [] },
    pagination: {
      inventory: { page: 1, perPage: 10 }, sales: { page: 1, perPage: 10 }, purchases: { page: 1, perPage: 10 },
      employees: { page: 1, perPage: 10 }, customers: { page: 1, perPage: 10 }, suppliers: { page: 1, perPage: 10 },
      transactions: { page: 1, perPage: 10 }, expenses: { page: 1, perPage: 10 }, documents: { page: 1, perPage: 10 }
    },
    deleteTarget: null
  };

  const PAGE_TITLES = {
    dashboard: '📈 Dashboard Overview', inventory: '📦 Inventory Management', sales: '💰 Sales Orders',
    purchases: '🚚 Purchase Orders', employees: '👥 Employee Management', customers: '🤝 Customer Relations',
    suppliers: '🏭 Supplier Management', projects: '📋 Project Management', accounts: '💵 Financial Accounts',
    expenses: '🧾 Expense Tracking', reports: '📊 Analytics & Reports', calendar: '📅 Calendar',
    documents: '📄 Document Repository', settings: '⚙️ Settings'
  };

  function escapeHtml(text) {
    if (text == null) return '';
    return String(text).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  function formatCurrency(amount) {
    const n = Number(amount) || 0;
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }
  function formatDate(dateVal) {
    if (!dateVal) return 'N/A';
    let d;
    if (typeof dateVal.toDate === 'function') d = dateVal.toDate();
    else d = new Date(dateVal);
    if (isNaN(d.getTime())) return 'N/A';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function getInitials(name) {
    if (!name) return '?';
    return String(name).trim().split(/\s+/).map(function (n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
  }
  function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
    const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML =
      '<i class="fas ' + (icons[type] || icons.info) + ' toast-icon"></i>' +
      '<div class="toast-content"><div class="toast-title">' + (titles[type] || 'Info') + '</div>' +
      '<div class="toast-message">' + escapeHtml(message) + '</div></div>' +
      '<button class="toast-close" aria-label="Close">&times;</button>';
    toast.querySelector('.toast-close').addEventListener('click', function () { removeToast(toast); });
    container.appendChild(toast);
    setTimeout(function () { removeToast(toast); }, 4500);
  }
  function removeToast(toast) {
    if (!toast || !toast.parentElement) return;
    toast.classList.add('removing');
    setTimeout(function () { if (toast.parentElement) toast.parentElement.removeChild(toast); }, 300);
  }
  function openGlobalModal(htmlContent) {
    const modal = document.getElementById('globalModal');
    document.getElementById('modalContent').innerHTML = htmlContent;
    modal.classList.add('active');
  }
  function closeGlobalModal() { document.getElementById('globalModal').classList.remove('active'); }
  document.getElementById('globalModal').addEventListener('click', function (e) { if (e.target === this) closeGlobalModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeGlobalModal(); });

  function updateDateTime() {
    const el = document.getElementById('currentDateTime');
    if (!el) return;
    const now = new Date();
    el.textContent = now.toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function initSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const menuToggle = document.getElementById('menuToggle');
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }
    menuToggle.addEventListener('click', function () { if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar(); });
    overlay.addEventListener('click', closeSidebar);
    document.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () { if (window.innerWidth <= 768) closeSidebar(); });
    });
  }

  function setupNavigation() {
    document.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        const page = this.dataset.page;
        if (!page) return;
        document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });
        this.classList.add('active');
        navigateTo(page);
      });
    });
  }

  function navigateTo(page) {
    state.currentPage = page;
    const titleEl = document.getElementById('pageTitle');
    if (titleEl) titleEl.textContent = PAGE_TITLES[page] || page;
    const container = document.getElementById('dynamicContent');
    container.innerHTML = '<div class="loading-block"><div class="loading-spinner lg"></div><span>Loading ' + escapeHtml(PAGE_TITLES[page] || page) + '...</span></div>';
    if (typeof window.renderPage === 'function') {
      try { window.renderPage(page, container); }
      catch (err) {
        console.error('Page render error:', err);
        container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h4>Something went wrong</h4><p>' + escapeHtml(err.message || 'Unable to render page') + '</p></div></div>';
      }
    }
  }

  function handleLogout() {
    if (!confirm('Are you sure you want to sign out of this company workspace?')) return;
    sessionStorage.removeItem('activeCompany');
    sessionStorage.removeItem('companyAuth');
    auth.signOut().then(function () { window.location.href = 'dashboard.html'; }).catch(function () { window.location.href = 'dashboard.html'; });
  }

  function bootstrap() {
    let companySession = null;
    try { companySession = JSON.parse(sessionStorage.getItem('activeCompany')); } catch (e) { companySession = null; }
    if (!companySession || !sessionStorage.getItem('companyAuth')) { window.location.href = 'dashboard.html'; return; }
    state.company = companySession;
    document.getElementById('sidebarCompany').textContent = companySession.name || 'Company';
    document.getElementById('sidebarIndustry').textContent = companySession.type || 'Type';

    auth.onAuthStateChanged(function (user) {
      if (user) {
        state.user = user;
        document.getElementById('userEmail').innerHTML = '<i class="fas fa-user-circle"></i> ' + escapeHtml(user.email || 'User');
        initSidebar();
        setupNavigation();
        updateDateTime();
        setInterval(updateDateTime, 1000);
        navigateTo('dashboard');
      } else { window.location.href = 'index.html'; }
    });
  }
  document.addEventListener('DOMContentLoaded', bootstrap);

  window.BudgetFlow = {
    db: db, auth: auth, state: state,
    escapeHtml: escapeHtml, formatCurrency: formatCurrency, formatDate: formatDate,
    getInitials: getInitials, showToast: showToast,
    openGlobalModal: openGlobalModal, closeGlobalModal: closeGlobalModal,
    navigateTo: navigateTo, handleLogout: handleLogout, PAGE_TITLES: PAGE_TITLES
  };
</script>

<!-- ============================================================
     PART 2 — DASHBOARD + INVENTORY MODULES
     ============================================================ -->
<script>
(function () {
  'use strict';
  const BF = window.BudgetFlow;
  const db = BF.db;
  const state = BF.state;
  const { escapeHtml, formatCurrency, formatDate, getInitials, showToast } = BF;

  function companyCollection(name) { return db.collection(name).where('companyId', '==', state.company.id); }

  window.renderPage = function (page, container) {
    switch (page) {
      case 'dashboard': renderDashboard(container); break;
      case 'inventory': renderInventory(container); break;
      default:
        container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-tools"></i><h4>' + escapeHtml(BF.PAGE_TITLES[page] || page) + '</h4><p>This module will be wired up in a later part.</p></div></div>';
    }
  };

  function renderDashboard(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" id="dashboardStats">
        <div class="stat-card" onclick="BudgetFlow.navigateTo('inventory')">
          <div class="stat-icon"><i class="fas fa-boxes"></i></div>
          <div class="stat-value" id="statProducts">—</div><div class="stat-label">Total Products</div>
          <div class="stat-change positive"><i class="fas fa-check-circle"></i> In stock</div>
        </div>
        <div class="stat-card" onclick="BudgetFlow.navigateTo('sales')">
          <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
          <div class="stat-value" id="statSales">—</div><div class="stat-label">Total Sales</div>
          <div class="stat-change positive"><i class="fas fa-arrow-up"></i> Revenue tracked</div>
        </div>
        <div class="stat-card" onclick="BudgetFlow.navigateTo('customers')">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="statCustomers">—</div><div class="stat-label">Customers</div>
          <div class="stat-change positive"><i class="fas fa-user-check"></i> Active</div>
        </div>
        <div class="stat-card" onclick="BudgetFlow.navigateTo('sales')">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="statPending">—</div><div class="stat-label">Pending Orders</div>
          <div class="stat-change warning"><i class="fas fa-exclamation-triangle"></i> Needs attention</div>
        </div>
      </div>
      <div class="dashboard-grid fade-in">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-chart-line"></i> Recent Sales</div>
            <button class="btn btn-sm btn-primary" onclick="BudgetFlow.navigateTo('sales')">View All <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="table-wrapper"><table><thead><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody id="recentSalesBody"><tr><td colspan="4"><div class="loading-block"><div class="loading-spinner"></div><span>Loading…</span></div></td></tr></tbody></table></div>
        </div>
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-exclamation-triangle"></i> Low Stock Items</div>
            <button class="btn btn-sm btn-warning" onclick="BudgetFlow.navigateTo('inventory')">View All <i class="fas fa-arrow-right"></i></button>
          </div>
          <div class="table-wrapper"><table><thead><tr><th>Item</th><th>Stock</th><th>Status</th></tr></thead>
          <tbody id="lowStockBody"><tr><td colspan="3"><div class="loading-block"><div class="loading-spinner"></div><span>Loading…</span></div></td></tr></tbody></table></div>
        </div>
      </div>
      <div class="card fade-in">
        <div class="card-header"><div class="card-title"><i class="fas fa-clock"></i> Recent Activity</div></div>
        <div id="activityFeed"><div class="loading-block"><div class="loading-spinner"></div><span>Loading activity…</span></div></div>
      </div>`;
    loadDashboardData();
  }

  async function loadDashboardData() {
    try {
      const [invSnap, salesSnap, custSnap] = await Promise.all([
        companyCollection('inventory').get(), companyCollection('sales').get(), companyCollection('customers').get()
      ]);
      const inventory = invSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const sales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const totalSales = sales.reduce((s, sale) => s + (Number(sale.total) || 0), 0);
      const pendingSales = sales.filter(s => (s.status || '').toLowerCase() === 'pending');
      sales.sort((a, b) => {
        const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tb - ta;
      });
      setText('statProducts', inventory.length);
      setText('statSales', formatCurrency(totalSales));
      setText('statCustomers', custSnap.size);
      setText('statPending', pendingSales.length);

      const recentSalesBody = document.getElementById('recentSalesBody');
      if (recentSalesBody) {
        const recent = sales.slice(0, 5);
        if (recent.length === 0) {
          recentSalesBody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="fas fa-receipt"></i><p>No sales recorded yet</p></div></td></tr>';
        } else {
          recentSalesBody.innerHTML = recent.map(sale => {
            const status = (sale.status || 'pending').toLowerCase();
            const badgeClass = status === 'completed' ? 'badge-success' : status === 'pending' ? 'badge-warning' : status === 'cancelled' ? 'badge-danger' : 'badge-info';
            return `<tr><td><strong>#${escapeHtml(sale.invoiceNo || sale.id.slice(-6).toUpperCase())}</strong></td><td>${escapeHtml(sale.customerName || 'Walk-in')}</td><td><strong>${formatCurrency(sale.total)}</strong></td><td><span class="badge ${badgeClass}">${escapeHtml(sale.status || 'pending')}</span></td></tr>`;
          }).join('');
        }
      }
      const lowStockBody = document.getElementById('lowStockBody');
      if (lowStockBody) {
        const lowStock = inventory.filter(p => (Number(p.stock) || 0) < 10).sort((a, b) => (Number(a.stock) || 0) - (Number(b.stock) || 0)).slice(0, 6);
        if (lowStock.length === 0) {
          lowStockBody.innerHTML = '<tr><td colspan="3"><div class="empty-state"><i class="fas fa-check-circle"></i><p>All items well stocked</p></div></td></tr>';
        } else {
          lowStockBody.innerHTML = lowStock.map(p => {
            const stock = Number(p.stock) || 0;
            const badgeClass = stock === 0 ? 'badge-danger' : 'badge-warning';
            const label = stock === 0 ? 'Out' : 'Low';
            return `<tr><td><strong>${escapeHtml(p.name || 'Unnamed')}</strong></td><td>${stock}</td><td><span class="badge ${badgeClass}">${label}</span></td></tr>`;
          }).join('');
        }
      }
      renderActivityFeed(sales, inventory);
    } catch (err) {
      console.error('Dashboard load error:', err);
      showToast('Failed to load dashboard data', 'error');
    }
  }

  function renderActivityFeed(sales, inventory) {
    const feed = document.getElementById('activityFeed');
    if (!feed) return;
    const items = [];
    sales.slice(0, 4).forEach(s => {
      items.push({ icon: 'fa-shopping-cart', color: 'green', title: 'Sale recorded — ' + formatCurrency(s.total), subtitle: (s.customerName || 'Walk-in') + (s.invoiceNo ? ' • #' + s.invoiceNo : ''), time: s.createdAt });
    });
    inventory.slice(0, 3).forEach(p => {
      items.push({ icon: 'fa-box', color: 'blue', title: 'Product in catalog — ' + (p.name || 'Unnamed'), subtitle: 'Stock: ' + (Number(p.stock) || 0) + ' units', time: p.createdAt });
    });
    const lowCount = inventory.filter(p => (Number(p.stock) || 0) < 10).length;
    if (lowCount > 0) {
      items.unshift({ icon: 'fa-exclamation-triangle', color: 'yellow', title: lowCount + ' item(s) need restocking', subtitle: 'Check the Low Stock panel', time: null });
    }
    if (items.length === 0) {
      feed.innerHTML = '<div class="empty-state"><i class="fas fa-clock"></i><p>No activity yet — start by adding products or sales</p></div>';
      return;
    }
    feed.innerHTML = items.map(it => `<div class="activity-item"><div class="activity-icon ${it.color}"><i class="fas ${it.icon}"></i></div><div class="activity-content"><strong>${escapeHtml(it.title)}</strong><small>${escapeHtml(it.subtitle)}</small></div><div class="activity-time">${it.time ? timeAgo(it.time) : 'now'}</div></div>`).join('');
  }

  function timeAgo(dateVal) {
    if (!dateVal) return 'now';
    let d;
    if (typeof dateVal.toDate === 'function') d = dateVal.toDate();
    else d = new Date(dateVal);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  }

  let invFilters = { search: '', category: 'all' };

  function renderInventory(container) {
    container.innerHTML = `
      <div class="card fade-in">
        <div class="card-header">
          <div><div class="card-title"><i class="fas fa-boxes"></i> Product Inventory</div>
          <div class="card-subtitle">Manage products, stock levels, and pricing</div></div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="InventoryModule.openAdd()"><i class="fas fa-plus"></i> Add Product</button>
            <button class="btn btn-success" onclick="InventoryModule.exportCSV()"><i class="fas fa-download"></i> Export</button>
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar"><i class="fas fa-search"></i>
            <input type="text" id="invSearch" placeholder="Search by name, SKU, or category…" oninput="InventoryModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="invCategoryTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-cat="all" onclick="InventoryModule.setCategory('all')">All</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Stock</th><th>Price</th><th>Value</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="inventoryTableBody"><tr><td colspan="8"><div class="loading-block"><div class="loading-spinner"></div><span>Loading inventory…</span></div></td></tr></tbody></table>
        </div>
        <div class="pagination" id="inventoryPagination"></div>
      </div>`;
    loadInventory();
  }

  async function loadInventory() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;
    try {
      const snap = await companyCollection('inventory').get();
      state.cache.inventory = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      buildCategoryTabs();
      renderInventoryTable();
    } catch (err) {
      console.error('Inventory load error:', err);
      showToast('Failed to load inventory', 'error');
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load inventory</p></div></td></tr>';
    }
  }

  function buildCategoryTabs() {
    const tabs = document.getElementById('invCategoryTabs');
    if (!tabs) return;
    const cats = new Set();
    state.cache.inventory.forEach(p => { if (p.category && String(p.category).trim()) cats.add(String(p.category).trim()); });
    const list = ['all', ...Array.from(cats).sort()];
    tabs.innerHTML = list.map(cat => {
      const isActive = invFilters.category === cat ? 'active' : '';
      const label = cat === 'all' ? 'All' : escapeHtml(cat);
      return `<button class="filter-tab ${isActive}" data-cat="${escapeHtml(cat)}" onclick="InventoryModule.setCategory('${escapeHtml(cat)}')">${label}</button>`;
    }).join('');
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;
    let filtered = state.cache.inventory.slice();
    if (invFilters.category !== 'all') filtered = filtered.filter(p => String(p.category || '').trim() === invFilters.category);
    if (invFilters.search) {
      const q = invFilters.search.toLowerCase();
      filtered = filtered.filter(p => (p.name || '').toLowerCase().includes(q) || (p.sku || '').toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q));
    }
    filtered.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
    const pg = state.pagination.inventory;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-box-open"></i><h4>No products found</h4><p>' + (state.cache.inventory.length === 0 ? 'Add your first product to get started' : 'Try adjusting your search or filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(p => {
        const stock = Number(p.stock) || 0;
        const price = Number(p.price) || 0;
        const value = stock * price;
        const statusBadge = stock > 20 ? 'badge-success' : stock > 5 ? 'badge-warning' : stock > 0 ? 'badge-danger' : 'badge-gray';
        const statusLabel = stock > 20 ? 'In Stock' : stock > 5 ? 'Low' : stock > 0 ? 'Critical' : 'Out of Stock';
        return `<tr>
          <td><div class="user-cell"><div class="avatar avatar-sm">${getInitials(p.name)}</div><div class="user-cell-info"><strong>${escapeHtml(p.name || 'Unnamed')}</strong><small>${p.barcode ? 'Barcode: ' + escapeHtml(p.barcode) : 'ID: ' + p.id.slice(-6)}</small></div></div></td>
          <td>${escapeHtml(p.sku || '—')}</td><td>${escapeHtml(p.category || 'General')}</td>
          <td><strong>${stock}</strong></td><td>${formatCurrency(price)}</td><td><strong>${formatCurrency(value)}</strong></td>
          <td><span class="badge ${statusBadge}">${statusLabel}</span></td>
          <td><div class="d-flex gap-1">
            <button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="InventoryModule.openEdit('${p.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="InventoryModule.confirmDelete('${p.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    const pagEl = document.getElementById('inventoryPagination');
    if (pagEl) {
      if (totalPages <= 1) pagEl.innerHTML = '';
      else {
        let html = `<button class="page-btn" ${pg.page === 1 ? 'disabled' : ''} onclick="InventoryModule.goToPage(${pg.page - 1})"><i class="fas fa-chevron-left"></i></button>`;
        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
            if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
            continue;
          }
          html += `<button class="page-btn ${i === pg.page ? 'active' : ''}" onclick="InventoryModule.goToPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" ${pg.page === totalPages ? 'disabled' : ''} onclick="InventoryModule.goToPage(${pg.page + 1})"><i class="fas fa-chevron-right"></i></button>`;
        pagEl.innerHTML = html;
      }
    }
  }

  window.InventoryModule = {
    onSearch: function (val) { invFilters.search = val || ''; state.pagination.inventory.page = 1; renderInventoryTable(); },
    setCategory: function (cat) {
      invFilters.category = cat; state.pagination.inventory.page = 1;
      document.querySelectorAll('#invCategoryTabs .filter-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.cat === cat));
      renderInventoryTable();
    },
    goToPage: function (p) { state.pagination.inventory.page = p; renderInventoryTable(); },
    openAdd: function () { openInventoryForm(null); },
    openEdit: function (id) { const item = state.cache.inventory.find(p => p.id === id); if (item) openInventoryForm(item); },
    confirmDelete: function (id) {
      const item = state.cache.inventory.find(p => p.id === id);
      if (!item) return;
      state.deleteTarget = { collection: 'inventory', id: id, label: item.name || 'this product' };
      openDeleteConfirm();
    },
    save: async function (id) {
      const name = document.getElementById('inv_name').value.trim();
      const sku = document.getElementById('inv_sku').value.trim();
      const barcode = document.getElementById('inv_barcode').value.trim();
      const category = document.getElementById('inv_category').value.trim();
      const stock = Number(document.getElementById('inv_stock').value) || 0;
      const price = Number(document.getElementById('inv_price').value) || 0;
      const cost = Number(document.getElementById('inv_cost').value) || 0;
      if (!name) { showToast('Product name is required', 'error'); return; }
      if (price < 0 || stock < 0) { showToast('Stock and price cannot be negative', 'error'); return; }
      const payload = { name, sku, barcode, category: category || 'General', stock, price, cost, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('inventory').doc(id).update(payload); showToast('Product updated successfully', 'success'); }
        else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('inventory').add(payload);
          showToast('Product added successfully', 'success');
        }
        BF.closeGlobalModal();
        loadInventory();
      } catch (err) { console.error('Save inventory error:', err); showToast('Failed to save product: ' + (err.message || 'Unknown error'), 'error'); }
    },
    exportCSV: function () {
      if (state.cache.inventory.length === 0) { showToast('No products to export', 'warning'); return; }
      const rows = [['Name', 'SKU', 'Category', 'Stock', 'Price', 'Cost', 'Value', 'Barcode']];
      state.cache.inventory.forEach(p => {
        const stock = Number(p.stock) || 0; const price = Number(p.price) || 0;
        rows.push([p.name || '', p.sku || '', p.category || '', stock, price, Number(p.cost) || 0, stock * price, p.barcode || '']);
      });
      downloadCSV(rows, 'inventory_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Inventory exported successfully', 'success');
    }
  };

  function openInventoryForm(item) {
    const isEdit = !!item;
    const v = isEdit ? item : {};
    const html = `
      <div class="modal-header">
        <h3><i class="fas fa-${isEdit ? 'edit' : 'plus-circle'}"></i> ${isEdit ? 'Edit Product' : 'Add New Product'}</h3>
        <button class="modal-close" onclick="BudgetFlow.closeGlobalModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="inventoryForm" onsubmit="return false;">
          <div class="form-group"><label>Product Name <span class="required">*</span></label>
            <input type="text" class="form-control" id="inv_name" value="${escapeHtml(v.name || '')}" placeholder="e.g. Wireless Mouse" required></div>
          <div class="form-row">
            <div class="form-group"><label>SKU</label><input type="text" class="form-control" id="inv_sku" value="${escapeHtml(v.sku || '')}" placeholder="e.g. WM-001"></div>
            <div class="form-group"><label>Barcode</label><input type="text" class="form-control" id="inv_barcode" value="${escapeHtml(v.barcode || '')}" placeholder="Optional"></div>
          </div>
          <div class="form-group"><label>Category</label>
            <input type="text" class="form-control" id="inv_category" value="${escapeHtml(v.category || '')}" placeholder="e.g. Electronics" list="invCategoryList">
            <datalist id="invCategoryList">${Array.from(new Set(state.cache.inventory.map(p => p.category).filter(Boolean))).map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist></div>
          <div class="form-row">
            <div class="form-group"><label>Stock Quantity <span class="required">*</span></label>
              <input type="number" class="form-control" id="inv_stock" value="${Number(v.stock) || 0}" min="0" step="1" required></div>
            <div class="form-group"><label>Unit Price (₹) <span class="required">*</span></label>
              <input type="number" class="form-control" id="inv_price" value="${Number(v.price) || 0}" min="0" step="0.01" required></div>
          </div>
          <div class="form-group"><label>Cost Price (₹)</label>
            <input type="number" class="form-control" id="inv_cost" value="${Number(v.cost) || 0}" min="0" step="0.01">
            <div class="form-hint">Used to calculate profit margins</div></div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>
            <button type="button" class="btn btn-success" onclick="InventoryModule.save(${isEdit ? `'${item.id}'` : 'null'})">
              <i class="fas fa-save"></i> ${isEdit ? 'Update' : 'Save'} Product</button>
          </div>
        </form>
      </div>`;
    BF.openGlobalModal(html);
  }

  function openDeleteConfirm() {
    const t = state.deleteTarget;
    if (!t) return;
    const html = `
      <div class="modal-header" style="background: var(--gradient-danger);">
        <h3><i class="fas fa-trash-alt"></i> Confirm Delete</h3>
        <button class="modal-close" onclick="BudgetFlow.closeGlobalModal(); BudgetFlow.state.deleteTarget=null;">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom: 1.4rem; font-size: 0.95rem; color: var(--gray-700);">
          Are you sure you want to delete <strong>${escapeHtml(t.label)}</strong>? This action cannot be undone.</p>
        <div class="form-actions">
          <button class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal(); BudgetFlow.state.deleteTarget=null;">Cancel</button>
          <button class="btn btn-danger" onclick="SharedModule.confirmDelete()"><i class="fas fa-trash"></i> Delete Permanently</button>
        </div>
      </div>`;
    BF.openGlobalModal(html);
  }

  window.SharedModule = {
    confirmDelete: async function () {
      const t = state.deleteTarget;
      if (!t) return;
      try {
        await db.collection(t.collection).doc(t.id).delete();
        showToast('Deleted successfully', 'success');
        BF.closeGlobalModal();
        state.deleteTarget = null;
        if (state.currentPage === 'inventory') loadInventory();
        else if (state.currentPage === 'dashboard') loadDashboardData();
      } catch (err) {
        console.error('Delete error:', err);
        showToast('Failed to delete: ' + (err.message || 'Unknown error'), 'error');
      }
    }
  };

  function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }
  function downloadCSV(rows, filename) {
    const csv = rows.map(r => r.map(cell => { const s = String(cell == null ? '' : cell); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  BF.companyCollection = companyCollection;
  BF.downloadCSV = downloadCSV;
  BF.openDeleteConfirm = openDeleteConfirm;
  BF.timeAgo = timeAgo;
  BF.renderInventoryTable = renderInventoryTable;
  BF.loadInventory = loadInventory;
  BF.loadDashboardData = loadDashboardData;
  console.log('[Part 2] Dashboard + Inventory modules loaded ✓');
})();
</script>

<!-- ============================================================
     PART 3 — SALES + PURCHASES MODULES
     ============================================================ -->
<script>
(function () {
  'use strict';
  const BF = window.BudgetFlow;
  const db = BF.db;
  const state = BF.state;
  const { escapeHtml, formatCurrency, formatDate, showToast, getInitials } = BF;

  const prevRenderPage = window.renderPage;
  window.renderPage = function (page, container) {
    switch (page) {
      case 'sales': renderSales(container); break;
      case 'purchases': renderPurchases(container); break;
      default:
        if (typeof prevRenderPage === 'function') prevRenderPage(page, container);
        else container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-tools"></i><p>Module not yet loaded</p></div></div>';
    }
  };

  const salesFilters = { search: '', status: 'all' };

  function renderSales(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-receipt"></i></div><div class="stat-value" id="salesStatCount">—</div><div class="stat-label">Total Orders</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div><div class="stat-value" id="salesStatRevenue">—</div><div class="stat-label">Revenue</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-value" id="salesStatPending">—</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="salesStatCompleted">—</div><div class="stat-label">Completed</div></div>
      </div>
      <div class="card fade-in">
        <div class="card-header">
          <div><div class="card-title"><i class="fas fa-shopping-cart"></i> Sales Orders</div>
          <div class="card-subtitle">Create invoices, track payments, and manage order status</div></div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="SalesModule.openNew()"><i class="fas fa-plus"></i> New Sale</button>
            <button class="btn btn-success" onclick="SalesModule.exportCSV()"><i class="fas fa-download"></i> Export</button>
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar"><i class="fas fa-search"></i>
            <input type="text" id="salesSearch" placeholder="Search by invoice or customer…" oninput="SalesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="salesStatusTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-status="all" onclick="SalesModule.setStatus('all')">All</button>
            <button class="filter-tab" data-status="pending" onclick="SalesModule.setStatus('pending')">Pending</button>
            <button class="filter-tab" data-status="completed" onclick="SalesModule.setStatus('completed')">Completed</button>
            <button class="filter-tab" data-status="cancelled" onclick="SalesModule.setStatus('cancelled')">Cancelled</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table><thead><tr><th>Invoice #</th><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="salesTableBody"><tr><td colspan="7"><div class="loading-block"><div class="loading-spinner"></div><span>Loading sales…</span></div></td></tr></tbody></table>
        </div>
        <div class="pagination" id="salesPagination"></div>
      </div>`;
    loadSales();
  }

  async function loadSales() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('sales').get();
      state.cache.sales = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.sales.sort((a, b) => {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });
      const totalOrders = state.cache.sales.length;
      const revenue = state.cache.sales.filter(s => (s.status || '').toLowerCase() !== 'cancelled').reduce((sum, s) => sum + (Number(s.total) || 0), 0);
      const pending = state.cache.sales.filter(s => (s.status || 'pending').toLowerCase() === 'pending').length;
      const completed = state.cache.sales.filter(s => (s.status || '').toLowerCase() === 'completed').length;
      setText('salesStatCount', totalOrders); setText('salesStatRevenue', formatCurrency(revenue));
      setText('salesStatPending', pending); setText('salesStatCompleted', completed);
      renderSalesTable();
    } catch (err) {
      console.error('Load sales error:', err);
      showToast('Failed to load sales', 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load sales</p></div></td></tr>';
    }
  }

  function renderSalesTable() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;
    let filtered = state.cache.sales.slice();
    if (salesFilters.status !== 'all') filtered = filtered.filter(s => (s.status || 'pending').toLowerCase() === salesFilters.status);
    if (salesFilters.search) {
      const q = salesFilters.search.toLowerCase();
      filtered = filtered.filter(s => (s.invoiceNo || '').toLowerCase().includes(q) || (s.customerName || '').toLowerCase().includes(q) || (s.id || '').toLowerCase().includes(q));
    }
    const pg = state.pagination.sales;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-receipt"></i><h4>No sales found</h4><p>' + (state.cache.sales.length === 0 ? 'Create your first sale to get started' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(s => {
        const status = (s.status || 'pending').toLowerCase();
        const badgeClass = status === 'completed' ? 'badge-success' : status === 'pending' ? 'badge-warning' : status === 'cancelled' ? 'badge-danger' : 'badge-info';
        const itemsCount = Array.isArray(s.items) ? s.items.length : (Number(s.items) || 0);
        const dateStr = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        return `<tr>
          <td><strong style="color:var(--primary);cursor:pointer;" onclick="SalesModule.viewInvoice('${s.id}')">#${escapeHtml(s.invoiceNo || s.id.slice(-6).toUpperCase())}</strong></td>
          <td>${escapeHtml(s.customerName || 'Walk-in')}</td><td>${itemsCount}</td>
          <td><strong>${formatCurrency(s.total)}</strong></td><td>${dateStr}</td>
          <td><span class="badge ${badgeClass}">${escapeHtml(s.status || 'pending')}</span></td>
          <td><div class="d-flex gap-1">
            ${status === 'pending' ? `<button class="btn btn-sm btn-success" title="Mark Complete" onclick="SalesModule.complete('${s.id}')"><i class="fas fa-check"></i></button>
              <button class="btn btn-sm btn-warning" title="Cancel" onclick="SalesModule.cancel('${s.id}')"><i class="fas fa-times"></i></button>`
              : `<button class="btn btn-sm btn-icon btn-info" title="View" onclick="SalesModule.viewInvoice('${s.id}')"><i class="fas fa-eye"></i></button>`}
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="SalesModule.confirmDelete('${s.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('salesPagination', pg, totalPages, 'SalesModule.goToPage');
  }

  window.SalesModule = {
    onSearch: function (val) { salesFilters.search = val || ''; state.pagination.sales.page = 1; renderSalesTable(); },
    setStatus: function (status) {
      salesFilters.status = status; state.pagination.sales.page = 1;
      document.querySelectorAll('#salesStatusTabs .filter-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.status === status));
      renderSalesTable();
    },
    goToPage: function (p) { state.pagination.sales.page = p; renderSalesTable(); },
    openNew: function () { openSaleForm(); },
    viewInvoice: function (id) { const sale = state.cache.sales.find(s => s.id === id); if (sale) openInvoiceView(sale); },
    complete: async function (id) {
      const sale = state.cache.sales.find(s => s.id === id);
      if (!sale) return;
      if (!confirm('Mark this sale as completed? Stock will be deducted from inventory.')) return;
      try {
        const items = Array.isArray(sale.items) ? sale.items : [];
        for (const item of items) {
          if (!item.productId) continue;
          const prodRef = db.collection('inventory').doc(item.productId);
          const prodSnap = await prodRef.get();
          if (prodSnap.exists) {
            const currentStock = Number(prodSnap.data().stock) || 0;
            const newStock = Math.max(0, currentStock - (Number(item.qty) || 0));
            await prodRef.update({ stock: newStock });
          }
        }
        await db.collection('sales').doc(id).update({ status: 'completed', completedAt: firebase.firestore.FieldValue.serverTimestamp() });
        showToast('Sale completed and stock updated', 'success');
        loadSales();
      } catch (err) { console.error('Complete sale error:', err); showToast('Failed to complete sale: ' + (err.message || 'Unknown'), 'error'); }
    },
    cancel: async function (id) {
      if (!confirm('Cancel this sale? This cannot be undone.')) return;
      try {
        await db.collection('sales').doc(id).update({ status: 'cancelled', cancelledAt: firebase.firestore.FieldValue.serverTimestamp() });
        showToast('Sale cancelled', 'success'); loadSales();
      } catch (err) { console.error('Cancel sale error:', err); showToast('Failed to cancel: ' + (err.message || 'Unknown'), 'error'); }
    },
    confirmDelete: function (id) {
      const sale = state.cache.sales.find(s => s.id === id);
      if (!sale) return;
      state.deleteTarget = { collection: 'sales', id: id, label: 'Invoice #' + (sale.invoiceNo || id.slice(-6).toUpperCase()) };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadSales(); };
    },
    exportCSV: function () {
      if (state.cache.sales.length === 0) { showToast('No sales to export', 'warning'); return; }
      const rows = [['Invoice', 'Customer', 'Items', 'Total', 'Status', 'Date']];
      state.cache.sales.forEach(s => {
        const dateStr = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN') : '';

      });
      BF.downloadCSV(rows, 'sales_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Sales exported successfully', 'success');
    }

  async function ensureSaleFormData() {
    if (!state.cache.customers || state.cache.customers.length === 0) {
      try { const snap = await BF.companyCollection('customers').get(); state.cache.customers = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}
    }
    if (!state.cache.inventory || state.cache.inventory.length === 0) {
      try { const snap = await BF.companyCollection('inventory').get(); state.cache.inventory = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}

  function refreshSaleCustomerOptions() {
    const sel = document.getElementById('sale_customer');
    if (!sel || !state.cache.customers) return;
    const currentVal = sel.value;
    const opts = ['<option value="walkin">Walk-in Customer</option>'];
    state.cache.customers.forEach(c => opts.push(`<option value="${c.id}">${escapeHtml(c.name)}${c.company ? ' — ' + escapeHtml(c.company) : ''}</option>`));
    sel.innerHTML = opts.join('');

  function renderSaleLineItems() {
    const container = document.getElementById('saleLineItems');
    if (!container) return;
    const products = state.cache.inventory || [];
    const productOptions = products.length
      ? products.map(p => `<option value="${p.id}" data-price="${Number(p.price) || 0}" data-stock="${Number(p.stock) || 0}" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)} — ₹${Number(p.price) || 0} (${Number(p.stock) || 0} in stock)</option>`).join('')
      : '<option value="">— No products in inventory —</option>';
    container.innerHTML = saleLineItems.map((item, idx) => `
      <div class="d-flex gap-1 mb-1" style="align-items:center;flex-wrap:wrap;" data-line="${idx}">
        <select class="form-control" style="flex:2;min-width:180px;" onchange="SalesModule.updateLine(${idx}, 'product', this.value)">
          <option value="">— Select product —</option>${productOptions}</select>
        <input type="number" class="form-control" style="flex:0 0 80px;" placeholder="Qty" min="1" step="1" value="${item.qty || 1}" oninput="SalesModule.updateLine(${idx}, 'qty', this.value)">
        <input type="number" class="form-control" style="flex:0 0 100px;" placeholder="Price" min="0" step="0.01" value="${item.price || 0}" oninput="SalesModule.updateLine(${idx}, 'price', this.value)">
        <button class="btn btn-sm btn-danger btn-icon" onclick="SalesModule.removeLine(${idx})" title="Remove"><i class="fas fa-times"></i></button>
      </div>`).join('');
    saleLineItems.forEach((item, idx) => {
      const sel = container.querySelector(`[data-line="${idx}"] select`);
      if (sel && item.productId) sel.value = item.productId;
    });
    SalesModule.recalc();
  }

  SalesModule.addLine = function () { saleLineItems.push({ productId: '', name: '', qty: 1, price: 0 }); renderSaleLineItems(); };
  SalesModule.removeLine = function (idx) { if (saleLineItems.length <= 1) { showToast('At least one line item required', 'warning'); return; } saleLineItems.splice(idx, 1); renderSaleLineItems(); };
  SalesModule.updateLine = function (idx, field, value) {
    if (!saleLineItems[idx]) return;
    if (field === 'product') {
      saleLineItems[idx].productId = value;
      const prod = (state.cache.inventory || []).find(p => p.id === value);
      if (prod) { saleLineItems[idx].name = prod.name || ''; saleLineItems[idx].price = Number(prod.price) || 0; }
      renderSaleLineItems();
    } else if (field === 'qty') { saleLineItems[idx].qty = Math.max(1, Number(value) || 1); SalesModule.recalc(); }
    else if (field === 'price') { saleLineItems[idx].price = Math.max(0, Number(value) || 0); SalesModule.recalc(); }
  };
  SalesModule.recalc = function () {
    const subtotal = saleLineItems.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
    const discount = Number(document.getElementById('sale_discount')?.value) || 0;
    const total = Math.max(0, subtotal - discount);
    const subEl = document.getElementById('saleSubtotal'); const totEl = document.getElementById('saleTotal');
    if (subEl) subEl.textContent = formatCurrency(subtotal);
    if (totEl) totEl.textContent = formatCurrency(total);
  };

  SalesModule.save = async function () {
    const customerVal = document.getElementById('sale_customer')?.value || 'walkin';
    const discount = Number(document.getElementById('sale_discount')?.value) || 0;
    const validItems = saleLineItems.filter(it => it.productId && Number(it.qty) > 0);
    if (validItems.length === 0) { showToast('Add at least one product to the sale', 'error'); return; }
    for (const it of validItems) {
      const prod = (state.cache.inventory || []).find(p => p.id === it.productId);
      if (prod && Number(it.qty) > Number(prod.stock || 0)) {
        showToast(`Insufficient stock for "${prod.name}" (have ${prod.stock}, need ${it.qty})`, 'error');
        return;
      }
    }
    let customerName = 'Walk-in Customer'; let customerId = '';
    if (customerVal !== 'walkin') {
      const cust = (state.cache.customers || []).find(c => c.id === customerVal);
      if (cust) { customerName = cust.name; customerId = cust.id; }
    }
    const subtotal = validItems.reduce((sum, it) => sum + it.qty * it.price, 0);
    const total = Math.max(0, subtotal - discount);
    const invoiceNo = await generateInvoiceNo();
    const payload = {
      companyId: state.company.id, invoiceNo, customerId, customerName,
      items: validItems.map(it => ({ productId: it.productId, name: it.name, qty: it.qty, price: it.price, lineTotal: it.qty * it.price })),
      subtotal, discount, total, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    try { await db.collection('sales').add(payload); showToast('Sale created — #' + invoiceNo, 'success'); BF.closeGlobalModal(); loadSales(); }
    catch (err) { console.error('Save sale error:', err); showToast('Failed to save sale: ' + (err.message || 'Unknown'), 'error'); }
  };

  async function generateInvoiceNo() {
    const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = `INV-${y}${m}-`;
    const snap = await BF.companyCollection('sales').get();
    let maxSeq = 0;
    snap.forEach(doc => { const inv = doc.data().invoiceNo || ''; if (inv.startsWith(prefix)) { const seq = parseInt(inv.slice(prefix.length), 10); if (!isNaN(seq) && seq > maxSeq) maxSeq = seq; } });
    return prefix + String(maxSeq + 1).padStart(4, '0');
  }

  async function loadPurchases() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('purchases').get();
      state.cache.purchases = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.purchases.sort((a, b) => {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });
      const totalCount = state.cache.purchases.length;
      const totalValue = state.cache.purchases.filter(p => (p.status || '').toLowerCase() !== 'cancelled').reduce((sum, p) => sum + (Number(p.total) || 0), 0);
      const pending = state.cache.purchases.filter(p => (p.status || 'pending').toLowerCase() === 'pending').length;
      const received = state.cache.purchases.filter(p => (p.status || '').toLowerCase() === 'received').length;
      setText('purchStatCount', totalCount); setText('purchStatValue', formatCurrency(totalValue));
      setText('purchStatPending', pending); setText('purchStatReceived', received);
      renderPurchasesTable();
    } catch (err) {
      console.error('Load purchases error:', err);
      showToast('Failed to load purchases', 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load purchases</p></div></td></tr>';
    }
  }

  function renderPurchasesTable() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;
    let filtered = state.cache.purchases.slice();
    if (purchFilters.status !== 'all') filtered = filtered.filter(p => (p.status || 'pending').toLowerCase() === purchFilters.status);
    if (purchFilters.search) {
      const q = purchFilters.search.toLowerCase();
      filtered = filtered.filter(p => (p.poNo || '').toLowerCase().includes(q) || (p.supplierName || '').toLowerCase().includes(q) || (p.id || '').toLowerCase().includes(q));
    }
    const pg = state.pagination.purchases;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-truck"></i><h4>No purchase orders</h4><p>' + (state.cache.purchases.length === 0 ? 'Create your first purchase order' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(p => {
        const status = (p.status || 'pending').toLowerCase();
        const badgeClass = status === 'received' ? 'badge-success' : status === 'pending' ? 'badge-warning' : status === 'cancelled' ? 'badge-danger' : 'badge-info';
        const itemsCount = Array.isArray(p.items) ? p.items.length : (Number(p.items) || 0);
        const dateStr = p.createdAt ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
        return `<tr>
          <td><strong style="color:var(--primary);cursor:pointer;" onclick="PurchasesModule.viewPO('${p.id}')">#${escapeHtml(p.poNo || p.id.slice(-6).toUpperCase())}</strong></td>
          <td>${escapeHtml(p.supplierName || '—')}</td><td>${itemsCount}</td>
          <td><strong>${formatCurrency(p.total)}</strong></td><td>${dateStr}</td>
          <td><span class="badge ${badgeClass}">${escapeHtml(p.status || 'pending')}</span></td>
          <td><div class="d-flex gap-1">
            ${status === 'pending' ? `<button class="btn btn-sm btn-success" title="Receive Stock" onclick="PurchasesModule.receive('${p.id}')"><i class="fas fa-check"></i> Receive</button>`
              : `<button class="btn btn-sm btn-icon btn-info" title="View" onclick="PurchasesModule.viewPO('${p.id}')"><i class="fas fa-eye"></i></button>`}
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="PurchasesModule.confirmDelete('${p.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('purchasesPagination', pg, totalPages, 'PurchasesModule.goToPage');
  }

  window.PurchasesModule = {
    onSearch: function (val) { purchFilters.search = val || ''; state.pagination.purchases.page = 1; renderPurchasesTable(); },
    setStatus: function (status) {
      purchFilters.status = status; state.pagination.purchases.page = 1;
      document.querySelectorAll('#purchStatusTabs .filter-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.status === status));
      renderPurchasesTable();
    },
    goToPage: function (p) { state.pagination.purchases.page = p; renderPurchasesTable(); },
    openNew: function () { openPurchaseForm(); },
    viewPO: function (id) { const po = state.cache.purchases.find(p => p.id === id); if (po) openPOView(po); },
    receive: async function (id) {
      const po = state.cache.purchases.find(p => p.id === id);
      if (!po) return;
      if (!confirm('Mark this PO as received? Stock will be added to inventory.')) return;
      try {
        const items = Array.isArray(po.items) ? po.items : [];
        for (const item of items) {
          if (!item.productId) continue;
          const prodRef = db.collection('inventory').doc(item.productId);
          const prodSnap = await prodRef.get();
          if (prodSnap.exists) {
            const currentStock = Number(prodSnap.data().stock) || 0;
            const newStock = currentStock + (Number(item.qty) || 0);
            const updates = { stock: newStock };
            if (Number(item.price) > 0) updates.cost = Number(item.price);
            await prodRef.update(updates);
          }
        }
        await db.collection('purchases').doc(id).update({ status: 'received', receivedAt: firebase.firestore.FieldValue.serverTimestamp() });
        showToast('Purchase received and stock updated', 'success');
        loadPurchases();
      } catch (err) { console.error('Receive PO error:', err); showToast('Failed to receive: ' + (err.message || 'Unknown'), 'error'); }
    },
    confirmDelete: function (id) {
      const po = state.cache.purchases.find(p => p.id === id);
      if (!po) return;
      state.deleteTarget = { collection: 'purchases', id: id, label: 'PO #' + (po.poNo || id.slice(-6).toUpperCase()) };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadPurchases(); };
    },
    exportCSV: function () {
      if (state.cache.purchases.length === 0) { showToast('No purchases to export', 'warning'); return; }
      const rows = [['PO', 'Supplier', 'Items', 'Total', 'Status', 'Date']];
      state.cache.purchases.forEach(p => {
        const dateStr = p.createdAt ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN') : '';
        rows.push([p.poNo || p.id.slice(-6).toUpperCase(), p.supplierName || '', Array.isArray(p.items) ? p.items.length : (Number(p.items) || 0), Number(p.total) || 0, p.status || 'pending', dateStr]);
      });
      BF.downloadCSV(rows, 'purchases_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Purchases exported successfully', 'success');
    }
  };
