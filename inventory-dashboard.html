        <div class="form-actions">
          <button class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>
          <button class="btn btn-success" onclick="PurchasesModule.save()"><i class="fas fa-save"></i> Create PO</button>
        </div>
      </div>`;
    BF.openGlobalModal(html);
    ensurePurchaseFormData().then(() => { renderPurchaseLineItems(); refreshPurchaseSupplierOptions(); });
  }

  async function ensurePurchaseFormData() {
    if (!state.cache.suppliers || state.cache.suppliers.length === 0) {
      try { const snap = await BF.companyCollection('suppliers').get(); state.cache.suppliers = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}
    }
    if (!state.cache.inventory || state.cache.inventory.length === 0) {
      try { const snap = await BF.companyCollection('inventory').get(); state.cache.inventory = snap.docs.map(d => ({ id: d.id, ...d.data() })); } catch (e) {}
    }
  }

  function refreshPurchaseSupplierOptions() {
    const sel = document.getElementById('purch_supplier');
    if (!sel || !state.cache.suppliers) return;
    const currentVal = sel.value;
    const opts = ['<option value="">— Select supplier —</option>'];
    state.cache.suppliers.forEach(s => opts.push(`<option value="${s.id}">${escapeHtml(s.name)}</option>`));
    sel.innerHTML = opts.join('');
    if (currentVal) sel.value = currentVal;
  }

  function renderPurchaseLineItems() {
    const container = document.getElementById('purchLineItems');
    if (!container) return;
    const products = state.cache.inventory || [];
    const productOptions = products.length
      ? products.map(p => `<option value="${p.id}" data-price="${Number(p.cost) || Number(p.price) || 0}">${escapeHtml(p.name)} — ₹${Number(p.cost) || Number(p.price) || 0}</option>`).join('')
      : '<option value="">— No products in inventory —</option>';
    container.innerHTML = purchaseLineItems.map((item, idx) => `
      <div class="d-flex gap-1 mb-1" style="align-items:center;flex-wrap:wrap;" data-line="${idx}">
        <select class="form-control" style="flex:2;min-width:180px;" onchange="PurchasesModule.updateLine(${idx}, 'product', this.value)">
          <option value="">— Select product —</option>${productOptions}</select>
        <input type="number" class="form-control" style="flex:0 0 80px;" placeholder="Qty" min="1" step="1" value="${item.qty || 1}" oninput="PurchasesModule.updateLine(${idx}, 'qty', this.value)">
        <input type="number" class="form-control" style="flex:0 0 100px;" placeholder="Cost" min="0" step="0.01" value="${item.price || 0}" oninput="PurchasesModule.updateLine(${idx}, 'price', this.value)">
        <button class="btn btn-sm btn-danger btn-icon" onclick="PurchasesModule.removeLine(${idx})" title="Remove"><i class="fas fa-times"></i></button>
      </div>`).join('');
    purchaseLineItems.forEach((item, idx) => {
      const sel = container.querySelector(`[data-line="${idx}"] select`);
      if (sel && item.productId) sel.value = item.productId;
    });
    PurchasesModule.recalc();
  }

  PurchasesModule.addLine = function () { purchaseLineItems.push({ productId: '', name: '', qty: 1, price: 0 }); renderPurchaseLineItems(); };
  PurchasesModule.removeLine = function (idx) { if (purchaseLineItems.length <= 1) { showToast('At least one line item required', 'warning'); return; } purchaseLineItems.splice(idx, 1); renderPurchaseLineItems(); };
  PurchasesModule.updateLine = function (idx, field, value) {
    if (!purchaseLineItems[idx]) return;
    if (field === 'product') {
      purchaseLineItems[idx].productId = value;
      const prod = (state.cache.inventory || []).find(p => p.id === value);
      if (prod) { purchaseLineItems[idx].name = prod.name || ''; purchaseLineItems[idx].price = Number(prod.cost) || Number(prod.price) || 0; }
      renderPurchaseLineItems();
    } else if (field === 'qty') { purchaseLineItems[idx].qty = Math.max(1, Number(value) || 1); PurchasesModule.recalc(); }
    else if (field === 'price') { purchaseLineItems[idx].price = Math.max(0, Number(value) || 0); PurchasesModule.recalc(); }
  };
  PurchasesModule.recalc = function () {
    const total = purchaseLineItems.reduce((sum, it) => sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0);
    const el = document.getElementById('purchTotal');
    if (el) el.textContent = formatCurrency(total);
  };

  PurchasesModule.save = async function () {
    const supplierVal = document.getElementById('purch_supplier')?.value;
    if (!supplierVal) { showToast('Please select a supplier', 'error'); return; }
    const validItems = purchaseLineItems.filter(it => it.productId && Number(it.qty) > 0);
    if (validItems.length === 0) { showToast('Add at least one product to the purchase', 'error'); return; }
    const supplier = (state.cache.suppliers || []).find(s => s.id === supplierVal);
    const total = validItems.reduce((sum, it) => sum + it.qty * it.price, 0);
    const poNo = await generatePONo();
    const payload = {
      companyId: state.company.id, poNo, supplierId: supplierVal,
      supplierName: supplier ? supplier.name : 'Unknown',
      items: validItems.map(it => ({ productId: it.productId, name: it.name, qty: it.qty, price: it.price, lineTotal: it.qty * it.price })),
      total, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    try { await db.collection('purchases').add(payload); showToast('Purchase order created — #' + poNo, 'success'); BF.closeGlobalModal(); loadPurchases(); }
    catch (err) { console.error('Save purchase error:', err); showToast('Failed to save purchase: ' + (err.message || 'Unknown'), 'error'); }
  };

  async function generatePONo() {
    const now = new Date(); const y = now.getFullYear(); const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = `PO-${y}${m}-`;
    const snap = await BF.companyCollection('purchases').get();
    let maxSeq = 0;
    snap.forEach(doc => { const no = doc.data().poNo || ''; if (no.startsWith(prefix)) { const seq = parseInt(no.slice(prefix.length), 10); if (!isNaN(seq) && seq > maxSeq) maxSeq = seq; } });
    return prefix + String(maxSeq + 1).padStart(4, '0');
  }

  function openPOView(po) {
    const items = Array.isArray(po.items) ? po.items : [];
    const dateStr = po.createdAt ? (po.createdAt.toDate ? po.createdAt.toDate() : new Date(po.createdAt)).toLocaleString('en-IN') : '—';
    const status = (po.status || 'pending').toLowerCase();
    const badgeClass = status === 'received' ? 'badge-success' : status === 'pending' ? 'badge-warning' : status === 'cancelled' ? 'badge-danger' : 'badge-info';
    const html = `
      <div class="modal-header" style="background: var(--gradient-warning);"><h3><i class="fas fa-file-invoice-dollar"></i> PO #${escapeHtml(po.poNo || po.id.slice(-6).toUpperCase())}</h3>
        <button class="modal-close" onclick="BudgetFlow.closeGlobalModal()">&times;</button></div>
      <div class="modal-body">
        <div class="d-flex justify-between mb-2" style="flex-wrap:wrap;gap:10px;">
          <div><div class="text-muted" style="font-size:0.75rem;">SUPPLIER</div><div class="fw-700">${escapeHtml(po.supplierName || '—')}</div></div>
          <div><div class="text-muted" style="font-size:0.75rem;">DATE</div><div class="fw-600">${dateStr}</div></div>
          <div><div class="text-muted" style="font-size:0.75rem;">STATUS</div><span class="badge ${badgeClass}">${escapeHtml(po.status || 'pending')}</span></div>
        </div>
        <div class="table-wrapper" style="margin-top:1rem;">
          <table><thead><tr><th>Item</th><th>Qty</th><th>Cost</th><th>Total</th></tr></thead>
          <tbody>${items.length === 0 ? '<tr><td colspan="4"><div class="empty-state"><p>No items</p></div></td></tr>' : items.map(it => `<tr><td>${escapeHtml(it.name || 'Item')}</td><td>${it.qty}</td><td>${formatCurrency(it.price)}</td><td><strong>${formatCurrency(it.lineTotal || it.qty * it.price)}</strong></td></tr>`).join('')}</tbody></table>
        </div>
        <div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-md);margin-top:1rem;">
          <div class="d-flex justify-between" style="font-size:1.1rem;"><strong>Total:</strong><strong style="color:var(--warning);">${formatCurrency(po.total)}</strong></div>
        </div>
        <div class="form-actions"><button class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Close</button></div>
      </div>`;
    BF.openGlobalModal(html);
  }

  function renderPagination(containerId, pg, totalPages, goToFn) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = `<button class="page-btn" ${pg.page === 1 ? 'disabled' : ''} onclick="${goToFn}(${pg.page - 1})"><i class="fas fa-chevron-left"></i></button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
        if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
        continue;
      }
      html += `<button class="page-btn ${i === pg.page ? 'active' : ''}" onclick="${goToFn}(${i})">${i}</button>`;
    }
    html += `<button class="page-btn" ${pg.page === totalPages ? 'disabled' : ''} onclick="${goToFn}(${pg.page + 1})"><i class="fas fa-chevron-right"></i></button>`;
    el.innerHTML = html;
  }

  function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

  BF.renderPagination = renderPagination;
  console.log('[Part 3] Sales + Purchases modules loaded ✓');
})();
</script>

<!-- ============================================================
     PART 4 — EMPLOYEES + CUSTOMERS + SUPPLIERS MODULES
     ============================================================ -->
<script>
(function () {
  'use strict';
  const BF = window.BudgetFlow;
  const db = BF.db;
  const state = BF.state;
  const { escapeHtml, formatCurrency, formatDate, showToast, getInitials } = BF;

  const prevRenderPage = window.renderPage;
  window.renderPage = function (page, container) {
    switch (page) {
      case 'employees': renderEmployees(container); break;
      case 'customers': renderCustomers(container); break;
      case 'suppliers': renderSuppliers(container); break;
      default:
        if (typeof prevRenderPage === 'function') prevRenderPage(page, container);
        else container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-tools"></i><p>Module not yet loaded</p></div></div>';
    }
  };

  const empFilters = { search: '', department: 'all' };

  function renderEmployees(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value" id="empStatCount">—</div><div class="stat-label">Total Employees</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-check"></i></div><div class="stat-value" id="empStatActive">—</div><div class="stat-label">Active</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-building"></i></div><div class="stat-value" id="empStatDepts">—</div><div class="stat-label">Departments</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div><div class="stat-value" id="empStatSalary">—</div><div class="stat-label">Monthly Payroll</div></div>
      </div>
      <div class="card fade-in">
        <div class="card-header">
          <div><div class="card-title"><i class="fas fa-users"></i> Employee Directory</div>
          <div class="card-subtitle">Manage team members, roles, and payroll</div></div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="EmployeesModule.openAdd()"><i class="fas fa-user-plus"></i> Add Employee</button>
            <button class="btn btn-success" onclick="EmployeesModule.exportCSV()"><i class="fas fa-download"></i> Export</button>
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar"><i class="fas fa-search"></i>
            <input type="text" id="empSearch" placeholder="Search by name, position, email…" oninput="EmployeesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="empDeptTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-dept="all" onclick="EmployeesModule.setDept('all')">All</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table><thead><tr><th>Employee</th><th>Position</th><th>Department</th><th>Contact</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="employeesTableBody"><tr><td colspan="7"><div class="loading-block"><div class="loading-spinner"></div><span>Loading employees…</span></div></td></tr></tbody></table>
        </div>
        <div class="pagination" id="employeesPagination"></div>
      </div>`;
    loadEmployees();
  }

  async function loadEmployees() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('employees').get();
      state.cache.employees = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.employees.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      const total = state.cache.employees.length;
      const active = state.cache.employees.filter(e => (e.status || 'Active').toLowerCase() === 'active').length;
      const depts = new Set(state.cache.employees.map(e => e.department).filter(Boolean)).size;
      const payroll = state.cache.employees.filter(e => (e.status || 'Active').toLowerCase() === 'active').reduce((sum, e) => sum + (Number(e.salary) || 0), 0);
      setText('empStatCount', total); setText('empStatActive', active);
      setText('empStatDepts', depts); setText('empStatSalary', formatCurrency(payroll));
      buildEmpDeptTabs(); renderEmployeesTable();
    } catch (err) {
      console.error('Load employees error:', err);
      showToast('Failed to load employees', 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load employees</p></div></td></tr>';
    }
  }

  function buildEmpDeptTabs() {
    const tabs = document.getElementById('empDeptTabs');
    if (!tabs) return;
    const depts = new Set();
    state.cache.employees.forEach(e => { if (e.department && String(e.department).trim()) depts.add(String(e.department).trim()); });
    const list = ['all', ...Array.from(depts).sort()];
    tabs.innerHTML = list.map(dept => {
      const isActive = empFilters.department === dept ? 'active' : '';
      const label = dept === 'all' ? 'All' : escapeHtml(dept);
      return `<button class="filter-tab ${isActive}" data-dept="${escapeHtml(dept)}" onclick="EmployeesModule.setDept('${escapeHtml(dept)}')">${label}</button>`;
    }).join('');
  }

  function renderEmployeesTable() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;
    let filtered = state.cache.employees.slice();
    if (empFilters.department !== 'all') filtered = filtered.filter(e => String(e.department || '').trim() === empFilters.department);
    if (empFilters.search) {
      const q = empFilters.search.toLowerCase();
      filtered = filtered.filter(e => (e.name || '').toLowerCase().includes(q) || (e.position || '').toLowerCase().includes(q) || (e.email || '').toLowerCase().includes(q) || (e.phone || '').toLowerCase().includes(q));
    }
    const pg = state.pagination.employees;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-users"></i><h4>No employees found</h4><p>' + (state.cache.employees.length === 0 ? 'Add your first team member to get started' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(e => {
        const status = (e.status || 'Active').toLowerCase();
        const badgeClass = status === 'active' ? 'badge-success' : status === 'inactive' ? 'badge-gray' : status === 'on leave' ? 'badge-warning' : 'badge-info';
        return `<tr>
          <td><div class="user-cell"><div class="avatar avatar-sm">${getInitials(e.name)}</div>
            <div class="user-cell-info"><strong>${escapeHtml(e.name || 'Unnamed')}</strong><small>${escapeHtml(e.email || '—')}</small></div></div></td>
          <td>${escapeHtml(e.position || '—')}</td><td>${escapeHtml(e.department || '—')}</td>
          <td>${escapeHtml(e.phone || '—')}</td><td><strong>${formatCurrency(e.salary)}</strong></td>
          <td><span class="badge ${badgeClass}">${escapeHtml(e.status || 'Active')}</span></td>
          <td><div class="d-flex gap-1">
            <button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="EmployeesModule.openEdit('${e.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="EmployeesModule.confirmDelete('${e.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('employeesPagination', pg, totalPages, 'EmployeesModule.goToPage');
  }

  window.EmployeesModule = {
    onSearch: function (val) { empFilters.search = val || ''; state.pagination.employees.page = 1; renderEmployeesTable(); },
    setDept: function (dept) {
      empFilters.department = dept; state.pagination.employees.page = 1;
      document.querySelectorAll('#empDeptTabs .filter-tab').forEach(b => b.classList.toggle('active', b.dataset.dept === dept));
      renderEmployeesTable();
    },
    goToPage: function (p) { state.pagination.employees.page = p; renderEmployeesTable(); },
    openAdd: function () { openEmployeeForm(null); },
    openEdit: function (id) { const e = state.cache.employees.find(x => x.id === id); if (e) openEmployeeForm(e); },
    confirmDelete: function (id) {
      const e = state.cache.employees.find(x => x.id === id);
      if (!e) return;
      state.deleteTarget = { collection: 'employees', id, label: e.name || 'this employee' };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadEmployees(); };
    },
    save: async function (id) {
      const name = document.getElementById('emp_name').value.trim();
      const position = document.getElementById('emp_position').value.trim();
      const department = document.getElementById('emp_department').value.trim();
      const email = document.getElementById('emp_email').value.trim();
      const phone = document.getElementById('emp_phone').value.trim();
      const salary = Number(document.getElementById('emp_salary').value) || 0;
      const hireDate = document.getElementById('emp_hireDate').value;
      const status = document.getElementById('emp_status').value;
      if (!name) { showToast('Employee name is required', 'error'); return; }
      const payload = { name, position, department, email, phone, salary, hireDate, status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('employees').doc(id).update(payload); showToast('Employee updated successfully', 'success'); }
        else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('employees').add(payload);
          showToast('Employee added successfully', 'success');
        }
        BF.closeGlobalModal(); loadEmployees();
      } catch (err) { console.error('Save employee error:', err); showToast('Failed to save employee: ' + (err.message || 'Unknown'), 'error'); }
    },
    exportCSV: function () {
      if (state.cache.employees.length === 0) { showToast('No employees to export', 'warning'); return; }
      const rows = [['Name', 'Position', 'Department', 'Email', 'Phone', 'Salary', 'Hire Date', 'Status']];
      state.cache.employees.forEach(e => rows.push([e.name || '', e.position || '', e.department || '', e.email || '', e.phone || '', Number(e.salary) || 0, e.hireDate || '', e.status || 'Active']));
      BF.downloadCSV(rows, 'employees_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Employees exported successfully', 'success');
    }
  };

  function openEmployeeForm(emp) {
    const isEdit = !!emp; const v = isEdit ? emp : {};
    const html = `
      <div class="modal-header"><h3><i class="fas fa-${isEdit ? 'user-edit' : 'user-plus'}"></i> ${isEdit ? 'Edit Employee' : 'Add New Employee'}</h3>
        <button class="modal-close" onclick="BudgetFlow.closeGlobalModal()">&times;</button></div>
      <div class="modal-body">
        <form id="employeeForm" onsubmit="return false;">
          <div class="form-group"><label>Full Name <span class="required">*</span></label>
            <input type="text" class="form-control" id="emp_name" value="${escapeHtml(v.name || '')}" placeholder="e.g. Priya Sharma" required></div>
          <div class="form-row">
            <div class="form-group"><label>Position</label>
              <input type="text" class="form-control" id="emp_position" value="${escapeHtml(v.position || '')}" placeholder="e.g. Sales Manager"></div>
            <div class="form-group"><label>Department</label>
              <input type="text" class="form-control" id="emp_department" value="${escapeHtml(v.department || '')}" placeholder="e.g. Sales" list="empDeptList">
              <datalist id="empDeptList">${Array.from(new Set(state.cache.employees.map(e => e.department).filter(Boolean))).map(d => `<option value="${escapeHtml(d)}">`).join('')}</datalist></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Email</label>
              <input type="email" class="form-control" id="emp_email" value="${escapeHtml(v.email || '')}" placeholder="name@company.com"></div>
            <div class="form-group"><label>Phone</label>
              <input type="tel" class="form-control" id="emp_phone" value="${escapeHtml(v.phone || '')}" placeholder="+91 98765 43210"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Monthly Salary (₹)</label>
              <input type="number" class="form-control" id="emp_salary" value="${Number(v.salary) || 0}" min="0" step="100"></div>
            <div class="form-group"><label>Hire Date</label>
              <input type="date" class="form-control" id="emp_hireDate" value="${escapeHtml(v.hireDate || '')}"></div>
          </div>
          <div class="form-group"><label>Status</label>
            <select class="form-control" id="emp_status">
              <option value="Active" ${(v.status || 'Active') === 'Active' ? 'selected' : ''}>Active</option>
              <option value="On Leave" ${v.status === 'On Leave' ? 'selected' : ''}>On Leave</option>
              <option value="Inactive" ${v.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
            </select></div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>
            <button type="button" class="btn btn-success" onclick="EmployeesModule.save(${isEdit ? `'${emp.id}'` : 'null'})">
              <i class="fas fa-save"></i> ${isEdit ? 'Update' : 'Save'} Employee</button>
          </div>
        </form>
      </div>`;
    BF.openGlobalModal(html);
  }

  const custFilters = { search: '', type: 'all' };

  function renderCustomers(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value" id="custStatCount">—</div><div class="stat-label">Total Customers</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-crown"></i></div><div class="stat-value" id="custStatVIP">—</div><div class="stat-label">VIP Customers</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-boxes"></i></div><div class="stat-value" id="custStatWholesale">—</div><div class="stat-label">Wholesale</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div><div class="stat-value" id="custStatRevenue">—</div><div class="stat-label">Total Revenue</div></div>
      </div>

            <button class="filter-tab" data-type="wholesale" onclick="CustomersModule.setType('wholesale')">Wholesale</button>

          <tbody id="customersTableBody"><tr><td colspan="7"><div class="loading-block"><div class="loading-spinner"></div><span>Loading customers…</span></div></td></tr></tbody></table>

  async function loadCustomers() {
    const tbody = document.getElementById('customersTableBody');
    if (!tbody) return;
    try {
      const [custSnap, salesSnap] = await Promise.all([BF.companyCollection('customers').get(), BF.companyCollection('sales').get()]);
      state.cache.customers = custSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.sales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.customers.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      const statsMap = {};
      state.cache.sales.forEach(s => {
        if (!s.customerId) return;
        if (!statsMap[s.customerId]) statsMap[s.customerId] = { orders: 0, spent: 0 };
        statsMap[s.customerId].orders += 1;
        if ((s.status || '').toLowerCase() !== 'cancelled') statsMap[s.customerId].spent += Number(s.total) || 0;
      });
      state.customerStats = statsMap;
      const total = state.cache.customers.length;
      const vip = state.cache.customers.filter(c => (c.customerType || '').toLowerCase() === 'vip').length;
      const wholesale = state.cache.customers.filter(c => (c.customerType || '').toLowerCase() === 'wholesale').length;
      const revenue = Object.values(statsMap).reduce((sum, s) => sum + s.spent, 0);
      setText('custStatCount', total); setText('custStatVIP', vip);
      setText('custStatWholesale', wholesale); setText('custStatRevenue', formatCurrency(revenue));
      renderCustomersTable();
    } catch (err) {
      console.error('Load customers error:', err);
      showToast('Failed to load customers', 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load customers</p></div></td></tr>';
    }
  }

  function renderCustomersTable() {
    const tbody = document.getElementById('customersTableBody');
    if (!tbody) return;
    let filtered = state.cache.customers.slice();
    if (custFilters.type !== 'all') filtered = filtered.filter(c => (c.customerType || 'regular').toLowerCase() === custFilters.type);
    if (custFilters.search) {
      const q = custFilters.search.toLowerCase();
      filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(q) || (c.email || '').toLowerCase().includes(q) || (c.phone || '').toLowerCase().includes(q) || (c.company || '').toLowerCase().includes(q));
    }
    const pg = state.pagination.customers;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    const stats = state.customerStats || {};
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-address-book"></i><h4>No customers found</h4><p>' + (state.cache.customers.length === 0 ? 'Add your first customer to get started' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(c => {
        const type = (c.customerType || 'regular').toLowerCase();
        const typeBadge = type === 'vip' ? 'badge-purple' : type === 'wholesale' ? 'badge-info' : 'badge-gray';
        const st = stats[c.id] || { orders: 0, spent: 0 };
        return `<tr>
          <td><div class="user-cell"><div class="avatar avatar-sm">${getInitials(c.name)}</div>
            <div class="user-cell-info"><strong>${escapeHtml(c.name || 'Unnamed')}</strong><small>${escapeHtml(c.email || '—')}</small></div></div></td>
          <td>${escapeHtml(c.company || '—')}</td><td>${escapeHtml(c.phone || '—')}</td>
          <td><span class="badge ${typeBadge}">${escapeHtml(c.customerType || 'regular')}</span></td>
          <td><strong>${st.orders}</strong></td><td><strong>${formatCurrency(st.spent)}</strong></td>
          <td><div class="d-flex gap-1">
            <button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="CustomersModule.openEdit('${c.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="CustomersModule.confirmDelete('${c.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('customersPagination', pg, totalPages, 'CustomersModule.goToPage');
  }

  window.CustomersModule = {
    onSearch: function (val) { custFilters.search = val || ''; state.pagination.customers.page = 1; renderCustomersTable(); },
    setType: function (type) {
      custFilters.type = type; state.pagination.customers.page = 1;

    goToPage: function (p) { state.pagination.customers.page = p; renderCustomersTable(); },
    openAdd: function () { openCustomerForm(null); },
    openEdit: function (id) { const c = state.cache.customers.find(x => x.id === id); if (c) openCustomerForm(c); },
    confirmDelete: function (id) {

      state.deleteTarget = { collection: 'customers', id, label: c.name || 'this customer' };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadCustomers(); };
    },
    save: async function (id) {
      const name = document.getElementById('cust_name').value.trim();
      const company = document.getElementById('cust_company').value.trim();
      const email = document.getElementById('cust_email').value.trim();
      const phone = document.getElementById('cust_phone').value.trim();
      const address = document.getElementById('cust_address').value.trim();
      const gst = document.getElementById('cust_gst').value.trim();
      const customerType = document.getElementById('cust_type').value;
      if (!name) { showToast('Customer name is required', 'error'); return; }
      const payload = { name, company, email, phone, address, gstNumber: gst, customerType, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('customers').doc(id).update(payload); showToast('Customer updated successfully', 'success'); }
        else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('customers').add(payload);
          showToast('Customer added successfully', 'success');

        BF.closeGlobalModal(); loadCustomers();
      } catch (err) { console.error('Save customer error:', err); showToast('Failed to save customer: ' + (err.message || 'Unknown'), 'error'); }
    },
    exportCSV: function () {
      if (state.cache.customers.length === 0) { showToast('No customers to export', 'warning'); return; }
      const stats = state.customerStats || {};
      const rows = [['Name', 'Company', 'Email', 'Phone', 'Address', 'GST', 'Type', 'Orders', 'Total Spent']];
      state.cache.customers.forEach(c => {
        const st = stats[c.id] || { orders: 0, spent: 0 };
        rows.push([c.name || '', c.company || '', c.email || '', c.phone || '', c.address || '', c.gstNumber || '', c.customerType || 'regular', st.orders, st.spent]);

  const supFilters = { search: '' };

  function renderSuppliers(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-industry"></i></div><div class="stat-value" id="supStatCount">—</div><div class="stat-label">Total Suppliers</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-truck"></i></div><div class="stat-value" id="supStatPOs">—</div><div class="stat-label">Total Purchase Orders</div></div>

    try {
      const [supSnap, purchSnap] = await Promise.all([BF.companyCollection('suppliers').get(), BF.companyCollection('purchases').get()]);
      state.cache.suppliers = supSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.suppliers.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      const purchases = purchSnap.docs.map(d => d.data());
      const total = state.cache.suppliers.length;
      const poCount = purchases.length;
      const totalValue = purchases.filter(p => (p.status || '').toLowerCase() !== 'cancelled').reduce((sum, p) => sum + (Number(p.total) || 0), 0);
      setText('supStatCount', total); setText('supStatPOs', poCount); setText('supStatValue', formatCurrency(totalValue));
      const supStats = {};
      purchases.forEach(p => { if (!p.supplierId) return; if (!supStats[p.supplierId]) supStats[p.supplierId] = { count: 0 }; supStats[p.supplierId].count += 1; });
      state.supplierStats = supStats;
      renderSuppliersTable();

      showToast('Failed to load suppliers', 'error');
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load suppliers</p></div></td></tr>';

  function renderSuppliersTable() {
    const tbody = document.getElementById('suppliersTableBody');
    if (!tbody) return;
    let filtered = state.cache.suppliers.slice();

      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-industry"></i><h4>No suppliers found</h4><p>' + (state.cache.suppliers.length === 0 ? 'Add your first supplier to get started' : 'Try a different search') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(s => {
        const st = stats[s.id] || { count: 0 };

          <td><div class="user-cell"><div class="avatar avatar-sm">${getInitials(s.name)}</div>

              <input type="tel" class="form-control" id="sup_phone" value="${escapeHtml(v.phone || '')}" placeholder="+91 98765 43210"></div>
          </div>
          <div class="form-group"><label>Email</label>
            <input type="email" class="form-control" id="sup_email" value="${escapeHtml(v.email || '')}" placeholder="sales@supplier.com"></div>
          <div class="form-group"><label>Products / Categories</label>
            <input type="text" class="form-control" id="sup_products" value="${escapeHtml(v.products || '')}" placeholder="e.g. Electronics, Accessories"></div>

          <div class="form-group"><label>GST Number</label>
            <input type="text" class="form-control" id="sup_gst" value="${escapeHtml(v.gstNumber || '')}" placeholder="22AAAAA0000A1Z5"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>

  const origConfirm = window.SharedModule.confirmDelete;
  window.SharedModule.confirmDelete = async function () {

    if (!t) return;
    try {
      await db.collection(t.collection).doc(t.id).delete();
      showToast('Deleted successfully', 'success');
      BF.closeGlobalModal();
      state.deleteTarget = null;
      if (typeof window.SharedModule._afterDelete === 'function') {
        const fn = window.SharedModule._afterDelete;
        window.SharedModule._afterDelete = null;
        fn();

      else if (state.currentPage === 'dashboard') { BF.loadDashboardData(); }

  function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

  console.log('[Part 4] Employees + Customers + Suppliers modules loaded ✓');
})();

<script>
(function () {
  'use strict';
  const BF = window.BudgetFlow;
  const db = BF.db;
  const state = BF.state;
  const { escapeHtml, formatCurrency, formatDate, showToast, getInitials } = BF;

  const prevRenderPage = window.renderPage;
  window.renderPage = function (page, container) {
    switch (page) {
      case 'projects': renderProjects(container); break;
      case 'accounts': renderAccounts(container); break;

      const active = state.cache.projects.filter(p => (p.status || '').toLowerCase() === 'active').length;
      const completed = state.cache.projects.filter(p => (p.status || '').toLowerCase() === 'completed').length;
      const avgProgress = total ? Math.round(state.cache.projects.reduce((sum, p) => sum + (Number(p.progress) || 0), 0) / total) : 0;
      setText('projStatCount', total); setText('projStatActive', active);
      setText('projStatCompleted', completed); setText('projStatProgress', avgProgress + '%');
      renderProjectsGrid();
    } catch (err) {
      console.error('Load projects error:', err);
      showToast('Failed to load projects', 'error');
      grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load projects</p></div>';

  function renderProjectsGrid() {

      const progress = Math.max(0, Math.min(100, Number(p.progress) || 0));
      const progressColor = progress >= 75 ? 'success' : progress >= 40 ? 'warning' : 'danger';
      const startStr = p.startDate ? formatDate(p.startDate) : '—';

        <div class="d-flex gap-1" style="margin-top:12px;">

      const startDate = document.getElementById('proj_start').value;

      const payload = { name, description, owner, startDate, endDate, status, progress, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('projects').doc(id).update(payload); showToast('Project updated successfully', 'success'); }
        else {
          payload.companyId = state.company.id;

  async function loadAccounts() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('transactions').get();
      state.cache.transactions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.transactions.sort((a, b) => {
        const da = a.date ? new Date(a.date).getTime() : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const db2 = b.date ? new Date(b.date).getTime() : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return db2 - da;
      });
      const income = state.cache.transactions.filter(t => (t.type || '').toLowerCase() === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const expense = state.cache.transactions.filter(t => (t.type || '').toLowerCase() === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const profit = income - expense;
      setText('accStatIncome', formatCurrency(income)); setText('accStatExpense', formatCurrency(expense));
      const profitEl = document.getElementById('accStatProfit');
      if (profitEl) { profitEl.textContent = formatCurrency(profit); profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)'; }
      setText('accStatCount', state.cache.transactions.length);
      renderAccountsTable();
    } catch (err) {
      console.error('Load accounts error:', err);
      showToast('Failed to load transactions', 'error');
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load transactions</p></div></td></tr>';
    }
  }

  function renderAccountsTable() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;
    let filtered = state.cache.transactions.slice();
    if (accFilters.type !== 'all') filtered = filtered.filter(t => (t.type || 'income').toLowerCase() === accFilters.type);
    if (accFilters.search) {
      const q = accFilters.search.toLowerCase();
      filtered = filtered.filter(t => (t.description || '').toLowerCase().includes(q) || (t.category || '').toLowerCase().includes(q));
    }
    if (!state.pagination.transactions) state.pagination.transactions = { page: 1, perPage: 10 };
    const pg = state.pagination.transactions;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-coins"></i><h4>No transactions</h4><p>' + (state.cache.transactions.length === 0 ? 'Record your first transaction' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(t => {
        const type = (t.type || 'income').toLowerCase();
        const isIncome = type === 'income';
        const dateStr = t.date ? formatDate(t.date) : (t.createdAt ? formatDate(t.createdAt) : '—');
        return `<tr>
          <td>${dateStr}</td><td><strong>${escapeHtml(t.description || '—')}</strong></td>
          <td><span class="badge badge-gray">${escapeHtml(t.category || 'General')}</span></td>

      }).join('');
    }
    BF.renderPagination('accountsPagination', pg, totalPages, 'AccountsModule.goToPage');
  }

        <div class="stat-card"><div class="stat-icon"><i class="fas fa-receipt"></i></div><div class="stat-value" id="expStatCount">—</div><div class="stat-label">Total Expenses</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-value" id="expStatPending">—</div><div class="stat-label">Pending</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-value" id="expStatApproved">—</div><div class="stat-label">Approved</div></div>
        <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-alt"></i></div><div class="stat-value" id="expStatMonth">—</div><div class="stat-label">This Month</div></div>
      </div>
      <div class="card fade-in">
        <div class="card-header">
          <div><div class="card-title"><i class="fas fa-receipt"></i> Expense Management</div>
          <div class="card-subtitle">Track bills, claims, and operational expenses</div></div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="ExpensesModule.openAdd()"><i class="fas fa-plus"></i> Add Expense</button>
            <button class="btn btn-success" onclick="ExpensesModule.exportCSV()"><i class="fas fa-download"></i> Export</button>
          </div>
        </div>
        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar"><i class="fas fa-search"></i>
            <input type="text" id="expSearch" placeholder="Search description or category…" oninput="ExpensesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="expStatusTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-status="all" onclick="ExpensesModule.setStatus('all')">All</button>
            <button class="filter-tab" data-status="pending" onclick="ExpensesModule.setStatus('pending')">Pending</button>
            <button class="filter-tab" data-status="approved" onclick="ExpensesModule.setStatus('approved')">Approved</button>
            <button class="filter-tab" data-status="paid" onclick="ExpensesModule.setStatus('paid')">Paid</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="expensesTableBody"><tr><td colspan="6"><div class="loading-block"><div class="loading-spinner"></div><span>Loading expenses…</span></div></td></tr></tbody></table>
        </div>
        <div class="pagination" id="expensesPagination"></div>
      </div>`;
    loadExpenses();
  }

  async function loadExpenses() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('expenses').get();
      state.cache.expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.expenses.sort((a, b) => {
        const da = a.date ? new Date(a.date).getTime() : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const db2 = b.date ? new Date(b.date).getTime() : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return db2 - da;
      });
      const total = state.cache.expenses.length;
      const pending = state.cache.expenses.filter(e => (e.status || 'pending').toLowerCase() === 'pending').length;
      const approved = state.cache.expenses.filter(e => ['approved', 'paid'].includes((e.status || '').toLowerCase())).length;
      const now = new Date();
      const monthTotal = state.cache.expenses.filter(e => {
        if (!e.date) return false;
        const d = new Date(e.date);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      }).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      setText('expStatCount', total); setText('expStatPending', pending);
      setText('expStatApproved', approved); setText('expStatMonth', formatCurrency(monthTotal));
      renderExpensesTable();
    } catch (err) {
      console.error('Load expenses error:', err);
      showToast('Failed to load expenses', 'error');
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load expenses</p></div></td></tr>';
    }
  }

  function renderExpensesTable() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;
    let filtered = state.cache.expenses.slice();
    if (expFilters.status !== 'all') filtered = filtered.filter(e => (e.status || 'pending').toLowerCase() === expFilters.status);
    if (expFilters.search) {
      const q = expFilters.search.toLowerCase();
      filtered = filtered.filter(e => (e.description || '').toLowerCase().includes(q) || (e.category || '').toLowerCase().includes(q));
    }
    if (!state.pagination.expenses) state.pagination.expenses = { page: 1, perPage: 10 };
    const pg = state.pagination.expenses;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-receipt"></i><h4>No expenses</h4><p>' + (state.cache.expenses.length === 0 ? 'Add your first expense record' : 'Try adjusting your filters') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(e => {
        const status = (e.status || 'pending').toLowerCase();
        const badgeClass = status === 'paid' ? 'badge-success' : status === 'approved' ? 'badge-info' : status === 'rejected' ? 'badge-danger' : 'badge-warning';
        const dateStr = e.date ? formatDate(e.date) : (e.createdAt ? formatDate(e.createdAt) : '—');
        return `<tr>
          <td>${dateStr}</td><td><strong>${escapeHtml(e.description || '—')}</strong></td>
          <td><span class="badge badge-gray">${escapeHtml(e.category || 'General')}</span></td>
          <td><strong>${formatCurrency(e.amount)}</strong></td>
          <td><span class="badge ${badgeClass}">${escapeHtml(e.status || 'pending')}</span></td>
          <td><div class="d-flex gap-1">
            ${status === 'pending' ? `<button class="btn btn-sm btn-success" title="Approve" onclick="ExpensesModule.approve('${e.id}')"><i class="fas fa-check"></i></button>` : ''}
            ${status === 'approved' ? `<button class="btn btn-sm btn-info" title="Mark as Paid" onclick="ExpensesModule.markPaid('${e.id}')"><i class="fas fa-money-bill"></i></button>` : ''}
            <button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="ExpensesModule.openEdit('${e.id}')"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="ExpensesModule.confirmDelete('${e.id}')"><i class="fas fa-trash"></i></button>
          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('expensesPagination', pg, totalPages, 'ExpensesModule.goToPage');
  }

  window.ExpensesModule = {
    onSearch: function (val) { expFilters.search = val || ''; if (!state.pagination.expenses) state.pagination.expenses = { page: 1, perPage: 10 }; state.pagination.expenses.page = 1; renderExpensesTable(); },
    setStatus: function (status) {
      expFilters.status = status;
      if (!state.pagination.expenses) state.pagination.expenses = { page: 1, perPage: 10 };
      state.pagination.expenses.page = 1;
      document.querySelectorAll('#expStatusTabs .filter-tab').forEach(b => b.classList.toggle('active', b.dataset.status === status));
      renderExpensesTable();
    },
    goToPage: function (p) { if (!state.pagination.expenses) state.pagination.expenses = { page: 1, perPage: 10 }; state.pagination.expenses.page = p; renderExpensesTable(); },
    openAdd: function () { openExpenseForm(null); },
    openEdit: function (id) { const e = state.cache.expenses.find(x => x.id === id); if (e) openExpenseForm(e); },
    confirmDelete: function (id) {
      const e = state.cache.expenses.find(x => x.id === id);
      if (!e) return;
      state.deleteTarget = { collection: 'expenses', id, label: e.description || 'this expense' };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadExpenses(); };
    },
    approve: async function (id) {
      try { await db.collection('expenses').doc(id).update({ status: 'approved', approvedAt: firebase.firestore.FieldValue.serverTimestamp() }); showToast('Expense approved', 'success'); loadExpenses(); }
      catch (err) { console.error('Approve expense error:', err); showToast('Failed to approve: ' + (err.message || 'Unknown'), 'error'); }
    },
    markPaid: async function (id) {
      try { await db.collection('expenses').doc(id).update({ status: 'paid', paidAt: firebase.firestore.FieldValue.serverTimestamp() }); showToast('Expense marked as paid', 'success'); loadExpenses(); }
      catch (err) { console.error('Mark paid error:', err); showToast('Failed to mark paid: ' + (err.message || 'Unknown'), 'error'); }
    },
    save: async function (id) {
      const description = document.getElementById('exp_description').value.trim();
      const amount = Number(document.getElementById('exp_amount').value) || 0;
      const category = document.getElementById('exp_category').value.trim();
      const date = document.getElementById('exp_date').value;
      const status = document.getElementById('exp_status').value;
      const notes = document.getElementById('exp_notes').value.trim();
      if (!description) { showToast('Description is required', 'error'); return; }
      if (amount <= 0) { showToast('Amount must be greater than zero', 'error'); return; }
      const payload = { description, amount, category: category || 'General', date, status, notes, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('expenses').doc(id).update(payload); showToast('Expense updated successfully', 'success'); }
        else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('expenses').add(payload);
          showToast('Expense recorded successfully', 'success');
        }
        BF.closeGlobalModal(); loadExpenses();
      } catch (err) { console.error('Save expense error:', err); showToast('Failed to save expense: ' + (err.message || 'Unknown'), 'error'); }
    },
    exportCSV: function () {
      if (state.cache.expenses.length === 0) { showToast('No expenses to export', 'warning'); return; }
      const rows = [['Date', 'Description', 'Category', 'Amount', 'Status', 'Notes']];
      state.cache.expenses.forEach(e => rows.push([e.date || '', e.description || '', e.category || 'General', Number(e.amount) || 0, e.status || 'pending', e.notes || '']));
      BF.downloadCSV(rows, 'expenses_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Expenses exported successfully', 'success');
    }
  };

  function openExpenseForm(exp) {
    const isEdit = !!exp; const v = isEdit ? exp : {};
    const today = new Date().toISOString().split('T')[0];
    const html = `
      <div class="modal-header"><h3><i class="fas fa-${isEdit ? 'edit' : 'plus-circle'}"></i> ${isEdit ? 'Edit Expense' : 'Add New Expense'}</h3>
        <button class="modal-close" onclick="BudgetFlow.closeGlobalModal()">&times;</button></div>
      <div class="modal-body">
        <form id="expenseForm" onsubmit="return false;">
          <div class="form-group"><label>Description <span class="required">*</span></label>
            <input type="text" class="form-control" id="exp_description" value="${escapeHtml(v.description || '')}" placeholder="e.g. Office rent — November" required></div>
          <div class="form-row">
            <div class="form-group"><label>Amount (₹) <span class="required">*</span></label>
              <input type="number" class="form-control" id="exp_amount" value="${Number(v.amount) || ''}" min="0.01" step="0.01" required></div>
            <div class="form-group"><label>Category</label>
              <input type="text" class="form-control" id="exp_category" value="${escapeHtml(v.category || '')}" placeholder="e.g. Rent, Utilities, Travel" list="expCatList">
              <datalist id="expCatList">${Array.from(new Set(state.cache.expenses.map(e => e.category).filter(Boolean))).map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Date</label>
              <input type="date" class="form-control" id="exp_date" value="${escapeHtml(v.date || today)}"></div>
            <div class="form-group"><label>Status</label>
              <select class="form-control" id="exp_status">
                <option value="pending" ${(v.status || 'pending') === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="approved" ${v.status === 'approved' ? 'selected' : ''}>Approved</option>
                <option value="paid" ${v.status === 'paid' ? 'selected' : ''}>Paid</option>
                <option value="rejected" ${v.status === 'rejected' ? 'selected' : ''}>Rejected</option>
              </select></div>
          </div>
          <div class="form-group"><label>Notes</label>
            <textarea class="form-control" id="exp_notes" rows="2" placeholder="Optional notes or reference number">${escapeHtml(v.notes || '')}</textarea></div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>
            <button type="button" class="btn btn-success" onclick="ExpensesModule.save(${isEdit ? `'${exp.id}'` : 'null'})">
              <i class="fas fa-save"></i> ${isEdit ? 'Update' : 'Save'} Expense</button>
          </div>
        </form>
      </div>`;
    BF.openGlobalModal(html);
  }

  function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }
  console.log('[Part 5] Projects + Accounts + Expenses modules loaded ✓');
})();
</script>

<!-- ============================================================
     PART 6 — REPORTS + CALENDAR + DOCUMENTS + SETTINGS
     ============================================================ -->
<script>
(function () {
  'use strict';
  const BF = window.BudgetFlow;
  const db = BF.db;
  const state = BF.state;
  const { escapeHtml, formatCurrency, formatDate, showToast, getInitials } = BF;

  const prevRenderPage = window.renderPage;
  window.renderPage = function (page, container) {
    switch (page) {
      case 'reports': renderReports(container); break;
      case 'calendar': renderCalendar(container); break;
      case 'documents': renderDocuments(container); break;
      case 'settings': renderSettings(container); break;
      default:
        if (typeof prevRenderPage === 'function') prevRenderPage(page, container);
        else container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-tools"></i><p>Module not yet loaded</p></div></div>';
    }
  };

  async function renderReports(container) {
    container.innerHTML = '<div class="loading-block"><div class="loading-spinner lg"></div><span>Analyzing business data…</span></div>';
    try {
      const [invSnap, salesSnap, custSnap, expSnap, txSnap] = await Promise.all([
        BF.companyCollection('inventory').get(), BF.companyCollection('sales').get(),
        BF.companyCollection('customers').get(), BF.companyCollection('expenses').get(),
        BF.companyCollection('transactions').get()
      ]);
      const inventory = invSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const sales = salesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const expenses = expSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const transactions = txSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      const validSales = sales.filter(s => (s.status || '').toLowerCase() !== 'cancelled');
      const totalSalesRevenue = validSales.reduce((s, x) => s + (Number(x.total) || 0), 0);
      const txIncome = transactions.filter(t => (t.type || '').toLowerCase() === 'income').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const txExpense = transactions.filter(t => (t.type || '').toLowerCase() === 'expense').reduce((s, t) => s + (Number(t.amount) || 0), 0);
      const totalExpenses = txExpense + expenses.filter(e => ['approved', 'paid'].includes((e.status || '').toLowerCase())).reduce((s, e) => s + (Number(e.amount) || 0), 0);
      const totalRevenue = totalSalesRevenue + txIncome;
      const netProfit = totalRevenue - totalExpenses;
      const profitMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100) : 0;
      const inventoryValue = inventory.reduce((s, p) => s + ((Number(p.stock) || 0) * (Number(p.price) || 0)), 0);
      const inventoryCostValue = inventory.reduce((s, p) => s + ((Number(p.stock) || 0) * (Number(p.cost) || Number(p.price) || 0)), 0);

      const monthBuckets = {};
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        monthBuckets[key] = { label: d.toLocaleString('en-US', { month: 'short', year: '2-digit' }), value: 0 };
      }
      validSales.forEach(s => {
        const d = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)) : null;
        if (!d) return;
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (monthBuckets[key]) monthBuckets[key].value += Number(s.total) || 0;
      });
      const monthArray = Object.values(monthBuckets);
      const maxMonth = Math.max(1, ...monthArray.map(m => m.value));

      const customerTotals = {};
      validSales.forEach(s => {
        if (!s.customerId) return;
        if (!customerTotals[s.customerId]) customerTotals[s.customerId] = { name: s.customerName || 'Unknown', total: 0, orders: 0 };
        customerTotals[s.customerId].total += Number(s.total) || 0;
        customerTotals[s.customerId].orders += 1;
      });
      const topCustomers = Object.values(customerTotals).sort((a, b) => b.total - a.total).slice(0, 5);

      const productTotals = {};
      validSales.forEach(s => {
        const items = Array.isArray(s.items) ? s.items : [];
        items.forEach(it => {
          const key = it.productId || it.name || 'unknown';
          if (!productTotals[key]) productTotals[key] = { name: it.name || 'Unknown', qty: 0, revenue: 0 };
          productTotals[key].qty += Number(it.qty) || 0;
          productTotals[key].revenue += Number(it.lineTotal) || (Number(it.qty) || 0) * (Number(it.price) || 0);
        });
      });
      const topProducts = Object.values(productTotals).sort((a, b) => b.revenue - a.revenue).slice(0, 5);

      const expenseByCat = {};
      transactions.filter(t => (t.type || '').toLowerCase() === 'expense').forEach(t => {
        const cat = t.category || 'General';
        if (!expenseByCat[cat]) expenseByCat[cat] = 0;
        expenseByCat[cat] += Number(t.amount) || 0;
      });
      expenses.filter(e => ['approved', 'paid'].includes((e.status || '').toLowerCase())).forEach(e => {
        const cat = e.category || 'General';
        if (!expenseByCat[cat]) expenseByCat[cat] = 0;
        expenseByCat[cat] += Number(e.amount) || 0;
      });
      const topExpenses = Object.entries(expenseByCat).map(([cat, amt]) => ({ cat, amt })).sort((a, b) => b.amt - a.amt).slice(0, 5);
      const maxExpense = Math.max(1, ...topExpenses.map(e => e.amt));

      container.innerHTML = `
        <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
            <div class="stat-value">${formatCurrency(totalRevenue)}</div><div class="stat-label">Total Revenue</div>
            <div class="stat-change positive"><i class="fas fa-arrow-up"></i> Sales + transactions</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-arrow-down"></i></div>
            <div class="stat-value">${formatCurrency(totalExpenses)}</div><div class="stat-label">Total Expenses</div>
            <div class="stat-change negative"><i class="fas fa-arrow-down"></i> Approved + paid</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-wallet"></i></div>
            <div class="stat-value" style="color:${netProfit >= 0 ? 'var(--success)' : 'var(--danger)'};">${formatCurrency(netProfit)}</div>
            <div class="stat-label">Net Profit</div>
            <div class="stat-change ${netProfit >= 0 ? 'positive' : 'negative'}"><i class="fas fa-percentage"></i> ${profitMargin.toFixed(1)}% margin</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-boxes"></i></div>
            <div class="stat-value">${formatCurrency(inventoryValue)}</div><div class="stat-label">Inventory Value</div>
            <div class="stat-change"><i class="fas fa-cube"></i> Cost: ${formatCurrency(inventoryCostValue)}</div></div>
        </div>
        <div class="dashboard-grid fade-in">
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-chart-bar"></i> Sales — Last 6 Months</div></div>
            <div style="display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 0;">
              ${monthArray.map(m => {
                const pct = (m.value / maxMonth) * 100;
                return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;">
                  <div style="font-size:0.65rem;color:var(--gray-600);margin-bottom:4px;font-weight:600;">${m.value > 0 ? formatCurrency(m.value) : ''}</div>
                  <div style="width:100%;max-width:60px;height:${Math.max(4, pct)}%;background:var(--gradient-primary);border-radius:6px 6px 0 0;transition:height 0.4s ease;"></div>
                  <div style="font-size:0.7rem;color:var(--gray-500);margin-top:6px;font-weight:600;">${m.label}</div>
                </div>`;
              }).join('')}
            </div>
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-crown"></i> Top 5 Customers</div></div>
            ${topCustomers.length === 0 ? '<div class="empty-state"><i class="fas fa-users"></i><p>No customer data yet</p></div>' : topCustomers.map(c => `
              <div class="activity-item">
                <div class="avatar avatar-sm">${getInitials(c.name)}</div>
                <div class="activity-content"><strong>${escapeHtml(c.name)}</strong><small>${c.orders} order${c.orders !== 1 ? 's' : ''}</small></div>
                <strong style="color:var(--success);">${formatCurrency(c.total)}</strong>
              </div>`).join('')}
          </div>
        </div>
        <div class="dashboard-grid fade-in">
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-fire"></i> Top 5 Products</div></div>
            ${topProducts.length === 0 ? '<div class="empty-state"><i class="fas fa-box-open"></i><p>No product sales yet</p></div>' : topProducts.map((p, i) => `
              <div class="activity-item">
                <div class="activity-icon blue"><strong>#${i + 1}</strong></div>
                <div class="activity-content"><strong>${escapeHtml(p.name)}</strong><small>${p.qty} unit${p.qty !== 1 ? 's' : ''} sold</small></div>
                <strong style="color:var(--primary);">${formatCurrency(p.revenue)}</strong>
              </div>`).join('')}
          </div>
          <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-receipt"></i> Top 5 Expense Categories</div></div>
            ${topExpenses.length === 0 ? '<div class="empty-state"><i class="fas fa-coins"></i><p>No expense data yet</p></div>' : topExpenses.map(e => `
              <div style="margin-bottom:14px;">
                <div class="d-flex justify-between" style="margin-bottom:6px;">
                  <strong style="font-size:0.85rem;">${escapeHtml(e.cat)}</strong>
                  <span style="color:var(--danger);font-weight:700;font-size:0.85rem;">${formatCurrency(e.amt)}</span>
                </div>
                <div class="progress-bar"><div class="progress-fill danger" style="width:${(e.amt / maxExpense) * 100}%;"></div></div>
              </div>`).join('')}
          </div>
        </div>
        <div class="card fade-in">
          <div class="card-header"><div class="card-title"><i class="fas fa-file-export"></i> Export Reports</div></div>
          <div class="d-flex gap-2 flex-wrap">

  async function loadCalendarEvents() {
    try {
      const [salesSnap, purchSnap, expSnap, projSnap] = await Promise.all([
        BF.companyCollection('sales').get(), BF.companyCollection('purchases').get(),
        BF.companyCollection('expenses').get(), BF.companyCollection('projects').get()
      ]);
      const events = [];
      salesSnap.forEach(d => {
        const s = d.data();
        const dt = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)) : null;
        if (dt) events.push({ date: dt, type: 'sale', color: 'success', title: 'Sale #' + (s.invoiceNo || d.id.slice(-6).toUpperCase()), detail: (s.customerName || 'Walk-in') + ' — ' + formatCurrency(s.total) });
      });
      purchSnap.forEach(d => {
        const p = d.data();
        const dt = p.createdAt ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)) : null;
        if (dt) events.push({ date: dt, type: 'purchase', color: 'warning', title: 'PO #' + (p.poNo || d.id.slice(-6).toUpperCase()), detail: (p.supplierName || '') + ' — ' + formatCurrency(p.total) });
      });
      expSnap.forEach(d => {
        const e = d.data();
        if (!e.date) return;
        const dt = new Date(e.date);
        if (!isNaN(dt)) events.push({ date: dt, type: 'expense', color: 'danger', title: 'Expense — ' + (e.category || 'General'), detail: (e.description || '') + ' — ' + formatCurrency(e.amount) });
      });
      projSnap.forEach(d => {
        const p = d.data();
        if (p.endDate) {
          const dt = new Date(p.endDate);
          if (!isNaN(dt)) events.push({ date: dt, type: 'project', color: 'purple', title: 'Project due — ' + (p.name || 'Untitled'), detail: 'Status: ' + (p.status || 'active') + ', ' + (p.progress || 0) + '% complete' });
        }
      });
      state._calendarEvents = events;
      renderCalendarGrid();
    } catch (err) {
      console.error('Calendar load error:', err);
      showToast('Failed to load calendar events', 'error');
    }

  function renderCalendarGrid() {
    const grid = document.getElementById('calendarGrid');
    const label = document.getElementById('calMonthLabel');
    if (!grid || !label) return;
    const year = calState.year; const month = calState.month;
    label.textContent = new Date(year, month, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();
    const eventsByDate = {};
    (state._calendarEvents || []).forEach(ev => {
      const key = ev.date.getFullYear() + '-' + (ev.date.getMonth() + 1) + '-' + ev.date.getDate();
      if (!eventsByDate[key]) eventsByDate[key] = [];
      eventsByDate[key].push(ev);
    });
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
    weekdays.forEach(w => { html += `<div style="text-align:center;padding:8px;font-size:0.72rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;">${w}</div>`; });
    for (let i = 0; i < startWeekday; i++) { html += '<div style="min-height:80px;background:transparent;"></div>'; }
    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = year + '-' + (month + 1) + '-' + day;
      const events = eventsByDate[dateKey] || [];
      const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
      const bgColor = isToday ? 'rgba(78,84,200,0.08)' : 'var(--gray-50)';
      const borderColor = isToday ? 'var(--primary)' : 'var(--gray-200)';
      html += `<div style="min-height:80px;background:${bgColor};border:1px solid ${borderColor};border-radius:8px;padding:6px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;"
                onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='${borderColor}'"
                onclick="CalendarModule.showDay(${day}, ${events.length})">
        <div style="font-weight:${isToday ? '800' : '600'};font-size:0.85rem;color:${isToday ? 'var(--primary)' : 'var(--gray-800)'};margin-bottom:4px;">${day}</div>
        ${events.slice(0, 2).map(ev => `<div style="font-size:0.65rem;background:var(--${ev.color});color:white;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">${escapeHtml(ev.title)}</div>`).join('')}
        ${events.length > 2 ? `<div style="font-size:0.65rem;color:var(--gray-500);font-weight:600;">+${events.length - 2} more</div>` : ''}
      </div>`;
    }
    html += '</div>';
    grid.innerHTML = html;
  }

  window.CalendarModule = {

    nextMonth: function () { calState.month++; if (calState.month > 11) { calState.month = 0; calState.year++; } renderCalendarGrid(); },
    today: function () { const now = new Date(); calState.year = now.getFullYear(); calState.month = now.getMonth(); renderCalendarGrid(); },
    showDay: function (day) {
      const dateKey = calState.year + '-' + (calState.month + 1) + '-' + day;
      const events = (state._calendarEvents || []).filter(ev => {
        const k = ev.date.getFullYear() + '-' + (ev.date.getMonth() + 1) + '-' + ev.date.getDate();
        return k === dateKey;
      });
      const dateStr = new Date(calState.year, calState.month, day).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const html = `

  async function loadDocuments() {
    const tbody = document.getElementById('documentsTableBody');
    if (!tbody) return;
    try {
      const snap = await BF.companyCollection('documents').get();
      state.cache.documents = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.cache.documents.sort((a, b) => String(a.name || '').localeCompare(String(b.name || '')));
      renderDocumentsTable();
    } catch (err) {
      console.error('Load documents error:', err);
      showToast('Failed to load documents', 'error');
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load documents</p></div></td></tr>';
    }
  }

  function renderDocumentsTable() {
    const tbody = document.getElementById('documentsTableBody');
    if (!tbody) return;
    let filtered = state.cache.documents.slice();
    if (docFilters.search) {
      const q = docFilters.search.toLowerCase();
      filtered = filtered.filter(d => (d.name || '').toLowerCase().includes(q) || (d.category || '').toLowerCase().includes(q) || (d.notes || '').toLowerCase().includes(q));
    }
    if (!state.pagination.documents) state.pagination.documents = { page: 1, perPage: 10 };
    const pg = state.pagination.documents;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    if (pageItems.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-folder-open"></i><h4>No documents</h4><p>' + (state.cache.documents.length === 0 ? 'Add your first document reference' : 'Try a different search') + '</p></div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(d => {
        const addedStr = d.createdAt ? formatDate(d.createdAt) : '—';
        return `<tr>
          <td><div class="user-cell"><div class="avatar avatar-sm" style="background:var(--gradient-info);"><i class="fas fa-file"></i></div>
            <div class="user-cell-info"><strong>${escapeHtml(d.name || 'Untitled')}</strong></div></div></td>
          <td><span class="badge badge-info">${escapeHtml(d.category || 'General')}</span></td>

          </div></td>
        </tr>`;
      }).join('');
    }
    BF.renderPagination('documentsPagination', pg, totalPages, 'DocumentsModule.goToPage');
  }

    confirmDelete: function (id) {
      const d = state.cache.documents.find(x => x.id === id);
      if (!d) return;
      state.deleteTarget = { collection: 'documents', id, label: d.name || 'this document' };
      BF.openDeleteConfirm();
      window.SharedModule._afterDelete = () => { loadDocuments(); };
    },
    save: async function (id) {
      const name = document.getElementById('doc_name').value.trim();
      const category = document.getElementById('doc_category').value.trim();
      const url = document.getElementById('doc_url').value.trim();
      const notes = document.getElementById('doc_notes').value.trim();
      if (!name) { showToast('Document name is required', 'error'); return; }
      const payload = { name, category: category || 'General', url, notes, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      try {
        if (id) { await db.collection('documents').doc(id).update(payload); showToast('Document updated', 'success'); }
        else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('documents').add(payload);
          showToast('Document added', 'success');
        }
        BF.closeGlobalModal(); loadDocuments();
      } catch (err) { console.error('Save document error:', err); showToast('Failed to save: ' + (err.message || 'Unknown'), 'error'); }
