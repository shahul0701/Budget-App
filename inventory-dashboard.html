          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="invSearch" placeholder="Search by name, SKU, or category…" oninput="InventoryModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="invCategoryTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-cat="all" onclick="InventoryModule.setCategory('all')">All</button>
          </div>
        </div>

        <div class="table-wrapper" id="inventoryTableWrapper">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Price</th>
                <th>Value</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <tr><td colspan="8"><div class="loading-block"><div class="loading-spinner"></div><span>Loading inventory…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="inventoryPagination"></div>
      </div>
    `;

    loadInventory();
  }

  async function loadInventory() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading inventory…', 'Fetching your products');
      const snap = await App.companyCollection('inventory').get();
      state.cache.inventory = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      App.hideLoading();
      buildCategoryTabs();
      renderInventoryTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Inventory] load error:', err);
      showToast('Failed to load inventory: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load inventory</p></div></td></tr>';
    }
  }

  function buildCategoryTabs() {
    const tabs = document.getElementById('invCategoryTabs');
    if (!tabs) return;
    const cats = new Set();
    state.cache.inventory.forEach(function (p) {
      if (p.category && String(p.category).trim()) cats.add(String(p.category).trim());
    });
    const list = ['all'].concat(Array.from(cats).sort());
    tabs.innerHTML = list.map(function (cat) {
      const isActive = invFilters.category === cat ? 'active' : '';
      const label = cat === 'all' ? 'All' : escapeHtml(cat);
      return '<button class="filter-tab ' + isActive + '" data-cat="' + escapeHtml(cat) + '" onclick="InventoryModule.setCategory(\'' + escapeHtml(cat).replace(/'/g, "\\'") + '\')">' + label + '</button>';
    }).join('');
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;

    let filtered = state.cache.inventory.slice();

    if (invFilters.category !== 'all') {
      filtered = filtered.filter(function (p) {
        return String(p.category || '').trim() === invFilters.category;
      });
    }

    if (invFilters.search) {
      const q = invFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.name || '').toLowerCase().includes(q) ||
               (p.sku || '').toLowerCase().includes(q) ||
               (p.category || '').toLowerCase().includes(q);
      });
    }

    filtered.sort(function (a, b) {
      return String(a.name || '').localeCompare(String(b.name || ''));
    });

    const pg = state.pagination.inventory;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="8"><div class="empty-state">' +
          '<i class="fas fa-box-open"></i>' +
          '<h4>No products found</h4>' +
          '<p>' + (state.cache.inventory.length === 0
            ? 'Add your first product to get started'
            : 'Try adjusting your search or filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (p) {
        const stock = Number(p.stock) || 0;
        const price = Number(p.price) || 0;
        const value = stock * price;
        const statusBadge = stock > 20 ? 'badge-success'
                          : stock > 5  ? 'badge-warning'
                          : stock > 0  ? 'badge-danger'
                          : 'badge-gray';
        const statusLabel = stock > 20 ? 'In Stock'
                          : stock > 5  ? 'Low'
                          : stock > 0  ? 'Critical'
                          : 'Out of Stock';
        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(p.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(p.name || 'Unnamed') + '</strong>' +
                '<small>' + (p.barcode ? 'Barcode: ' + escapeHtml(p.barcode) : 'ID: ' + p.id.slice(-6)) + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(p.sku || '—') + '</td>' +
          '<td>' + escapeHtml(p.category || 'General') + '</td>' +
          '<td><strong>' + stock + '</strong></td>' +
          '<td>' + formatCurrency(price) + '</td>' +
          '<td><strong>' + formatCurrency(value) + '</strong></td>' +
          '<td><span class="badge ' + statusBadge + '">' + statusLabel + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              // NEW: quick "New Sale" shortcut
              '<button class="btn btn-sm btn-icon btn-success" title="New Sale with this product" onclick="InventoryModule.quickSale(\'' + p.id + '\')"><i class="fas fa-shopping-cart"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="InventoryModule.openEdit(\'' + p.id + '\')"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="InventoryModule.confirmDelete(\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    // Pagination
    const pagEl = document.getElementById('inventoryPagination');
    if (pagEl) {
      if (totalPages <= 1) {
        pagEl.innerHTML = '';
      } else {
        let html = '<button class="page-btn" ' + (pg.page === 1 ? 'disabled' : '') + ' onclick="InventoryModule.goToPage(' + (pg.page - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
            if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
            continue;
          }
          html += '<button class="page-btn ' + (i === pg.page ? 'active' : '') + '" onclick="InventoryModule.goToPage(' + i + ')">' + i + '</button>';
        }
        html += '<button class="page-btn" ' + (pg.page === totalPages ? 'disabled' : '') + ' onclick="InventoryModule.goToPage(' + (pg.page + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
        pagEl.innerHTML = html;
      }
    }
  }

  // ============================================================
  // ==================== INVENTORY MODULE API =================
  // ============================================================
  window.InventoryModule = {
    onSearch: function (val) {
      invFilters.search = val || '';
      state.pagination.inventory.page = 1;
      renderInventoryTable();
    },

    setCategory: function (cat) {
      invFilters.category = cat;
      state.pagination.inventory.page = 1;
      document.querySelectorAll('#invCategoryTabs .filter-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      renderInventoryTable();
    },

    goToPage: function (p) {
      state.pagination.inventory.page = p;
      renderInventoryTable();
    },

    openAdd: function () {
      openInventoryForm(null);
    },

    openEdit: function (id) {
      const item = state.cache.inventory.find(function (p) { return p.id === id; });
      if (!item) { showToast('Product not found', 'error'); return; }
      openInventoryForm(item);
    },

    // NEW: quick "New Sale" from inventory row
    quickSale: function (productId) {
      const product = state.cache.inventory.find(function (p) { return p.id === productId; });
      if (!product) return;
      // Stash the pre-selected product and navigate
      window._preSelectedSaleProduct = product;
      App.quickNav('sales');
      // Sales module (Part 3) will detect _preSelectedSaleProduct
      showToast('Opening sale form for ' + (product.name || 'product'), 'info');
    },

    confirmDelete: function (id) {
      const item = state.cache.inventory.find(function (p) { return p.id === id; });
      if (!item) return;
      state.deleteTarget = { collection: 'inventory', id: id, label: item.name || 'this product' };
      App.openDeleteConfirm();
    },

    save: async function (id) {
      const name = document.getElementById('inv_name').value.trim();
      const sku = document.getElementById('inv_sku').value.trim();
      const barcode = document.getElementById('inv_barcode').value.trim();
      const category = document.getElementById('inv_category').value.trim();
      const stock = Number(document.getElementById('inv_stock').value) || 0;
      const price = Number(document.getElementById('inv_price').value) || 0;
      const cost = Number(document.getElementById('inv_cost').value) || 0;

      if (!name) { showToast('Product name is required', 'error'); return; }
      if (price < 0 || stock < 0) { showToast('Stock and price cannot be negative', 'error'); return; }

      const payload = {
        name: name,
        sku: sku,
        barcode: barcode,
        category: category || 'General',
        stock: stock,
        price: price,
        cost: cost,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating product…' : 'Saving product…');
        if (id) {
          await db.collection('inventory').doc(id).update(payload);
          showToast('Product updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('inventory').add(payload);
          showToast('Product added successfully', 'success');
        }
        App.hideLoading();
        App.closeGlobalModal();
        loadInventory();
      } catch (err) {
        App.hideLoading();
        console.error('[Inventory] save error:', err);
        showToast('Failed to save product: ' + (err.message || 'Unknown'), 'error');
      }
    },

    exportCSV: function () {
      if (state.cache.inventory.length === 0) {
        showToast('No products to export', 'warning');
        return;
      }
      const rows = [['Name', 'SKU', 'Category', 'Stock', 'Price', 'Cost', 'Value', 'Barcode']];
      state.cache.inventory.forEach(function (p) {
        const stock = Number(p.stock) || 0;
        const price = Number(p.price) || 0;
        rows.push([
          p.name || '', p.sku || '', p.category || '',
          stock, price, Number(p.cost) || 0,
          stock * price, p.barcode || ''
        ]);
      });
      App.downloadCSV(rows, 'inventory_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Inventory CSV downloaded', 'success');
    },

    // NEW: PDF export
    exportPDF: async function () {
      const card = document.getElementById('inventoryCard');
      if (!card) { showToast('Nothing to export', 'error'); return; }

      // Build a print-friendly clone with company header
      const temp = document.createElement('div');
      temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;padding:30px;';
      temp.innerHTML =
        '<div style="text-align:center;margin-bottom:24px;border-bottom:2px solid #4e54c8;padding-bottom:16px;">' +
          '<h1 style="font-size:1.6rem;font-weight:800;color:#4e54c8;margin:0 0 6px 0;">' +
            escapeHtml(state.company.name || 'Company') +
          '</h1>' +
          '<div style="font-size:0.85rem;color:#64748b;">' +
            (state.companyDetails && state.companyDetails.phone ? '📞 ' + escapeHtml(state.companyDetails.phone) + ' • ' : '') +
            (state.companyDetails && state.companyDetails.email ? '✉ ' + escapeHtml(state.companyDetails.email) + ' • ' : '') +
            (state.companyDetails && state.companyDetails.gstNumber ? 'GST: ' + escapeHtml(state.companyDetails.gstNumber) : '') +
          '</div>' +
          '<h2 style="font-size:1.1rem;font-weight:700;margin-top:12px;color:#1e293b;">Inventory Report</h2>' +
          '<div style="font-size:0.75rem;color:#64748b;">Generated ' + new Date().toLocaleString('en-IN') + '</div>' +
        '</div>' +
        document.getElementById('inventoryTableWrapper').innerHTML;

      document.body.appendChild(temp);

      try {
        await App.exportToPDF(temp, 'inventory_' + new Date().toISOString().split('T')[0] + '.pdf', { orientation: 'landscape' });
      } finally {
        document.body.removeChild(temp);
      }
    }
  };

  // ============================================================
  // ================= INVENTORY FORM (MODAL) ===================
  // ============================================================
  function openInventoryForm(item) {
    const isEdit = !!item;
    const v = isEdit ? item : {};

    const cats = Array.from(new Set(state.cache.inventory.map(function (p) { return p.category; }).filter(Boolean)));

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-' + (isEdit ? 'edit' : 'plus-circle') + '"></i> ' + (isEdit ? 'Edit Product' : 'Add New Product') + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<form id="inventoryForm" onsubmit="return false;">' +
          '<div class="form-group">' +
            '<label>Product Name <span class="required">*</span></label>' +
            '<input type="text" class="form-control" id="inv_name" value="' + escapeHtml(v.name || '') + '" placeholder="e.g. Wireless Mouse" required>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>SKU</label>' +
              '<input type="text" class="form-control" id="inv_sku" value="' + escapeHtml(v.sku || '') + '" placeholder="e.g. WM-001">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Barcode</label>' +
              '<input type="text" class="form-control" id="inv_barcode" value="' + escapeHtml(v.barcode || '') + '" placeholder="Optional">' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Category</label>' +
            '<input type="text" class="form-control" id="inv_category" value="' + escapeHtml(v.category || '') + '" placeholder="e.g. Electronics" list="invCategoryList">' +
            '<datalist id="invCategoryList">' +
              cats.map(function (c) { return '<option value="' + escapeHtml(c) + '">'; }).join('') +
            '</datalist>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Stock Quantity <span class="required">*</span></label>' +
              '<input type="number" class="form-control" id="inv_stock" value="' + (Number(v.stock) || 0) + '" min="0" step="1" required>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Unit Price (₹) <span class="required">*</span></label>' +
              '<input type="number" class="form-control" id="inv_price" value="' + (Number(v.price) || 0) + '" min="0" step="0.01" required>' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Cost Price (₹)</label>' +
            '<input type="number" class="form-control" id="inv_cost" value="' + (Number(v.cost) || 0) + '" min="0" step="0.01">' +
            '<div class="form-hint">Used to calculate profit margins</div>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
            '<button type="button" class="btn btn-success" onclick="InventoryModule.save(' + (isEdit ? "'" + item.id + "'" : 'null') + ')">' +
              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Save') + ' Product' +
            '</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    App.openGlobalModal(html);
    setTimeout(function () {
      const el = document.getElementById('inv_name');
      if (el) el.focus();
    }, 100);
  }

  // ============================================================
  // ==================== REGISTER RENDERERS ====================
  // ============================================================
  App.registerPageRenderer('dashboard', renderDashboard);
  App.registerPageRenderer('inventory', renderInventory);

  // Expose reload functions
  App.loadDashboard = loadDashboardData;
  App.loadInventory = loadInventory;
  App.renderInventoryTable = renderInventoryTable;
  App.timeAgo = timeAgo;

  console.log('[Part 2 — UPGRADED] Dashboard + Inventory loaded ✓');
  console.log('  New: quick-actions grid, 6 stat cards, PDF export, quick sale from inventory');
})();
</script>
<!-- ============================================================
     PART 3 (UPGRADED) — SALES + PURCHASES
     Insert AFTER Part 2 (Upgraded) script block.
     ============================================================ -->
<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 3] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, showToast, getInitials } = App;

  // ============================================================
  // ====================== SALES MODULE ========================
  // ============================================================
  const salesFilters = { search: '', status: 'all' };

  function renderSales(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-receipt"></i></div>
          <div class="stat-value" id="salesStatCount">—</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-value" id="salesStatRevenue">—</div>
          <div class="stat-label">Revenue</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="salesStatPending">—</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-value" id="salesStatCompleted">—</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-shopping-cart"></i> Sales Orders</div>
            <div class="card-subtitle">Create invoices, track payments, and manage order status</div>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="SalesModule.openNew()">
              <i class="fas fa-plus"></i> New Sale
            </button>
            <button class="btn btn-success" onclick="SalesModule.exportCSV()">
              <i class="fas fa-download"></i> CSV
            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="salesSearch" placeholder="Search by invoice or customer…" oninput="SalesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="salesStatusTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-status="all" onclick="SalesModule.setStatus('all')">All</button>
            <button class="filter-tab" data-status="pending" onclick="SalesModule.setStatus('pending')">Pending</button>
            <button class="filter-tab" data-status="completed" onclick="SalesModule.setStatus('completed')">Completed</button>
            <button class="filter-tab" data-status="cancelled" onclick="SalesModule.setStatus('cancelled')">Cancelled</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="salesTableBody">
              <tr><td colspan="8"><div class="loading-block"><div class="loading-spinner"></div><span>Loading sales…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="salesPagination"></div>
      </div>
    `;

    loadSales();
  }

  async function loadSales() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading sales…');
      const snap = await App.companyCollection('sales').get();
      state.cache.sales = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.sales.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      const totalOrders = state.cache.sales.length;
      const revenue = state.cache.sales
        .filter(function (s) { return (s.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (sum, s) { return sum + (Number(s.total) || 0); }, 0);
      const pending = state.cache.sales.filter(function (s) { return (s.status || 'pending').toLowerCase() === 'pending'; }).length;
      const completed = state.cache.sales.filter(function (s) { return (s.status || '').toLowerCase() === 'completed'; }).length;

      setText('salesStatCount', totalOrders);
      setText('salesStatRevenue', formatCurrency(revenue));
      setText('salesStatPending', pending);
      setText('salesStatCompleted', completed);

      App.hideLoading();
      renderSalesTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Sales] load error:', err);
      showToast('Failed to load sales: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load sales</p></div></td></tr>';
    }
  }

  function paymentBadge(payment) {
    if (!payment) return '<span class="badge badge-gray">—</span>';
    if (payment.mode === 'split') {
      const modes = (payment.splits || []).map(function (s) {
        const label = (App.PAYMENT_MODES.find(function (m) { return m.id === s.mode; }) || {}).label || s.mode;
        return label;
      }).join(' + ');
      return '<span class="badge badge-purple" title="' + escapeHtml(modes) + '">Split</span>';
    }
    const label = (App.PAYMENT_MODES.find(function (m) { return m.id === payment.mode; }) || {}).label || payment.mode;
    return '<span class="badge badge-info">' + escapeHtml(label) + '</span>';
  }

  function renderSalesTable() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;

    let filtered = state.cache.sales.slice();
    if (salesFilters.status !== 'all') {
      filtered = filtered.filter(function (s) {
        return (s.status || 'pending').toLowerCase() === salesFilters.status;
      });
    }
    if (salesFilters.search) {
      const q = salesFilters.search.toLowerCase();
      filtered = filtered.filter(function (s) {
        return (s.invoiceNo || '').toLowerCase().includes(q) ||
               (s.customerName || '').toLowerCase().includes(q) ||
               (s.customerPhone || '').toLowerCase().includes(q) ||
               (s.id || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.sales;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="8"><div class="empty-state">' +
          '<i class="fas fa-receipt"></i>' +
          '<h4>No sales found</h4>' +
          '<p>' + (state.cache.sales.length === 0
            ? 'Create your first sale to get started'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (s) {
        const status = (s.status || 'pending').toLowerCase();
        const badgeClass = status === 'completed' ? 'badge-success'
                         : status === 'pending' ? 'badge-warning'
                         : status === 'cancelled' ? 'badge-danger'
                         : 'badge-info';
        const itemsCount = Array.isArray(s.items) ? s.items.length : (Number(s.items) || 0);
        const dateStr = s.createdAt
          ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
          : '—';

        return '<tr>' +
          '<td>' +
            '<strong style="color:var(--primary);cursor:pointer;" onclick="SalesModule.viewInvoice(\'' + s.id + '\')">' +
              '#' + escapeHtml(s.invoiceNo || s.id.slice(-6).toUpperCase()) +
            '</strong>' +
          '</td>' +
          '<td>' +
            '<div style="font-weight:600;">' + escapeHtml(s.customerName || 'Walk-in') + '</div>' +
            (s.customerPhone ? '<small class="text-muted">' + escapeHtml(s.customerPhone) + '</small>' : '') +
          '</td>' +
          '<td>' + itemsCount + '</td>' +
          '<td><strong>' + formatCurrency(s.total) + '</strong></td>' +
          '<td>' + paymentBadge(s.payment) + '</td>' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(s.status || 'pending') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              (status === 'pending'
                ? '<button class="btn btn-sm btn-success" title="Mark Complete + Record Payment" onclick="SalesModule.complete(\'' + s.id + '\')"><i class="fas fa-check"></i></button>' +
                  '<button class="btn btn-sm btn-warning" title="Cancel" onclick="SalesModule.cancel(\'' + s.id + '\')"><i class="fas fa-times"></i></button>'
                : '<button class="btn btn-sm btn-icon btn-info" title="View" onclick="SalesModule.viewInvoice(\'' + s.id + '\')"><i class="fas fa-eye"></i></button>') +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="SalesModule.confirmDelete(\'' + s.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('salesPagination', pg, totalPages, 'SalesModule.goToPage');
  }

  // ============================================================
  // ==================== SALES MODULE API ======================
  // ============================================================
  window.SalesModule = {
    onSearch: function (val) {
      salesFilters.search = val || '';
      state.pagination.sales.page = 1;
      renderSalesTable();
    },

    setStatus: function (status) {
      salesFilters.status = status;
      state.pagination.sales.page = 1;
      document.querySelectorAll('#salesStatusTabs .filter-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.status === status);
      });
      renderSalesTable();
    },

    goToPage: function (p) {
      state.pagination.sales.page = p;
      renderSalesTable();
    },

    openNew: function () {
      openSaleForm();
    },

    viewInvoice: function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (sale) openInvoiceView(sale);
    },

    // Complete with payment mode picker (#6)
    complete: async function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (!sale) return;

      // Open payment mode picker
      App.openPaymentModePicker(sale.total, 'Receive Payment', async function (paymentData) {
        try {
          App.showLoading('Completing sale…', 'Updating stock and payment');

          // Deduct stock
          const items = Array.isArray(sale.items) ? sale.items : [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (!item.productId) continue;
            const prodRef = db.collection('inventory').doc(item.productId);
            const prodSnap = await prodRef.get();
            if (prodSnap.exists) {
              const currentStock = Number(prodSnap.data().stock) || 0;
              const newStock = Math.max(0, currentStock - (Number(item.qty) || 0));
              await prodRef.update({ stock: newStock });
            }
          }

          // Update sale with payment + completed
          await db.collection('sales').doc(id).update({
            status: 'completed',
            payment: paymentData,
            completedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          App.hideLoading();
          showToast('Sale completed and payment recorded', 'success');
          await loadSales();
          if (typeof App.loadInventory === 'function') App.loadInventory();
          if (typeof App.loadDashboard === 'function') App.loadDashboard();
        } catch (err) {
          App.hideLoading();
          console.error('[Sales] complete error:', err);
          showToast('Failed to complete: ' + (err.message || 'Unknown'), 'error');
        }
      });
    },

    cancel: async function (id) {
      if (!confirm('Cancel this sale? This cannot be undone.')) return;
      try {
        App.showLoading('Cancelling…');
        await db.collection('sales').doc(id).update({
          status: 'cancelled',
          cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        App.hideLoading();
        showToast('Sale cancelled', 'success');
        await loadSales();
      } catch (err) {
        App.hideLoading();
        console.error('[Sales] cancel error:', err);
        showToast('Failed to cancel: ' + (err.message || 'Unknown'), 'error');
      }
    },

    confirmDelete: function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (!sale) return;
      state.deleteTarget = {
        collection: 'sales',
        id: id,
        label: 'Invoice #' + (sale.invoiceNo || id.slice(-6).toUpperCase())
      };
      App.openDeleteConfirm();
    },

    save: async function () {
      const customerVal = document.getElementById('sale_customer').value || 'walkin';
      const discount = Number(document.getElementById('sale_discount').value) || 0;

      const validItems = saleLineItems.filter(function (it) {
        return it.productId && Number(it.qty) > 0;
      });

      if (validItems.length === 0) {
        showToast('Add at least one product to the sale', 'error');
        return;
      }

      // Validate stock
      for (let i = 0; i < validItems.length; i++) {
        const it = validItems[i];
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === it.productId; });
        if (prod && Number(it.qty) > Number(prod.stock || 0)) {
          showToast('Insufficient stock for "' + prod.name + '" (have ' + prod.stock + ', need ' + it.qty + ')', 'error');
          return;
        }
      }

      let customerName = 'Walk-in Customer';
      let customerId = '';
      let customerPhone = '';

      if (customerVal === 'walkin') {
        // Use walk-in from modal if set
        if (window._currentWalkin) {
          customerName = window._currentWalkin.name;
          customerPhone = window._currentWalkin.phone || '';
        }
      } else if (customerVal !== 'walkin') {
        const cust = (state.cache.customers || []).find(function (c) { return c.id === customerVal; });
        if (cust) {
          customerName = cust.name;
          customerPhone = cust.phone || '';
          customerId = cust.id;
        }
      }

      const subtotal = validItems.reduce(function (sum, it) { return sum + it.qty * it.price; }, 0);
      const total = Math.max(0, subtotal - discount);
      const invoiceNo = await generateInvoiceNo();

      const payload = {
        companyId: state.company.id,
        invoiceNo: invoiceNo,
        customerId: customerId,
        customerName: customerName,
        customerPhone: customerPhone,
        items: validItems.map(function (it) {
          return {
            productId: it.productId,
            name: it.name,
            qty: it.qty,
            price: it.price,
            gstRate: Number(it.gstRate) || 18,
            lineTotal: it.qty * it.price
          };
        }),
        subtotal: subtotal,
        discount: discount,
        total: total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading('Creating sale…');
        await db.collection('sales').add(payload);
        App.hideLoading();
        showToast('Sale created — #' + invoiceNo, 'success');
        window._currentWalkin = null;
        App.closeGlobalModal();
        await loadSales();
      } catch (err) {
        App.hideLoading();
        console.error('[Sales] save error:', err);
        showToast('Failed to save sale: ' + (err.message || 'Unknown'), 'error');
      }
    },

    addLine: function () {
      saleLineItems.push({ productId: '', name: '', qty: 1, price: 0, gstRate: 18 });
      renderSaleLineItems();
    },

    removeLine: function (idx) {
      if (saleLineItems.length <= 1) {
        showToast('At least one line item required', 'warning');
        return;
      }
      saleLineItems.splice(idx, 1);
      renderSaleLineItems();
    },

    updateLine: function (idx, field, value) {
      if (!saleLineItems[idx]) return;
      if (field === 'product') {
        saleLineItems[idx].productId = value;
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === value; });
        if (prod) {
          saleLineItems[idx].name = prod.name || '';
          saleLineItems[idx].price = Number(prod.price) || 0;
        }
        renderSaleLineItems();
      } else if (field === 'qty') {
        saleLineItems[idx].qty = Math.max(1, Number(value) || 1);
        SalesModule.recalc();
      } else if (field === 'price') {
        saleLineItems[idx].price = Math.max(0, Number(value) || 0);
        SalesModule.recalc();
      } else if (field === 'gstRate') {
        saleLineItems[idx].gstRate = Math.max(0, Number(value) || 18);
        SalesModule.recalc();
      }
    },

    recalc: function () {
      const subtotal = saleLineItems.reduce(function (sum, it) {
        return sum + (Number(it.qty) || 0) * (Number(it.price) || 0);
      }, 0);
      const discEl = document.getElementById('sale_discount');
      const discount = discEl ? (Number(discEl.value) || 0) : 0;
      const total = Math.max(0, subtotal - discount);
      const subEl = document.getElementById('saleSubtotal');
      const totEl = document.getElementById('saleTotal');
      if (subEl) subEl.textContent = formatCurrency(subtotal);
      if (totEl) totEl.textContent = formatCurrency(total);
    },

    // Open walk-in modal (#3)
    openWalkin: function () {
      App.openWalkinModal(function (walkin) {
        window._currentWalkin = walkin;
        const sel = document.getElementById('sale_customer');
        if (sel) sel.value = 'walkin';
        const nameEl = document.getElementById('walkinNameDisplay');
        if (nameEl) {
          nameEl.textContent = walkin.name || 'Walk-in Customer';
          nameEl.style.display = 'block';
        }
        if (walkin.phone) {
          const phoneEl = document.getElementById('walkinPhoneDisplay');
          if (phoneEl) {
            phoneEl.textContent = walkin.phone;
            phoneEl.style.display = 'block';
          }
        }
        showToast('Walk-in customer set: ' + walkin.name, 'success');
      });
    },

    exportCSV: function () {
      if (state.cache.sales.length === 0) {
        showToast('No sales to export', 'warning');
        return;
      }
      const rows = [['Invoice', 'Customer', 'Phone', 'Items', 'Subtotal', 'Discount', 'Total', 'Status', 'Payment', 'Date']];
      state.cache.sales.forEach(function (s) {
        const dateStr = s.createdAt
          ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN')
          : '';
        const payMode = s.payment ? (s.payment.mode === 'split' ? 'Split' : s.payment.mode) : '';
        rows.push([
          s.invoiceNo || s.id.slice(-6).toUpperCase(),
          s.customerName || 'Walk-in',
          s.customerPhone || '',
          Array.isArray(s.items) ? s.items.length : 0,
          Number(s.subtotal) || 0,
          Number(s.discount) || 0,
          Number(s.total) || 0,
          s.status || 'pending',
          payMode,
          dateStr
        ]);
      });
      App.downloadCSV(rows, 'sales_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Sales CSV downloaded', 'success');
    }
  };

  async function ensureSaleFormData() {
    if (!state.cache.customers || state.cache.customers.length === 0) {
      try {
        const snap = await App.companyCollection('customers').get();
        state.cache.customers = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) {}
    }
    if (!state.cache.inventory || state.cache.inventory.length === 0) {
      try {
        const snap = await App.companyCollection('inventory').get();
        state.cache.inventory = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) {}
    }
  }

    const sel = document.getElementById('sale_customer');
    if (!sel) return;

    (state.cache.customers || []).forEach(function (c) {
      opts.push('<option value="' + c.id + '">' + escapeHtml(c.name) + (c.company ? ' — ' + escapeHtml(c.company) : '') + '</option>');

  function renderSaleLineItems() {
    const container = document.getElementById('saleLineItems');
    if (!container) return;

    const products = state.cache.inventory || [];
    const productOptions = products.length
      ? products.map(function (p) {
          return '<option value="' + p.id + '">' + escapeHtml(p.name) + ' — ₹' + (Number(p.price) || 0) + ' (' + (Number(p.stock) || 0) + ' in stock)</option>';

        '<select class="form-control" style="flex:2;min-width:180px;" onchange="SalesModule.updateLine(' + idx + ', \'product\', this.value)">' +

        '<input type="number" class="form-control" style="flex:0 0 90px;" placeholder="Price" min="0" step="0.01" ' +

      if (sel) sel.value = item.productId;

  async function generateInvoiceNo() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = 'INV-' + y + m + '-';
    try {
      const snap = await App.companyCollection('sales').get();
      let maxSeq = 0;
      snap.forEach(function (doc) {
        const inv = doc.data().invoiceNo || '';
        if (inv.indexOf(prefix) === 0) {
          const seq = parseInt(inv.slice(prefix.length), 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        }
      });
      return prefix + String(maxSeq + 1).padStart(4, '0');
    } catch (e) {
      return prefix + String(Math.floor(Math.random() * 9000) + 1000);
    }
  }

          '<div><div class="text-muted" style="font-size:0.75rem;">STATUS</div><span class="badge ' + badgeClass + '">' + escapeHtml(sale.status || 'pending') + '</span></div>' +

  async function loadPurchases() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading purchases…');
      const snap = await App.companyCollection('purchases').get();
      state.cache.purchases = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.purchases.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      const totalCount = state.cache.purchases.length;
      const totalValue = state.cache.purchases
        .filter(function (p) { return (p.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (sum, p) { return sum + (Number(p.total) || 0); }, 0);
      const pending = state.cache.purchases.filter(function (p) { return (p.status || 'pending').toLowerCase() === 'pending'; }).length;
      const received = state.cache.purchases.filter(function (p) { return (p.status || '').toLowerCase() === 'received'; }).length;

      setText('purchStatCount', totalCount);
      setText('purchStatValue', formatCurrency(totalValue));
      setText('purchStatPending', pending);
      setText('purchStatReceived', received);

      App.hideLoading();
      renderPurchasesTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Purchases] load error:', err);
      showToast('Failed to load purchases: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load purchases</p></div></td></tr>';
    }
  }

  function renderPurchasesTable() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;

    let filtered = state.cache.purchases.slice();
    if (purchFilters.status !== 'all') {
      filtered = filtered.filter(function (p) {
        return (p.status || 'pending').toLowerCase() === purchFilters.status;
      });
    }
    if (purchFilters.search) {
      const q = purchFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.poNo || '').toLowerCase().includes(q) ||
               (p.supplierName || '').toLowerCase().includes(q) ||
               (p.id || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.purchases;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="8"><div class="empty-state">' +
          '<i class="fas fa-truck"></i>' +
          '<h4>No purchase orders</h4>' +
          '<p>' + (state.cache.purchases.length === 0
            ? 'Create your first purchase order'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (p) {
        const status = (p.status || 'pending').toLowerCase();
        const badgeClass = status === 'received' ? 'badge-success'
                         : status === 'pending' ? 'badge-warning'
                         : status === 'cancelled' ? 'badge-danger'
                         : 'badge-info';
        const itemsCount = Array.isArray(p.items) ? p.items.length : (Number(p.items) || 0);
        const dateStr = p.createdAt
          ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
          : '—';

        return '<tr>' +
          '<td>' +
            '<strong style="color:var(--primary);cursor:pointer;" onclick="PurchasesModule.viewPO(\'' + p.id + '\')">' +
              '#' + escapeHtml(p.poNo || p.id.slice(-6).toUpperCase()) +
            '</strong>' +
          '</td>' +
          '<td>' + escapeHtml(p.supplierName || '—') + '</td>' +
          '<td>' + itemsCount + '</td>' +
          '<td><strong>' + formatCurrency(p.total) + '</strong></td>' +
          '<td>' + paymentBadge(p.payment) + '</td>' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(p.status || 'pending') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              (status === 'pending'
                ? '<button class="btn btn-sm btn-success" title="Receive + Record Payment" onclick="PurchasesModule.receive(\'' + p.id + '\')"><i class="fas fa-check"></i> Receive</button>'
                : '<button class="btn btn-sm btn-icon btn-info" title="View" onclick="PurchasesModule.viewPO(\'' + p.id + '\')"><i class="fas fa-eye"></i></button>') +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="PurchasesModule.confirmDelete(\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('purchasesPagination', pg, totalPages, 'PurchasesModule.goToPage');
  }

  // ============================================================
  // ================== PURCHASES MODULE API ====================
  // ============================================================
  window.PurchasesModule = {
    onSearch: function (val) {
      purchFilters.search = val || '';
      state.pagination.purchases.page = 1;
      renderPurchasesTable();
    },

    setStatus: function (status) {
      purchFilters.status = status;
      state.pagination.purchases.page = 1;
      document.querySelectorAll('#purchStatusTabs .filter-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.status === status);
      });
      renderPurchasesTable();
    },

    goToPage: function (p) {
      state.pagination.purchases.page = p;
      renderPurchasesTable();
    },

    openNew: function () {
      openPurchaseForm();
    },

    viewPO: function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (po) openPOView(po);
    },

    // Receive with payment mode picker (#6)
    receive: async function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (!po) return;

      App.openPaymentModePicker(po.total, 'Pay Supplier', async function (paymentData) {
        try {
          App.showLoading('Receiving stock…', 'Updating inventory and payment');

          const items = Array.isArray(po.items) ? po.items : [];
          for (let i = 0; i < items.length; i++) {
            const item = items[i];
            if (!item.productId) continue;
            const prodRef = db.collection('inventory').doc(item.productId);
            const prodSnap = await prodRef.get();
            if (prodSnap.exists) {
              const currentStock = Number(prodSnap.data().stock) || 0;
              const newStock = currentStock + (Number(item.qty) || 0);
              const updates = { stock: newStock };
              if (Number(item.price) > 0) updates.cost = Number(item.price);
              await prodRef.update(updates);
            }
          }

          await db.collection('purchases').doc(id).update({
            status: 'received',
            payment: paymentData,
            receivedAt: firebase.firestore.FieldValue.serverTimestamp()
          });

          App.hideLoading();
          showToast('Purchase received and payment recorded', 'success');
          await loadPurchases();
          if (typeof App.loadInventory === 'function') App.loadInventory();
          if (typeof App.loadDashboard === 'function') App.loadDashboard();
        } catch (err) {
          App.hideLoading();
          console.error('[Purchases] receive error:', err);
          showToast('Failed to receive: ' + (err.message || 'Unknown'), 'error');
        }
      });
    },

    confirmDelete: function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (!po) return;
      state.deleteTarget = {
        collection: 'purchases',
        id: id,
        label: 'PO #' + (po.poNo || id.slice(-6).toUpperCase())
      };
      App.openDeleteConfirm();
    },

    save: async function () {
      const supplierVal = document.getElementById('purch_supplier').value;
      if (!supplierVal) {
        showToast('Please select a supplier', 'error');
        return;
      }

      const validItems = purchaseLineItems.filter(function (it) {
        return it.productId && Number(it.qty) > 0;
      });

      if (validItems.length === 0) {
        showToast('Add at least one product to the purchase', 'error');
        return;
      }

      const supplier = (state.cache.suppliers || []).find(function (s) { return s.id === supplierVal; });
      const total = validItems.reduce(function (sum, it) { return sum + it.qty * it.price; }, 0);
      const poNo = await generatePONo();

      const payload = {
        companyId: state.company.id,
        poNo: poNo,
        supplierId: supplierVal,
        supplierName: supplier ? supplier.name : 'Unknown',
        items: validItems.map(function (it) {
          return {
            productId: it.productId,
            name: it.name,
            qty: it.qty,
            price: it.price,
            gstRate: Number(it.gstRate) || 18,
            lineTotal: it.qty * it.price
          };
        }),
        total: total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading('Creating PO…');
        await db.collection('purchases').add(payload);
        App.hideLoading();
        showToast('PO created — #' + poNo, 'success');
        App.closeGlobalModal();
        await loadPurchases();
      } catch (err) {
        App.hideLoading();
        console.error('[Purchases] save error:', err);
        showToast('Failed to save purchase: ' + (err.message || 'Unknown'), 'error');
      }
    },

    addLine: function () {
      purchaseLineItems.push({ productId: '', name: '', qty: 1, price: 0, gstRate: 18 });
      renderPurchaseLineItems();
    },

    removeLine: function (idx) {
      if (purchaseLineItems.length <= 1) {
        showToast('At least one line item required', 'warning');
        return;
      }
      purchaseLineItems.splice(idx, 1);
      renderPurchaseLineItems();
    },

    updateLine: function (idx, field, value) {
      if (!purchaseLineItems[idx]) return;
      if (field === 'product') {
        purchaseLineItems[idx].productId = value;
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === value; });
        if (prod) {
          purchaseLineItems[idx].name = prod.name || '';
          purchaseLineItems[idx].price = Number(prod.cost) || Number(prod.price) || 0;
        }
        renderPurchaseLineItems();
      } else if (field === 'qty') {
        purchaseLineItems[idx].qty = Math.max(1, Number(value) || 1);
        PurchasesModule.recalc();
      } else if (field === 'price') {
        purchaseLineItems[idx].price = Math.max(0, Number(value) || 0);
        PurchasesModule.recalc();
      } else if (field === 'gstRate') {
        purchaseLineItems[idx].gstRate = Math.max(0, Number(value) || 18);
        PurchasesModule.recalc();
      }
    },

    recalc: function () {
      const total = purchaseLineItems.reduce(function (sum, it) {
        return sum + (Number(it.qty) || 0) * (Number(it.price) || 0);
      }, 0);
      const el = document.getElementById('purchTotal');
      if (el) el.textContent = formatCurrency(total);
    },

    exportCSV: function () {
      if (state.cache.purchases.length === 0) {
        showToast('No purchases to export', 'warning');
        return;
      }
      const rows = [['PO', 'Supplier', 'Items', 'Total', 'Status', 'Payment', 'Date']];
      state.cache.purchases.forEach(function (p) {
        const dateStr = p.createdAt
          ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN')
          : '';
        const payMode = p.payment ? (p.payment.mode === 'split' ? 'Split' : p.payment.mode) : '';
        rows.push([
          p.poNo || p.id.slice(-6).toUpperCase(),
          p.supplierName || '',
          Array.isArray(p.items) ? p.items.length : 0,
          Number(p.total) || 0,
          p.status || 'pending',
          payMode,
          dateStr
        ]);
      });
      App.downloadCSV(rows, 'purchases_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Purchases CSV downloaded', 'success');
    }
  };

  // ---- Purchase line items ----
  let purchaseLineItems = [];

  function openPurchaseForm() {
    purchaseLineItems = [{ productId: '', name: '', qty: 1, price: 0, gstRate: 18 }];

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-plus-circle"></i> New Purchase Order</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +

        '<div class="form-group">' +
          '<label>Supplier <span class="required">*</span></label>' +
          '<select class="form-control" id="purch_supplier"><option value="">— Select supplier —</option></select>' +
        '</div>' +
        '<div class="form-group">' +
          '<label>Line Items</label>' +
          '<div id="purchLineItems"></div>' +
          '<button class="btn btn-sm btn-outline mt-1" onclick="PurchasesModule.addLine()"><i class="fas fa-plus"></i> Add Item</button>' +
        '</div>' +
        '<div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-md);margin-top:1rem;">' +
          '<div class="d-flex justify-between" style="font-size:1.1rem;">' +

          '<button class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
          '<button class="btn btn-success" onclick="PurchasesModule.save()"><i class="fas fa-save"></i> Create PO</button>' +

      '</div>';

    App.openGlobalModal(html);

    ensurePurchaseFormData().then(function () {
      populatePurchaseSupplierSelect();
      renderPurchaseLineItems();
    });
  }

  async function ensurePurchaseFormData() {
    if (!state.cache.suppliers || state.cache.suppliers.length === 0) {
      try {
        const snap = await App.companyCollection('suppliers').get();
        state.cache.suppliers = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) {}
    }
    if (!state.cache.inventory || state.cache.inventory.length === 0) {
      try {
        const snap = await App.companyCollection('inventory').get();
        state.cache.inventory = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) {}
    }
  }

  function populatePurchaseSupplierSelect() {
    const sel = document.getElementById('purch_supplier');
    if (!sel) return;
    const opts = ['<option value="">— Select supplier —</option>'];
    (state.cache.suppliers || []).forEach(function (s) {
      opts.push('<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>');
    });
    sel.innerHTML = opts.join('');
  }

  function renderPurchaseLineItems() {
    const container = document.getElementById('purchLineItems');
    if (!container) return;

    const products = state.cache.inventory || [];
    const productOptions = products.length
      ? products.map(function (p) {
          return '<option value="' + p.id + '">' + escapeHtml(p.name) + ' — ₹' + (Number(p.cost) || Number(p.price) || 0) + '</option>';
        }).join('')
      : '<option value="">— No products in inventory —</option>';

    container.innerHTML = purchaseLineItems.map(function (item, idx) {
      return '<div class="d-flex gap-1 mb-1" style="align-items:center;flex-wrap:wrap;" data-line="' + idx + '">' +
        '<select class="form-control" style="flex:2;min-width:180px;" onchange="PurchasesModule.updateLine(' + idx + ', \'product\', this.value)">' +
          '<option value="">— Select product —</option>' + productOptions +
        '</select>' +
        '<input type="number" class="form-control" style="flex:0 0 70px;" placeholder="Qty" min="1" step="1" ' +
          'value="' + (item.qty || 1) + '" oninput="PurchasesModule.updateLine(' + idx + ', \'qty\', this.value)">' +
        '<input type="number" class="form-control" style="flex:0 0 90px;" placeholder="Cost" min="0" step="0.01" ' +
          'value="' + (item.price || 0) + '" oninput="PurchasesModule.updateLine(' + idx + ', \'price\', this.value)">' +
        '<input type="number" class="form-control" style="flex:0 0 70px;" placeholder="GST %" min="0" step="0.5" ' +
          'value="' + (item.gstRate || 18) + '" oninput="PurchasesModule.updateLine(' + idx + ', \'gstRate\', this.value)" title="GST rate %">' +
        '<button class="btn btn-sm btn-danger btn-icon" onclick="PurchasesModule.removeLine(' + idx + ')" title="Remove"><i class="fas fa-times"></i></button>' +
        '</div>';
    }).join('');

    purchaseLineItems.forEach(function (item, idx) {
      if (!item.productId) return;
      const row = container.querySelector('[data-line="' + idx + '"]');
      if (!row) return;
      const sel = row.querySelector('select');
      if (sel) sel.value = item.productId;
    });

    PurchasesModule.recalc();
  }

  async function generatePONo() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = 'PO-' + y + m + '-';
    try {
      const snap = await App.companyCollection('purchases').get();
      let maxSeq = 0;
      snap.forEach(function (doc) {
        const no = doc.data().poNo || '';
        if (no.indexOf(prefix) === 0) {
          const seq = parseInt(no.slice(prefix.length), 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        }
      });
      return prefix + String(maxSeq + 1).padStart(4, '0');
    } catch (e) {
      return prefix + String(Math.floor(Math.random() * 9000) + 1000);
    }
  }

  function openPOView(po) {
    const items = Array.isArray(po.items) ? po.items : [];
    const dateStr = po.createdAt
      ? (po.createdAt.toDate ? po.createdAt.toDate() : new Date(po.createdAt)).toLocaleString('en-IN')
      : '—';
    const status = (po.status || 'pending').toLowerCase();
    const badgeClass = status === 'received' ? 'badge-success'
                     : status === 'pending' ? 'badge-warning'
                     : status === 'cancelled' ? 'badge-danger'
                     : 'badge-info';

    const itemsHtml = items.length === 0
      ? '<tr><td colspan="5"><div class="empty-state"><p>No items</p></div></td></tr>'
      : items.map(function (it) {
          return '<tr>' +
            '<td>' + escapeHtml(it.name || 'Item') + '</td>' +
            '<td>' + it.qty + '</td>' +
            '<td>' + formatCurrency(it.price) + '</td>' +
            '<td>' + (it.gstRate || 18) + '%</td>' +
            '<td><strong>' + formatCurrency(it.lineTotal || it.qty * it.price) + '</strong></td>' +
            '</tr>';
        }).join('');

    let paymentHtml = '';
    if (po.payment) {
      if (po.payment.mode === 'split') {
        const splits = (po.payment.splits || []).map(function (sp) {
          const label = (App.PAYMENT_MODES.find(function (m) { return m.id === sp.mode; }) || {}).label || sp.mode;
          return '<div class="d-flex justify-between" style="padding:4px 0;font-size:0.85rem;"><span>' + escapeHtml(label) + '</span><strong>' + formatCurrency(sp.amount) + '</strong></div>';
        }).join('');
        paymentHtml = '<div style="margin-top:1rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius-md);">' +
          '<div style="font-weight:700;font-size:0.9rem;margin-bottom:8px;"><i class="fas fa-divide"></i> Split Payment</div>' + splits + '</div>';
      } else {
        const label = (App.PAYMENT_MODES.find(function (m) { return m.id === po.payment.mode; }) || {}).label || po.payment.mode;
        paymentHtml = '<div style="margin-top:1rem;padding:1rem;background:var(--gray-50);border-radius:var(--radius-md);">' +
          '<div class="d-flex justify-between" style="font-size:0.9rem;"><span class="text-muted">Payment Mode:</span><strong>' + escapeHtml(label) + '</strong></div></div>';
      }
    }

    const html =
      '<div class="modal-header" style="background: var(--gradient-warning);">' +
        '<h3><i class="fas fa-file-invoice-dollar"></i> PO #' + escapeHtml(po.poNo || po.id.slice(-6).toUpperCase()) + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body" id="poViewContent">' +
        '<div class="d-flex justify-between mb-2" style="flex-wrap:wrap;gap:10px;">' +
          '<div><div class="text-muted" style="font-size:0.75rem;">SUPPLIER</div><div class="fw-700">' + escapeHtml(po.supplierName || '—') + '</div></div>' +
          '<div><div class="text-muted" style="font-size:0.75rem;">DATE</div><div class="fw-600">' + dateStr + '</div></div>' +
          '<div><div class="text-muted" style="font-size:0.75rem;">STATUS</div><span class="badge ' + badgeClass + '">' + escapeHtml(po.status || 'pending') + '</span></div>' +
        '</div>' +
        '<div class="table-wrapper" style="margin-top:1rem;">' +
          '<table><thead><tr><th>Item</th><th>Qty</th><th>Cost</th><th>GST</th><th>Total</th></tr></thead>' +
          '<tbody>' + itemsHtml + '</tbody></table>' +
        '</div>' +
        '<div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-md);margin-top:1rem;">' +
          '<div class="d-flex justify-between" style="font-size:1.1rem;">' +
            '<strong>Total:</strong>' +
            '<strong style="color:var(--warning);">' + formatCurrency(po.total) + '</strong>' +
          '</div>' +
        '</div>' +
        paymentHtml +
        '<div class="form-actions">' +
          '<button class="btn btn-outline" onclick="App.closeGlobalModal()">Close</button>' +
        '</div>' +
      '</div>';

    App.openGlobalModal(html);
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // ============================================================
  // ==================== REGISTER RENDERERS ====================
  // ============================================================
  App.registerPageRenderer('sales', renderSales);
  App.registerPageRenderer('purchases', renderPurchases);

  App.loadSales = loadSales;
  App.loadPurchases = loadPurchases;

  console.log('[Part 3 — UPGRADED] Sales + Purchases loaded ✓');
  console.log('  New: walk-in modal, payment mode picker, split payments, PDF invoices');
})();
</script>

<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 4] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, formatDate, showToast, getInitials } = App;

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // ============================================================
  // ===================== EMPLOYEES ============================
  // ============================================================
  const empFilters = { search: '', department: 'all' };

  function renderEmployees(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="empStatCount">—</div>
          <div class="stat-label">Total Employees</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-user-check"></i></div>
          <div class="stat-value" id="empStatActive">—</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-building"></i></div>
          <div class="stat-value" id="empStatDepts">—</div>
          <div class="stat-label">Departments</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-value" id="empStatSalary">—</div>
          <div class="stat-label">Monthly Payroll</div>
        </div>
      </div>

      <div class="card fade-in" id="employeesCard">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-users"></i> Employee Directory</div>
            <div class="card-subtitle">Manage team members, roles, and payroll</div>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="EmployeesModule.openAdd()">
              <i class="fas fa-user-plus"></i> Add Employee
            </button>
            <button class="btn btn-success" onclick="EmployeesModule.exportCSV()">
              <i class="fas fa-download"></i> CSV
            </button>
            <button class="btn btn-purple" onclick="EmployeesModule.exportPDF()">
              <i class="fas fa-file-pdf"></i> PDF
            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="empSearch" placeholder="Search by name, position, email…" oninput="EmployeesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="empDeptTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-dept="all" onclick="EmployeesModule.setDept('all')">All</button>
          </div>
        </div>

        <div class="table-wrapper" id="employeesTableWrapper">
          <table>
            <thead>
              <tr>
                <th>Employee</th>
                <th>Position</th>
                <th>Department</th>
                <th>Contact</th>
                <th>Salary</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeesTableBody">
              <tr><td colspan="7"><div class="loading-block"><div class="loading-spinner"></div><span>Loading employees…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="employeesPagination"></div>
      </div>
    `;

    loadEmployees();
  }

  async function loadEmployees() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading employees…');
      const snap = await App.companyCollection('employees').get();
      state.cache.employees = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.employees.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      const total = state.cache.employees.length;
      const active = state.cache.employees.filter(function (e) {
        return (e.status || 'Active').toLowerCase() === 'active';
      }).length;
      const depts = new Set(state.cache.employees.map(function (e) { return e.department; }).filter(Boolean)).size;
      const payroll = state.cache.employees
        .filter(function (e) { return (e.status || 'Active').toLowerCase() === 'active'; })
        .reduce(function (sum, e) { return sum + (Number(e.salary) || 0); }, 0);

      setText('empStatCount', total);
      setText('empStatActive', active);
      setText('empStatDepts', depts);
      setText('empStatSalary', formatCurrency(payroll));

      App.hideLoading();
      buildEmpDeptTabs();
      renderEmployeesTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Employees] load error:', err);
      showToast('Failed to load employees: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load employees</p></div></td></tr>';
    }
  }

  function buildEmpDeptTabs() {
    const tabs = document.getElementById('empDeptTabs');
    if (!tabs) return;
    const depts = new Set();
    state.cache.employees.forEach(function (e) {
      if (e.department && String(e.department).trim()) depts.add(String(e.department).trim());
    });
    const list = ['all'].concat(Array.from(depts).sort());
    tabs.innerHTML = list.map(function (dept) {
      const isActive = empFilters.department === dept ? 'active' : '';
      const label = dept === 'all' ? 'All' : escapeHtml(dept);
      return '<button class="filter-tab ' + isActive + '" data-dept="' + escapeHtml(dept) + '" onclick="EmployeesModule.setDept(\'' + escapeHtml(dept).replace(/'/g, "\\'") + '\')">' + label + '</button>';
    }).join('');
  }

  function renderEmployeesTable() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;

    let filtered = state.cache.employees.slice();
    if (empFilters.department !== 'all') {
      filtered = filtered.filter(function (e) {
        return String(e.department || '').trim() === empFilters.department;
      });
    }
    if (empFilters.search) {
      const q = empFilters.search.toLowerCase();
      filtered = filtered.filter(function (e) {
        return (e.name || '').toLowerCase().includes(q) ||
               (e.position || '').toLowerCase().includes(q) ||
               (e.email || '').toLowerCase().includes(q) ||
               (e.phone || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.employees;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-users"></i>' +
          '<h4>No employees found</h4>' +
          '<p>' + (state.cache.employees.length === 0
            ? 'Add your first team member to get started'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (e) {
        const status = (e.status || 'Active').toLowerCase();
        const badgeClass = status === 'active' ? 'badge-success'
                         : status === 'inactive' ? 'badge-gray'
                         : status === 'on leave' ? 'badge-warning'
                         : 'badge-info';
        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(e.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(e.name || 'Unnamed') + '</strong>' +
                '<small>' + escapeHtml(e.email || '—') + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(e.position || '—') + '</td>' +
          '<td>' + escapeHtml(e.department || '—') + '</td>' +
          '<td>' + escapeHtml(e.phone || '—') + '</td>' +
          '<td><strong>' + formatCurrency(e.salary) + '</strong></td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(e.status || 'Active') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="EmployeesModule.openEdit(\'' + e.id + '\')"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="EmployeesModule.confirmDelete(\'' + e.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('employeesPagination', pg, totalPages, 'EmployeesModule.goToPage');
  }

  window.EmployeesModule = {
    onSearch: function (val) {
      empFilters.search = val || '';
      state.pagination.employees.page = 1;
      renderEmployeesTable();
    },
    setDept: function (dept) {
      empFilters.department = dept;
      state.pagination.employees.page = 1;
      document.querySelectorAll('#empDeptTabs .filter-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.dept === dept);
      });
      renderEmployeesTable();
    },
    goToPage: function (p) {
      state.pagination.employees.page = p;
      renderEmployeesTable();
    },
    openAdd: function () { openEmployeeForm(null); },
    openEdit: function (id) {
      const e = state.cache.employees.find(function (x) { return x.id === id; });
      if (e) openEmployeeForm(e);
    },
    confirmDelete: function (id) {
      const e = state.cache.employees.find(function (x) { return x.id === id; });
      if (!e) return;
      state.deleteTarget = { collection: 'employees', id: id, label: e.name || 'this employee' };
      App.openDeleteConfirm();
    },
    save: async function (id) {
      const name = document.getElementById('emp_name').value.trim();
      const position = document.getElementById('emp_position').value.trim();
      const department = document.getElementById('emp_department').value.trim();
      const email = document.getElementById('emp_email').value.trim();
      const phone = document.getElementById('emp_phone').value.trim();
      const salary = Number(document.getElementById('emp_salary').value) || 0;
      const hireDate = document.getElementById('emp_hireDate').value;
      const status = document.getElementById('emp_status').value;

      if (!name) { showToast('Employee name is required', 'error'); return; }

      const payload = {
        name: name, position: position, department: department,
        email: email, phone: phone, salary: salary,
        hireDate: hireDate, status: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating employee…' : 'Saving employee…');
        if (id) {
          await db.collection('employees').doc(id).update(payload);
          showToast('Employee updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('employees').add(payload);
          showToast('Employee added successfully', 'success');
        }
        App.hideLoading();
        App.closeGlobalModal();
        loadEmployees();
      } catch (err) {
        App.hideLoading();
        console.error('[Employees] save error:', err);
        showToast('Failed to save employee: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.employees.length === 0) {
        showToast('No employees to export', 'warning');
        return;
      }
      const rows = [['Name', 'Position', 'Department', 'Email', 'Phone', 'Salary', 'Hire Date', 'Status']];
      state.cache.employees.forEach(function (e) {
        rows.push([
          e.name || '', e.position || '', e.department || '',
          e.email || '', e.phone || '', Number(e.salary) || 0,
          e.hireDate || '', e.status || 'Active'
        ]);
      });
      App.downloadCSV(rows, 'employees_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Employees CSV downloaded', 'success');
    },
    exportPDF: async function () {
      const card = document.getElementById('employeesCard');
      if (!card) { showToast('Nothing to export', 'error'); return; }

      const temp = document.createElement('div');
      temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;padding:40px;';
      temp.innerHTML =
        buildPDFHeader('Employee Directory') +
        document.getElementById('employeesTableWrapper').innerHTML +
        buildPDFFooter();

      document.body.appendChild(temp);
      try {
        await App.exportToPDF(temp, 'employees_' + new Date().toISOString().split('T')[0] + '.pdf', { orientation: 'landscape' });
      } finally {
        document.body.removeChild(temp);
      }
    }
  };

  function openEmployeeForm(emp) {
    const isEdit = !!emp;
    const v = isEdit ? emp : {};
    const depts = Array.from(new Set(state.cache.employees.map(function (e) { return e.department; }).filter(Boolean)));
