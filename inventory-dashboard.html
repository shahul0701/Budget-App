<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow | Inventory Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ==================== DESIGN SYSTEM ==================== */
    :root {
      --primary: #4e54c8;
      --primary-light: #8f94fb;
      --success: #00b09b;
      --success-light: #96c93d;
      --warning: #f46b45;
      --warning-light: #eea849;
      --danger: #ff416c;
      --danger-light: #ff4b2b;
      --info: #3498db;
      --purple: #8b5cf6;
      --dark: #0f172a;
      --light: #f8fafc;
      --gray-50: #f9fafb;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-success: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
      --gradient-warning: linear-gradient(135deg, #f46b45 0%, #eea849 100%);
      --gradient-danger: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      --gradient-info: linear-gradient(135deg, #3498db 0%, #6dd5ed 100%);
      --gradient-purple: linear-gradient(135deg, #8b5cf6 0%, #a78bfa 100%);
      --gradient-sidebar: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      --sidebar-width: 270px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
      --shadow-xl: 0 20px 50px rgba(0,0,0,0.18);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    html { scroll-behavior: smooth; }
    body { background: var(--gray-100); min-height: 100vh; color: var(--gray-800); overflow-x: hidden; }

    /* ==================== LAYOUT ==================== */
    .app-container { display: flex; min-height: 100vh; position: relative; }

    /* ==================== SIDEBAR ==================== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--gradient-sidebar);
      color: white;
      position: fixed;
      height: 100vh;
      left: 0; top: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 24px rgba(0,0,0,0.15);
    }
    .sidebar-brand { padding: 1.6rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .sidebar-brand h2 {
      font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; display: flex; align-items: center; gap: 8px;
    }
    .company-info {
      margin-top: 12px; padding: 10px 12px;
      background: rgba(255,255,255,0.08); border-radius: var(--radius-md);
      font-size: 0.8rem; display: flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .company-info span:first-of-type {
      font-weight: 600; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; max-width: 120px;
    }
    .industry-badge {
      background: rgba(96,165,250,0.25); padding: 3px 10px; border-radius: 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.3px;
      text-transform: uppercase; margin-left: auto; white-space: nowrap; color: #bfdbfe;
    }
    .sidebar-nav {
      flex: 1; overflow-y: auto; padding: 1rem 0.8rem;
      scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .sidebar-nav::-webkit-scrollbar { width: 6px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .nav-section { margin-bottom: 1.4rem; }
    .nav-section-title {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.2px;
      color: var(--gray-500); padding: 0.4rem 0.8rem; font-weight: 700;
    }
    .nav-link {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: var(--radius-md);
      color: var(--gray-300); text-decoration: none;
      font-size: 0.875rem; font-weight: 500; cursor: pointer;
      transition: var(--transition); margin: 2px 0;
      position: relative; overflow: hidden;
    }
    .nav-link::before {
      content: ''; position: absolute; left: 0; top: 0;
      height: 100%; width: 3px; background: var(--primary-light);
      transform: scaleY(0); transition: transform 0.25s ease;
      border-radius: 0 3px 3px 0;
    }
    .nav-link:hover { background: rgba(255,255,255,0.08); color: white; transform: translateX(2px); }
    .nav-link.active { background: rgba(96,165,250,0.18); color: white; font-weight: 600; }
    .nav-link.active::before { transform: scaleY(1); }
    .nav-link i { width: 20px; text-align: center; font-size: 1rem; flex-shrink: 0; }
    .sidebar-footer { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }

    /* ==================== MAIN ==================== */
    .main-content {
      flex: 1; margin-left: var(--sidebar-width);
      padding: 1.5rem; min-height: 100vh;
      transition: margin-left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      width: calc(100% - var(--sidebar-width));
    }
    .top-header {
      background: white; padding: 1.1rem 1.5rem;
      border-radius: var(--radius-lg);
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; box-shadow: var(--shadow-sm);
      flex-wrap: wrap; gap: 1rem; position: sticky; top: 1.5rem;
      z-index: 100; border: 1px solid var(--gray-200);
    }
    .header-left h1 {
      font-size: 1.5rem; color: var(--gray-900); font-weight: 800;
      letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
    }
    .header-left p { font-size: 0.8rem; color: var(--gray-500); margin-top: 3px; font-weight: 500; }
    .header-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* ==================== BUTTONS ==================== */
    .btn {
      padding: 9px 18px; border-radius: var(--radius-md); border: none;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      transition: var(--transition); display: inline-flex;
      align-items: center; justify-content: center; gap: 7px;
      white-space: nowrap; font-family: inherit;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: #3f45a8; box-shadow: 0 6px 18px rgba(78,84,200,0.35); transform: translateY(-2px); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #009a88; box-shadow: 0 6px 18px rgba(0,176,155,0.35); transform: translateY(-2px); }
    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #d95a38; box-shadow: 0 6px 18px rgba(244,107,69,0.35); transform: translateY(-2px); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #e03458; box-shadow: 0 6px 18px rgba(255,65,108,0.35); transform: translateY(-2px); }
    .btn-info { background: var(--info); color: white; }
    .btn-info:hover { background: #2980b9; box-shadow: 0 6px 18px rgba(52,152,219,0.35); transform: translateY(-2px); }
    .btn-purple { background: var(--purple); color: white; }
    .btn-purple:hover { background: #7c3aed; box-shadow: 0 6px 18px rgba(139,92,246,0.35); transform: translateY(-2px); }
    .btn-outline { background: transparent; border: 2px solid var(--gray-300); color: var(--gray-700); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: rgba(78,84,200,0.05); }
    .btn-sm { padding: 5px 11px; font-size: 0.75rem; border-radius: var(--radius-sm); }
    .btn-lg { padding: 13px 26px; font-size: 0.95rem; border-radius: var(--radius-lg); }
    .btn-block { width: 100%; }
    .btn-icon { width: 38px; height: 38px; padding: 0; border-radius: var(--radius-md); }

    /* ==================== CARDS ==================== */
    .card {
      background: white; border-radius: var(--radius-xl); padding: 1.5rem;
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      transition: var(--transition);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.2rem; flex-wrap: wrap; gap: 12px;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 8px; }
    .card-subtitle { font-size: 0.8rem; color: var(--gray-500); margin-top: 4px; font-weight: 500; }

    /* ==================== STATS ==================== */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1.2rem; margin-bottom: 1.5rem;
    }
    .stat-card {
      background: white; padding: 1.4rem; border-radius: var(--radius-xl);
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
      transition: var(--transition); cursor: pointer;
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 4px; height: 100%; background: var(--primary);
      border-radius: 0 4px 4px 0;
    }
    .stat-card:nth-child(2)::before { background: var(--success); }
    .stat-card:nth-child(3)::before { background: var(--warning); }
    .stat-card:nth-child(4)::before { background: var(--purple); }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .stat-icon {
      font-size: 1.8rem; margin-bottom: 0.6rem;
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px; border-radius: var(--radius-md);
      background: rgba(78,84,200,0.1); color: var(--primary);
    }
    .stat-card:nth-child(2) .stat-icon { background: rgba(0,176,155,0.1); color: var(--success); }
    .stat-card:nth-child(3) .stat-icon { background: rgba(244,107,69,0.1); color: var(--warning); }
    .stat-card:nth-child(4) .stat-icon { background: rgba(139,92,246,0.1); color: var(--purple); }
    .stat-value { font-size: 1.9rem; font-weight: 800; color: var(--gray-900); letter-spacing: -0.5px; line-height: 1.1; }
    .stat-label { color: var(--gray-500); font-size: 0.82rem; font-weight: 600; margin-top: 4px; }
    .stat-change { font-size: 0.72rem; margin-top: 8px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .stat-change.positive { color: var(--success); }
    .stat-change.negative { color: var(--danger); }
    .stat-change.warning { color: var(--warning); }

    /* ==================== GRIDS ==================== */
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 1.5rem; margin-bottom: 1.5rem;
    }

    /* ==================== TABLES ==================== */
    .table-wrapper { overflow-x: auto; border-radius: var(--radius-md); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; min-width: 600px; }
    thead th {
      background: var(--gray-50); padding: 12px 14px; text-align: left;
      font-weight: 700; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--gray-500);
      border-bottom: 2px solid var(--gray-200); white-space: nowrap;
    }
    tbody td {
      padding: 13px 14px; border-bottom: 1px solid var(--gray-100);
      font-size: 0.875rem; color: var(--gray-700); vertical-align: middle;
    }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--gray-50); }
    tbody tr:last-child td { border-bottom: none; }

    /* ==================== BADGES ==================== */
    .badge {
      padding: 4px 11px; border-radius: 20px; font-size: 0.68rem;
      font-weight: 700; display: inline-flex; align-items: center;
      gap: 4px; letter-spacing: 0.2px; white-space: nowrap;
    }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fef3c7; color: #92400e; }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-info { background: #dbeafe; color: #1e40af; }
    .badge-purple { background: #ede9fe; color: #5b21b6; }
    .badge-gray { background: var(--gray-200); color: var(--gray-600); }

    /* ==================== PROGRESS ==================== */
    .progress-bar { height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; width: 100%; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .progress-fill.success { background: var(--gradient-success); }
    .progress-fill.warning { background: var(--gradient-warning); }
    .progress-fill.danger { background: var(--gradient-danger); }
    .progress-fill.info { background: var(--gradient-info); }

    /* ==================== AVATAR ==================== */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: 0.85rem;
      flex-shrink: 0; background: var(--gradient-primary);
    }
    .avatar-sm { width: 32px; height: 32px; font-size: 0.7rem; }
    .avatar-lg { width: 56px; height: 56px; font-size: 1.1rem; }
    .user-cell { display: flex; align-items: center; gap: 12px; }
    .user-cell-info strong { display: block; font-size: 0.875rem; color: var(--gray-900); font-weight: 600; }
    .user-cell-info small { font-size: 0.72rem; color: var(--gray-500); }

    /* ==================== ACTIVITY ==================== */
    .activity-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--gray-100); }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon {
      width: 42px; height: 42px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .activity-icon.green { background: #d1fae5; color: #065f46; }
    .activity-icon.blue { background: #dbeafe; color: #1e40af; }
    .activity-icon.yellow { background: #fef3c7; color: #92400e; }
    .activity-icon.red { background: #fee2e2; color: #991b1b; }
    .activity-icon.purple { background: #ede9fe; color: #5b21b6; }
    .activity-content { flex: 1; min-width: 0; }
    .activity-content strong { display: block; font-size: 0.85rem; color: var(--gray-900); font-weight: 600; }
    .activity-content small { font-size: 0.75rem; color: var(--gray-500); }
    .activity-time { font-size: 0.7rem; color: var(--gray-400); white-space: nowrap; }

    /* ==================== EMPTY STATE ==================== */
    .empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--gray-400); }
    .empty-state i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; display: block; }
    .empty-state p { font-size: 0.9rem; font-weight: 500; color: var(--gray-500); }
    .empty-state h4 { font-size: 1.05rem; color: var(--gray-700); margin-bottom: 6px; font-weight: 700; }

    /* ==================== MODAL ==================== */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,0.65);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      justify-content: center; align-items: center;
      z-index: 2000; padding: 20px;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .modal.active { display: flex; opacity: 1; }
    .modal-content {
      background: white; border-radius: var(--radius-2xl);
      padding: 0; max-width: 560px; width: 100%;
      max-height: 88vh; overflow-y: auto;
      animation: modalSlideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-xl); scrollbar-width: thin;
    }
    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-header {
      padding: 1.4rem 1.6rem; background: var(--gradient-primary);
      color: white; display: flex; justify-content: space-between;
      align-items: center; border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
      position: sticky; top: 0; z-index: 10;
    }
    .modal-header h3 { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .modal-close {
      background: rgba(255,255,255,0.2); border: none; color: white;
      width: 34px; height: 34px; border-radius: 50%;
      font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition); line-height: 1;
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); transform: rotate(90deg); }
    .modal-body { padding: 1.6rem; }

    /* ==================== FORMS ==================== */
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.82rem; color: var(--gray-700); }
    .form-group label .required { color: var(--danger); margin-left: 2px; }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-md);
      font-size: 0.9rem; transition: var(--transition);
      background: white; font-family: inherit; color: var(--gray-800);
    }
    .form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(78,84,200,0.1); }
    .form-control::placeholder { color: var(--gray-400); }
    textarea.form-control { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-actions {
      display: flex; gap: 12px; margin-top: 1.4rem;
      padding-top: 1.2rem; border-top: 1px solid var(--gray-200);
    }
    .form-actions .btn { flex: 1; }
    .form-hint { font-size: 0.72rem; color: var(--gray-500); margin-top: 4px; }

    /* ==================== SEARCH / FILTERS ==================== */
    .search-bar { position: relative; max-width: 420px; width: 100%; }
    .search-bar input {
      width: 100%; padding: 10px 16px 10px 40px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-md);
      font-size: 0.875rem; transition: var(--transition);
      background: white; font-family: inherit;
    }
    .search-bar input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(78,84,200,0.1); }
    .search-bar i {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%); color: var(--gray-400); font-size: 0.9rem;
    }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter-tab {
      padding: 7px 16px; border-radius: 20px;
      border: 2px solid var(--gray-200); background: white;
      font-size: 0.8rem; font-weight: 600; color: var(--gray-600);
      cursor: pointer; transition: var(--transition); font-family: inherit;
    }
    .filter-tab:hover { border-color: var(--primary-light); color: var(--primary); }
    .filter-tab.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ==================== PAGINATION ==================== */
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 1.4rem; flex-wrap: wrap; }
    .page-btn {
      min-width: 38px; height: 38px; padding: 0 12px;
      border: 2px solid var(--gray-200); border-radius: var(--radius-md);
      background: white; cursor: pointer; font-weight: 600;
      font-size: 0.82rem; color: var(--gray-600);
      transition: var(--transition); font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ==================== TOAST ==================== */
    .toast-container {
      position: fixed; top: 20px; right: 20px;
      z-index: 9999; display: flex; flex-direction: column;
      gap: 10px; max-width: 360px;
    }
    .toast {
      background: white; border-radius: var(--radius-md);
      padding: 14px 18px; box-shadow: var(--shadow-lg);
      display: flex; align-items: flex-start; gap: 12px;
      animation: toastSlideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 4px solid var(--info); min-width: 280px;
    }
    @keyframes toastSlideIn {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast.removing { animation: toastSlideOut 0.3s ease forwards; }
    @keyframes toastSlideOut { to { transform: translateX(110%); opacity: 0; } }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    .toast.info { border-left-color: var(--info); }
    .toast-icon { font-size: 1.2rem; margin-top: 1px; flex-shrink: 0; }
    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.warning .toast-icon { color: var(--warning); }
    .toast.info .toast-icon { color: var(--info); }
    .toast-content { flex: 1; min-width: 0; }

<script>
(function () {
  'use strict';

  // ---------- Error display ----------
  window.addEventListener('error', function (e) {
    console.error('[Global error]', e.error || e.message);

  window.addEventListener('unhandledrejection', function (e) {

  function showErrorOverlay(message) {
    const overlay = document.getElementById('errorOverlay');

    const pre = document.createElement('pre');
    pre.textContent = message || 'Unknown error';
    details.innerHTML = '';
    details.appendChild(pre);
    overlay.classList.add('active');
  }

  // ---------- Firebase config ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBhjgu6vpBRhMVjMs5RgSL4aViJq6GYy1A",
    authDomain: "budget-app-1365f.firebaseapp.com",
    databaseURL: "https://budget-app-1365f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "budget-app-1365f",
    storageBucket: "budget-app-1365f.firebasestorage.app",
    messagingSenderId: "1036194450411",
    appId: "1:1036194450411:web:78ca39a5a82ab9db6c67ae",

  };

  let db, auth;
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // Enable offline persistence (best-effort)
    db.enablePersistence({ synchronizeTabs: true }).catch(function (err) {
      if (err.code === 'failed-precondition') console.warn('Persistence failed: multiple tabs open');
      else if (err.code === 'unimplemented') console.warn('Persistence not supported');
    });
  } catch (err) {
    console.error('Firebase init failed:', err);
    showErrorOverlay('Firebase init failed: ' + (err.message || err));
  }

  // ---------- Page titles ----------
  const PAGE_TITLES = {
    dashboard: '📈 Dashboard Overview',
    inventory: '📦 Inventory Management',
    sales: '💰 Sales Orders',
    purchases: '🚚 Purchase Orders',
    employees: '👥 Employee Management',
    customers: '🤝 Customer Relations',
    suppliers: '🏭 Supplier Management',
    projects: '📋 Project Management',
    accounts: '💵 Financial Accounts',
    expenses: '🧾 Expense Tracking',
    reports: '📊 Analytics & Reports',
    calendar: '📅 Calendar',
    documents: '📄 Document Repository',
    settings: '⚙️ Settings'
  };

  // ---------- State ----------
  const state = {
    company: null,
    user: null,
    currentPage: 'dashboard',
    cache: {
      inventory: [], sales: [], purchases: [], employees: [],
      customers: [], suppliers: [], projects: [],
      transactions: [], expenses: [], documents: []
    },
    pagination: {
      inventory: { page: 1, perPage: 10 },
      sales: { page: 1, perPage: 10 },
      purchases: { page: 1, perPage: 10 },
      employees: { page: 1, perPage: 10 },
      customers: { page: 1, perPage: 10 },
      suppliers: { page: 1, perPage: 10 },
      transactions: { page: 1, perPage: 10 },
      expenses: { page: 1, perPage: 10 },
      documents: { page: 1, perPage: 10 }
    },
    deleteTarget: null
  };

  // ---------- Renderer registry (later parts add to this) ----------
  const pageRenderers = {};

  function registerPageRenderer(name, fn) {
    pageRenderers[name] = fn;
    console.log('[Router] Registered renderer:', name);
  }

  // ---------- Navigate / router ----------
  function navigateTo(page) {
    state.currentPage = page;
    const titleEl = document.getElementById('pageTitle');
    if (titleEl) titleEl.textContent = PAGE_TITLES[page] || page;

    const container = document.getElementById('dynamicContent');
    container.innerHTML =
      '<div class="loading-block">' +
        '<div class="loading-spinner lg"></div>' +
        '<span>Loading ' + escapeHtml(PAGE_TITLES[page] || page) + '…</span>' +
      '</div>';

    const renderer = pageRenderers[page];
    if (typeof renderer === 'function') {
      try {
        renderer(container);
      } catch (err) {
        console.error('Renderer for "' + page + '" threw:', err);
        container.innerHTML =
          '<div class="card"><div class="empty-state">' +
            '<i class="fas fa-exclamation-triangle"></i>' +
            '<h4>Module error</h4>' +
            '<p>' + escapeHtml(err.message || 'Unknown') + '</p>' +
          '</div></div>';
        showErrorOverlay((err.stack || err.message || String(err)));
      }
    } else {
      container.innerHTML =
        '<div class="card"><div class="empty-state">' +
          '<i class="fas fa-tools"></i>' +
          '<h4>' + escapeHtml(PAGE_TITLES[page] || page) + '</h4>' +
          '<p>This module is not installed yet (expecting Part 2+).</p>' +
        '</div></div>';
    }
  }

  // ---------- Utility: escape HTML ----------
  function escapeHtml(text) {
    if (text == null) return '';
    return String(text).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  // ---------- Utility: format currency ----------
  function formatCurrency(amount) {
    const n = Number(amount) || 0;
    return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  // ---------- Utility: format date ----------
  function formatDate(v) {
    if (!v) return 'N/A';
    let d;
    if (typeof v.toDate === 'function') d = v.toDate();
    else d = new Date(v);
    if (isNaN(d.getTime())) return 'N/A';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // ---------- Utility: initials ----------
  function getInitials(name) {
    if (!name) return '?';
    return String(name).trim().split(/\s+/).map(function (n) { return n[0]; }).join('').toUpperCase().slice(0, 2);
  }

  // ---------- Toast ----------
  function showToast(message, type) {
    type = type || 'info';
    const container = document.getElementById('toastContainer');
    if (!container) return;
    const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
    const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.innerHTML =
      '<i class="fas ' + (icons[type] || icons.info) + ' toast-icon"></i>' +
      '<div class="toast-content"><div class="toast-title">' + (titles[type] || 'Info') + '</div>' +
      '<div class="toast-message">' + escapeHtml(message) + '</div></div>' +
      '<button class="toast-close" aria-label="Close">&times;</button>';
    toast.querySelector('.toast-close').addEventListener('click', function () { removeToast(toast); });
    container.appendChild(toast);
    setTimeout(function () { removeToast(toast); }, 4500);
  }

  function removeToast(toast) {
    if (!toast || !toast.parentElement) return;
    toast.classList.add('removing');
    setTimeout(function () {
      if (toast.parentElement) toast.parentElement.removeChild(toast);
    }, 300);
  }

  // ---------- Modal ----------
  function openGlobalModal(htmlContent) {
    const modal = document.getElementById('globalModal');
    document.getElementById('modalContent').innerHTML = htmlContent;
    modal.classList.add('active');
  }

  function closeGlobalModal() {
    document.getElementById('globalModal').classList.remove('active');
  }

  // Close modal on overlay click
  document.getElementById('globalModal').addEventListener('click', function (e) {
    if (e.target === this) closeGlobalModal();
  });

  // Close modal on Escape
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeGlobalModal();
  });

  // ---------- Live clock ----------
  function updateDateTime() {
    const el = document.getElementById('currentDateTime');
    if (!el) return;
    const now = new Date();
    el.textContent = now.toLocaleString('en-US', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  // ---------- Sidebar (mobile) ----------
  function initSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggle = document.getElementById('menuToggle');
    if (!sidebar || !overlay || !toggle) return;

    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('active'); }

    toggle.addEventListener('click', function () {
      if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
    });
    overlay.addEventListener('click', closeSidebar);
  }

  // ---------- Navigation ----------
  function setupNavigation() {
    document.querySelectorAll('.nav-link').forEach(function (link) {
      link.addEventListener('click', function () {
        const page = this.dataset.page;
        if (!page) return;
        document.querySelectorAll('.nav-link').forEach(function (l) { l.classList.remove('active'); });
        this.classList.add('active');
        if (window.innerWidth <= 768) {
          const sb = document.getElementById('sidebar');
          const ov = document.getElementById('sidebarOverlay');
          if (sb) sb.classList.remove('open');
          if (ov) ov.classList.remove('active');
        }
        navigateTo(page);
      });
    });
  }

  // ---------- Logout ----------
  function logout() {
    if (!confirm('Sign out of this workspace?')) return;
    sessionStorage.removeItem('activeCompany');
    sessionStorage.removeItem('companyAuth');
    if (auth) {
      auth.signOut().catch(function () {}).finally(function () {
        window.location.href = 'dashboard.html';
      });
    } else {
      window.location.href = 'dashboard.html';
    }
  }

  // ---------- Session bootstrap (SAFE - always proceeds) ----------
  function bootstrap() {
    let companySession = null;
    try { companySession = JSON.parse(sessionStorage.getItem('activeCompany')); } catch (e) {}

    const hasAuthFlag = sessionStorage.getItem('companyAuth') === 'true';

    if (!companySession) {
      // Fallback demo company so the dashboard always loads
      companySession = {
        id: 'demo-company-' + (localStorage.getItem('demoCompanyId') || 'default'),
        name: 'Demo Company',
        type: 'Demo',
        userId: 'demo-user'
      };
      // Persist demo id so multiple reloads share the same data bucket
      if (!localStorage.getItem('demoCompanyId')) {
        localStorage.setItem('demoCompanyId', Math.random().toString(36).slice(2, 10));
        companySession.id = 'demo-company-' + localStorage.getItem('demoCompanyId');
      } else {
        companySession.id = 'demo-company-' + localStorage.getItem('demoCompanyId');
      }
      sessionStorage.setItem('activeCompany', JSON.stringify(companySession));
      sessionStorage.setItem('companyAuth', 'true');
      console.warn('[Bootstrap] No activeCompany — using demo workspace:', companySession.id);
      showToast('No company session found — using demo workspace', 'warning');
    }

    state.company = companySession;

    // Sidebar company info
    const sc = document.getElementById('sidebarCompany');
    const si = document.getElementById('sidebarIndustry');
    if (sc) sc.textContent = companySession.name || 'Company';
    if (si) si.textContent = companySession.type || 'Type';

    // Wait for auth (but don't redirect; proceed regardless)
    let authHandled = false;
    function proceed(user) {
      if (authHandled) return;
      authHandled = true;
      state.user = user || { email: 'demo@budgetflow.app', uid: 'demo-user' };
      const ue = document.getElementById('userEmail');
      if (ue) ue.innerHTML = '<i class="fas fa-user-circle"></i> ' + escapeHtml(state.user.email || 'User');

      initSidebar();
      setupNavigation();
      updateDateTime();
      setInterval(updateDateTime, 1000);

      // Kick off the dashboard
      navigateTo('dashboard');
      console.log('[Bootstrap] Ready. Company:', state.company.id);
    }

    if (auth) {
      // Give auth 2 seconds to resolve; otherwise proceed anonymously
      const fallback = setTimeout(function () {
        console.warn('[Bootstrap] Auth timeout — proceeding without user');
        proceed(null);
      }, 2000);

      auth.onAuthStateChanged(function (user) {
        clearTimeout(fallback);
        proceed(user);
      }, function (err) {
        console.warn('[Bootstrap] Auth error:', err);
        clearTimeout(fallback);
        proceed(null);
      });
    } else {
      proceed(null);
    }
  }

  // ---------- Firestore helpers (used by all parts) ----------
  function companyCollection(name) {
    if (!state.company) throw new Error('No company in state');
    return db.collection(name).where('companyId', '==', state.company.id);
  }

  // ---------- CSV download ----------
  function downloadCSV(rows, filename) {
    const csv = rows.map(function (r) {
      return r.map(function (cell) {
        const s = String(cell == null ? '' : cell);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Shared pagination renderer ----------
  function renderPagination(containerId, pg, totalPages, goToFnName) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (totalPages <= 1) { el.innerHTML = ''; return; }
    let html = '<button class="page-btn" ' + (pg.page === 1 ? 'disabled' : '') + ' onclick="App.' + goToFnName + '(' + (pg.page - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
        if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
        continue;
      }
      html += '<button class="page-btn ' + (i === pg.page ? 'active' : '') + '" onclick="App.' + goToFnName + '(' + i + ')">' + i + '</button>';
    }
    html += '<button class="page-btn" ' + (pg.page === totalPages ? 'disabled' : '') + ' onclick="App.' + goToFnName + '(' + (pg.page + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
    el.innerHTML = html;
  }

  // ---------- Shared delete confirmation ----------
  function openDeleteConfirm() {
    const t = state.deleteTarget;
    if (!t) return;
    const html =
      '<div class="modal-header" style="background: var(--gradient-danger);">' +
        '<h3><i class="fas fa-trash-alt"></i> Confirm Delete</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal(); App.state.deleteTarget=null;">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<p style="margin-bottom: 1.4rem; font-size: 0.95rem; color: var(--gray-700);">' +
          'Are you sure you want to delete <strong>' + escapeHtml(t.label) + '</strong>? This action cannot be undone.' +
        '</p>' +
        '<div class="form-actions">' +
          '<button class="btn btn-outline" onclick="App.closeGlobalModal(); App.state.deleteTarget=null;">Cancel</button>' +
          '<button class="btn btn-danger" onclick="App.confirmDelete()"><i class="fas fa-trash"></i> Delete Permanently</button>' +
        '</div>' +
      '</div>';
    openGlobalModal(html);
  }

  async function confirmDelete() {
    const t = state.deleteTarget;
    if (!t) return;
    try {
      await db.collection(t.collection).doc(t.id).delete();
      showToast('Deleted successfully', 'success');
      closeGlobalModal();
      state.deleteTarget = null;
      // Reload current page
      navigateTo(state.currentPage);
    } catch (err) {
      console.error('Delete error:', err);
      showToast('Failed to delete: ' + (err.message || 'Unknown'), 'error');
    }
  }

  // ---------- Expose global App ----------
  window.App = {
    db: db,
    auth: auth,
    state: state,
    firebase: firebase,

    // Utilities
    escapeHtml: escapeHtml,
    formatCurrency: formatCurrency,
    formatDate: formatDate,
    getInitials: getInitials,
    showToast: showToast,
    downloadCSV: downloadCSV,
    renderPagination: renderPagination,
    companyCollection: companyCollection,

    // Modal
    openGlobalModal: openGlobalModal,
    closeGlobalModal: closeGlobalModal,

    // Delete
    openDeleteConfirm: openDeleteConfirm,
    confirmDelete: confirmDelete,

    // Navigation
    navigateTo: navigateTo,
    registerPageRenderer: registerPageRenderer,
    PAGE_TITLES: PAGE_TITLES,

    // Logout
    logout: logout,

    // Debug
    showErrorOverlay: showErrorOverlay
  };

  // ---------- Kick off ----------
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }

  console.log('[Part 1] App shell initialized ✓');
})();
</script>

</body>

<!-- ============================================================
     PART 2 — DASHBOARD + INVENTORY MODULES
     Insert AFTER the Part 1 script block (before </body>).
     ============================================================ -->
<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) {
    console.error('[Part 2] App not found — Part 1 must load first.');
    return;
  }

  const { db, state, escapeHtml, formatCurrency, getInitials, showToast } = App;

  // ============================================================
  // ====================== DASHBOARD ===========================
  // ============================================================
  function renderDashboard(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" id="dashboardStats">
        <div class="stat-card" onclick="App.navigateTo('inventory')">
          <div class="stat-icon"><i class="fas fa-boxes"></i></div>
          <div class="stat-value" id="statProducts">—</div>
          <div class="stat-label">Total Products</div>
          <div class="stat-change positive"><i class="fas fa-check-circle"></i> In stock</div>
        </div>
        <div class="stat-card" onclick="App.navigateTo('sales')">
          <div class="stat-icon"><i class="fas fa-shopping-cart"></i></div>
          <div class="stat-value" id="statSales">—</div>
          <div class="stat-label">Total Sales</div>
          <div class="stat-change positive"><i class="fas fa-arrow-up"></i> Revenue tracked</div>
        </div>
        <div class="stat-card" onclick="App.navigateTo('customers')">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="statCustomers">—</div>
          <div class="stat-label">Customers</div>
          <div class="stat-change positive"><i class="fas fa-user-check"></i> Active</div>
        </div>
        <div class="stat-card" onclick="App.navigateTo('sales')">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="statPending">—</div>
          <div class="stat-label">Pending Orders</div>
          <div class="stat-change warning"><i class="fas fa-exclamation-triangle"></i> Needs attention</div>
        </div>
      </div>

      <div class="dashboard-grid fade-in">
        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-chart-line"></i> Recent Sales</div>
            <button class="btn btn-sm btn-primary" onclick="App.navigateTo('sales')">
              View All <i class="fas fa-arrow-right"></i>
            </button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>Order</th><th>Customer</th><th>Amount</th><th>Status</th></tr>
              </thead>
              <tbody id="recentSalesBody">
                <tr><td colspan="4"><div class="loading-block"><div class="loading-spinner"></div><span>Loading…</span></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-exclamation-triangle"></i> Low Stock Items</div>
            <button class="btn btn-sm btn-warning" onclick="App.navigateTo('inventory')">
              View All <i class="fas fa-arrow-right"></i>
            </button>
          </div>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr><th>Item</th><th>Stock</th><th>Status</th></tr>
              </thead>
              <tbody id="lowStockBody">
                <tr><td colspan="3"><div class="loading-block"><div class="loading-spinner"></div><span>Loading…</span></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div class="card-title"><i class="fas fa-clock"></i> Recent Activity</div>
        </div>
        <div id="activityFeed">
          <div class="loading-block"><div class="loading-spinner"></div><span>Loading activity…</span></div>
        </div>
      </div>
    `;

    loadDashboardData();
  }

  async function loadDashboardData() {
    try {
      const [invSnap, salesSnap, custSnap] = await Promise.all([
        App.companyCollection('inventory').get(),
        App.companyCollection('sales').get(),
        App.companyCollection('customers').get()
      ]);

      const inventory = invSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const sales = salesSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

      // Cache
      state.cache.inventory = inventory;
      state.cache.sales = sales;

      // Stat calculations
      const totalSales = sales.reduce(function (s, x) { return s + (Number(x.total) || 0); }, 0);
      const pendingSales = sales.filter(function (s) {
        return (s.status || '').toLowerCase() === 'pending';
      });

      // Sort sales newest first
      sales.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      setText('statProducts', inventory.length);
      setText('statSales', formatCurrency(totalSales));
      setText('statCustomers', custSnap.size);
      setText('statPending', pendingSales.length);

      // Recent sales
      const recentBody = document.getElementById('recentSalesBody');
      if (recentBody) {
        const recent = sales.slice(0, 5);
        if (recent.length === 0) {
          recentBody.innerHTML =
            '<tr><td colspan="4"><div class="empty-state"><i class="fas fa-receipt"></i><p>No sales recorded yet</p></div></td></tr>';
        } else {
          recentBody.innerHTML = recent.map(function (sale) {
            const status = (sale.status || 'pending').toLowerCase();
            const badgeClass = status === 'completed' ? 'badge-success'
                             : status === 'pending' ? 'badge-warning'
                             : status === 'cancelled' ? 'badge-danger'
                             : 'badge-info';
            return '<tr>' +
              '<td><strong>#' + escapeHtml(sale.invoiceNo || sale.id.slice(-6).toUpperCase()) + '</strong></td>' +
              '<td>' + escapeHtml(sale.customerName || 'Walk-in') + '</td>' +
              '<td><strong>' + formatCurrency(sale.total) + '</strong></td>' +
              '<td><span class="badge ' + badgeClass + '">' + escapeHtml(sale.status || 'pending') + '</span></td>' +
              '</tr>';
          }).join('');
        }
      }

      // Low stock
      const lowBody = document.getElementById('lowStockBody');
      if (lowBody) {
        const lowStock = inventory
          .filter(function (p) { return (Number(p.stock) || 0) < 10; })
          .sort(function (a, b) { return (Number(a.stock) || 0) - (Number(b.stock) || 0); })
          .slice(0, 6);

        if (lowStock.length === 0) {
          lowBody.innerHTML =
            '<tr><td colspan="3"><div class="empty-state"><i class="fas fa-check-circle"></i><p>All items well stocked</p></div></td></tr>';
        } else {
          lowBody.innerHTML = lowStock.map(function (p) {
            const stock = Number(p.stock) || 0;
            const badgeClass = stock === 0 ? 'badge-danger' : 'badge-warning';
            const label = stock === 0 ? 'Out' : 'Low';
            return '<tr>' +
              '<td><strong>' + escapeHtml(p.name || 'Unnamed') + '</strong></td>' +
              '<td>' + stock + '</td>' +
              '<td><span class="badge ' + badgeClass + '">' + label + '</span></td>' +
              '</tr>';
          }).join('');
        }
      }

      // Activity feed
      renderActivityFeed(sales, inventory);
    } catch (err) {
      console.error('[Dashboard] load error:', err);
      showToast('Failed to load dashboard data: ' + (err.message || 'Unknown'), 'error');
      const rb = document.getElementById('recentSalesBody');
      const lb = document.getElementById('lowStockBody');
      if (rb) rb.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div></td></tr>';
      if (lb) lb.innerHTML = '<tr><td colspan="3"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div></td></tr>';
    }
  }

  function renderActivityFeed(sales, inventory) {
    const feed = document.getElementById('activityFeed');
    if (!feed) return;

    const items = [];

    sales.slice(0, 4).forEach(function (s) {
      items.push({
        icon: 'fa-shopping-cart',
        color: 'green',
        title: 'Sale recorded — ' + formatCurrency(s.total),
        subtitle: (s.customerName || 'Walk-in') + (s.invoiceNo ? ' • #' + s.invoiceNo : ''),
        time: s.createdAt
      });
    });

    inventory.slice(0, 3).forEach(function (p) {
      items.push({
        icon: 'fa-box',
        color: 'blue',
        title: 'Product in catalog — ' + (p.name || 'Unnamed'),
        subtitle: 'Stock: ' + (Number(p.stock) || 0) + ' units',
        time: p.createdAt
      });
    });

    const lowCount = inventory.filter(function (p) { return (Number(p.stock) || 0) < 10; }).length;
    if (lowCount > 0) {
      items.unshift({
        icon: 'fa-exclamation-triangle',
        color: 'yellow',
        title: lowCount + ' item(s) need restocking',
        subtitle: 'Check the Low Stock panel',
        time: null
      });
    }

    if (items.length === 0) {
      feed.innerHTML =
        '<div class="empty-state"><i class="fas fa-clock"></i><p>No activity yet — start by adding products or sales</p></div>';
      return;
    }

    feed.innerHTML = items.map(function (it) {
      return '<div class="activity-item">' +
        '<div class="activity-icon ' + it.color + '"><i class="fas ' + it.icon + '"></i></div>' +
        '<div class="activity-content">' +
          '<strong>' + escapeHtml(it.title) + '</strong>' +
          '<small>' + escapeHtml(it.subtitle) + '</small>' +
        '</div>' +
        '<div class="activity-time">' + (it.time ? timeAgo(it.time) : 'now') + '</div>' +
        '</div>';
    }).join('');
  }

  function timeAgo(dateVal) {
    if (!dateVal) return 'now';
    let d;
    if (typeof dateVal.toDate === 'function') d = dateVal.toDate();
    else d = new Date(dateVal);
    const diff = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  }

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // ============================================================
  // ====================== INVENTORY ===========================
  // ============================================================
  const invFilters = { search: '', category: 'all' };

  function renderInventory(container) {
    container.innerHTML = `
      <div class="card fade-in">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-boxes"></i> Product Inventory</div>
            <div class="card-subtitle">Manage products, stock levels, and pricing</div>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="InventoryModule.openAdd()">
              <i class="fas fa-plus"></i> Add Product
            </button>
            <button class="btn btn-success" onclick="InventoryModule.exportCSV()">
              <i class="fas fa-download"></i> Export
            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="invSearch" placeholder="Search by name, SKU, or category…" oninput="InventoryModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="invCategoryTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-cat="all" onclick="InventoryModule.setCategory('all')">All</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Stock</th>
                <th>Price</th>
                <th>Value</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <tr><td colspan="8"><div class="loading-block"><div class="loading-spinner"></div><span>Loading inventory…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="inventoryPagination"></div>
      </div>
    `;

    loadInventory();
  }

  async function loadInventory() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('inventory').get();
      state.cache.inventory = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      buildCategoryTabs();
      renderInventoryTable();
    } catch (err) {
      console.error('[Inventory] load error:', err);
      showToast('Failed to load inventory: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load inventory</p></div></td></tr>';
    }
  }

  function buildCategoryTabs() {
    const tabs = document.getElementById('invCategoryTabs');
    if (!tabs) return;
    const cats = new Set();
    state.cache.inventory.forEach(function (p) {
      if (p.category && String(p.category).trim()) cats.add(String(p.category).trim());
    });
    const list = ['all'].concat(Array.from(cats).sort());
    tabs.innerHTML = list.map(function (cat) {
      const isActive = invFilters.category === cat ? 'active' : '';
      const label = cat === 'all' ? 'All' : escapeHtml(cat);
      return '<button class="filter-tab ' + isActive + '" data-cat="' + escapeHtml(cat) + '" onclick="InventoryModule.setCategory(\'' + escapeHtml(cat).replace(/'/g, "\\'") + '\')">' + label + '</button>';
    }).join('');
  }

  function renderInventoryTable() {
    const tbody = document.getElementById('inventoryTableBody');
    if (!tbody) return;

    let filtered = state.cache.inventory.slice();

    if (invFilters.category !== 'all') {
      filtered = filtered.filter(function (p) {
        return String(p.category || '').trim() === invFilters.category;
      });
    }

    if (invFilters.search) {
      const q = invFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.name || '').toLowerCase().includes(q) ||
               (p.sku || '').toLowerCase().includes(q) ||
               (p.category || '').toLowerCase().includes(q);
      });
    }

    filtered.sort(function (a, b) {
      return String(a.name || '').localeCompare(String(b.name || ''));
    });

    const pg = state.pagination.inventory;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="8"><div class="empty-state">' +
          '<i class="fas fa-box-open"></i>' +
          '<h4>No products found</h4>' +
          '<p>' + (state.cache.inventory.length === 0
            ? 'Add your first product to get started'
            : 'Try adjusting your search or filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (p) {
        const stock = Number(p.stock) || 0;
        const price = Number(p.price) || 0;
        const value = stock * price;
        const statusBadge = stock > 20 ? 'badge-success'
                          : stock > 5  ? 'badge-warning'
                          : stock > 0  ? 'badge-danger'
                          : 'badge-gray';
        const statusLabel = stock > 20 ? 'In Stock'
                          : stock > 5  ? 'Low'
                          : stock > 0  ? 'Critical'
                          : 'Out of Stock';
        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(p.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(p.name || 'Unnamed') + '</strong>' +
                '<small>' + (p.barcode ? 'Barcode: ' + escapeHtml(p.barcode) : 'ID: ' + p.id.slice(-6)) + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(p.sku || '—') + '</td>' +
          '<td>' + escapeHtml(p.category || 'General') + '</td>' +
          '<td><strong>' + stock + '</strong></td>' +
          '<td>' + formatCurrency(price) + '</td>' +
          '<td><strong>' + formatCurrency(value) + '</strong></td>' +
          '<td><span class="badge ' + statusBadge + '">' + statusLabel + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="InventoryModule.openEdit(\'' + p.id + '\')"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="InventoryModule.confirmDelete(\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    // Pagination
    const pagEl = document.getElementById('inventoryPagination');
    if (pagEl) {
      if (totalPages <= 1) {
        pagEl.innerHTML = '';
      } else {
        let html = '<button class="page-btn" ' + (pg.page === 1 ? 'disabled' : '') + ' onclick="InventoryModule.goToPage(' + (pg.page - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
        for (let i = 1; i <= totalPages; i++) {
          if (totalPages > 7 && i !== 1 && i !== totalPages && Math.abs(i - pg.page) > 1) {
            if (i === 2 || i === totalPages - 1) html += '<span class="page-btn" style="border:none;background:none;cursor:default;">…</span>';
            continue;
          }
          html += '<button class="page-btn ' + (i === pg.page ? 'active' : '') + '" onclick="InventoryModule.goToPage(' + i + ')">' + i + '</button>';
        }
        html += '<button class="page-btn" ' + (pg.page === totalPages ? 'disabled' : '') + ' onclick="InventoryModule.goToPage(' + (pg.page + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
        pagEl.innerHTML = html;
      }
    }
  }

  // ============================================================
  // ==================== INVENTORY MODULE API =================
  // ============================================================
  window.InventoryModule = {
    onSearch: function (val) {
      invFilters.search = val || '';
      state.pagination.inventory.page = 1;
      renderInventoryTable();
    },

    setCategory: function (cat) {
      invFilters.category = cat;
      state.pagination.inventory.page = 1;
      document.querySelectorAll('#invCategoryTabs .filter-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      renderInventoryTable();
    },

    goToPage: function (p) {
      state.pagination.inventory.page = p;
      renderInventoryTable();
    },

    openAdd: function () {
      openInventoryForm(null);
    },

    openEdit: function (id) {
      const item = state.cache.inventory.find(function (p) { return p.id === id; });
      if (!item) { showToast('Product not found', 'error'); return; }
      openInventoryForm(item);
    },

    confirmDelete: function (id) {
      const item = state.cache.inventory.find(function (p) { return p.id === id; });
      if (!item) return;
      state.deleteTarget = { collection: 'inventory', id: id, label: item.name || 'this product' };
      App.openDeleteConfirm();
    },

    save: async function (id) {
      const name = document.getElementById('inv_name').value.trim();
      const sku = document.getElementById('inv_sku').value.trim();
      const barcode = document.getElementById('inv_barcode').value.trim();
      const category = document.getElementById('inv_category').value.trim();
      const stock = Number(document.getElementById('inv_stock').value) || 0;
      const price = Number(document.getElementById('inv_price').value) || 0;
      const cost = Number(document.getElementById('inv_cost').value) || 0;

      if (!name) { showToast('Product name is required', 'error'); return; }
      if (price < 0 || stock < 0) { showToast('Stock and price cannot be negative', 'error'); return; }

      const payload = {
        name: name,
        sku: sku,
        barcode: barcode,
        category: category || 'General',
        stock: stock,
        price: price,
        cost: cost,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (id) {
          await db.collection('inventory').doc(id).update(payload);
          showToast('Product updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('inventory').add(payload);
          showToast('Product added successfully', 'success');
        }
        App.closeGlobalModal();
        loadInventory();
      } catch (err) {
        console.error('[Inventory] save error:', err);
        showToast('Failed to save product: ' + (err.message || 'Unknown'), 'error');
      }
    },

    exportCSV: function () {
      if (state.cache.inventory.length === 0) {
        showToast('No products to export', 'warning');
        return;
      }
      const rows = [['Name', 'SKU', 'Category', 'Stock', 'Price', 'Cost', 'Value', 'Barcode']];
      state.cache.inventory.forEach(function (p) {
        const stock = Number(p.stock) || 0;
        const price = Number(p.price) || 0;
        rows.push([
          p.name || '', p.sku || '', p.category || '',
          stock, price, Number(p.cost) || 0,
          stock * price, p.barcode || ''
        ]);
      });
      App.downloadCSV(rows, 'inventory_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Inventory exported successfully', 'success');
    }
  };

  // ============================================================
  // ================= INVENTORY FORM (MODAL) ===================
  // ============================================================
  function openInventoryForm(item) {
    const isEdit = !!item;
    const v = isEdit ? item : {};

    // Existing categories for datalist
    const cats = Array.from(new Set(state.cache.inventory.map(function (p) { return p.category; }).filter(Boolean)));

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-' + (isEdit ? 'edit' : 'plus-circle') + '"></i> ' + (isEdit ? 'Edit Product' : 'Add New Product') + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<form id="inventoryForm" onsubmit="return false;">' +
          '<div class="form-group">' +
            '<label>Product Name <span class="required">*</span></label>' +
            '<input type="text" class="form-control" id="inv_name" value="' + escapeHtml(v.name || '') + '" placeholder="e.g. Wireless Mouse" required>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>SKU</label>' +
              '<input type="text" class="form-control" id="inv_sku" value="' + escapeHtml(v.sku || '') + '" placeholder="e.g. WM-001">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Barcode</label>' +
              '<input type="text" class="form-control" id="inv_barcode" value="' + escapeHtml(v.barcode || '') + '" placeholder="Optional">' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Category</label>' +
            '<input type="text" class="form-control" id="inv_category" value="' + escapeHtml(v.category || '') + '" placeholder="e.g. Electronics" list="invCategoryList">' +
            '<datalist id="invCategoryList">' +
              cats.map(function (c) { return '<option value="' + escapeHtml(c) + '">'; }).join('') +
            '</datalist>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Stock Quantity <span class="required">*</span></label>' +
              '<input type="number" class="form-control" id="inv_stock" value="' + (Number(v.stock) || 0) + '" min="0" step="1" required>' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Unit Price (₹) <span class="required">*</span></label>' +
              '<input type="number" class="form-control" id="inv_price" value="' + (Number(v.price) || 0) + '" min="0" step="0.01" required>' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Cost Price (₹)</label>' +
            '<input type="number" class="form-control" id="inv_cost" value="' + (Number(v.cost) || 0) + '" min="0" step="0.01">' +
