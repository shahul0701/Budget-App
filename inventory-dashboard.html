          <button class="modal-close" onclick="BudgetFlow.closeGlobalModal()">&times;</button></div>
        <div class="modal-body">
          <p style="margin-bottom:1rem;color:var(--gray-700);font-size:0.9rem;line-height:1.5;">This will <strong style="color:var(--danger);">permanently delete</strong> all records (inventory, sales, purchases, employees, customers, suppliers, projects, transactions, expenses, documents) for <strong>${escapeHtml(state.company.name)}</strong>.</p>
          <p style="margin-bottom:1rem;color:var(--danger);font-size:0.85rem;font-weight:700;">This action CANNOT be undone.</p>
          <div class="form-group"><label>Type <code style="background:var(--gray-100);padding:2px 8px;border-radius:4px;">DELETE ALL</code> to confirm</label>
            <input type="text" class="form-control" id="reset_confirm" placeholder="DELETE ALL" autocomplete="off"></div>
          <div class="form-actions">
            <button class="btn btn-outline" onclick="BudgetFlow.closeGlobalModal()">Cancel</button>
            <button class="btn btn-danger" onclick="SettingsModule.confirmReset()"><i class="fas fa-trash"></i> Permanently Delete</button>
          </div>
        </div>`;
      BF.openGlobalModal(html);
    },
    confirmReset: async function () {
      const input = document.getElementById('reset_confirm').value.trim();
      if (input !== 'DELETE ALL') { showToast('Type "DELETE ALL" exactly to confirm', 'error'); return; }
      const collections = ['inventory', 'sales', 'purchases', 'employees', 'customers', 'suppliers', 'projects', 'transactions', 'expenses', 'documents'];
      try {
        showToast('Deleting all company data…', 'info');
        let deleted = 0;
        for (const col of collections) {
          const snap = await BF.companyCollection(col).get();
          for (const doc of snap.docs) { await doc.ref.delete(); deleted++; }
        }
        showToast('Deleted ' + deleted + ' records. Workspace reset.', 'success');
        BF.closeGlobalModal();
        setTimeout(() => { const container = document.getElementById('dynamicContent'); renderSettings(container); }, 500);
      } catch (err) { console.error('Reset error:', err); showToast('Reset failed: ' + (err.message || 'Unknown'), 'error'); }
    }
  };

  let lastKey = ''; let lastKeyTime = 0;
  document.addEventListener('keydown', function (e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (['input', 'textarea', 'select'].includes(tag)) return;
    const now = Date.now(); const key = e.key.toLowerCase();
    if (lastKey === 'g' && (now - lastKeyTime) < 800) {
      const map = { d: 'dashboard', i: 'inventory', s: 'sales', p: 'purchases', e: 'employees', c: 'customers', u: 'suppliers', j: 'projects', a: 'accounts', x: 'expenses', r: 'reports', k: 'calendar', o: 'documents', t: 'settings' };
      if (map[key]) {
        document.querySelectorAll('.nav-link').forEach(l => l.classList.toggle('active', l.dataset.page === map[key]));
        BF.navigateTo(map[key]); lastKey = ''; return;
      }
    }
    lastKey = key; lastKeyTime = now;
  });

  let idleTimer = null;
  function resetIdleTimer() {
    if (idleTimer) clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      const warnEl = document.createElement('div');
      warnEl.className = 'toast warning';
      warnEl.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;max-width:320px;';
      warnEl.innerHTML = '<i class="fas fa-clock toast-icon"></i><div class="toast-content"><div class="toast-title">Session Expiring Soon</div><div class="toast-message">You have been idle for 30 minutes. Click anywhere to stay signed in.</div></div>';
      document.body.appendChild(warnEl);
      const cleanup = () => { if (warnEl.parentElement) warnEl.parentElement.removeChild(warnEl); };
      setTimeout(cleanup, 60000);
      document.addEventListener('mousemove', cleanup, { once: true });
      document.addEventListener('keydown', cleanup, { once: true });
    }, 30 * 60 * 1000);
  }
  ['mousemove', 'keydown', 'click', 'scroll'].forEach(evt => document.addEventListener(evt, resetIdleTimer, { passive: true }));
  resetIdleTimer();

  console.log('[Part 6] Reports + Calendar + Documents + Settings loaded ✓');
  console.log('==============================================');
  console.log('  BudgetFlow Inventory Pro — COMPLETE');
  console.log('  All 6 parts loaded successfully');
  console.log('==============================================');
})();
</script>
