          '<div class="form-actions">' +
            '<button type="button" class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
            '<button type="button" class="btn btn-success" onclick="InventoryModule.save(' + (isEdit ? "'" + item.id + "'" : 'null') + ')">' +
              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Save') + ' Product' +
            '</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    App.openGlobalModal(html);

    // Auto-focus name field
    setTimeout(function () {
      const el = document.getElementById('inv_name');
      if (el) el.focus();
    }, 100);
  }

  // ============================================================
  // ==================== REGISTER RENDERERS ====================
  // ============================================================
  App.registerPageRenderer('dashboard', renderDashboard);
  App.registerPageRenderer('inventory', renderInventory);

  // Expose reload functions for cross-module use
  App.loadDashboard = loadDashboardData;
  App.loadInventory = loadInventory;
  App.renderInventoryTable = renderInventoryTable;

  console.log('[Part 2] Dashboard + Inventory modules loaded ✓');
})();
</script>
<!-- ============================================================
     PART 3 — SALES + PURCHASES MODULES
     Insert AFTER the Part 2 script block (before </body>).
     ============================================================ -->
<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 3] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, showToast, getInitials } = App;

  // ============================================================
  // ====================== SALES MODULE ========================
  // ============================================================
  const salesFilters = { search: '', status: 'all' };

  function renderSales(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-receipt"></i></div>
          <div class="stat-value" id="salesStatCount">—</div>
          <div class="stat-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-value" id="salesStatRevenue">—</div>
          <div class="stat-label">Revenue</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-clock"></i></div>
          <div class="stat-value" id="salesStatPending">—</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-value" id="salesStatCompleted">—</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-shopping-cart"></i> Sales Orders</div>
            <div class="card-subtitle">Create invoices, track payments, and manage order status</div>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="SalesModule.openNew()">
              <i class="fas fa-plus"></i> New Sale
            </button>
            <button class="btn btn-success" onclick="SalesModule.exportCSV()">
              <i class="fas fa-download"></i> Export
            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="salesSearch" placeholder="Search by invoice or customer…" oninput="SalesModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="salesStatusTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-status="all" onclick="SalesModule.setStatus('all')">All</button>
            <button class="filter-tab" data-status="pending" onclick="SalesModule.setStatus('pending')">Pending</button>
            <button class="filter-tab" data-status="completed" onclick="SalesModule.setStatus('completed')">Completed</button>
            <button class="filter-tab" data-status="cancelled" onclick="SalesModule.setStatus('cancelled')">Cancelled</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Invoice #</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="salesTableBody">
              <tr><td colspan="7"><div class="loading-block"><div class="loading-spinner"></div><span>Loading sales…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="salesPagination"></div>
      </div>
    `;

    loadSales();
  }

  async function loadSales() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('sales').get();
      state.cache.sales = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.sales.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      const totalOrders = state.cache.sales.length;
      const revenue = state.cache.sales
        .filter(function (s) { return (s.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (sum, s) { return sum + (Number(s.total) || 0); }, 0);
      const pending = state.cache.sales.filter(function (s) { return (s.status || 'pending').toLowerCase() === 'pending'; }).length;
      const completed = state.cache.sales.filter(function (s) { return (s.status || '').toLowerCase() === 'completed'; }).length;

      setText('salesStatCount', totalOrders);
      setText('salesStatRevenue', formatCurrency(revenue));
      setText('salesStatPending', pending);
      setText('salesStatCompleted', completed);

      renderSalesTable();
    } catch (err) {
      console.error('[Sales] load error:', err);
      showToast('Failed to load sales: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load sales</p></div></td></tr>';
    }
  }

  function renderSalesTable() {
    const tbody = document.getElementById('salesTableBody');
    if (!tbody) return;

    let filtered = state.cache.sales.slice();
    if (salesFilters.status !== 'all') {
      filtered = filtered.filter(function (s) {
        return (s.status || 'pending').toLowerCase() === salesFilters.status;
      });
    }
    if (salesFilters.search) {
      const q = salesFilters.search.toLowerCase();
      filtered = filtered.filter(function (s) {
        return (s.invoiceNo || '').toLowerCase().includes(q) ||
               (s.customerName || '').toLowerCase().includes(q) ||
               (s.id || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.sales;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-receipt"></i>' +
          '<h4>No sales found</h4>' +
          '<p>' + (state.cache.sales.length === 0
            ? 'Create your first sale to get started'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (s) {
        const status = (s.status || 'pending').toLowerCase();
        const badgeClass = status === 'completed' ? 'badge-success'
                         : status === 'pending' ? 'badge-warning'
                         : status === 'cancelled' ? 'badge-danger'
                         : 'badge-info';
        const itemsCount = Array.isArray(s.items) ? s.items.length : (Number(s.items) || 0);
        const dateStr = s.createdAt
          ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
          : '—';

        return '<tr>' +
          '<td>' +
            '<strong style="color:var(--primary);cursor:pointer;" onclick="SalesModule.viewInvoice(\'' + s.id + '\')">' +
              '#' + escapeHtml(s.invoiceNo || s.id.slice(-6).toUpperCase()) +
            '</strong>' +
          '</td>' +
          '<td>' + escapeHtml(s.customerName || 'Walk-in') + '</td>' +
          '<td>' + itemsCount + '</td>' +
          '<td><strong>' + formatCurrency(s.total) + '</strong></td>' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(s.status || 'pending') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              (status === 'pending'
                ? '<button class="btn btn-sm btn-success" title="Mark Complete" onclick="SalesModule.complete(\'' + s.id + '\')"><i class="fas fa-check"></i></button>' +
                  '<button class="btn btn-sm btn-warning" title="Cancel" onclick="SalesModule.cancel(\'' + s.id + '\')"><i class="fas fa-times"></i></button>'
                : '<button class="btn btn-sm btn-icon btn-info" title="View" onclick="SalesModule.viewInvoice(\'' + s.id + '\')"><i class="fas fa-eye"></i></button>') +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="SalesModule.confirmDelete(\'' + s.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('salesPagination', pg, totalPages, 'SalesModule.goToPage');
  }

  // ============================================================
  // ==================== SALES MODULE API ======================
  // ============================================================
  window.SalesModule = {
    onSearch: function (val) {
      salesFilters.search = val || '';
      state.pagination.sales.page = 1;
      renderSalesTable();
    },

    setStatus: function (status) {
      salesFilters.status = status;
      state.pagination.sales.page = 1;
      document.querySelectorAll('#salesStatusTabs .filter-tab').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.status === status);
      });
      renderSalesTable();
    },

    goToPage: function (p) {
      state.pagination.sales.page = p;
      renderSalesTable();
    },

    openNew: function () {
      openSaleForm();
    },

    viewInvoice: function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (sale) openInvoiceView(sale);
    },

    complete: async function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (!sale) return;
      if (!confirm('Mark this sale as completed? Stock will be deducted from inventory.')) return;

      try {
        const items = Array.isArray(sale.items) ? sale.items : [];
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (!item.productId) continue;
          const prodRef = db.collection('inventory').doc(item.productId);
          const prodSnap = await prodRef.get();
          if (prodSnap.exists) {
            const currentStock = Number(prodSnap.data().stock) || 0;
            const newStock = Math.max(0, currentStock - (Number(item.qty) || 0));
            await prodRef.update({ stock: newStock });
          }
        }

        await db.collection('sales').doc(id).update({
          status: 'completed',
          completedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast('Sale completed and stock updated', 'success');
        await loadSales();
        if (typeof App.loadInventory === 'function') App.loadInventory();
      } catch (err) {
        console.error('[Sales] complete error:', err);
        showToast('Failed to complete sale: ' + (err.message || 'Unknown'), 'error');
      }
    },

    cancel: async function (id) {
      if (!confirm('Cancel this sale? This cannot be undone.')) return;
      try {
        await db.collection('sales').doc(id).update({
          status: 'cancelled',
          cancelledAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast('Sale cancelled', 'success');
        await loadSales();
      } catch (err) {
        console.error('[Sales] cancel error:', err);
        showToast('Failed to cancel: ' + (err.message || 'Unknown'), 'error');
      }
    },

    confirmDelete: function (id) {
      const sale = state.cache.sales.find(function (s) { return s.id === id; });
      if (!sale) return;
      state.deleteTarget = {
        collection: 'sales',
        id: id,
        label: 'Invoice #' + (sale.invoiceNo || id.slice(-6).toUpperCase())
      };
      App.openDeleteConfirm();
    },

    save: async function () {
      const customerVal = document.getElementById('sale_customer').value || 'walkin';
      const discount = Number(document.getElementById('sale_discount').value) || 0;

      const validItems = saleLineItems.filter(function (it) {
        return it.productId && Number(it.qty) > 0;
      });

      if (validItems.length === 0) {
        showToast('Add at least one product to the sale', 'error');
        return;
      }

      // Validate stock
      for (let i = 0; i < validItems.length; i++) {
        const it = validItems[i];
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === it.productId; });
        if (prod && Number(it.qty) > Number(prod.stock || 0)) {
          showToast('Insufficient stock for "' + prod.name + '" (have ' + prod.stock + ', need ' + it.qty + ')', 'error');
          return;
        }
      }

      let customerName = 'Walk-in Customer';
      let customerId = '';
      if (customerVal !== 'walkin') {
        const cust = (state.cache.customers || []).find(function (c) { return c.id === customerVal; });
        if (cust) { customerName = cust.name; customerId = cust.id; }
      }

      const subtotal = validItems.reduce(function (sum, it) { return sum + it.qty * it.price; }, 0);
      const total = Math.max(0, subtotal - discount);
      const invoiceNo = await generateInvoiceNo();

      const payload = {
        companyId: state.company.id,
        invoiceNo: invoiceNo,
        customerId: customerId,
        customerName: customerName,
        items: validItems.map(function (it) {
          return {
            productId: it.productId,
            name: it.name,
            qty: it.qty,
            price: it.price,
            lineTotal: it.qty * it.price
          };
        }),
        subtotal: subtotal,
        discount: discount,
        total: total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('sales').add(payload);
        showToast('Sale created — #' + invoiceNo, 'success');
        App.closeGlobalModal();
        await loadSales();
      } catch (err) {
        console.error('[Sales] save error:', err);
        showToast('Failed to save sale: ' + (err.message || 'Unknown'), 'error');
      }
    },

    addLine: function () {
      saleLineItems.push({ productId: '', name: '', qty: 1, price: 0 });
      renderSaleLineItems();
    },

    removeLine: function (idx) {
      if (saleLineItems.length <= 1) {
        showToast('At least one line item required', 'warning');
        return;
      }
      saleLineItems.splice(idx, 1);
      renderSaleLineItems();
    },

    updateLine: function (idx, field, value) {
      if (!saleLineItems[idx]) return;
      if (field === 'product') {
        saleLineItems[idx].productId = value;
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === value; });
        if (prod) {
          saleLineItems[idx].name = prod.name || '';
          saleLineItems[idx].price = Number(prod.price) || 0;
        }
        renderSaleLineItems();
      } else if (field === 'qty') {
        saleLineItems[idx].qty = Math.max(1, Number(value) || 1);
        SalesModule.recalc();
      } else if (field === 'price') {
        saleLineItems[idx].price = Math.max(0, Number(value) || 0);
        SalesModule.recalc();
      }
    },

    recalc: function () {
      const subtotal = saleLineItems.reduce(function (sum, it) {
        return sum + (Number(it.qty) || 0) * (Number(it.price) || 0);
      }, 0);
      const discEl = document.getElementById('sale_discount');
      const discount = discEl ? (Number(discEl.value) || 0) : 0;
      const total = Math.max(0, subtotal - discount);
      const subEl = document.getElementById('saleSubtotal');
      const totEl = document.getElementById('saleTotal');
      if (subEl) subEl.textContent = formatCurrency(subtotal);
      if (totEl) totEl.textContent = formatCurrency(total);
    },

    exportCSV: function () {
      if (state.cache.sales.length === 0) {
        showToast('No sales to export', 'warning');
        return;
      }
      const rows = [['Invoice', 'Customer', 'Items', 'Subtotal', 'Discount', 'Total', 'Status', 'Date']];
      state.cache.sales.forEach(function (s) {
        const dateStr = s.createdAt
          ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)).toLocaleDateString('en-IN')
          : '';
        rows.push([
          s.invoiceNo || s.id.slice(-6).toUpperCase(),
          s.customerName || 'Walk-in',
          Array.isArray(s.items) ? s.items.length : 0,
          Number(s.subtotal) || 0,
          Number(s.discount) || 0,
          Number(s.total) || 0,
          s.status || 'pending',
          dateStr
        ]);
      });
      App.downloadCSV(rows, 'sales_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Sales exported successfully', 'success');
    }
  };

  // ---- Sale line items state ----
  let saleLineItems = [];

  function openSaleForm() {
    saleLineItems = [{ productId: '', name: '', qty: 1, price: 0 }];

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-plus-circle"></i> New Sale</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="form-group">' +
          '<label>Customer <span class="required">*</span></label>' +
          '<select class="form-control" id="sale_customer">' +
            '<option value="walkin">Walk-in Customer</option>' +
          '</select>' +
        '</div>' +
        '<div class="form-group">' +
          '<label>Line Items</label>' +
          '<div id="saleLineItems"></div>' +
          '<button class="btn btn-sm btn-outline mt-1" onclick="SalesModule.addLine()"><i class="fas fa-plus"></i> Add Item</button>' +
        '</div>' +
        '<div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-md);margin-top:1rem;">' +
          '<div class="d-flex justify-between" style="font-size:0.9rem;">' +
            '<span class="text-muted">Subtotal:</span>' +
            '<strong id="saleSubtotal">₹0.00</strong>' +
          '</div>' +
          '<div class="d-flex justify-between" style="font-size:0.9rem;margin-top:6px;align-items:center;">' +
            '<span class="text-muted">Discount (₹):</span>' +
            '<input type="number" id="sale_discount" class="form-control" style="max-width:120px;padding:6px 10px;" value="0" min="0" step="0.01" oninput="SalesModule.recalc()">' +
          '</div>' +
          '<div class="d-flex justify-between" style="font-size:1.1rem;margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-200);">' +
            '<strong>Total:</strong>' +
            '<strong id="saleTotal" style="color:var(--success);">₹0.00</strong>' +
          '</div>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
          '<button class="btn btn-success" onclick="SalesModule.save()"><i class="fas fa-save"></i> Create Sale</button>' +
        '</div>' +
      '</div>';

    App.openGlobalModal(html);

    // Load customers + inventory
    ensureSaleFormData().then(function () {
      populateSaleCustomerSelect();
      renderSaleLineItems();
    });
  }

  async function ensureSaleFormData() {
    if (!state.cache.customers || state.cache.customers.length === 0) {
      try {
        const snap = await App.companyCollection('customers').get();
        state.cache.customers = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) { /* silent */ }
    }
    if (!state.cache.inventory || state.cache.inventory.length === 0) {
      try {
        const snap = await App.companyCollection('inventory').get();
        state.cache.inventory = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      } catch (e) { /* silent */ }
    }
  }

  function populateSaleCustomerSelect() {
    const sel = document.getElementById('sale_customer');
    if (!sel) return;
    const opts = ['<option value="walkin">Walk-in Customer</option>'];
    (state.cache.customers || []).forEach(function (c) {

  async function generateInvoiceNo() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = 'INV-' + y + m + '-';
    try {
      const snap = await App.companyCollection('sales').get();
      let maxSeq = 0;
      snap.forEach(function (doc) {
        const inv = doc.data().invoiceNo || '';
        if (inv.indexOf(prefix) === 0) {
          const seq = parseInt(inv.slice(prefix.length), 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        }
      });
      return prefix + String(maxSeq + 1).padStart(4, '0');
    } catch (e) {
      return prefix + String(Math.floor(Math.random() * 9000) + 1000);
    }
  }

  async function loadPurchases() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('purchases').get();
      state.cache.purchases = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.purchases.sort(function (a, b) {
        const ta = a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0;
        const tb = b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0;
        return tb - ta;
      });

      const totalCount = state.cache.purchases.length;
      const totalValue = state.cache.purchases
        .filter(function (p) { return (p.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (sum, p) { return sum + (Number(p.total) || 0); }, 0);
      const pending = state.cache.purchases.filter(function (p) { return (p.status || 'pending').toLowerCase() === 'pending'; }).length;
      const received = state.cache.purchases.filter(function (p) { return (p.status || '').toLowerCase() === 'received'; }).length;

      setText('purchStatCount', totalCount);
      setText('purchStatValue', formatCurrency(totalValue));
      setText('purchStatPending', pending);
      setText('purchStatReceived', received);

      renderPurchasesTable();
    } catch (err) {
      console.error('[Purchases] load error:', err);
      showToast('Failed to load purchases: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load purchases</p></div></td></tr>';
    }
  }

  function renderPurchasesTable() {
    const tbody = document.getElementById('purchasesTableBody');
    if (!tbody) return;

    let filtered = state.cache.purchases.slice();
    if (purchFilters.status !== 'all') {
      filtered = filtered.filter(function (p) {
        return (p.status || 'pending').toLowerCase() === purchFilters.status;
      });
    }
    if (purchFilters.search) {
      const q = purchFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.poNo || '').toLowerCase().includes(q) ||
               (p.supplierName || '').toLowerCase().includes(q) ||
               (p.id || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.purchases;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-truck"></i>' +
          '<h4>No purchase orders</h4>' +
          '<p>' + (state.cache.purchases.length === 0
            ? 'Create your first purchase order'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (p) {
        const status = (p.status || 'pending').toLowerCase();
        const badgeClass = status === 'received' ? 'badge-success'
                         : status === 'pending' ? 'badge-warning'
                         : status === 'cancelled' ? 'badge-danger'
                         : 'badge-info';
        const itemsCount = Array.isArray(p.items) ? p.items.length : (Number(p.items) || 0);
        const dateStr = p.createdAt
          ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
          : '—';

        return '<tr>' +
          '<td>' +
            '<strong style="color:var(--primary);cursor:pointer;" onclick="PurchasesModule.viewPO(\'' + p.id + '\')">' +
              '#' + escapeHtml(p.poNo || p.id.slice(-6).toUpperCase()) +
            '</strong>' +
          '</td>' +
          '<td>' + escapeHtml(p.supplierName || '—') + '</td>' +
          '<td>' + itemsCount + '</td>' +
          '<td><strong>' + formatCurrency(p.total) + '</strong></td>' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(p.status || 'pending') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              (status === 'pending'
                ? '<button class="btn btn-sm btn-success" title="Receive Stock" onclick="PurchasesModule.receive(\'' + p.id + '\')"><i class="fas fa-check"></i> Receive</button>'
                : '<button class="btn btn-sm btn-icon btn-info" title="View" onclick="PurchasesModule.viewPO(\'' + p.id + '\')"><i class="fas fa-eye"></i></button>') +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="PurchasesModule.confirmDelete(\'' + p.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +

      }).join('');

    App.renderPagination('purchasesPagination', pg, totalPages, 'PurchasesModule.goToPage');

      });

    },

    openNew: function () {
      openPurchaseForm();
    },

    viewPO: function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (po) openPOView(po);
    },

    receive: async function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (!po) return;
      if (!confirm('Mark this PO as received? Stock will be added to inventory.')) return;

      try {
        const items = Array.isArray(po.items) ? po.items : [];
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (!item.productId) continue;
          const prodRef = db.collection('inventory').doc(item.productId);
          const prodSnap = await prodRef.get();
          if (prodSnap.exists) {
            const currentStock = Number(prodSnap.data().stock) || 0;
            const newStock = currentStock + (Number(item.qty) || 0);
            const updates = { stock: newStock };
            if (Number(item.price) > 0) updates.cost = Number(item.price);
            await prodRef.update(updates);
          }
        }

        await db.collection('purchases').doc(id).update({
          status: 'received',
          receivedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast('Purchase received and stock updated', 'success');
        await loadPurchases();
        if (typeof App.loadInventory === 'function') App.loadInventory();
      } catch (err) {
        console.error('[Purchases] receive error:', err);
        showToast('Failed to receive: ' + (err.message || 'Unknown'), 'error');
      }
    },

    confirmDelete: function (id) {
      const po = state.cache.purchases.find(function (p) { return p.id === id; });
      if (!po) return;
      state.deleteTarget = {
        collection: 'purchases',
        id: id,
        label: 'PO #' + (po.poNo || id.slice(-6).toUpperCase())
      };
      App.openDeleteConfirm();
    },

    save: async function () {
      const supplierVal = document.getElementById('purch_supplier').value;
      if (!supplierVal) {
        showToast('Please select a supplier', 'error');
        return;
      }

      const validItems = purchaseLineItems.filter(function (it) {
        return it.productId && Number(it.qty) > 0;
      });

      if (validItems.length === 0) {
        showToast('Add at least one product to the purchase', 'error');
        return;
      }

      const supplier = (state.cache.suppliers || []).find(function (s) { return s.id === supplierVal; });
      const total = validItems.reduce(function (sum, it) { return sum + it.qty * it.price; }, 0);
      const poNo = await generatePONo();

      const payload = {
        companyId: state.company.id,
        poNo: poNo,
        supplierId: supplierVal,
        supplierName: supplier ? supplier.name : 'Unknown',
        items: validItems.map(function (it) {
          return {
            productId: it.productId,
            name: it.name,
            qty: it.qty,
            price: it.price,
            lineTotal: it.qty * it.price
          };
        }),
        total: total,
        status: 'pending',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await db.collection('purchases').add(payload);
        showToast('Purchase order created — #' + poNo, 'success');
        App.closeGlobalModal();
        await loadPurchases();
      } catch (err) {
        console.error('[Purchases] save error:', err);
        showToast('Failed to save purchase: ' + (err.message || 'Unknown'), 'error');
      }
    },

    addLine: function () {
      purchaseLineItems.push({ productId: '', name: '', qty: 1, price: 0 });
      renderPurchaseLineItems();
    },

    removeLine: function (idx) {
      if (purchaseLineItems.length <= 1) {
        showToast('At least one line item required', 'warning');
        return;
      }
      purchaseLineItems.splice(idx, 1);
      renderPurchaseLineItems();
    },

    updateLine: function (idx, field, value) {
      if (!purchaseLineItems[idx]) return;
      if (field === 'product') {
        purchaseLineItems[idx].productId = value;
        const prod = (state.cache.inventory || []).find(function (p) { return p.id === value; });
        if (prod) {
          purchaseLineItems[idx].name = prod.name || '';
          purchaseLineItems[idx].price = Number(prod.cost) || Number(prod.price) || 0;
        }
        renderPurchaseLineItems();
      } else if (field === 'qty') {
        purchaseLineItems[idx].qty = Math.max(1, Number(value) || 1);
        PurchasesModule.recalc();
      } else if (field === 'price') {
        purchaseLineItems[idx].price = Math.max(0, Number(value) || 0);
        PurchasesModule.recalc();
      }
    },

    recalc: function () {
      const total = purchaseLineItems.reduce(function (sum, it) {
        return sum + (Number(it.qty) || 0) * (Number(it.price) || 0);
      }, 0);
      const el = document.getElementById('purchTotal');
      if (el) el.textContent = formatCurrency(total);
    },

    exportCSV: function () {
      if (state.cache.purchases.length === 0) {
        showToast('No purchases to export', 'warning');
        return;
      }
      const rows = [['PO', 'Supplier', 'Items', 'Total', 'Status', 'Date']];
      state.cache.purchases.forEach(function (p) {
        const dateStr = p.createdAt
          ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)).toLocaleDateString('en-IN')
          : '';
        rows.push([
          p.poNo || p.id.slice(-6).toUpperCase(),
          p.supplierName || '',
          Array.isArray(p.items) ? p.items.length : 0,
          Number(p.total) || 0,
          p.status || 'pending',
          dateStr
        ]);
      });
      App.downloadCSV(rows, 'purchases_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Purchases exported successfully', 'success');
    }
  };

    sel.innerHTML = opts.join('');

  function renderPurchaseLineItems() {
    const container = document.getElementById('purchLineItems');
    if (!container) return;

    const products = state.cache.inventory || [];
    const productOptions = products.length
      ? products.map(function (p) {
          return '<option value="' + p.id + '">' + escapeHtml(p.name) + ' — ₹' + (Number(p.cost) || Number(p.price) || 0) + '</option>';
        }).join('')
      : '<option value="">— No products in inventory —</option>';

    container.innerHTML = purchaseLineItems.map(function (item, idx) {
      return '<div class="d-flex gap-1 mb-1" style="align-items:center;flex-wrap:wrap;" data-line="' + idx + '">' +
        '<select class="form-control" style="flex:2;min-width:180px;" onchange="PurchasesModule.updateLine(' + idx + ', \'product\', this.value)">' +
          '<option value="">— Select product —</option>' + productOptions +
        '</select>' +
        '<input type="number" class="form-control" style="flex:0 0 80px;" placeholder="Qty" min="1" step="1" ' +
          'value="' + (item.qty || 1) + '" oninput="PurchasesModule.updateLine(' + idx + ', \'qty\', this.value)">' +
        '<input type="number" class="form-control" style="flex:0 0 100px;" placeholder="Cost" min="0" step="0.01" ' +
          'value="' + (item.price || 0) + '" oninput="PurchasesModule.updateLine(' + idx + ', \'price\', this.value)">' +
        '<button class="btn btn-sm btn-danger btn-icon" onclick="PurchasesModule.removeLine(' + idx + ')" title="Remove"><i class="fas fa-times"></i></button>' +
        '</div>';
    }).join('');

    purchaseLineItems.forEach(function (item, idx) {
      if (!item.productId) return;
      const row = container.querySelector('[data-line="' + idx + '"]');
      if (!row) return;
      const sel = row.querySelector('select');
      if (sel) sel.value = item.productId;
    });

    PurchasesModule.recalc();
  }

  async function generatePONo() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const prefix = 'PO-' + y + m + '-';
    try {
      const snap = await App.companyCollection('purchases').get();
      let maxSeq = 0;
      snap.forEach(function (doc) {
        const no = doc.data().poNo || '';
        if (no.indexOf(prefix) === 0) {
          const seq = parseInt(no.slice(prefix.length), 10);
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        }
      });
      return prefix + String(maxSeq + 1).padStart(4, '0');
    } catch (e) {
      return prefix + String(Math.floor(Math.random() * 9000) + 1000);
    }
  }

  function openPOView(po) {
    const items = Array.isArray(po.items) ? po.items : [];
    const dateStr = po.createdAt
      ? (po.createdAt.toDate ? po.createdAt.toDate() : new Date(po.createdAt)).toLocaleString('en-IN')
      : '—';
    const status = (po.status || 'pending').toLowerCase();
    const badgeClass = status === 'received' ? 'badge-success'
                     : status === 'pending' ? 'badge-warning'
                     : status === 'cancelled' ? 'badge-danger'
                     : 'badge-info';

    const itemsHtml = items.length === 0
      ? '<tr><td colspan="4"><div class="empty-state"><p>No items</p></div></td></tr>'
      : items.map(function (it) {
          return '<tr>' +
            '<td>' + escapeHtml(it.name || 'Item') + '</td>' +
            '<td>' + it.qty + '</td>' +
            '<td>' + formatCurrency(it.price) + '</td>' +
            '<td><strong>' + formatCurrency(it.lineTotal || it.qty * it.price) + '</strong></td>' +
            '</tr>';
        }).join('');

    const html =
      '<div class="modal-header" style="background: var(--gradient-warning);">' +
        '<h3><i class="fas fa-file-invoice-dollar"></i> PO #' + escapeHtml(po.poNo || po.id.slice(-6).toUpperCase()) + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<div class="d-flex justify-between mb-2" style="flex-wrap:wrap;gap:10px;">' +
          '<div><div class="text-muted" style="font-size:0.75rem;">SUPPLIER</div><div class="fw-700">' + escapeHtml(po.supplierName || '—') + '</div></div>' +
          '<div><div class="text-muted" style="font-size:0.75rem;">DATE</div><div class="fw-600">' + dateStr + '</div></div>' +
          '<div><div class="text-muted" style="font-size:0.75rem;">STATUS</div><span class="badge ' + badgeClass + '">' + escapeHtml(po.status || 'pending') + '</span></div>' +
        '</div>' +
        '<div class="table-wrapper" style="margin-top:1rem;">' +
          '<table><thead><tr><th>Item</th><th>Qty</th><th>Cost</th><th>Total</th></tr></thead>' +
          '<tbody>' + itemsHtml + '</tbody></table>' +
        '</div>' +
        '<div style="background:var(--gray-50);padding:1rem;border-radius:var(--radius-md);margin-top:1rem;">' +
          '<div class="d-flex justify-between" style="font-size:1.1rem;">' +
            '<strong>Total:</strong>' +
            '<strong style="color:var(--warning);">' + formatCurrency(po.total) + '</strong>' +
          '</div>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-outline" onclick="App.closeGlobalModal()">Close</button>' +
        '</div>' +
      '</div>';

    App.openGlobalModal(html);
  }

  // ============================================================
  // ==================== REGISTER RENDERERS ====================
  // ============================================================
  App.registerPageRenderer('sales', renderSales);
  App.registerPageRenderer('purchases', renderPurchases);

  // Expose reload functions
  App.loadSales = loadSales;
  App.loadPurchases = loadPurchases;

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  console.log('[Part 3] Sales + Purchases modules loaded ✓');
})();
</script>

<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 4] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, formatDate, showToast, getInitials } = App;

  function setText(id, text) {

  // ============================================================
  // ===================== EMPLOYEES ============================
  // ============================================================
  const empFilters = { search: '', department: 'all' };

  function renderEmployees(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">

  async function loadEmployees() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('employees').get();
      state.cache.employees = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.employees.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      const total = state.cache.employees.length;
      const active = state.cache.employees.filter(function (e) {
        return (e.status || 'Active').toLowerCase() === 'active';
      }).length;
      const depts = new Set(state.cache.employees.map(function (e) { return e.department; }).filter(Boolean)).size;
      const payroll = state.cache.employees
        .filter(function (e) { return (e.status || 'Active').toLowerCase() === 'active'; })
        .reduce(function (sum, e) { return sum + (Number(e.salary) || 0); }, 0);

      setText('empStatCount', total);
      setText('empStatActive', active);
      setText('empStatDepts', depts);
      setText('empStatSalary', formatCurrency(payroll));

      buildEmpDeptTabs();
      renderEmployeesTable();
    } catch (err) {
      console.error('[Employees] load error:', err);
      showToast('Failed to load employees: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load employees</p></div></td></tr>';
    }
  }

  function buildEmpDeptTabs() {
    const tabs = document.getElementById('empDeptTabs');
    if (!tabs) return;
    const depts = new Set();
    state.cache.employees.forEach(function (e) {
      if (e.department && String(e.department).trim()) depts.add(String(e.department).trim());
    });
    const list = ['all'].concat(Array.from(depts).sort());
    tabs.innerHTML = list.map(function (dept) {
      const isActive = empFilters.department === dept ? 'active' : '';
      const label = dept === 'all' ? 'All' : escapeHtml(dept);
      return '<button class="filter-tab ' + isActive + '" data-dept="' + escapeHtml(dept) + '" onclick="EmployeesModule.setDept(\'' + escapeHtml(dept).replace(/'/g, "\\'") + '\')">' + label + '</button>';
    }).join('');
  }

  function renderEmployeesTable() {
    const tbody = document.getElementById('employeesTableBody');
    if (!tbody) return;

    let filtered = state.cache.employees.slice();
    if (empFilters.department !== 'all') {
      filtered = filtered.filter(function (e) {
        return String(e.department || '').trim() === empFilters.department;
      });
    }
    if (empFilters.search) {
      const q = empFilters.search.toLowerCase();
      filtered = filtered.filter(function (e) {
        return (e.name || '').toLowerCase().includes(q) ||
               (e.position || '').toLowerCase().includes(q) ||
               (e.email || '').toLowerCase().includes(q) ||
               (e.phone || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.employees;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-users"></i>' +
          '<h4>No employees found</h4>' +
          '<p>' + (state.cache.employees.length === 0
            ? 'Add your first team member to get started'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (e) {
        const status = (e.status || 'Active').toLowerCase();
        const badgeClass = status === 'active' ? 'badge-success'
                         : status === 'inactive' ? 'badge-gray'
                         : status === 'on leave' ? 'badge-warning'
                         : 'badge-info';
        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(e.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(e.name || 'Unnamed') + '</strong>' +
                '<small>' + escapeHtml(e.email || '—') + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(e.position || '—') + '</td>' +
          '<td>' + escapeHtml(e.department || '—') + '</td>' +
          '<td>' + escapeHtml(e.phone || '—') + '</td>' +
          '<td><strong>' + formatCurrency(e.salary) + '</strong></td>' +
          '<td><span class="badge ' + badgeClass + '">' + escapeHtml(e.status || 'Active') + '</span></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="EmployeesModule.openEdit(\'' + e.id + '\')"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="EmployeesModule.confirmDelete(\'' + e.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('employeesPagination', pg, totalPages, 'EmployeesModule.goToPage');
  }

  window.EmployeesModule = {
    onSearch: function (val) {
      empFilters.search = val || '';
      state.pagination.employees.page = 1;
      renderEmployeesTable();
    },
    setDept: function (dept) {
      empFilters.department = dept;
      state.pagination.employees.page = 1;
      document.querySelectorAll('#empDeptTabs .filter-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.dept === dept);
      });
      renderEmployeesTable();
    },
    goToPage: function (p) {
      state.pagination.employees.page = p;
      renderEmployeesTable();
    },
    openAdd: function () { openEmployeeForm(null); },
    openEdit: function (id) {
      const e = state.cache.employees.find(function (x) { return x.id === id; });
      if (e) openEmployeeForm(e);
    },
    confirmDelete: function (id) {
      const e = state.cache.employees.find(function (x) { return x.id === id; });
      if (!e) return;
      state.deleteTarget = { collection: 'employees', id: id, label: e.name || 'this employee' };
      App.openDeleteConfirm();
      // Refresh after delete via a hook
      state._afterDeleteHook = function () { loadEmployees(); };
    },
    save: async function (id) {
      const name = document.getElementById('emp_name').value.trim();
      const position = document.getElementById('emp_position').value.trim();
      const department = document.getElementById('emp_department').value.trim();
      const email = document.getElementById('emp_email').value.trim();
      const phone = document.getElementById('emp_phone').value.trim();
      const salary = Number(document.getElementById('emp_salary').value) || 0;
      const hireDate = document.getElementById('emp_hireDate').value;
      const status = document.getElementById('emp_status').value;

      if (!name) { showToast('Employee name is required', 'error'); return; }

      const payload = {
        name: name, position: position, department: department,
        email: email, phone: phone, salary: salary,
        hireDate: hireDate, status: status,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (id) {
          await db.collection('employees').doc(id).update(payload);
          showToast('Employee updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('employees').add(payload);
          showToast('Employee added successfully', 'success');
        }
        App.closeGlobalModal();
        loadEmployees();
      } catch (err) {
        console.error('[Employees] save error:', err);
        showToast('Failed to save employee: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.employees.length === 0) {
        showToast('No employees to export', 'warning');
        return;
      }
      const rows = [['Name', 'Position', 'Department', 'Email', 'Phone', 'Salary', 'Hire Date', 'Status']];
      state.cache.employees.forEach(function (e) {
        rows.push([
          e.name || '', e.position || '', e.department || '',
          e.email || '', e.phone || '', Number(e.salary) || 0,
          e.hireDate || '', e.status || 'Active'
        ]);
      });
      App.downloadCSV(rows, 'employees_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Employees exported successfully', 'success');
    }
  };

  function openEmployeeForm(emp) {
    const isEdit = !!emp;
    const v = isEdit ? emp : {};
    const depts = Array.from(new Set(state.cache.employees.map(function (e) { return e.department; }).filter(Boolean)));

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-' + (isEdit ? 'user-edit' : 'user-plus') + '"></i> ' + (isEdit ? 'Edit Employee' : 'Add New Employee') + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<form id="employeeForm" onsubmit="return false;">' +
          '<div class="form-group">' +
            '<label>Full Name <span class="required">*</span></label>' +
            '<input type="text" class="form-control" id="emp_name" value="' + escapeHtml(v.name || '') + '" placeholder="e.g. Priya Sharma" required>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Position</label>' +
              '<input type="text" class="form-control" id="emp_position" value="' + escapeHtml(v.position || '') + '" placeholder="e.g. Sales Manager">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Department</label>' +
              '<input type="text" class="form-control" id="emp_department" value="' + escapeHtml(v.department || '') + '" placeholder="e.g. Sales" list="empDeptList">' +
              '<datalist id="empDeptList">' +
                depts.map(function (d) { return '<option value="' + escapeHtml(d) + '">'; }).join('') +
              '</datalist>' +
            '</div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Email</label>' +
              '<input type="email" class="form-control" id="emp_email" value="' + escapeHtml(v.email || '') + '" placeholder="name@company.com">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Phone</label>' +
              '<input type="tel" class="form-control" id="emp_phone" value="' + escapeHtml(v.phone || '') + '" placeholder="+91 98765 43210">' +
            '</div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Monthly Salary (₹)</label>' +
              '<input type="number" class="form-control" id="emp_salary" value="' + (Number(v.salary) || 0) + '" min="0" step="100">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Hire Date</label>' +
              '<input type="date" class="form-control" id="emp_hireDate" value="' + escapeHtml(v.hireDate || '') + '">' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Status</label>' +
            '<select class="form-control" id="emp_status">' +
              '<option value="Active" ' + ((v.status || 'Active') === 'Active' ? 'selected' : '') + '>Active</option>' +
              '<option value="On Leave" ' + (v.status === 'On Leave' ? 'selected' : '') + '>On Leave</option>' +
              '<option value="Inactive" ' + (v.status === 'Inactive' ? 'selected' : '') + '>Inactive</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
            '<button type="button" class="btn btn-success" onclick="EmployeesModule.save(' + (isEdit ? "'" + emp.id + "'" : 'null') + ')">' +
              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Save') + ' Employee' +
            '</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    App.openGlobalModal(html);
    setTimeout(function () {
      const el = document.getElementById('emp_name');
      if (el) el.focus();
    }, 100);
  }

  // ============================================================
  // ===================== CUSTOMERS ============================
  // ============================================================
  const custFilters = { search: '', type: 'all' };

  function renderCustomers(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-users"></i></div>
          <div class="stat-value" id="custStatCount">—</div>
          <div class="stat-label">Total Customers</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-crown"></i></div>
          <div class="stat-value" id="custStatVIP">—</div>
          <div class="stat-label">VIP Customers</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-boxes"></i></div>

          <div class="stat-label">Wholesale</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-rupee-sign"></i></div>
          <div class="stat-value" id="custStatRevenue">—</div>
          <div class="stat-label">Total Revenue</div>
        </div>
      </div>

      <div class="card fade-in">

          </div>
          <div class="d-flex gap-1 flex-wrap">

              <i class="fas fa-user-plus"></i> Add Customer

              <i class="fas fa-download"></i> Export

  async function loadCustomers() {
    const tbody = document.getElementById('customersTableBody');
    if (!tbody) return;
    try {
      const [custSnap, salesSnap] = await Promise.all([
        App.companyCollection('customers').get(),
        App.companyCollection('sales').get()
      ]);
      state.cache.customers = custSnap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.sales = salesSnap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.customers.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      const statsMap = {};
      state.cache.sales.forEach(function (s) {
        if (!s.customerId) return;
        if (!statsMap[s.customerId]) statsMap[s.customerId] = { orders: 0, spent: 0 };
        statsMap[s.customerId].orders += 1;
        if ((s.status || '').toLowerCase() !== 'cancelled') {
          statsMap[s.customerId].spent += Number(s.total) || 0;
        }
      });
      state.customerStats = statsMap;

      const total = state.cache.customers.length;
      const vip = state.cache.customers.filter(function (c) {
        return (c.customerType || '').toLowerCase() === 'vip';
      }).length;
      const wholesale = state.cache.customers.filter(function (c) {
        return (c.customerType || '').toLowerCase() === 'wholesale';
      }).length;
      const revenue = Object.values(statsMap).reduce(function (sum, s) { return sum + s.spent; }, 0);

      setText('custStatCount', total);
      setText('custStatVIP', vip);
      setText('custStatWholesale', wholesale);
      setText('custStatRevenue', formatCurrency(revenue));

      renderCustomersTable();
    } catch (err) {
      console.error('[Customers] load error:', err);
      showToast('Failed to load customers: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load customers</p></div></td></tr>';
    }
  }

    if (custFilters.search) {

      filtered = filtered.filter(function (c) {
        return (c.name || '').toLowerCase().includes(q) ||

               (c.phone || '').toLowerCase().includes(q) ||
               (c.company || '').toLowerCase().includes(q);
      });

    const pg = state.pagination.customers;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    const stats = state.customerStats || {};

    if (pageItems.length === 0) {

<script>
(function () {

  // ============================================================
  // ===================== PROJECTS =============================

        </div>

    loadProjects();

  async function loadProjects() {
    const grid = document.getElementById('projectsGrid');
    if (!grid) return;
    try {
      const snap = await App.companyCollection('projects').get();
      state.cache.projects = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      const total = state.cache.projects.length;
      const active = state.cache.projects.filter(function (p) {
        return (p.status || '').toLowerCase() === 'active';
      }).length;
      const completed = state.cache.projects.filter(function (p) {
        return (p.status || '').toLowerCase() === 'completed';
      }).length;
      const avgProgress = total
        ? Math.round(state.cache.projects.reduce(function (sum, p) {
            return sum + (Number(p.progress) || 0);
          }, 0) / total)
        : 0;

      setText('projStatCount', total);
      setText('projStatActive', active);
      setText('projStatCompleted', completed);
      setText('projStatProgress', avgProgress + '%');

      renderProjectsGrid();
    } catch (err) {
      console.error('[Projects] load error:', err);
      showToast('Failed to load projects: ' + (err.message || 'Unknown'), 'error');
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle"></i><p>Failed to load projects</p></div>';

  function renderProjectsGrid() {
    const grid = document.getElementById('projectsGrid');

    let filtered = state.cache.projects.slice();

      filtered = filtered.filter(function (p) {
        return (p.status || 'active').toLowerCase() === projFilters.status;
      });
    }
    if (projFilters.search) {
      const q = projFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.name || '').toLowerCase().includes(q) ||

          '<i class="fas fa-tasks"></i>' +

      const status = (p.status || 'active').toLowerCase();

                       : status === 'on hold' ? 'badge-warning'
                       : status === 'cancelled' ? 'badge-danger'
                       : 'badge-gray';
      const progress = Math.max(0, Math.min(100, Number(p.progress) || 0));
      const progressColor = progress >= 75 ? 'success' : progress >= 40 ? 'warning' : 'danger';
      const startStr = p.startDate ? formatDate(p.startDate) : '—';
      const endStr = p.endDate ? formatDate(p.endDate) : '—';

      return '<div class="card" style="padding:1.2rem;">' +
        '<div class="d-flex justify-between mb-2" style="align-items:flex-start;gap:10px;">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-title" style="font-size:1rem;margin-bottom:4px;">' +
              '<i class="fas fa-project-diagram" style="color:var(--primary);"></i> ' +
              escapeHtml(p.name || 'Untitled Project') +
            '</div>' +
            '<div class="card-subtitle" style="font-size:0.75rem;">' +

            '</div>' +
          '</div>' +
          '<span class="badge ' + badgeClass + '">' + escapeHtml(p.status || 'active') + '</span>' +
        '</div>' +
        (p.description
          ? '<p style="font-size:0.8rem;color:var(--gray-600);margin:10px 0;line-height:1.4;">' + escapeHtml(p.description) + '</p>'
          : '') +
        '<div style="margin:14px 0 8px;">' +
          '<div class="d-flex justify-between" style="font-size:0.75rem;margin-bottom:6px;">' +
            '<span class="text-muted">Progress</span>' +
            '<strong style="color:var(--primary);">' + progress + '%</strong>' +
          '</div>' +
          '<div class="progress-bar"><div class="progress-fill ' + progressColor + '" style="width:' + progress + '%;"></div></div>' +
        '</div>' +
        '<div class="d-flex justify-between" style="font-size:0.72rem;color:var(--gray-500);margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100);">' +
          '<span><i class="fas fa-calendar-alt"></i> ' + startStr + '</span>' +
          '<span><i class="fas fa-flag-checkered"></i> ' + endStr + '</span>' +
        '</div>' +
        '<div class="d-flex gap-1" style="margin-top:12px;">' +
          '<button class="btn btn-sm btn-warning" style="flex:1;" onclick="ProjectsModule.openEdit(\'' + p.id + '\')">' +
            '<i class="fas fa-edit"></i> Edit' +
          '</button>' +
          '<button class="btn btn-sm btn-danger" style="flex:0;" onclick="ProjectsModule.confirmDelete(\'' + p.id + '\')">' +
            '<i class="fas fa-trash"></i>' +
          '</button>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  window.ProjectsModule = {
    onSearch: function (val) {
      projFilters.search = val || '';
      renderProjectsGrid();
    },
    setStatus: function (status) {
      projFilters.status = status;
      document.querySelectorAll('#projStatusTabs .filter-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.status === status);
      });
      renderProjectsGrid();
    },
    openAdd: function () { openProjectForm(null); },
    openEdit: function (id) {
      const p = state.cache.projects.find(function (x) { return x.id === id; });
      if (p) openProjectForm(p);
    },
    confirmDelete: function (id) {
      const p = state.cache.projects.find(function (x) { return x.id === id; });
      if (!p) return;
      state.deleteTarget = { collection: 'projects', id: id, label: p.name || 'this project' };
      App.openDeleteConfirm();
    },
    save: async function (id) {
      const name = document.getElementById('proj_name').value.trim();
      const description = document.getElementById('proj_description').value.trim();
      const owner = document.getElementById('proj_owner').value.trim();
      const startDate = document.getElementById('proj_start').value;
      const endDate = document.getElementById('proj_end').value;
      const status = document.getElementById('proj_status').value;
      const progress = Math.max(0, Math.min(100, Number(document.getElementById('proj_progress').value) || 0));

      if (!name) { showToast('Project name is required', 'error'); return; }

      const payload = {
        name: name, description: description, owner: owner,
        startDate: startDate, endDate: endDate,
        status: status, progress: progress,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        if (id) {
          await db.collection('projects').doc(id).update(payload);
          showToast('Project updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('projects').add(payload);
          showToast('Project created successfully', 'success');
        }
        App.closeGlobalModal();
        loadProjects();
      } catch (err) {
        console.error('[Projects] save error:', err);
        showToast('Failed to save project: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.projects.length === 0) {
        showToast('No projects to export', 'warning');
        return;
      }
      const rows = [['Name', 'Description', 'Owner', 'Start Date', 'End Date', 'Status', 'Progress %']];
      state.cache.projects.forEach(function (p) {
        rows.push([
          p.name || '', p.description || '', p.owner || '',
          p.startDate || '', p.endDate || '',
          p.status || 'active', Number(p.progress) || 0
        ]);
      });
      App.downloadCSV(rows, 'projects_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Projects exported successfully', 'success');
    }

            '<datalist id="projOwnerList">' +

          '</div>' +
          '<div class="form-row">' +

              '<input type="date" class="form-control" id="proj_start" value="' + escapeHtml(v.startDate || '') + '">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>End Date</label>' +
              '<input type="date" class="form-control" id="proj_end" value="' + escapeHtml(v.endDate || '') + '">' +
            '</div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Status</label>' +
              '<select class="form-control" id="proj_status">' +
                '<option value="active" ' + ((v.status || 'active') === 'active' ? 'selected' : '') + '>Active</option>' +
                '<option value="on hold" ' + (v.status === 'on hold' ? 'selected' : '') + '>On Hold</option>' +
                '<option value="completed" ' + (v.status === 'completed' ? 'selected' : '') + '>Completed</option>' +
                '<option value="cancelled" ' + (v.status === 'cancelled' ? 'selected' : '') + '>Cancelled</option>' +

            '</div>' +
            '<div class="form-group">' +
              '<label>Progress (%)</label>' +

          '</div>' +

            '<button type="button" class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +

              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Create') + ' Project' +

    App.openGlobalModal(html);

  // ============================================================
  // ===================== ACCOUNTS =============================
  // ============================================================
  const accFilters = { search: '', type: 'all' };

  function renderAccounts(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-arrow-up"></i></div>
          <div class="stat-value" id="accStatIncome">—</div>
          <div class="stat-label">Total Income</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-arrow-down"></i></div>
          <div class="stat-value" id="accStatExpense">—</div>
          <div class="stat-label">Total Expenses</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-wallet"></i></div>
          <div class="stat-value" id="accStatProfit">—</div>

        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-list"></i></div>
          <div class="stat-value" id="accStatCount">—</div>
          <div class="stat-label">Transactions</div>
        </div>
      </div>

      <div class="card fade-in">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-coins"></i> Transaction Ledger</div>
            <div class="card-subtitle">Record income and expense transactions</div>
          </div>

            </button>

            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="accSearch" placeholder="Search description or category…" oninput="AccountsModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="accTypeTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-type="all" onclick="AccountsModule.setType('all')">All</button>
            <button class="filter-tab" data-type="income" onclick="AccountsModule.setType('income')">Income</button>
            <button class="filter-tab" data-type="expense" onclick="AccountsModule.setType('expense')">Expense</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="accountsTableBody">
              <tr><td colspan="6"><div class="loading-block"><div class="loading-spinner"></div><span>Loading transactions…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="accountsPagination"></div>
      </div>
    `;

    loadAccounts();
  }

  async function loadAccounts() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('transactions').get();
      state.cache.transactions = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.transactions.sort(function (a, b) {
        const da = a.date ? new Date(a.date).getTime()
          : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const dbv = b.date ? new Date(b.date).getTime()
          : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return dbv - da;
      });

      const income = state.cache.transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'income'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const expense = state.cache.transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'expense'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const profit = income - expense;

      setText('accStatIncome', formatCurrency(income));
      setText('accStatExpense', formatCurrency(expense));
      const profitEl = document.getElementById('accStatProfit');
      if (profitEl) {
        profitEl.textContent = formatCurrency(profit);
        profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
      }
      setText('accStatCount', state.cache.transactions.length);

      renderAccountsTable();
    } catch (err) {
      console.error('[Accounts] load error:', err);
      showToast('Failed to load transactions: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load transactions</p></div></td></tr>';
    }
  }

  function renderAccountsTable() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;

    let filtered = state.cache.transactions.slice();
    if (accFilters.type !== 'all') {
      filtered = filtered.filter(function (t) {
        return (t.type || 'income').toLowerCase() === accFilters.type;
      });
    }
    if (accFilters.search) {
      const q = accFilters.search.toLowerCase();
      filtered = filtered.filter(function (t) {
        return (t.description || '').toLowerCase().includes(q) ||
               (t.category || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.transactions;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="6"><div class="empty-state">' +
          '<i class="fas fa-coins"></i>' +
          '<h4>No transactions</h4>' +
          '<p>' + (state.cache.transactions.length === 0
            ? 'Record your first transaction'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (t) {
        const type = (t.type || 'income').toLowerCase();
        const isIncome = type === 'income';
        const dateStr = t.date ? formatDate(t.date) : (t.createdAt ? formatDate(t.createdAt) : '—');
        return '<tr>' +
          '<td>' + dateStr + '</td>' +

  async function loadExpenses() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;
    try {
      const snap = await App.companyCollection('expenses').get();
      state.cache.expenses = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.expenses.sort(function (a, b) {
        const da = a.date ? new Date(a.date).getTime()
          : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const dbv = b.date ? new Date(b.date).getTime()
          : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return dbv - da;
      });

      const total = state.cache.expenses.length;
      const pending = state.cache.expenses.filter(function (e) {
        return (e.status || 'pending').toLowerCase() === 'pending';
      }).length;
      const approved = state.cache.expenses.filter(function (e) {
        return ['approved', 'paid'].indexOf((e.status || '').toLowerCase()) !== -1;
      }).length;

      const now = new Date();
      const monthTotal = state.cache.expenses
        .filter(function (e) {
          if (!e.date) return false;
          const d = new Date(e.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);

      setText('expStatCount', total);
      setText('expStatPending', pending);
      setText('expStatApproved', approved);
      setText('expStatMonth', formatCurrency(monthTotal));

      renderExpensesTable();
    } catch (err) {
      console.error('[Expenses] load error:', err);
      showToast('Failed to load expenses: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML =
        '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load expenses</p></div></td></tr>';
    }
  }

  function renderExpensesTable() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;

    let filtered = state.cache.expenses.slice();
    if (expFilters.status !== 'all') {
      filtered = filtered.filter(function (e) {
        return (e.status || 'pending').toLowerCase() === expFilters.status;
      });
    }
    if (expFilters.search) {
      const q = expFilters.search.toLowerCase();
      filtered = filtered.filter(function (e) {
        return (e.description || '').toLowerCase().includes(q) ||
               (e.category || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.expenses;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="6"><div class="empty-state">' +
          '<i class="fas fa-receipt"></i>' +
          '<h4>No expenses</h4>' +
          '<p>' + (state.cache.expenses.length === 0

            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (e) {
        const status = (e.status || 'pending').toLowerCase();

        return '<tr>' +
          '<td>' + dateStr + '</td>' +
          '<td><strong>' + escapeHtml(e.description || '—') + '</strong></td>' +
          '<td><span class="badge badge-gray">' + escapeHtml(e.category || 'General') + '</span></td>' +

<script>
