  async function loadCustomers() {
    const tbody = document.getElementById('customersTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading customers…');
      const [custSnap, salesSnap] = await Promise.all([
        App.companyCollection('customers').get(),
        App.companyCollection('sales').get()
      ]);
      state.cache.customers = custSnap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.sales = salesSnap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.customers.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      // Stats from sales (including walk-ins matched by name + phone)
      const statsMap = {};
      const walkinNames = new Set();
      state.cache.sales.forEach(function (s) {
        // Registered customer
        if (s.customerId) {
          if (!statsMap[s.customerId]) statsMap[s.customerId] = { orders: 0, spent: 0 };
          statsMap[s.customerId].orders += 1;
          if ((s.status || '').toLowerCase() !== 'cancelled') {
            statsMap[s.customerId].spent += Number(s.total) || 0;
          }
        } else if (s.customerName && s.customerName !== 'Walk-in Customer') {
          // Walk-in with name captured
          const key = 'walkin:' + s.customerName + ':' + (s.customerPhone || '');
          if (!statsMap[key]) statsMap[key] = { orders: 0, spent: 0, name: s.customerName, phone: s.customerPhone || '' };
          statsMap[key].orders += 1;
          if ((s.status || '').toLowerCase() !== 'cancelled') {
            statsMap[key].spent += Number(s.total) || 0;
          }
          walkinNames.add(s.customerName);
        }
      });
      state.customerStats = statsMap;
      state.walkinStats = Object.keys(statsMap)
        .filter(function (k) { return k.indexOf('walkin:') === 0; })
        .map(function (k) { return Object.assign({ key: k }, statsMap[k]); });

      const total = state.cache.customers.length;
      const vip = state.cache.customers.filter(function (c) {
        return (c.customerType || '').toLowerCase() === 'vip';
      }).length;
      const wholesale = state.cache.customers.filter(function (c) {
        return (c.customerType || '').toLowerCase() === 'wholesale';
      }).length;

      setText('custStatCount', total);
      setText('custStatVIP', vip);
      setText('custStatWholesale', wholesale);
      setText('custStatWalkin', walkinNames.size);

      App.hideLoading();
      renderCustomersTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Customers] load error:', err);
      showToast('Failed to load customers: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load customers</p></div></td></tr>';
    }
  }

  function renderCustomersTable() {
    const tbody = document.getElementById('customersTableBody');
    if (!tbody) return;

    // Build display list: registered customers + walk-in history (if filter active or type=walkin)
    let displayItems = [];

    if (custFilters.type === 'walkin') {
      // Show only walk-ins
      displayItems = (state.walkinStats || []).map(function (w) {
        return {
          isWalkin: true,
          id: w.key,
          name: w.name || 'Walk-in',
          phone: w.phone || '',
          company: '',
          customerType: 'walk-in',
          stats: { orders: w.orders, spent: w.spent }
        };
      });
    } else {
      // Show registered customers
      let filtered = state.cache.customers.slice();
      if (custFilters.type !== 'all') {
        filtered = filtered.filter(function (c) {
          return (c.customerType || 'regular').toLowerCase() === custFilters.type;
        });
      }
      if (custFilters.search) {
        const q = custFilters.search.toLowerCase();
        filtered = filtered.filter(function (c) {
          return (c.name || '').toLowerCase().includes(q) ||
                 (c.email || '').toLowerCase().includes(q) ||
                 (c.phone || '').toLowerCase().includes(q) ||
                 (c.company || '').toLowerCase().includes(q);
        });
      }
      displayItems = filtered.map(function (c) {
        const st = (state.customerStats || {})[c.id] || { orders: 0, spent: 0 };
        return Object.assign({ isWalkin: false }, c, { stats: st });
      });
    }

    // Apply search for walk-ins too
    if (custFilters.type === 'walkin' && custFilters.search) {
      const q = custFilters.search.toLowerCase();
      displayItems = displayItems.filter(function (w) {
        return (w.name || '').toLowerCase().includes(q) ||
               (w.phone || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.customers;
    const totalPages = Math.max(1, Math.ceil(displayItems.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = displayItems.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-address-book"></i>' +
          '<h4>No ' + (custFilters.type === 'walkin' ? 'walk-in customers' : 'customers') + ' found</h4>' +
          '<p>' + (custFilters.type === 'walkin'
            ? 'Walk-in names captured during sales will appear here'
            : (state.cache.customers.length === 0
                ? 'Add your first customer to get started'
                : 'Try adjusting your filters')) + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (c) {
        const type = (c.customerType || 'regular').toLowerCase();
        const typeBadge = type === 'vip' ? 'badge-purple'
                        : type === 'wholesale' ? 'badge-info'
                        : type === 'walk-in' ? 'badge-warning'
                        : 'badge-gray';
        const st = c.stats || { orders: 0, spent: 0 };

        let actionBtns = '';
        if (!c.isWalkin) {
          actionBtns =
            '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="CustomersModule.openEdit(\'' + c.id + '\')"><i class="fas fa-edit"></i></button>' +
            '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="CustomersModule.confirmDelete(\'' + c.id + '\')"><i class="fas fa-trash"></i></button>';
        }

        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(c.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(c.name || 'Unnamed') + '</strong>' +
                '<small>' + escapeHtml(c.email || (c.isWalkin ? 'Walk-in customer' : '—')) + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(c.company || '—') + '</td>' +
          '<td>' + escapeHtml(c.phone || '—') + '</td>' +
          '<td><span class="badge ' + typeBadge + '">' + escapeHtml(c.customerType || 'regular') + '</span></td>' +
          '<td><strong>' + st.orders + '</strong></td>' +
          '<td><strong>' + formatCurrency(st.spent) + '</strong></td>' +
          '<td>' +
            '<div class="d-flex gap-1">' + actionBtns + '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('customersPagination', pg, totalPages, 'CustomersModule.goToPage');
  }

  window.CustomersModule = {
    onSearch: function (val) {
      custFilters.search = val || '';
      state.pagination.customers.page = 1;
      renderCustomersTable();
    },
    setType: function (type) {
      custFilters.type = type;
      state.pagination.customers.page = 1;
      document.querySelectorAll('#custTypeTabs .filter-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.type === type);
      });
      renderCustomersTable();
    },
    goToPage: function (p) {
      state.pagination.customers.page = p;
      renderCustomersTable();
    },
    openAdd: function () { openCustomerForm(null); },
    openEdit: function (id) {
      const c = state.cache.customers.find(function (x) { return x.id === id; });
      if (c) openCustomerForm(c);
    },
    confirmDelete: function (id) {
      const c = state.cache.customers.find(function (x) { return x.id === id; });
      if (!c) return;
      state.deleteTarget = { collection: 'customers', id: id, label: c.name || 'this customer' };
      App.openDeleteConfirm();
    },
    save: async function (id) {
      const name = document.getElementById('cust_name').value.trim();
      const company = document.getElementById('cust_company').value.trim();
      const email = document.getElementById('cust_email').value.trim();
      const phone = document.getElementById('cust_phone').value.trim();
      const address = document.getElementById('cust_address').value.trim();
      const gst = document.getElementById('cust_gst').value.trim();
      const customerType = document.getElementById('cust_type').value;

      if (!name) { showToast('Customer name is required', 'error'); return; }

      const payload = {
        name: name, company: company, email: email, phone: phone,
        address: address, gstNumber: gst, customerType: customerType,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating customer…' : 'Saving customer…');
        if (id) {
          await db.collection('customers').doc(id).update(payload);
          showToast('Customer updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('customers').add(payload);
          showToast('Customer added successfully', 'success');
        }
        App.hideLoading();
        App.closeGlobalModal();
        loadCustomers();
      } catch (err) {
        App.hideLoading();
        console.error('[Customers] save error:', err);
        showToast('Failed to save customer: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.customers.length === 0) {
        showToast('No customers to export', 'warning');
        return;
      }
      const stats = state.customerStats || {};
      const rows = [['Name', 'Company', 'Email', 'Phone', 'Address', 'GST', 'Type', 'Orders', 'Total Spent']];
      state.cache.customers.forEach(function (c) {
        const st = stats[c.id] || { orders: 0, spent: 0 };
        rows.push([
          c.name || '', c.company || '', c.email || '', c.phone || '',
          c.address || '', c.gstNumber || '', c.customerType || 'regular',
          st.orders, st.spent
        ]);
      });
      App.downloadCSV(rows, 'customers_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Customers CSV downloaded', 'success');
    },
    exportPDF: async function () {
      const card = document.getElementById('customersCard');
      if (!card) { showToast('Nothing to export', 'error'); return; }

      const temp = document.createElement('div');
      temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;padding:40px;';
      temp.innerHTML =
        buildPDFHeader('Customer Directory') +
        document.getElementById('customersTableWrapper').innerHTML +
        buildPDFFooter();

      document.body.appendChild(temp);
      try {
        await App.exportToPDF(temp, 'customers_' + new Date().toISOString().split('T')[0] + '.pdf', { orientation: 'landscape' });
      } finally {
        document.body.removeChild(temp);
      }
    }
  };

            <thead>
              <tr>
                <th>Supplier</th>
                <th>Contact Person</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Products</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliersTableBody">
              <tr><td colspan="6"><div class="loading-block"><div class="loading-spinner"></div><span>Loading suppliers…</span></div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination" id="suppliersPagination"></div>
      </div>
    `;

    loadSuppliers();
  }

  async function loadSuppliers() {
    const tbody = document.getElementById('suppliersTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading suppliers…');
      const [supSnap, purchSnap] = await Promise.all([
        App.companyCollection('suppliers').get(),
        App.companyCollection('purchases').get()
      ]);
      state.cache.suppliers = supSnap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });
      state.cache.suppliers.sort(function (a, b) {
        return String(a.name || '').localeCompare(String(b.name || ''));
      });

      const purchases = purchSnap.docs.map(function (d) { return d.data(); });

      const total = state.cache.suppliers.length;
      const poCount = purchases.length;
      const totalValue = purchases
        .filter(function (p) { return (p.status || '').toLowerCase() !== 'cancelled'; })
        .reduce(function (sum, p) { return sum + (Number(p.total) || 0); }, 0);

      setText('supStatCount', total);
      setText('supStatPOs', poCount);
      setText('supStatValue', formatCurrency(totalValue));

      const supStats = {};
      purchases.forEach(function (p) {
        if (!p.supplierId) return;
        if (!supStats[p.supplierId]) supStats[p.supplierId] = { count: 0, total: 0 };
        supStats[p.supplierId].count += 1;
        supStats[p.supplierId].total += Number(p.total) || 0;
      });
      state.supplierStats = supStats;

      App.hideLoading();
      renderSuppliersTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Suppliers] load error:', err);
      showToast('Failed to load suppliers: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load suppliers</p></div></td></tr>';
    }
  }

  function renderSuppliersTable() {
    const tbody = document.getElementById('suppliersTableBody');
    if (!tbody) return;

    let filtered = state.cache.suppliers.slice();
    if (supFilters.search) {
      const q = supFilters.search.toLowerCase();
      filtered = filtered.filter(function (s) {
        return (s.name || '').toLowerCase().includes(q) ||
               (s.contact || '').toLowerCase().includes(q) ||
               (s.email || '').toLowerCase().includes(q) ||
               (s.phone || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.suppliers;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);
    const stats = state.supplierStats || {};

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="6"><div class="empty-state">' +
          '<i class="fas fa-industry"></i>' +
          '<h4>No suppliers found</h4>' +
          '<p>' + (state.cache.suppliers.length === 0
            ? 'Add your first supplier to get started'
            : 'Try a different search') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (s) {
        const st = stats[s.id] || { count: 0, total: 0 };
        return '<tr>' +
          '<td>' +
            '<div class="user-cell">' +
              '<div class="avatar avatar-sm">' + getInitials(s.name) + '</div>' +
              '<div class="user-cell-info">' +
                '<strong>' + escapeHtml(s.name || 'Unnamed') + '</strong>' +
                '<small>' + escapeHtml(s.address || '—') + '</small>' +
              '</div>' +
            '</div>' +
          '</td>' +
          '<td>' + escapeHtml(s.contact || '—') + '</td>' +
          '<td>' + escapeHtml(s.email || '—') + '</td>' +
          '<td>' + escapeHtml(s.phone || '—') + '</td>' +
          '<td>' +
            '<span class="badge badge-info">' + escapeHtml(s.products || 'General') + '</span>' +
            '<small class="text-muted" style="margin-left:6px;">' + st.count + ' PO(s) • ' + formatCurrency(st.total) + '</small>' +
          '</td>' +
          '<td>' +
            '<div class="d-flex gap-1">' +
              '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="SuppliersModule.openEdit(\'' + s.id + '\')"><i class="fas fa-edit"></i></button>' +
              '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="SuppliersModule.confirmDelete(\'' + s.id + '\')"><i class="fas fa-trash"></i></button>' +
            '</div>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('suppliersPagination', pg, totalPages, 'SuppliersModule.goToPage');
  }

  window.SuppliersModule = {
    onSearch: function (val) {
      supFilters.search = val || '';
      state.pagination.suppliers.page = 1;
      renderSuppliersTable();
    },
    goToPage: function (p) {
      state.pagination.suppliers.page = p;
      renderSuppliersTable();
    },
    openAdd: function () { openSupplierForm(null); },
    openEdit: function (id) {
      const s = state.cache.suppliers.find(function (x) { return x.id === id; });
      if (s) openSupplierForm(s);
    },
    confirmDelete: function (id) {
      const s = state.cache.suppliers.find(function (x) { return x.id === id; });
      if (!s) return;
      state.deleteTarget = { collection: 'suppliers', id: id, label: s.name || 'this supplier' };
      App.openDeleteConfirm();
    },
    save: async function (id) {
      const name = document.getElementById('sup_name').value.trim();
      const contact = document.getElementById('sup_contact').value.trim();
      const email = document.getElementById('sup_email').value.trim();
      const phone = document.getElementById('sup_phone').value.trim();
      const products = document.getElementById('sup_products').value.trim();
      const address = document.getElementById('sup_address').value.trim();
      const gst = document.getElementById('sup_gst').value.trim();

      if (!name) { showToast('Supplier name is required', 'error'); return; }

      const payload = {
        name: name, contact: contact, email: email, phone: phone,
        products: products, address: address, gstNumber: gst,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating supplier…' : 'Saving supplier…');
        if (id) {
          await db.collection('suppliers').doc(id).update(payload);
          showToast('Supplier updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('suppliers').add(payload);
          showToast('Supplier added successfully', 'success');
        }
        App.hideLoading();
        App.closeGlobalModal();
        loadSuppliers();
      } catch (err) {
        App.hideLoading();
        console.error('[Suppliers] save error:', err);
        showToast('Failed to save supplier: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.suppliers.length === 0) {
        showToast('No suppliers to export', 'warning');
        return;
      }
      const stats = state.supplierStats || {};
      const rows = [['Name', 'Contact', 'Email', 'Phone', 'Products', 'Address', 'GST', 'POs', 'Total Value']];
      state.cache.suppliers.forEach(function (s) {
        const st = stats[s.id] || { count: 0, total: 0 };
        rows.push([
          s.name || '', s.contact || '', s.email || '', s.phone || '',
          s.products || '', s.address || '', s.gstNumber || '',
          st.count, st.total
        ]);
      });
      App.downloadCSV(rows, 'suppliers_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Suppliers CSV downloaded', 'success');
    },
    exportPDF: async function () {
      const card = document.getElementById('suppliersCard');
      if (!card) { showToast('Nothing to export', 'error'); return; }

      const temp = document.createElement('div');
      temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;padding:40px;';
      temp.innerHTML =
        buildPDFHeader('Supplier Directory') +
        document.getElementById('suppliersTableWrapper').innerHTML +
        buildPDFFooter();

      document.body.appendChild(temp);
      try {
        await App.exportToPDF(temp, 'suppliers_' + new Date().toISOString().split('T')[0] + '.pdf', { orientation: 'landscape' });
      } finally {
        document.body.removeChild(temp);
      }
    }
  };

  function openSupplierForm(sup) {
    const isEdit = !!sup;
    const v = isEdit ? sup : {};

    const html =
      '<div class="modal-header">' +
        '<h3><i class="fas fa-' + (isEdit ? 'edit' : 'plus-circle') + '"></i> ' + (isEdit ? 'Edit Supplier' : 'Add New Supplier') + '</h3>' +
        '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<form id="supplierForm" onsubmit="return false;">' +
          '<div class="form-group">' +
            '<label>Supplier Name <span class="required">*</span></label>' +
            '<input type="text" class="form-control" id="sup_name" value="' + escapeHtml(v.name || '') + '" placeholder="e.g. Global Traders Pvt Ltd" required>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="form-group">' +
              '<label>Contact Person</label>' +
              '<input type="text" class="form-control" id="sup_contact" value="' + escapeHtml(v.contact || '') + '" placeholder="e.g. Mr. Gupta">' +
            '</div>' +
            '<div class="form-group">' +
              '<label>Phone</label>' +
              '<input type="tel" class="form-control" id="sup_phone" value="' + escapeHtml(v.phone || '') + '" placeholder="+91 98765 43210">' +
            '</div>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Email</label>' +
            '<input type="email" class="form-control" id="sup_email" value="' + escapeHtml(v.email || '') + '" placeholder="sales@supplier.com">' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Products / Categories</label>' +
            '<input type="text" class="form-control" id="sup_products" value="' + escapeHtml(v.products || '') + '" placeholder="e.g. Electronics, Accessories">' +
          '</div>' +
          '<div class="form-group">' +
            '<label>Address</label>' +
            '<textarea class="form-control" id="sup_address" rows="2" placeholder="Street, city, state, PIN">' + escapeHtml(v.address || '') + '</textarea>' +
          '</div>' +
          '<div class="form-group">' +
            '<label>GST Number</label>' +
            '<input type="text" class="form-control" id="sup_gst" value="' + escapeHtml(v.gstNumber || '') + '" placeholder="22AAAAA0000A1Z5">' +
          '</div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-outline" onclick="App.closeGlobalModal()">Cancel</button>' +
            '<button type="button" class="btn btn-success" onclick="SuppliersModule.save(' + (isEdit ? "'" + sup.id + "'" : 'null') + ')">' +
              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Save') + ' Supplier' +
            '</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    App.openGlobalModal(html);
    setTimeout(function () {
      const el = document.getElementById('sup_name');
      if (el) el.focus();
    }, 100);
  }

  // ============================================================
  // ============ SHARED PDF HEADER/FOOTER BUILDERS =============
  // ============================================================
  function buildPDFHeader(title) {
    const cd = state.companyDetails || {};
    return '<div style="text-align:center;margin-bottom:24px;border-bottom:3px solid #4e54c8;padding-bottom:16px;">' +
      '<h1 style="font-size:1.8rem;font-weight:800;color:#4e54c8;margin:0 0 6px 0;">' +
        escapeHtml(state.company.name || 'Company') +
      '</h1>' +
      '<div style="font-size:0.8rem;color:#64748b;">' +
        (cd.phone ? '📞 ' + escapeHtml(cd.phone) + ' • ' : '') +
        (cd.email ? '✉ ' + escapeHtml(cd.email) + ' • ' : '') +
        (cd.gstNumber ? 'GST: ' + escapeHtml(cd.gstNumber) : '') +
      '</div>' +
      (cd.address ? '<div style="font-size:0.75rem;color:#64748b;margin-top:2px;">' + escapeHtml(cd.address) + '</div>' : '') +
      '<h2 style="font-size:1.2rem;font-weight:700;margin-top:14px;color:#1e293b;">' + escapeHtml(title) + '</h2>' +
      '<div style="font-size:0.7rem;color:#64748b;">Generated ' + new Date().toLocaleString('en-IN') + '</div>' +
    '</div>';
  }

  function buildPDFFooter() {
    return '<div style="margin-top:24px;text-align:center;font-size:0.7rem;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:12px;">' +
      'BudgetFlow Inventory Pro — Confidential' +
    '</div>';
  }

  // ============================================================
  // ==================== REGISTER RENDERERS ====================
  // ============================================================
  App.registerPageRenderer('employees', renderEmployees);
  App.registerPageRenderer('customers', renderCustomers);
  App.registerPageRenderer('suppliers', renderSuppliers);

  App.loadEmployees = loadEmployees;
  App.loadCustomers = loadCustomers;
  App.loadSuppliers = loadSuppliers;
  App.buildPDFHeader = buildPDFHeader;
  App.buildPDFFooter = buildPDFFooter;

  console.log('[Part 4 — UPGRADED] Employees + Customers + Suppliers loaded ✓');
  console.log('  New: PDF exports, walk-in history in customers, supplier PO totals');
})();
</script>

     PART 5 (UPGRADED) — PROJECTS + ACCOUNTS + EXPENSES

<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 5] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, formatDate, showToast, getInitials } = App;

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // Helper: render payment badge
  function paymentBadge(payment) {
    if (!payment) return '<span class="badge badge-gray">—</span>';
    if (payment.mode === 'split') {
      const modes = (payment.splits || []).map(function (s) {
        return (App.PAYMENT_MODES.find(function (m) { return m.id === s.mode; }) || {}).label || s.mode;
      }).join(' + ');
      return '<span class="badge badge-purple" title="' + escapeHtml(modes) + '">Split</span>';
    }
    const label = (App.PAYMENT_MODES.find(function (m) { return m.id === payment.mode; }) || {}).label || payment.mode;
    return '<span class="badge badge-info">' + escapeHtml(label) + '</span>';
  }

  // ============================================================
  // ===================== PROJECTS =============================
  // ============================================================
  const projFilters = { search: '', status: 'all' };

  function renderProjects(container) {
    container.innerHTML = `
      <div class="stats-grid fade-in" style="margin-bottom:1.5rem;">
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-tasks"></i></div>
          <div class="stat-value" id="projStatCount">—</div>
          <div class="stat-label">Total Projects</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-spinner"></i></div>
          <div class="stat-value" id="projStatActive">—</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
          <div class="stat-value" id="projStatCompleted">—</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><i class="fas fa-chart-line"></i></div>
          <div class="stat-value" id="projStatProgress">—</div>
          <div class="stat-label">Avg Progress</div>
        </div>
      </div>

      <div class="card fade-in" id="projectsCard">
        <div class="card-header">
          <div>
            <div class="card-title"><i class="fas fa-tasks"></i> Project Tracker</div>
            <div class="card-subtitle">Manage projects, deadlines, and progress</div>
          </div>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-primary" onclick="ProjectsModule.openAdd()">
              <i class="fas fa-plus"></i> New Project
            </button>
            <button class="btn btn-success" onclick="ProjectsModule.exportCSV()">
              <i class="fas fa-download"></i> CSV
            </button>
            <button class="btn btn-purple" onclick="ProjectsModule.exportPDF()">
              <i class="fas fa-file-pdf"></i> PDF
            </button>
          </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-2" style="align-items:center;">
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input type="text" id="projSearch" placeholder="Search projects…" oninput="ProjectsModule.onSearch(this.value)">
          </div>
          <div class="filter-tabs" id="projStatusTabs" style="margin-bottom:0;">
            <button class="filter-tab active" data-status="all" onclick="ProjectsModule.setStatus('all')">All</button>
            <button class="filter-tab" data-status="active" onclick="ProjectsModule.setStatus('active')">Active</button>
            <button class="filter-tab" data-status="completed" onclick="ProjectsModule.setStatus('completed')">Completed</button>
            <button class="filter-tab" data-status="on hold" onclick="ProjectsModule.setStatus('on hold')">On Hold</button>
          </div>
        </div>

        <div id="projectsGrid" class="dashboard-grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));">
          <div class="loading-block"><div class="loading-spinner lg"></div><span>Loading projects…</span></div>
        </div>
      </div>
    `;

    loadProjects();
  }

  async function loadProjects() {
    const grid = document.getElementById('projectsGrid');
    if (!grid) return;
    try {
      App.showLoading('Loading projects…');
      const snap = await App.companyCollection('projects').get();
      state.cache.projects = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      const total = state.cache.projects.length;
      const active = state.cache.projects.filter(function (p) {
        return (p.status || '').toLowerCase() === 'active';
      }).length;
      const completed = state.cache.projects.filter(function (p) {
        return (p.status || '').toLowerCase() === 'completed';
      }).length;
      const avgProgress = total
        ? Math.round(state.cache.projects.reduce(function (sum, p) {
            return sum + (Number(p.progress) || 0);
          }, 0) / total)
        : 0;

      setText('projStatCount', total);
      setText('projStatActive', active);
      setText('projStatCompleted', completed);
      setText('projStatProgress', avgProgress + '%');

      App.hideLoading();
      renderProjectsGrid();
    } catch (err) {
      App.hideLoading();
      console.error('[Projects] load error:', err);
      showToast('Failed to load projects: ' + (err.message || 'Unknown'), 'error');
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-exclamation-triangle"></i><p>Failed to load projects</p></div>';
    }
  }

  function renderProjectsGrid() {
    const grid = document.getElementById('projectsGrid');
    if (!grid) return;

    let filtered = state.cache.projects.slice();
    if (projFilters.status !== 'all') {
      filtered = filtered.filter(function (p) {
        return (p.status || 'active').toLowerCase() === projFilters.status;
      });
    }
    if (projFilters.search) {
      const q = projFilters.search.toLowerCase();
      filtered = filtered.filter(function (p) {
        return (p.name || '').toLowerCase().includes(q) ||
               (p.description || '').toLowerCase().includes(q) ||
               (p.owner || '').toLowerCase().includes(q);
      });
    }

    if (filtered.length === 0) {
      grid.innerHTML =
        '<div class="empty-state" style="grid-column:1/-1;">' +
          '<i class="fas fa-tasks"></i>' +
          '<h4>No projects found</h4>' +
          '<p>' + (state.cache.projects.length === 0
            ? 'Create your first project to get started'
            : 'Try adjusting your filters') + '</p>' +
        '</div>';
      return;
    }

    grid.innerHTML = filtered.map(function (p) {
      const status = (p.status || 'active').toLowerCase();
      const badgeClass = status === 'active' ? 'badge-info'
                       : status === 'completed' ? 'badge-success'
                       : status === 'on hold' ? 'badge-warning'
                       : status === 'cancelled' ? 'badge-danger'
                       : 'badge-gray';
      const progress = Math.max(0, Math.min(100, Number(p.progress) || 0));
      const progressColor = progress >= 75 ? 'success' : progress >= 40 ? 'warning' : 'danger';
      const startStr = p.startDate ? formatDate(p.startDate) : '—';
      const endStr = p.endDate ? formatDate(p.endDate) : '—';

      return '<div class="card" style="padding:1.2rem;">' +
        '<div class="d-flex justify-between mb-2" style="align-items:flex-start;gap:10px;">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="card-title" style="font-size:1rem;margin-bottom:4px;">' +
              '<i class="fas fa-project-diagram" style="color:var(--primary);"></i> ' +
              escapeHtml(p.name || 'Untitled Project') +
            '</div>' +
            '<div class="card-subtitle" style="font-size:0.75rem;">' +
              (p.owner ? '<i class="fas fa-user"></i> ' + escapeHtml(p.owner) : 'No owner assigned') +
            '</div>' +
          '</div>' +
          '<span class="badge ' + badgeClass + '">' + escapeHtml(p.status || 'active') + '</span>' +
        '</div>' +
        (p.description
          ? '<p style="font-size:0.8rem;color:var(--gray-600);margin:10px 0;line-height:1.4;">' + escapeHtml(p.description) + '</p>'
          : '') +
        '<div style="margin:14px 0 8px;">' +
          '<div class="d-flex justify-between" style="font-size:0.75rem;margin-bottom:6px;">' +
            '<span class="text-muted">Progress</span>' +
            '<strong style="color:var(--primary);">' + progress + '%</strong>' +
          '</div>' +
          '<div class="progress-bar"><div class="progress-fill ' + progressColor + '" style="width:' + progress + '%;"></div></div>' +
        '</div>' +
        '<div class="d-flex justify-between" style="font-size:0.72rem;color:var(--gray-500);margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100);">' +
          '<span><i class="fas fa-calendar-alt"></i> ' + startStr + '</span>' +
          '<span><i class="fas fa-flag-checkered"></i> ' + endStr + '</span>' +
        '</div>' +
        '<div class="d-flex gap-1" style="margin-top:12px;">' +
          '<button class="btn btn-sm btn-warning" style="flex:1;" onclick="ProjectsModule.openEdit(\'' + p.id + '\')">' +
            '<i class="fas fa-edit"></i> Edit' +
          '</button>' +
          '<button class="btn btn-sm btn-danger" style="flex:0;" onclick="ProjectsModule.confirmDelete(\'' + p.id + '\')">' +
            '<i class="fas fa-trash"></i>' +
          '</button>' +
        '</div>' +
        '</div>';
    }).join('');
  }

  window.ProjectsModule = {
    onSearch: function (val) {
      projFilters.search = val || '';
      renderProjectsGrid();
    },
    setStatus: function (status) {
      projFilters.status = status;
      document.querySelectorAll('#projStatusTabs .filter-tab').forEach(function (b) {
        b.classList.toggle('active', b.dataset.status === status);
      });

    save: async function (id) {
      const name = document.getElementById('proj_name').value.trim();
      const description = document.getElementById('proj_description').value.trim();
      const owner = document.getElementById('proj_owner').value.trim();
      const startDate = document.getElementById('proj_start').value;
      const endDate = document.getElementById('proj_end').value;
      const status = document.getElementById('proj_status').value;
      const progress = Math.max(0, Math.min(100, Number(document.getElementById('proj_progress').value) || 0));

      if (!name) { showToast('Project name is required', 'error'); return; }

      const payload = {
        name: name, description: description, owner: owner,
        startDate: startDate, endDate: endDate,
        status: status, progress: progress,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating project…' : 'Saving project…');
        if (id) {
          await db.collection('projects').doc(id).update(payload);
          showToast('Project updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('projects').add(payload);
          showToast('Project created successfully', 'success');

        App.hideLoading();
        App.closeGlobalModal();
        loadProjects();

        console.error('[Projects] save error:', err);

          p.name || '', p.description || '', p.owner || '',
          p.startDate || '', p.endDate || '',
          p.status || 'active', Number(p.progress) || 0
        ]);

      App.downloadCSV(rows, 'projects_' + new Date().toISOString().split('T')[0] + '.csv');

  async function loadAccounts() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading transactions…');
      const snap = await App.companyCollection('transactions').get();
      state.cache.transactions = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.transactions.sort(function (a, b) {
        const da = a.date ? new Date(a.date).getTime()
          : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const dbv = b.date ? new Date(b.date).getTime()
          : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return dbv - da;
      });

      const income = state.cache.transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'income'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const expense = state.cache.transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'expense'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const profit = income - expense;

      setText('accStatIncome', formatCurrency(income));
      setText('accStatExpense', formatCurrency(expense));
      const profitEl = document.getElementById('accStatProfit');
      if (profitEl) {
        profitEl.textContent = formatCurrency(profit);
        profitEl.style.color = profit >= 0 ? 'var(--success)' : 'var(--danger)';
      }
      setText('accStatCount', state.cache.transactions.length);

      App.hideLoading();
      renderAccountsTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Accounts] load error:', err);
      showToast('Failed to load transactions: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load transactions</p></div></td></tr>';
    }
  }

  function renderAccountsTable() {
    const tbody = document.getElementById('accountsTableBody');
    if (!tbody) return;

    let filtered = state.cache.transactions.slice();
    if (accFilters.type !== 'all') {
      filtered = filtered.filter(function (t) {
        return (t.type || 'income').toLowerCase() === accFilters.type;
      });
    }
    if (accFilters.search) {
      const q = accFilters.search.toLowerCase();
      filtered = filtered.filter(function (t) {
        return (t.description || '').toLowerCase().includes(q) ||
               (t.category || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.transactions;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-coins"></i>' +
          '<h4>No transactions</h4>' +
          '<p>' + (state.cache.transactions.length === 0
            ? 'Record your first transaction'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (t) {
        const type = (t.type || 'income').toLowerCase();
        const isIncome = type === 'income';
        const dateStr = t.date ? formatDate(t.date) : (t.createdAt ? formatDate(t.createdAt) : '—');
        return '<tr>' +
          '<td>' + dateStr + '</td>' +
          '<td><strong>' + escapeHtml(t.description || '—') + '</strong></td>' +
          '<td><span class="badge badge-gray">' + escapeHtml(t.category || 'General') + '</span></td>' +
          '<td>' +
            '<span class="badge ' + (isIncome ? 'badge-success' : 'badge-danger') + '">' +
              '<i class="fas fa-arrow-' + (isIncome ? 'up' : 'down') + '"></i> ' +
              escapeHtml(t.type || 'income') +
            '</span>' +
          '</td>' +
          '<td>' + paymentBadge(t.payment) + '</td>' +
          '<td>' +
            '<strong style="color:' + (isIncome ? 'var(--success)' : 'var(--danger)') + ';">' +
              (isIncome ? '+' : '−') + ' ' + formatCurrency(t.amount) +
            '</strong>' +
          '</td>' +
          '<td>' +
            '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="AccountsModule.confirmDelete(\'' + t.id + '\')"><i class="fas fa-trash"></i></button>' +
          '</td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('accountsPagination', pg, totalPages, 'AccountsModule.goToPage');
  }

  const expFilters = { search: '', status: 'all' };

  function renderExpenses(container) {

  async function loadExpenses() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;
    try {
      App.showLoading('Loading expenses…');
      const snap = await App.companyCollection('expenses').get();
      state.cache.expenses = snap.docs.map(function (d) {
        return Object.assign({ id: d.id }, d.data());
      });

      state.cache.expenses.sort(function (a, b) {
        const da = a.date ? new Date(a.date).getTime()
          : (a.createdAt ? (a.createdAt.toDate ? a.createdAt.toDate() : new Date(a.createdAt)).getTime() : 0);
        const dbv = b.date ? new Date(b.date).getTime()
          : (b.createdAt ? (b.createdAt.toDate ? b.createdAt.toDate() : new Date(b.createdAt)).getTime() : 0);
        return dbv - da;
      });

      const total = state.cache.expenses.length;
      const pending = state.cache.expenses.filter(function (e) {
        return (e.status || 'pending').toLowerCase() === 'pending';
      }).length;
      const approved = state.cache.expenses.filter(function (e) {
        return ['approved', 'paid'].indexOf((e.status || '').toLowerCase()) !== -1;
      }).length;

      const now = new Date();
      const monthTotal = state.cache.expenses
        .filter(function (e) {
          if (!e.date) return false;
          const d = new Date(e.date);
          return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        })
        .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);

      setText('expStatCount', total);
      setText('expStatPending', pending);
      setText('expStatApproved', approved);
      setText('expStatMonth', formatCurrency(monthTotal));

      App.hideLoading();
      renderExpensesTable();
    } catch (err) {
      App.hideLoading();
      console.error('[Expenses] load error:', err);
      showToast('Failed to load expenses: ' + (err.message || 'Unknown'), 'error');
      tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load expenses</p></div></td></tr>';
    }
  }

  function renderExpensesTable() {
    const tbody = document.getElementById('expensesTableBody');
    if (!tbody) return;

    let filtered = state.cache.expenses.slice();
    if (expFilters.status !== 'all') {
      filtered = filtered.filter(function (e) {
        return (e.status || 'pending').toLowerCase() === expFilters.status;
      });
    }
    if (expFilters.search) {
      const q = expFilters.search.toLowerCase();
      filtered = filtered.filter(function (e) {
        return (e.description || '').toLowerCase().includes(q) ||
               (e.category || '').toLowerCase().includes(q);
      });
    }

    const pg = state.pagination.expenses;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pg.perPage));
    if (pg.page > totalPages) pg.page = totalPages;
    const start = (pg.page - 1) * pg.perPage;
    const pageItems = filtered.slice(start, start + pg.perPage);

    if (pageItems.length === 0) {
      tbody.innerHTML =
        '<tr><td colspan="7"><div class="empty-state">' +
          '<i class="fas fa-receipt"></i>' +
          '<h4>No expenses</h4>' +
          '<p>' + (state.cache.expenses.length === 0
            ? 'Add your first expense record'
            : 'Try adjusting your filters') + '</p>' +
        '</div></td></tr>';
    } else {
      tbody.innerHTML = pageItems.map(function (e) {
        const status = (e.status || 'pending').toLowerCase();
        const badgeClass = status === 'paid' ? 'badge-success'
                         : status === 'approved' ? 'badge-info'
                         : status === 'rejected' ? 'badge-danger'
                         : 'badge-warning';
        const dateStr = e.date ? formatDate(e.date) : (e.createdAt ? formatDate(e.createdAt) : '—');

        let actionsHtml = '';
        if (status === 'pending') {
          actionsHtml += '<button class="btn btn-sm btn-success" title="Approve + Pay" onclick="ExpensesModule.approve(\'' + e.id + '\')"><i class="fas fa-check"></i></button>';
        }
        if (status === 'approved') {
          actionsHtml += '<button class="btn btn-sm btn-info" title="Mark as Paid" onclick="ExpensesModule.markPaid(\'' + e.id + '\')"><i class="fas fa-money-bill"></i></button>';
        }
        actionsHtml += '<button class="btn btn-sm btn-icon btn-warning" title="Edit" onclick="ExpensesModule.openEdit(\'' + e.id + '\')"><i class="fas fa-edit"></i></button>';
        actionsHtml += '<button class="btn btn-sm btn-icon btn-danger" title="Delete" onclick="ExpensesModule.confirmDelete(\'' + e.id + '\')"><i class="fas fa-trash"></i></button>';

        return '<tr>' +
          '<td>' + dateStr + '</td>' +
          '<td><strong>' + escapeHtml(e.description || '—') + '</strong></td>' +
          '<td><span class="badge badge-gray">' + escapeHtml(e.category || 'General') + '</span></td>' +
          '<td><strong>' + formatCurrency(e.amount) + '</strong></td>' +

          '<td><div class="d-flex gap-1">' + actionsHtml + '</div></td>' +
          '</tr>';
      }).join('');
    }

    App.renderPagination('expensesPagination', pg, totalPages, 'ExpensesModule.goToPage');

    save: async function (id) {
      const description = document.getElementById('exp_description').value.trim();
      const amount = Number(document.getElementById('exp_amount').value) || 0;
      const category = document.getElementById('exp_category').value.trim();
      const date = document.getElementById('exp_date').value;

      if (!description) { showToast('Description is required', 'error'); return; }
      if (amount <= 0) { showToast('Amount must be greater than zero', 'error'); return; }

      const payload = {
        description: description, amount: amount,
        category: category || 'General', date: date,
        status: status, notes: notes,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        App.showLoading(id ? 'Updating expense…' : 'Saving expense…');
        if (id) {
          await db.collection('expenses').doc(id).update(payload);
          showToast('Expense updated successfully', 'success');
        } else {
          payload.companyId = state.company.id;
          payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection('expenses').add(payload);
          showToast('Expense recorded successfully', 'success');
        }
        App.hideLoading();
        App.closeGlobalModal();
        loadExpenses();
      } catch (err) {
        App.hideLoading();
        console.error('[Expenses] save error:', err);
        showToast('Failed to save expense: ' + (err.message || 'Unknown'), 'error');
      }
    },
    exportCSV: function () {
      if (state.cache.expenses.length === 0) {
        showToast('No expenses to export', 'warning');
        return;
      }
      const rows = [['Date', 'Description', 'Category', 'Amount', 'Payment Mode', 'Status', 'Notes']];
      state.cache.expenses.forEach(function (e) {
        const payMode = e.payment ? (e.payment.mode === 'split' ? 'Split' : e.payment.mode) : '';
        rows.push([
          e.date || '', e.description || '', e.category || 'General',
          Number(e.amount) || 0, payMode, e.status || 'pending', e.notes || ''
        ]);
      });
      App.downloadCSV(rows, 'expenses_' + new Date().toISOString().split('T')[0] + '.csv');
      showToast('Expenses CSV downloaded', 'success');
    },
    exportPDF: async function () {
      if (state.cache.expenses.length === 0) {
        showToast('No expenses to export', 'warning');
        return;
      }

      const temp = document.createElement('div');
      temp.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;padding:40px;';
      temp.innerHTML = App.buildPDFHeader('Expense Report') + document.getElementById('expensesTableWrapper').innerHTML + App.buildPDFFooter();

      document.body.appendChild(temp);
      try {
        await App.exportToPDF(temp, 'expenses_' + new Date().toISOString().split('T')[0] + '.pdf', { orientation: 'landscape' });
      } finally {
        document.body.removeChild(temp);
      }
    }

                '<option value="approved" ' + (v.status === 'approved' ? 'selected' : '') + '>Approved</option>' +
                '<option value="paid" ' + (v.status === 'paid' ? 'selected' : '') + '>Paid</option>' +
                '<option value="rejected" ' + (v.status === 'rejected' ? 'selected' : '') + '>Rejected</option>' +

            '<button type="button" class="btn btn-success" onclick="ExpensesModule.save(' + (isEdit ? "'" + exp.id + "'" : 'null') + ')">' +
              '<i class="fas fa-save"></i> ' + (isEdit ? 'Update' : 'Save') + ' Expense' +
            '</button>' +
          '</div>' +
        '</form>' +
      '</div>';

    App.openGlobalModal(html);
    setTimeout(function () {
      const el = document.getElementById('exp_description');

<script>
(function () {
  'use strict';

  const App = window.App;
  if (!App) { console.error('[Part 6] App not found — Part 1 must load first.'); return; }

  const { db, state, escapeHtml, formatCurrency, formatDate, showToast, getInitials } = App;

  function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  // ============================================================
  // ===================== REPORTS ==============================
  // ============================================================
  async function renderReports(container) {
    container.innerHTML = '<div class="loading-block"><div class="loading-spinner lg"></div><span>Analyzing business data…</span></div>';

    try {
      App.showLoading('Building reports…', 'Analyzing business data');

      const [invSnap, salesSnap, expSnap, txSnap] = await Promise.all([
        App.companyCollection('inventory').get(),
        App.companyCollection('sales').get(),
        App.companyCollection('expenses').get(),
        App.companyCollection('transactions').get()
      ]);

      const inventory = invSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const sales = salesSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const expenses = expSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      const transactions = txSnap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });

      const validSales = sales.filter(function (s) { return (s.status || '').toLowerCase() !== 'cancelled'; });
      const totalSalesRevenue = validSales.reduce(function (s, x) { return s + (Number(x.total) || 0); }, 0);
      const txIncome = transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'income'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const txExpense = transactions
        .filter(function (t) { return (t.type || '').toLowerCase() === 'expense'; })
        .reduce(function (s, t) { return s + (Number(t.amount) || 0); }, 0);
      const approvedExpenses = expenses
        .filter(function (e) { return ['approved', 'paid'].indexOf((e.status || '').toLowerCase()) !== -1; })
        .reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);

      const totalExpenses = txExpense + approvedExpenses;
      const totalRevenue = totalSalesRevenue + txIncome;
      const netProfit = totalRevenue - totalExpenses;
      const profitMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100) : 0;
      const inventoryValue = inventory.reduce(function (s, p) {
        return s + ((Number(p.stock) || 0) * (Number(p.price) || 0));
      }, 0);
      const inventoryCostValue = inventory.reduce(function (s, p) {
        return s + ((Number(p.stock) || 0) * (Number(p.cost) || Number(p.price) || 0));
      }, 0);

      // 6-month sales
      const monthBuckets = {};
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        monthBuckets[key] = { label: d.toLocaleString('en-US', { month: 'short', year: '2-digit' }), value: 0 };
      }
      validSales.forEach(function (s) {
        const d = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)) : null;
        if (!d) return;
        const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        if (monthBuckets[key]) monthBuckets[key].value += Number(s.total) || 0;
      });
      const monthArray = Object.keys(monthBuckets).map(function (k) { return monthBuckets[k]; });
      const maxMonth = Math.max.apply(null, [1].concat(monthArray.map(function (m) { return m.value; })));

      // Top customers
      const customerTotals = {};
      validSales.forEach(function (s) {
        if (!s.customerId && !s.customerName) return;
        const key = s.customerId || ('walkin:' + s.customerName);
        if (!customerTotals[key]) {
          customerTotals[key] = { name: s.customerName || 'Unknown', total: 0, orders: 0 };
        }
        customerTotals[key].total += Number(s.total) || 0;
        customerTotals[key].orders += 1;
      });
      const topCustomers = Object.values(customerTotals)
        .sort(function (a, b) { return b.total - a.total; })
        .slice(0, 5);

      // Top products
      const productTotals = {};
      validSales.forEach(function (s) {
        const items = Array.isArray(s.items) ? s.items : [];
        items.forEach(function (it) {
          const key = it.productId || it.name || 'unknown';
          if (!productTotals[key]) productTotals[key] = { name: it.name || 'Unknown', qty: 0, revenue: 0 };
          productTotals[key].qty += Number(it.qty) || 0;
          productTotals[key].revenue += Number(it.lineTotal) || (Number(it.qty) || 0) * (Number(it.price) || 0);
        });
      });
      const topProducts = Object.values(productTotals)
        .sort(function (a, b) { return b.revenue - a.revenue; })
        .slice(0, 5);

      // Top expense categories
      const expenseByCat = {};
      transactions.filter(function (t) { return (t.type || '').toLowerCase() === 'expense'; }).forEach(function (t) {
        const cat = t.category || 'General';
        if (!expenseByCat[cat]) expenseByCat[cat] = 0;
        expenseByCat[cat] += Number(t.amount) || 0;
      });
      expenses.filter(function (e) {
        return ['approved', 'paid'].indexOf((e.status || '').toLowerCase()) !== -1;
      }).forEach(function (e) {
        const cat = e.category || 'General';
        if (!expenseByCat[cat]) expenseByCat[cat] = 0;
        expenseByCat[cat] += Number(e.amount) || 0;
      });
      const topExpenses = Object.keys(expenseByCat).map(function (cat) {
        return { cat: cat, amt: expenseByCat[cat] };
      }).sort(function (a, b) { return b.amt - a.amt; }).slice(0, 5);
      const maxExpense = Math.max.apply(null, [1].concat(topExpenses.map(function (e) { return e.amt; })));

      // Payment mode breakdown (#6)
      const payModeBreakdown = {};
      validSales.forEach(function (s) {
        if (!s.payment) return;
        if (s.payment.mode === 'split') {
          (s.payment.splits || []).forEach(function (sp) {
            const label = (App.PAYMENT_MODES.find(function (m) { return m.id === sp.mode; }) || {}).label || sp.mode;
            if (!payModeBreakdown[label]) payModeBreakdown[label] = 0;
            payModeBreakdown[label] += Number(sp.amount) || 0;

        } else {

          payModeBreakdown[label] += Number(s.total) || 0;
        }

            <div style="display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 0;">
              ${monthArray.map(function (m) {

                    (m.value > 0 ? formatCurrency(m.value) : '') +

        <div class="dashboard-grid fade-in">

        <!-- Payment Mode Breakdown (#6) -->

            <div class="card-title"><i class="fas fa-wallet"></i> Payment Mode Breakdown</div>
          </div>
          ${payModeArray.length === 0

            : payModeArray.map(function (p) {
                return '<div style="margin-bottom:14px;">' +
                  '<div class="d-flex justify-between" style="margin-bottom:6px;">' +
                    '<strong style="font-size:0.85rem;">' + escapeHtml(p.label) + '</strong>' +

                  '</div>' +

                '</div>';
              }).join('')}
        </div>

        <div class="card fade-in">
          <div class="card-header">
            <div class="card-title"><i class="fas fa-file-export"></i> Export Reports</div>
          </div>
          <div class="d-flex gap-2 flex-wrap">

            </button>
            <button class="btn btn-primary" onclick="window.print()">
              <i class="fas fa-print"></i> Print
            </button>
          </div>
        </div>
      `;

      state._reportData = {
        totalRevenue: totalRevenue, totalExpenses: totalExpenses,
        netProfit: netProfit, profitMargin: profitMargin,
        inventoryValue: inventoryValue, inventoryCostValue: inventoryCostValue,
        monthArray: monthArray, topCustomers: topCustomers,
        topProducts: topProducts, topExpenses: topExpenses,
        payModeArray: payModeArray
      };

      App.hideLoading();
    } catch (err) {
      App.hideLoading();
      console.error('[Reports] load error:', err);
      container.innerHTML = '<div class="card"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h4>Failed to load reports</h4><p>' + escapeHtml(err.message || 'Unknown error') + '</p></div></div>';

  async function loadCalendarEvents() {
    try {
      App.showLoading('Loading calendar…');
      const [salesSnap, purchSnap, expSnap, projSnap] = await Promise.all([
        App.companyCollection('sales').get(),
        App.companyCollection('purchases').get(),
        App.companyCollection('expenses').get(),
        App.companyCollection('projects').get()
      ]);
      const events = [];

      salesSnap.forEach(function (doc) {
        const s = doc.data();
        const dt = s.createdAt ? (s.createdAt.toDate ? s.createdAt.toDate() : new Date(s.createdAt)) : null;
        if (dt) events.push({
          date: dt, type: 'sale', color: 'success',
          title: 'Sale #' + (s.invoiceNo || doc.id.slice(-6).toUpperCase()),
          detail: (s.customerName || 'Walk-in') + ' — ' + formatCurrency(s.total)
        });
      });

      purchSnap.forEach(function (doc) {
        const p = doc.data();
        const dt = p.createdAt ? (p.createdAt.toDate ? p.createdAt.toDate() : new Date(p.createdAt)) : null;
        if (dt) events.push({
          date: dt, type: 'purchase', color: 'warning',
          title: 'PO #' + (p.poNo || doc.id.slice(-6).toUpperCase()),
          detail: (p.supplierName || '') + ' — ' + formatCurrency(p.total)
        });
      });

      expSnap.forEach(function (doc) {
        const e = doc.data();
        if (!e.date) return;
        const dt = new Date(e.date);
        if (!isNaN(dt)) events.push({
          date: dt, type: 'expense', color: 'danger',
          title: 'Expense — ' + (e.category || 'General'),
          detail: (e.description || '') + ' — ' + formatCurrency(e.amount)
        });
      });

      projSnap.forEach(function (doc) {
        const p = doc.data();
        if (p.endDate) {
          const dt = new Date(p.endDate);
          if (!isNaN(dt)) events.push({
            date: dt, type: 'project', color: 'purple',
            title: 'Project due — ' + (p.name || 'Untitled'),
            detail: 'Status: ' + (p.status || 'active') + ', ' + (p.progress || 0) + '% complete'
          });
        }
      });

      state._calendarEvents = events;
      App.hideLoading();
      renderCalendarGrid();
    } catch (err) {
      App.hideLoading();
      console.error('[Calendar] load error:', err);
      showToast('Failed to load calendar: ' + (err.message || 'Unknown'), 'error');
    }
  }

  function renderCalendarGrid() {
    const grid = document.getElementById('calendarGrid');
    const label = document.getElementById('calMonthLabel');
    if (!grid || !label) return;

    const year = calState.year;
    const month = calState.month;
    label.textContent = new Date(year, month, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });

    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const today = new Date();

    const eventsByDate = {};
    (state._calendarEvents || []).forEach(function (ev) {
      const key = ev.date.getFullYear() + '-' + (ev.date.getMonth() + 1) + '-' + ev.date.getDate();
      if (!eventsByDate[key]) eventsByDate[key] = [];
      eventsByDate[key].push(ev);
    });

    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    let html = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';
    weekdays.forEach(function (w) {
      html += '<div style="text-align:center;padding:8px;font-size:0.72rem;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.5px;">' + w + '</div>';
    });
    for (let i = 0; i < startWeekday; i++) {
      html += '<div style="min-height:80px;background:transparent;"></div>';
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = year + '-' + (month + 1) + '-' + day;
      const events = eventsByDate[dateKey] || [];
      const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
      const bgColor = isToday ? 'rgba(78,84,200,0.08)' : 'var(--gray-50)';
      const borderColor = isToday ? 'var(--primary)' : 'var(--gray-200)';

      html += '<div style="min-height:80px;background:' + bgColor + ';border:1px solid ' + borderColor + ';border-radius:8px;padding:6px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden;" ' +
                'onmouseover="this.style.borderColor=\'var(--primary)\'" onmouseout="this.style.borderColor=\'' + borderColor + '\'" ' +
                'onclick="CalendarModule.showDay(' + day + ')">' +
        '<div style="font-weight:' + (isToday ? '800' : '600') + ';font-size:0.85rem;color:' + (isToday ? 'var(--primary)' : 'var(--gray-800)') + ';margin-bottom:4px;">' +
          day +
        '</div>' +
        events.slice(0, 2).map(function (ev) {
          return '<div style="font-size:0.65rem;background:var(--' + ev.color + ');color:white;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;">' +
            escapeHtml(ev.title) +
          '</div>';
        }).join('') +
        (events.length > 2
          ? '<div style="font-size:0.65rem;color:var(--gray-500);font-weight:600;">+' + (events.length - 2) + ' more</div>'
          : '') +
      '</div>';
    }
    html += '</div>';
    grid.innerHTML = html;
  }

  window.CalendarModule = {
    prevMonth: function () {
      calState.month--;
      if (calState.month < 0) { calState.month = 11; calState.year--; }
      renderCalendarGrid();
    },
    nextMonth: function () {
      calState.month++;
      if (calState.month > 11) { calState.month = 0; calState.year++; }
      renderCalendarGrid();
    },
    today: function () {
      const now = new Date();
      calState.year = now.getFullYear();
      calState.month = now.getMonth();
      renderCalendarGrid();
    },
    showDay: function (day) {
      const dateKey = calState.year + '-' + (calState.month + 1) + '-' + day;
      const events = (state._calendarEvents || []).filter(function (ev) {
        const k = ev.date.getFullYear() + '-' + (ev.date.getMonth() + 1) + '-' + ev.date.getDate();
        return k === dateKey;
      });
      const dateStr = new Date(calState.year, calState.month, day).toLocaleDateString('en-IN', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'

      const html =

          '<h3><i class="fas fa-calendar-day"></i> ' + dateStr + '</h3>' +
          '<button class="modal-close" onclick="App.closeGlobalModal()">&times;</button>' +

            '<button class="btn btn-outline btn-block" onclick="App.closeGlobalModal()">Close</button>' +
          '</div>' +
        '</div>';
      App.openGlobalModal(html);
    }
